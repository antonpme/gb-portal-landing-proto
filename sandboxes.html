<!-- ============================================================
     gbppl-sandboxes-3 — THE SANDBOXES PAGE
     ------------------------------------------------------------
     The second room of the studio (hub-9, Ton 24.08: the nav must
     TAKE you to these pages, not scroll to these sections).

     Parallel rooms, one open question each. They are still links
     into live\ with a query on them rather than files of their own;
     the day one becomes a file it moves to sandbox\ and only its
     href changes here. See sandbox\README.md.

     THE DOORS ARE NOT WRITTEN HERE ANY MORE (gbppl-sandboxes-2,
     Ton 25.08). They are painted from system\sandbox-registry.js,
     the one place a sandbox is registered — the same file the studio
     panel reads on every page and the PROTO panel reads on checkout.
     Three surfaces, three voices, one list; a room added to the
     registry appears on all of them at once, and this page never
     drifts out of step with what the panels promise. The markup the
     script emits is the markup that stood here before it, class for
     class, so nothing about the page changed except who writes it.
     Rooms are grouped by the page they belong to, because that is
     the question the visitor arrives with: what is being tried on
     checkout, what on the portal.

     Same borrowed chrome as the hub and nothing of its own: the
     bar is header.css (--studio), the ground is shell.css
     (gb-demo), the doors and the chip are studio.css, the guard and
     the LOCK are studio.js. If something on this page needs a new
     rule, the rule belongs in one of those files.
     ============================================================ -->

<script>
/* ---- The doors, painted from the registry (gbppl-sandboxes-3).
   .gbs-door--box with a chip, a title, a line of description and,
   in the foot, the page the room belongs to.

   THE FOOT USED TO PRINT THE FILE PATH (live/checkout.html?v=1).
   Ton 26.08: the cards are read by people who do not have the repo
   open, and a query string is not a place. It now carries the page's
   name out of the registry: Checkout, Portal, Book a meeting. The
   internal references went out of the descriptions with it. ---- */
(function () {
  'use strict';
  var mount = document.getElementById('gbsRooms');
  var reg = window.GB_SANDBOXES;
  if (!mount || !reg) return;

  var ARROW =
    '<span class="gbs-arrow" aria-hidden="true">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';

  function esc(v) {
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function door(v, page) {
    var chip  = '<span class="gbs-chip">' + esc(String(v.status).replace(/-/g, ' ')) + '</span>';
    var title = '<h3 class="gbs-door-title">' + esc(v.label) + '</h3>';
    var desc  = '<p class="gbs-door-desc">' + esc(v.desc) + '</p>';
    /* The room that is not open yet keeps the same foot, with the
       arrow's place taken by the reason there is no arrow. */
    var end   = v.ready ? ARROW : '<span class="gbs-door-note">Not open yet</span>';
    var foot  = '<span class="gbs-door-foot"><span class="gbs-door-page">' +
                esc(page) + '</span>' + end + '</span>';
    var body  = chip + title + desc + foot;
    if (!v.ready) return '<div class="gbs-door gbs-door--box gbs-door--coming">' + body + '</div>';
    return '<a class="gbs-door gbs-door--box" href="' + esc(v.href) + '">' + body + '</a>';
  }

  var html = reg.rooms('').map(function (page) {
    return '<div class="gbs-room">' +
             '<span class="gb-eyebrow">' + esc(page.label) + '</span>' +
             '<div class="gbs-grid">' + page.variants.map(function (v) {
               return door(v, page.label);
             }).join('') + '</div>' +
           '</div>';
  }).join('');

  mount.innerHTML = html || '<p class="gbs-lede">None yet.</p>';
})();
</script>
