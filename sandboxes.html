<!-- ============================================================
     gbppl-sandbox-md-1 — PROJECTS ON THE LEFT, PROTOTYPES ON THE RIGHT
     ------------------------------------------------------------
     Ton, 31.08, 17:53, on the shelf he had rebuilt six hours earlier:
     «Пересмотреть, как показываем проекты: проекты списком слева,
     нажимаешь на проект, справа его прототипы карточками. Фильтры
     сейчас как основной контент, слишком шумно: свернуть по дефолту
     (по умолчанию показывается всё), или открывать в дровере:
     подумать, что лучше.»

     TWO HALVES.
       left       a rail of PROJECTS: the page name and the number of
                  prototypes behind it, one line each. The selected
                  one wears the active pair of the Oro rail (Blue 50
                  on a Blue 200 hairline, Blue 700 ink) — the same
                  declaration .oro-link carries, because Ton-5 names
                  «активный пункт» by name and state speaks in the
                  accent. Below 1024 the rail lies down as a row of
                  chips that scrolls inside itself, the way the
                  showcase's own contents do.
       right      the prototypes of that project, as cards. The card
                  is .gbs-door--box, the very object a variant was
                  until this morning: name in the serif, description
                  whole, the row of «status left, dates right» Ton
                  pointed at, tags at the foot.
       address    ?project=<id>, written with replaceState. A page
                  key, not prototype context, so it is not in the
                  KEEP list of header.js (trap 20 of the skill).

     THE FILTERS FOLDED, AND THEY DID NOT GO INTO A DRAWER. Sort stays
     out, because sorting hides nothing; everything that HIDES
     prototypes went behind one «Filters» button that opens in place.
     A drawer costs a surface of 520px with its own head, backdrop and
     focus trap, and paying that for nine chips is taking the person
     off the page to tick a box. While the shelf is folded the active
     tags stand in a line of their own with a cross each, so nobody
     wonders why the shelf is short.

     GROUP IS GONE. The rail groups by page permanently, and grouping
     the one or two prototypes of a single project by status or tag is
     a control with nothing to control. Its key is dropped from the
     address on the next write.
     ------------------------------------------------------------
     gbppl-sandbox-projects-1 — ONE CARD PER PAGE, PROTOTYPES INSIDE
     ------------------------------------------------------------
     Ton, 31.08, from a screenshot of this shelf: «Прототипы
     дублируются: Checkout, Checkout, Category, Category — бред. Дат
     создания не видно (updated есть, created нет; дата должна быть
     вверху справа, где Proposal, только справа). Вариации одного
     прототипа мы показываем отдельными карточками? Мы работаем как
     Figma: проект, внутри которого прототипы? Мне кажется, здесь
     что-то упущено.»

     It was. The card used to be a VARIANT, so eight variants of five
     pages made eight cards under five names, two of them printed
     twice. Now the card is the PAGE (the project) and the variants
     stand as rows inside it (the prototypes): five cards, no name
     repeated, and the shelf reads the way Figma reads.

     WHAT MOVED, AND WHERE.
       card head    page name in the serif, and on the right nothing
                    but a quiet count. A project has as many dates as
                    it has prototypes, so no date belongs up there.
       row          prototype name with the arrow, one description
                    clamped to two lines, then status chip on the
                    left and dates on the right, which is the place
                    Ton pointed at. The row is the link; the card is
                    not, because a page with two prototypes has no
                    single address.
       tags         one row at the foot of the card, the unique tags
                    of all its prototypes. Per row they would have
                    turned a list into a field of chips.
       Group        hidden in Cards. The card IS the page, so
                    grouping by page has already happened, and
                    grouping by status or tag would hand back the
                    flat variant cards Ton just refused. The value is
                    remembered, not reset: List is one click away and
                    still groups four ways.
       filter/sort  work on PROTOTYPES. A card whose prototypes all
                    fall out of the filter disappears with them, and
                    the order of the cards follows the order of their
                    first prototype under the current sort.
       List         untouched. Six columns, the page first, exactly
                    as it was measured on 1100 and on 390.
     ------------------------------------------------------------
     gbppl-sandboxes-4 — THE SANDBOXES PAGE, A PROJECT MANAGER
     ------------------------------------------------------------
     Ton, 28.08: «что если страница Sandboxes будет выполнять роль
     менеджера проектов в Figma? Сейчас один view: большие карточки,
     сгруппированные по принадлежности. 1. View должен быть и
     списком, и карточками. 2. Группировку стоит делать через теги
     (показывать бейджем принадлежность к чему-либо). Можно сделать
     фильтрацию или группировку на странице, группировка
     опциональная. 3. Можно смотреть проекты по последнему активному
     (что последнее изменялось).»

     WHAT THE PAGE DOES NOW. A shelf of controls above the content:
     View (cards or list), Group (none, page, status, tag), Sort
     (last active, name, status) and a row of tag chips that filters.
     The controls are the documentation segments of docs.css, not new
     furniture; the cards are the same .gbs-door--box they were, with
     a row of badges and the date of last activity added; the list is
     the one new object on the page.

     GROUPING IS NOW OPTIONAL, AND THE DEFAULT IS FLAT. Until today
     the rooms were always grouped by the page they belong to, and
     that was the only reading. It is still one click away (Group ·
     Page), but the page opens sorted by what moved last, because
     that is the question Ton put first.

     STATE LIVES IN TWO PLACES, ON PURPOSE. localStorage remembers
     how YOU left the page (gbppl-sandboxes-view / -group / -sort /
     -tags); the query string carries a view you want to SEND to
     somebody (?view=list&group=page&tag=header). The URL wins on
     load, and it is written with replaceState so the back button
     still means the previous page. These four keys are page keys,
     not prototype context, so they are NOT in the KEEP list of
     header.js: sending them along to live/checkout.html would be
     nonsense.
     ------------------------------------------------------------
     gbppl-sandboxes-3 — THE SANDBOXES PAGE
     ------------------------------------------------------------
     The second room of the studio (hub-9, Ton 24.08: the nav must
     TAKE you to these pages, not scroll to these sections).

     Parallel rooms, one open question each. They are still links
     into live\ with a query on them rather than files of their own;
     the day one becomes a file it moves to sandbox\ and only its
     href changes here. See sandbox\README.md.

     THE DOORS ARE NOT WRITTEN HERE ANY MORE (gbppl-sandboxes-2,
     Ton 25.08). They are painted from system\sandbox-registry.js,
     the one place a sandbox is registered — the same file the studio
     panel reads on every page and the PROTO panel reads on checkout.
     Three surfaces, three voices, one list; a room added to the
     registry appears on all of them at once, and this page never
     drifts out of step with what the panels promise. The markup the
     script emits is the markup that stood here before it, class for
     class, so nothing about the page changed except who writes it.
     Rooms are grouped by the page they belong to, because that is
     the question the visitor arrives with: what is being tried on
     checkout, what on the portal.

     Same borrowed chrome as the hub and nothing of its own: the
     bar is header.css (--studio), the ground is shell.css
     (gb-demo), the doors and the chip are studio.css, the guard and
     the LOCK are studio.js. If something on this page needs a new
     rule, the rule belongs in one of those files.

     gbppl-comments-c, 28.08: comment mode wired here too. This was
     the one page of sixteen that carried the console and the
     instrument but not the third mode, so its Mode row had two
     positions where every other page had three. Two stylesheets and
     one script, in the same place and the same order as everywhere
     else; nothing else on the page moved.
     ============================================================ -->

<script>
/* ---- The shelf, painted from the registry (gbppl-sandboxes-4).
   Three questions the visitor arrives with, and the page answers all
   three from one list: what moved last (Sort), what belongs together
   (the rail of projects), what is about the thing I care about (Tags).

   MASTER AND DETAIL (gbppl-sandbox-md-1, Ton 31.08, evening): «проекты
   списком слева, нажимаешь на проект, справа его прототипы
   карточками». So the flat shelf became two halves. The left one is a
   rail of PROJECTS, one line each, with the count of prototypes
   behind it; the right one is the prototypes of the selected project,
   as cards. Which project you are looking at is an address, so it
   rides in ?project=<id> and a link to it opens there.

   THE CARD IS THE ONE THAT STOOD HERE (gbppl-sandboxes-3), plus a row
   of badges and a line of date. THE LIST is new, and it is the only
   new object.

   THE TITLE IS THE PAGE, NOT THE VARIANT (gbppl-sandbox-names-1, Ton
   31.08, from a screenshot of this shelf): «Самый большой хаос здесь.
   Я не пойму, какой прототип что означает. Что такое Light Pre-Footer?
   Что такое V2 Shared Pool? Прототипы должны называться по странице:
   Checkout Page, Home Page, Category Page, Sign-in / Sign-up Form,
   Book a Meeting Form. Я не понимаю, что нажимать и куда ведёт.»

   So the two names swapped places. The serif line, the loudest thing
   on the card, now says WHERE you land; the line under it says WHICH
   of that page's tries this one is, and the description says what the
   try changes.

   AND THEN THE CARD STOPPED BEING A VARIANT AT ALL
   (gbppl-sandbox-projects-1, the same day, the next screenshot): the
   card is the page, the variants are rows inside it. The serif line
   is still the page; what used to be the second line of the card is
   now the first line of a row. Grouping by page went with it, for
   cards only: the header of this file has the full account.

   GROUPED BY PAGE, THE LIST ROW LEADS WITH THE VARIANT. The eyebrow
   of the group already said the page, and a group of three rows all
   starting with «Checkout page» under a heading reading «Checkout
   page» is the same word four times. Inside a page group the row
   drops its first column (.gbs-list--ingroup).

   TAGS ARE CHIPS IN TWO PLACES AND TEXT IN A THIRD. On the card a tag
   is a label, in the filter row it is a target; in the list row it is
   a line of text, because four chips in a dense row double its
   height. Same data, three jobs, and the quiet one is the one that
   has to fit.
   ---- */
(function () {
  'use strict';

  var mount    = document.getElementById('gbsRooms');
  var controls = document.getElementById('gbsControls');
  var tagAxis  = document.getElementById('gbsTagAxis');
  var fpanel   = document.getElementById('gbsFiltersPanel');
  var fbtn     = document.getElementById('gbsFiltersBtn');
  var fcount   = document.getElementById('gbsFiltersCount');
  var fline    = document.getElementById('gbsFiltered');
  var reg = window.GB_SANDBOXES;
  if (!mount || !reg) return;

  var ARROW =
    '<span class="gbs-arrow" aria-hidden="true">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';

  function esc(v) {
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---- The two segment axes: what is legal, what is default and
     which key remembers it. Tags are the third axis and are kept
     apart: they are a multiple choice, not a toggle. The fourth key,
     the selected project, is NOT here on purpose: see readState.

     GROUP IS GONE (gbppl-sandbox-md-1). Grouping by page is what the
     rail on the left does now, permanently and by construction, and
     grouping the one or two prototypes of a single project by status
     or by tag is a control with nothing left to control. Its
     localStorage key is simply no longer read. ---- */
  var AXES = {
    view:  { key: 'gbppl-sandboxes-view',  def: 'cards',       ok: ['cards', 'list'] },
    sort:  { key: 'gbppl-sandboxes-sort',  def: 'last-active', ok: ['last-active', 'name', 'status'] }
  };
  var TAGS_KEY = 'gbppl-sandboxes-tags';

  /* Порядок статусов ОБЪЯВЛЕН, а не алфавитный: что движется, что
     предложено, что решено. Он же порядок групп при Group · Status и
     тайбрейк при Sort · Status. */
  var STATUS_ORDER = ['in-progress', 'suggested', 'approved'];

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* приватное окно */ } }

  /* ---- The registry, flattened: one row per prototype ----
     TWO CATALOGUES, ONE SHELF (gbppl-proto-model-1, Ton 01.09). The
     registry now holds versions of pages (PAGES) and variants of
     elements (ELEMENTS), and a person looking for «what is being
     tried on the portal» wants both: the header a page wears is as
     much a prototype as a second checkout flow. So the shelf reads
     both and puts them in the same card.

     A variant of an element files itself under the page it is shown
     on, and says whose it is on its own line: a site-wide element
     says «Site element», a local one names its page. Without that
     line the sign in form would look like a prototype of the
     category page, which it is not: it rides every page with a bar. */
  var items = [];
  /* Порядок проектов — порядок реестра, а не порядок непустых страниц:
     теперь у страницы могут быть варианты элементов и ни одной версии
     (портал), и два списка обязаны укладываться в одну шкалу. */
  var pageOrder = Object.keys(reg.pages);
  function orderOf(id) {
    var i = pageOrder.indexOf(id);
    return i < 0 ? pageOrder.length : i;
  }

  reg.rooms('').forEach(function (page) {
    page.variants.forEach(function (v, varIndex) {
      items.push({
        label: v.label, desc: v.desc, status: v.status, ready: v.ready,
        href: v.href, tags: v.tags || [],
        created: v.created || '', updated: v.updated || '',
        /* Порядок В РЕЕСТРЕ, а не по алфавиту: варианты одной
           страницы стоят там в том порядке, в каком их поставил
           автор (сегодняшний поток раньше предложенного), и при
           равных датах это лучший ответ, чем первая буква имени.
           Алфавит остаётся у Sort · Name, где его и просят
           (gbppl-sandbox-names-1: имена перестали начинаться с
           «V1 ·» и «V2 ·», и алфавит перевернул пару чекаута). */
        page: page.label, pageId: page.id,
        pageIndex: orderOf(page.id), varIndex: varIndex
      });
    });
  });

  (typeof reg.elements === 'function' ? reg.elements('') : []).forEach(function (el, elIndex) {
    var home = reg.pages[el.home];
    if (!home) return;
    el.variants.forEach(function (v, i) {
      items.push({
        label: v.label, desc: v.note, status: v.status, ready: v.ready,
        href: v.href, tags: v.tags || [],
        created: v.created || '', updated: v.updated || '',
        page: home.label, pageId: el.home,
        /* Две вещи, которых нет у версии страницы: имя элемента и
           слово о том, чей он. Печатаются одной тихой строкой. */
        element: el.label, owner: el.owner,
        pageIndex: orderOf(el.home),
        /* Варианты элементов стоят ПОСЛЕ версий страницы внутри
           проекта: сначала «какая это страница целиком», потом «чем
           на ней подменили деталь». */
        varIndex: 100 + elIndex * 10 + i
      });
    });
  });

  var tagCount = {};
  items.forEach(function (it) {
    it.tags.forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  /* Самый населённый тег первым: строка фильтра читается как карта
     того, чем студия сейчас занята. */
  var allTags = Object.keys(tagCount).sort(function (a, b) {
    return (tagCount[b] - tagCount[a]) || a.localeCompare(b);
  });

  /* ---- Дата: 'YYYY-MM-DD' разбирается как ЛОКАЛЬНЫЙ день. new
     Date('2026-08-27') читается как UTC-полночь и в минусовых поясах
     съезжает на сутки назад. ---- */
  function parseDay(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function today() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function relative(s) {
    var d = parseDay(s);
    if (!d) return '';
    var days = Math.round((today() - d) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + ' days ago';
    if (days < 14) return 'a week ago';
    if (days < 31) return Math.round(days / 7) + ' weeks ago';
    if (days < 62) return 'a month ago';
    return Math.round(days / 30) + ' months ago';
  }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function absolute(s) {
    var d = parseDay(s);
    return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : 'not recorded';
  }
  /* Дата рождения печатается АБСОЛЮТНО, а не «6 дней назад»: на
     вопрос «сколько это здесь стоит» отвечает день, а не расстояние
     до сегодня, и в отличие от updated он больше никогда не
     сдвинется. Год опускается, пока он текущий: «26 Aug» в строке
     из шести предметов, «26 Aug 2025», когда прототип пережил год.
     Полная дата стоит в title у обеих. */
  function shortDay(s) {
    var d = parseDay(s);
    if (!d) return '';
    var y = d.getFullYear();
    return d.getDate() + ' ' + MONTHS[d.getMonth()] +
           (y === today().getFullYear() ? '' : ' ' + y);
  }

  function statusWord(s) { return String(s).replace(/-/g, ' '); }
  function statusRank(s) {
    var i = STATUS_ORDER.indexOf(String(s).replace(/ /g, '-'));
    return i < 0 ? STATUS_ORDER.length : i;
  }

  /* ---- State. localStorage remembers how you left the page, the
     query string carries a view you want to send to somebody, and the
     query string wins on load. Written with replaceState, so Back
     still means the previous page. ---- */
  var state = { view: '', sort: '', tags: [], project: '' };

  function readState() {
    var q = new URLSearchParams(location.search);
    Object.keys(AXES).forEach(function (name) {
      var a = AXES[name];
      var fromUrl = q.get(name);
      var fromLs  = lsGet(a.key);
      state[name] = a.ok.indexOf(fromUrl) > -1 ? fromUrl
                  : a.ok.indexOf(fromLs) > -1 ? fromLs
                  : a.def;
    });
    function known(t) { return !!tagCount[t]; }
    /* ?tag= присутствует, но пустой = «ни одного тега», и это не то
       же самое, что «ключа нет»: во втором случае вспоминается
       localStorage. */
    state.tags = q.has('tag')
      ? q.getAll('tag').filter(known)
      : (lsGet(TAGS_KEY) || '').split(',').filter(known);

    /* THE PROJECT COMES FROM THE URL AND FROM NOWHERE ELSE
       (gbppl-sandbox-md-1). The other three keys describe HOW you
       look at the shelf, and remembering them is a kindness. This one
       describes WHERE you are, and a page that reopens three days
       later on the room you happened to leave is not a default, it is
       a surprise. Without the key the shelf opens on the first
       project under the current sort. A value naming a project that
       the filter has emptied is dropped in render(), not here: what
       is legal depends on the tags, and they are read above. */
    state.project = q.get('project') || '';
  }

  function writeState() {
    Object.keys(AXES).forEach(function (name) { lsSet(AXES[name].key, state[name]); });
    lsSet(TAGS_KEY, state.tags.join(','));

    var q = new URLSearchParams(location.search);
    Object.keys(AXES).forEach(function (name) {
      q.delete(name);
      if (state[name] !== AXES[name].def) q.set(name, state[name]);
    });
    q.delete('tag');
    state.tags.forEach(function (t) { q.append('tag', t); });
    /* Проект пишется ВСЕГДА, даже когда он первый по сортировке:
       дефолт здесь не постоянная величина, он зависит от сортировки и
       от фильтра, и адрес, который сегодня открывает чекаут, а завтра
       главную, не адрес. Ключ страничный, в KEEP хедера он не входит
       (ловушка 20). */
    q.delete('project');
    if (state.project) q.set('project', state.project);
    /* Ключ снятой оси не остаётся в адресе жить своей жизнью:
       ?group=page, скопированный кем-то на прошлой неделе, теперь не
       значит ничего и молча уезжает (gbppl-sandbox-md-1). */
    q.delete('group');
    var s = q.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
  }

  /* Адрес пункта рельсы: сегодняшний запрос, в котором подменён один
     ключ. Ссылка настоящая, поэтому её можно скопировать и открыть в
     новой вкладке; клик по ней страницу не перезагружает. */
  function projectHref(id) {
    var q = new URLSearchParams(location.search);
    q.set('project', id);
    return location.pathname + '?' + q.toString();
  }

  /* Тот же запрос БЕЗ ключа проекта. По нему рельса решает, надо ли
     её пересобирать: смена проекта меняет только один атрибут в уже
     стоящих пунктах, а вот смена сортировки или тега меняет и состав,
     и адреса. */
  function queryWithoutProject() {
    var q = new URLSearchParams(location.search);
    q.delete('project');
    return q.toString();
  }

  /* ---- Filter, sort, group ---- */
  function visible() {
    if (!state.tags.length) return items.slice();
    /* ЛЮБОЙ из выбранных, не все сразу: чипы расширяют полку, а не
       сужают её до пересечения. Со счётчиком на чипе это читается. */
    return items.filter(function (it) {
      return state.tags.some(function (t) { return it.tags.indexOf(t) > -1; });
    });
  }

  function sortItems(list) {
    var by = state.sort;
    return list.slice().sort(function (a, b) {
      /* Имя = то, что стоит на карточке ПЕРВЫМ, то есть страница, а
         потом уже вариант (gbppl-sandbox-names-1). Внутри группы по
         странице первый ключ одинаков у всех и сортировка сама
         сваливается на вариант — ровно то, что там и нужно. */
      var byName = a.page.localeCompare(b.page) || a.label.localeCompare(b.label);
      /* Порядок реестра целиком: страница, потом вариант внутри неё. */
      var byReg = (a.pageIndex - b.pageIndex) || (a.varIndex - b.varIndex);
      if (by === 'name') return byName;
      if (by === 'status') return (statusRank(a.status) - statusRank(b.status)) || byReg;
      /* Last active: свежее сверху. Даты ISO, поэтому сравниваются
         строками. Ничья разводится ПОРЯДКОМ РЕЕСТРА (страница, затем
         вариант), и 31.08 это ничья у всех восьми: волна имён тронула
         копию каждого. Именем ничья больше не разводится: алфавит
         ставил «Shared quantity pool» впереди «Today’s flow», а в
         реестре сегодняшний поток стоит первым не случайно. */
      var byDate = a.updated === b.updated ? 0 : (a.updated < b.updated ? 1 : -1);
      return byDate || byReg;
    });
  }

  /* Проекты. Группировкой это не является и на контролы не смотрит:
     проект ПО ОПРЕДЕЛЕНИЮ страница, и рельса слева и есть та самая
     группировка по странице, которую раньше приходилось включать
     руками. Порядок проектов = порядок, в котором их прототипы
     встретились в уже отсортированном списке, поэтому Sort работает
     и здесь: при «last active» первым стоит проект с самым свежим
     прототипом, при «name» — первый по алфавиту, при «status» — тот,
     у кого есть самый ранний по объявленному порядку статус. Внутри
     проекта прототипы идут в том же порядке, что и в списке. */
  function projectsOf(list) {
    var bucket = {}, order = [];
    list.forEach(function (it) {
      if (!bucket[it.pageId]) { bucket[it.pageId] = { id: it.pageId, label: it.page, items: [] }; order.push(it.pageId); }
      bucket[it.pageId].items.push(it);
    });
    return order.map(function (k) { return bucket[k]; });
  }

  /* ---- Drawing ---- */
  var step = 0;
  /* Каскад: шаг 40ms объявлен в studio.css, здесь только номер по
     порядку. Потолок 14, чтобы длинная полка не докладывалась
     дольше, чем человек на неё смотрит. */
  function stamp() { return ' style="--gbs-step: ' + Math.min(step++, 14) + '"'; }

  /* Уникальные теги всех прототипов проекта, в порядке первого
     появления: карточка отвечает на вопрос «чего эта страница
     касается» один раз за всю страницу, а не по разу за прототип. */
  function tagBadges(tags) {
    if (!tags.length) return '';
    return '<span class="gbs-badges gbs-badges--tags">' + tags.map(function (t) {
      return '<span class="gbs-chip gbs-chip--tag">' + esc(t) + '</span>';
    }).join('') + '</span>';
  }

  function plural(n) { return n + (n === 1 ? ' prototype' : ' prototypes'); }

  /* ---- КАРТОЧКА = ПРОТОТИП (gbppl-sandbox-md-1, Тон 31.08) ----
     «Нажимаешь на проект, справа его прототипы карточками». Имя
     проекта звучит один раз, в шапке правой половины, поэтому
     карточке остаётся то, чем прототип отличается от соседа: своё
     имя серифом, описание целиком (в строке оно было обрезано двумя
     строками, в карточке места хватает), ряд «статус слева, даты
     справа» — тот самый, на который Тон показал утром, — и теги
     внизу.

     Это .gbs-door--box, то есть та же малая дверь, которой вариант и
     был до утра: волна ничего не рисовала заново, она вернула
     карточке содержимое, которое один день прожило строкой. */
  function pcard(it) {
    /* Чья это деталь (gbppl-proto-model-1): имя элемента одной тихой
       строкой под именем варианта. У версии страницы этой строки нет:
       она и есть страница.

       ОБЛАСТЬ ДЕЙСТВИЯ ГОВОРИТСЯ ТОЛЬКО У СКВОЗНОГО. Локальный
       элемент стоит в пане своей страницы, и её имя уже написано
       заголовком над карточками; печатать «· Portal page» на восьми
       карточках под заголовком «Portal page» — ровно то, на что Тон
       сказал 31.08 «Прототипы дублируются: Checkout, Checkout,
       Category, Category — бред». А «Site element» сказать
       обязательно: иначе форма входа читалась бы прототипом страницы
       категорий, хотя она едет на любой странице с баром. */
    var owner = it.element
      ? '<span class="gbs-pcard__owner">' + esc(it.element) +
        (it.owner === 'Site element' ? ' · ' + esc(it.owner) : '') + '</span>'
      : '';
    var body =
      '<span class="gbs-pcard__head">' +
        '<h4 class="gbs-door-title">' + esc(it.label) + '</h4>' +
        (it.ready ? ARROW : '<span class="gbs-pcard__note">not open yet</span>') +
      '</span>' +
      owner +
      '<p class="gbs-door-desc">' + esc(it.desc) + '</p>' +
      '<span class="gbs-pcard__meta">' +
        '<span class="gbs-chip">' + esc(statusWord(it.status)) + '</span>' +
        '<span class="gbs-pcard__created" title="created ' + esc(absolute(it.created)) + '">created ' +
        esc(shortDay(it.created) || 'not recorded') + '</span>' +
        '<span class="gbs-pcard__updated" title="updated ' + esc(absolute(it.updated)) + '">updated ' +
        esc(relative(it.updated) || 'not recorded') + '</span>' +
      '</span>' +
      tagBadges(it.tags);
    if (!it.ready) {
      return '<div class="gbs-door gbs-door--box gbs-door--proto gbs-door--coming"' + stamp() + '>' +
             body + '</div>';
    }
    return '<a class="gbs-door gbs-door--box gbs-door--proto" href="' + esc(it.href) + '"' +
           stamp() + '>' + body + '</a>';
  }

  function row(it) {
    var tags = it.tags.join(', ');
    /* СТРОКА ВЕДЁТ ИМЕНЕМ ПРОТОТИПА, ВСЕГДА (gbppl-sandbox-md-1).
       Колонка страницы жила в строке, пока список был плоским; в
       мастер-детали страница названа шапкой над списком, и печатать
       её в каждой строке значило бы сказать одно слово пять раз.
       Модификатор .gbs-list--ingroup, который раньше включался
       группировкой по странице, теперь стоит постоянно, и колонок в
       сетке пять. «Not open yet» ходит за именем: комнаты нет у
       прототипа, а не у страницы. */
    var note = it.ready ? '' : '<span class="gbs-row__note">· not open yet</span>';
    /* В строке имя элемента идёт тем же тихим суффиксом, что и «not
       open yet»: колонки под него в сетке из пяти нет, а вопрос «чья
       это деталь» в списке задаётся так же часто, как в карточках. */
    var own = it.element ? '<span class="gbs-row__note">· ' + esc(it.element) + '</span>' : '';
    var body =
      '<span class="gbs-row__name">' + esc(it.label) + own + note + '</span>' +
      '<span class="gbs-row__meta">' +
        '<span class="gbs-chip">' + esc(statusWord(it.status)) + '</span>' +
        '<span class="gbs-row__tags" title="' + esc(tags) + '">' + esc(tags) + '</span>' +
      '</span>' +
      /* Дата и стрелка стоят СНАРУЖИ меты: на узком экране они
         поднимаются к имени, а мета уходит под них целой строкой,
         и порядок переставляет CSS через order. */
      /* День рождения в свою колонку не вставлен, он въехал в
         подсказку рядом с датой правки — список отвечает на вопрос
         «что шевелилось последним», а возраст прототипа читается на
         его карточке (gbppl-sandbox-projects-1). */
      '<span class="gbs-row__updated" title="created ' + esc(absolute(it.created)) +
      ' · updated ' + esc(absolute(it.updated)) + '">' +
      esc(relative(it.updated) || 'not recorded') + '</span>' +
      (it.ready ? ARROW : '');
    if (!it.ready) return '<div class="gbs-row gbs-row--coming"' + stamp() + '>' + body + '</div>';
    return '<a class="gbs-row" href="' + esc(it.href) + '"' + stamp() + '>' + body + '</a>';
  }

  function paintControls() {
    if (!controls) return;
    Object.keys(AXES).forEach(function (name) {
      var axis = controls.querySelector('[data-axis="' + name + '"]');
      if (!axis) return;
      Array.prototype.forEach.call(axis.querySelectorAll('.gbdoc-seg'), function (b) {
        var on = b.getAttribute('data-val') === state[name];
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
    if (tagAxis) {
      Array.prototype.forEach.call(tagAxis.querySelectorAll('.gbs-tagbtn'), function (b) {
        var on = state.tags.indexOf(b.getAttribute('data-tag')) > -1;
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    /* Счёт на кнопке считает ТЕГИ, а не всё, что стоит в панели: вид
       ничего со страницы не убирает, а «Filters · 2» рядом с
       выбранным видом обещало бы, что убирает. */
    var n = state.tags.length;
    if (fcount) { fcount.textContent = String(n); fcount.hidden = !n; }

    /* Строка активных фильтров стоит только при свёрнутой панели:
       развёрнутая показывает те же теги зажжёнными в своём ряду. */
    if (fline) {
      var open = fpanel && !fpanel.hidden;
      fline.hidden = !n || open;
      if (!fline.hidden) {
        fline.innerHTML = 'Filtered by: ' + state.tags.map(function (t) {
          return '<button class="gbs-chip gbs-tagbtn is-on" type="button" data-tag="' +
                 esc(t) + '" aria-label="Remove the ' + esc(t) + ' filter">' +
                 esc(t) + ' ×</button>';
        }).join('');
      }
    }
  }

  /* ---- Левая половина ----
     Рельса перерисовывается ТОЛЬКО когда меняется её состав или
     адреса пунктов; при переключении проекта меняется один атрибут.
     Иначе клик с клавиатуры терял бы фокус вместе с элементом,
     который его получил, а список из пяти строк перестраивался бы,
     ничего не меняя. */
  var masterSig = '';
  function paintMaster(host, projs) {
    var sig = projs.map(function (p) { return p.id + ':' + p.items.length; }).join('|') +
              '#' + queryWithoutProject();
    if (sig !== masterSig || !host.children.length) {
      masterSig = sig;
      host.innerHTML = projs.map(function (p) {
        return '<a class="gbs-plink" href="' + esc(projectHref(p.id)) + '" data-project="' + esc(p.id) + '">' +
                 '<span class="gbs-plink__name">' + esc(p.label) + '</span>' +
                 '<span class="gbs-plink__count">' + p.items.length + '</span>' +
               '</a>';
      }).join('');
    }
    Array.prototype.forEach.call(host.querySelectorAll('.gbs-plink'), function (a) {
      var on = a.getAttribute('data-project') === state.project;
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });

    /* Лёжа рельса прокручивается внутри себя, и пятый проект стоит за
       краем. Прямая ссылка на него открыла бы страницу с подсвеченным
       пунктом, которого не видно. Двигаем ровно настолько, насколько
       нужно, и только по горизонтали: scrollIntoView увёз бы вместе с
       рельсой весь документ. */
    var on = host.querySelector('.gbs-plink[aria-current="page"]');
    if (!on || host.scrollWidth <= host.clientWidth) return;
    var left = on.offsetLeft, right = left + on.offsetWidth;
    if (left < host.scrollLeft) host.scrollLeft = left;
    else if (right > host.scrollLeft + host.clientWidth) host.scrollLeft = right - host.clientWidth;
  }

  /* ---- Правая половина ---- */
  function paintDetail(host, proj) {
    step = 0;
    var n = proj.items.length;
    var head =
      '<div class="gbs-proj__head">' +
        '<h3 class="gbs-door-title">' + esc(proj.label) + '</h3>' +
        '<span class="gbs-proj__count">' + plural(n) + '</span>' +
      '</div>';
    var body = state.view === 'cards'
      ? '<div class="gbs-grid">' + proj.items.map(pcard).join('') + '</div>'
      : '<div class="gbs-list gbs-list--ingroup">' + proj.items.map(row).join('') + '</div>';
    host.innerHTML = head + body;
  }

  function render() {
    var list = sortItems(visible());
    var projs = projectsOf(list);

    if (!items.length) {
      mount.innerHTML = '<p class="gbs-empty">None yet.</p>';
      paintControls();
      writeState();
      return;
    }
    if (!projs.length) {
      mount.innerHTML = '<p class="gbs-empty">No sandbox carries these tags. Turn one off to widen the shelf.</p>';
      paintControls();
      writeState();
      return;
    }

    /* Выбранный проект держится, пока он есть в списке; фильтр,
       опустошивший его, передаёт выбор первому по сортировке. */
    var chosen = null;
    projs.forEach(function (p) { if (p.id === state.project) chosen = p; });
    if (!chosen) { chosen = projs[0]; state.project = chosen.id; }

    /* Адрес переписывается ПЕРВЫМ: пункты рельсы строят свои href из
       сегодняшнего запроса, и рельса, собранная до записи, несла бы
       вчерашние ключи. */
    writeState();

    if (!mount.querySelector('.gbs-md')) {
      mount.innerHTML =
        '<div class="gbs-md">' +
          '<nav class="gbs-md__master" id="gbsMaster" aria-label="Projects"></nav>' +
          '<div class="gbs-md__detail" id="gbsDetail"></div>' +
        '</div>';
    }
    paintMaster(document.getElementById('gbsMaster'), projs);
    paintDetail(document.getElementById('gbsDetail'), chosen);
    paintControls();
  }

  /* ---- Wiring ---- */
  if (tagAxis) {
    if (!allTags.length) {
      tagAxis.hidden = true;
    } else {
      tagAxis.insertAdjacentHTML('beforeend', allTags.map(function (t) {
        return '<button class="gbs-chip gbs-tagbtn" type="button" aria-pressed="false" data-tag="' +
               esc(t) + '">' + esc(t) + ' · ' + tagCount[t] + '</button>';
      }).join(''));
    }
  }

  if (controls) {
    controls.addEventListener('click', function (e) {
      var el = e.target;
      if (!el || !el.closest) return;
      var seg = el.closest('.gbdoc-seg');
      if (seg && seg.parentNode) {
        var axis = seg.parentNode.getAttribute('data-axis');
        var val  = seg.getAttribute('data-val');
        if (AXES[axis] && state[axis] !== val) { state[axis] = val; render(); }
        return;
      }
      /* Один обработчик на оба места, где тег кликается: ряд чипов в
         развёрнутой панели и строка «Filtered by» под свёрнутой. */
      var chip = el.closest('.gbs-tagbtn');
      if (chip) {
        var t = chip.getAttribute('data-tag');
        var i = state.tags.indexOf(t);
        if (i > -1) state.tags.splice(i, 1); else state.tags.push(t);
        render();
      }
    });
  }

  /* Разворот полки. Состояние живёт ровно столько, сколько открыта
     вкладка, и НЕ ЗАПОМИНАЕТСЯ: свёрнуто по умолчанию — это и есть
     заказ («свернуть по дефолту»), а полка, открытая на прошлой
     неделе и встречающая тебя развёрнутой, отменяет его. */
  if (fbtn && fpanel) {
    fbtn.addEventListener('click', function () {
      var open = fpanel.hidden;
      fpanel.hidden = !open;
      fbtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      paintControls();
    });
  }

  /* Клик по проекту не перезагружает страницу, но пункт остаётся
     настоящей ссылкой: её можно скопировать, открыть в новой вкладке
     и прислать. Перехватывается только простой левый клик — с
     модификатором браузер делает своё дело сам. */
  mount.addEventListener('click', function (e) {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var el = e.target;
    if (!el || !el.closest) return;
    var link = el.closest('.gbs-plink');
    if (!link) return;
    e.preventDefault();
    var id = link.getAttribute('data-project');
    if (id === state.project) return;
    state.project = id;
    render();
  });

  readState();
  render();
})();
</script>

<!-- THE CONSOLE, at last on the two studio pages too (gbppl-panel-6).
     studio-panel.css says it stands on EVERY page of the studio and the
     prototype; the hub and the shelf were the two that never got it,
     because their own bar already carries the four doors. Inspect mode
     ended that argument: the Mode switch lives in the console, and a
     page without a console is a page a designer cannot inspect. The
     doors repeat here, and repeating them is the point (Ton 26.08: one
     console, one logic, everywhere). -->

     naming the sandboxes of this page would be the page twice over. -->
