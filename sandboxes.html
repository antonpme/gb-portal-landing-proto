<!-- ============================================================
     gbppl-sandbox-projects-1 — ONE CARD PER PAGE, PROTOTYPES INSIDE
     ------------------------------------------------------------
     Ton, 31.08, from a screenshot of this shelf: «Прототипы
     дублируются: Checkout, Checkout, Category, Category — бред. Дат
     создания не видно (updated есть, created нет; дата должна быть
     вверху справа, где Proposal, только справа). Вариации одного
     прототипа мы показываем отдельными карточками? Мы работаем как
     Figma: проект, внутри которого прототипы? Мне кажется, здесь
     что-то упущено.»

     It was. The card used to be a VARIANT, so eight variants of five
     pages made eight cards under five names, two of them printed
     twice. Now the card is the PAGE (the project) and the variants
     stand as rows inside it (the prototypes): five cards, no name
     repeated, and the shelf reads the way Figma reads.

     WHAT MOVED, AND WHERE.
       card head    page name in the serif, and on the right nothing
                    but a quiet count. A project has as many dates as
                    it has prototypes, so no date belongs up there.
       row          prototype name with the arrow, one description
                    clamped to two lines, then status chip on the
                    left and dates on the right, which is the place
                    Ton pointed at. The row is the link; the card is
                    not, because a page with two prototypes has no
                    single address.
       tags         one row at the foot of the card, the unique tags
                    of all its prototypes. Per row they would have
                    turned a list into a field of chips.
       Group        hidden in Cards. The card IS the page, so
                    grouping by page has already happened, and
                    grouping by status or tag would hand back the
                    flat variant cards Ton just refused. The value is
                    remembered, not reset: List is one click away and
                    still groups four ways.
       filter/sort  work on PROTOTYPES. A card whose prototypes all
                    fall out of the filter disappears with them, and
                    the order of the cards follows the order of their
                    first prototype under the current sort.
       List         untouched. Six columns, the page first, exactly
                    as it was measured on 1100 and on 390.
     ------------------------------------------------------------
     gbppl-sandboxes-4 — THE SANDBOXES PAGE, A PROJECT MANAGER
     ------------------------------------------------------------
     Ton, 28.08: «что если страница Sandboxes будет выполнять роль
     менеджера проектов в Figma? Сейчас один view: большие карточки,
     сгруппированные по принадлежности. 1. View должен быть и
     списком, и карточками. 2. Группировку стоит делать через теги
     (показывать бейджем принадлежность к чему-либо). Можно сделать
     фильтрацию или группировку на странице, группировка
     опциональная. 3. Можно смотреть проекты по последнему активному
     (что последнее изменялось).»

     WHAT THE PAGE DOES NOW. A shelf of controls above the content:
     View (cards or list), Group (none, page, status, tag), Sort
     (last active, name, status) and a row of tag chips that filters.
     The controls are the documentation segments of docs.css, not new
     furniture; the cards are the same .gbs-door--box they were, with
     a row of badges and the date of last activity added; the list is
     the one new object on the page.

     GROUPING IS NOW OPTIONAL, AND THE DEFAULT IS FLAT. Until today
     the rooms were always grouped by the page they belong to, and
     that was the only reading. It is still one click away (Group ·
     Page), but the page opens sorted by what moved last, because
     that is the question Ton put first.

     STATE LIVES IN TWO PLACES, ON PURPOSE. localStorage remembers
     how YOU left the page (gbppl-sandboxes-view / -group / -sort /
     -tags); the query string carries a view you want to SEND to
     somebody (?view=list&group=page&tag=header). The URL wins on
     load, and it is written with replaceState so the back button
     still means the previous page. These four keys are page keys,
     not prototype context, so they are NOT in the KEEP list of
     header.js: sending them along to live/checkout.html would be
     nonsense.
     ------------------------------------------------------------
     gbppl-sandboxes-3 — THE SANDBOXES PAGE
     ------------------------------------------------------------
     The second room of the studio (hub-9, Ton 24.08: the nav must
     TAKE you to these pages, not scroll to these sections).

     Parallel rooms, one open question each. They are still links
     into live\ with a query on them rather than files of their own;
     the day one becomes a file it moves to sandbox\ and only its
     href changes here. See sandbox\README.md.

     THE DOORS ARE NOT WRITTEN HERE ANY MORE (gbppl-sandboxes-2,
     Ton 25.08). They are painted from system\sandbox-registry.js,
     the one place a sandbox is registered — the same file the studio
     panel reads on every page and the PROTO panel reads on checkout.
     Three surfaces, three voices, one list; a room added to the
     registry appears on all of them at once, and this page never
     drifts out of step with what the panels promise. The markup the
     script emits is the markup that stood here before it, class for
     class, so nothing about the page changed except who writes it.
     Rooms are grouped by the page they belong to, because that is
     the question the visitor arrives with: what is being tried on
     checkout, what on the portal.

     Same borrowed chrome as the hub and nothing of its own: the
     bar is header.css (--studio), the ground is shell.css
     (gb-demo), the doors and the chip are studio.css, the guard and
     the LOCK are studio.js. If something on this page needs a new
     rule, the rule belongs in one of those files.

     gbppl-comments-c, 28.08: comment mode wired here too. This was
     the one page of sixteen that carried the console and the
     instrument but not the third mode, so its Mode row had two
     positions where every other page had three. Two stylesheets and
     one script, in the same place and the same order as everywhere
     else; nothing else on the page moved.
     ============================================================ -->

<script src="system/sandbox-registry.js"></script>
<script>
/* ---- The shelf, painted from the registry (gbppl-sandboxes-4).
   Three questions the visitor arrives with, and the page answers all
   three from one list: what moved last (Sort), what belongs together
   (Group), what is about the thing I care about (Tags).

   THE CARD IS THE ONE THAT STOOD HERE (gbppl-sandboxes-3), plus a row
   of badges and a line of date. THE LIST is new, and it is the only
   new object.

   THE TITLE IS THE PAGE, NOT THE VARIANT (gbppl-sandbox-names-1, Ton
   31.08, from a screenshot of this shelf): «Самый большой хаос здесь.
   Я не пойму, какой прототип что означает. Что такое Light Pre-Footer?
   Что такое V2 Shared Pool? Прототипы должны называться по странице:
   Checkout Page, Home Page, Category Page, Sign-in / Sign-up Form,
   Book a Meeting Form. Я не понимаю, что нажимать и куда ведёт.»

   So the two names swapped places. The serif line, the loudest thing
   on the card, now says WHERE you land; the line under it says WHICH
   of that page's tries this one is, and the description says what the
   try changes.

   AND THEN THE CARD STOPPED BEING A VARIANT AT ALL
   (gbppl-sandbox-projects-1, the same day, the next screenshot): the
   card is the page, the variants are rows inside it. The serif line
   is still the page; what used to be the second line of the card is
   now the first line of a row. Grouping by page went with it, for
   cards only: the header of this file has the full account.

   GROUPED BY PAGE, THE LIST ROW LEADS WITH THE VARIANT. The eyebrow
   of the group already said the page, and a group of three rows all
   starting with «Checkout page» under a heading reading «Checkout
   page» is the same word four times. Inside a page group the row
   drops its first column (.gbs-list--ingroup).

   TAGS ARE CHIPS IN TWO PLACES AND TEXT IN A THIRD. On the card a tag
   is a label, in the filter row it is a target; in the list row it is
   a line of text, because four chips in a dense row double its
   height. Same data, three jobs, and the quiet one is the one that
   has to fit.
   ---- */
(function () {
  'use strict';

  var mount    = document.getElementById('gbsRooms');
  var controls = document.getElementById('gbsControls');
  var tagAxis  = document.getElementById('gbsTagAxis');
  var reg = window.GB_SANDBOXES;
  if (!mount || !reg) return;

  var ARROW =
    '<span class="gbs-arrow" aria-hidden="true">' +
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M5 12h14M13 6l6 6-6 6"/></svg></span>';

  function esc(v) {
    return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---- The three segment axes: what is legal, what is default and
     which key remembers it. Tags are the fourth axis and are kept
     apart: they are a multiple choice, not a toggle. ---- */
  var AXES = {
    view:  { key: 'gbppl-sandboxes-view',  def: 'cards',       ok: ['cards', 'list'] },
    group: { key: 'gbppl-sandboxes-group', def: 'none',        ok: ['none', 'page', 'status', 'tag'] },
    sort:  { key: 'gbppl-sandboxes-sort',  def: 'last-active', ok: ['last-active', 'name', 'status'] }
  };
  var TAGS_KEY = 'gbppl-sandboxes-tags';

  /* Порядок статусов ОБЪЯВЛЕН, а не алфавитный: что движется, что
     предложено, что решено. Он же порядок групп при Group · Status и
     тайбрейк при Sort · Status. */
  var STATUS_ORDER = ['in-progress', 'proposal', 'approved'];

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* приватное окно */ } }

  /* ---- The registry, flattened: one row per sandbox ---- */
  var items = [];
  reg.rooms('').forEach(function (page, pageIndex) {
    page.variants.forEach(function (v, varIndex) {
      items.push({
        label: v.label, desc: v.desc, status: v.status, ready: v.ready,
        href: v.href, tags: v.tags || [],
        created: v.created || '', updated: v.updated || '',
        /* Порядок В РЕЕСТРЕ, а не по алфавиту: варианты одной
           страницы стоят там в том порядке, в каком их поставил
           автор (сегодняшний поток раньше предложенного), и при
           равных датах это лучший ответ, чем первая буква имени.
           Алфавит остаётся у Sort · Name, где его и просят
           (gbppl-sandbox-names-1: имена перестали начинаться с
           «V1 ·» и «V2 ·», и алфавит перевернул пару чекаута). */
        page: page.label, pageIndex: pageIndex, varIndex: varIndex
      });
    });
  });

  var tagCount = {};
  items.forEach(function (it) {
    it.tags.forEach(function (t) { tagCount[t] = (tagCount[t] || 0) + 1; });
  });
  /* Самый населённый тег первым: строка фильтра читается как карта
     того, чем студия сейчас занята. */
  var allTags = Object.keys(tagCount).sort(function (a, b) {
    return (tagCount[b] - tagCount[a]) || a.localeCompare(b);
  });

  /* ---- Дата: 'YYYY-MM-DD' разбирается как ЛОКАЛЬНЫЙ день. new
     Date('2026-08-27') читается как UTC-полночь и в минусовых поясах
     съезжает на сутки назад. ---- */
  function parseDay(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  function today() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }
  function relative(s) {
    var d = parseDay(s);
    if (!d) return '';
    var days = Math.round((today() - d) / 86400000);
    if (days <= 0) return 'today';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + ' days ago';
    if (days < 14) return 'a week ago';
    if (days < 31) return Math.round(days / 7) + ' weeks ago';
    if (days < 62) return 'a month ago';
    return Math.round(days / 30) + ' months ago';
  }
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function absolute(s) {
    var d = parseDay(s);
    return d ? d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() : 'not recorded';
  }
  /* Дата рождения печатается АБСОЛЮТНО, а не «6 дней назад»: на
     вопрос «сколько это здесь стоит» отвечает день, а не расстояние
     до сегодня, и в отличие от updated он больше никогда не
     сдвинется. Год опускается, пока он текущий: «26 Aug» в строке
     из шести предметов, «26 Aug 2025», когда прототип пережил год.
     Полная дата стоит в title у обеих. */
  function shortDay(s) {
    var d = parseDay(s);
    if (!d) return '';
    var y = d.getFullYear();
    return d.getDate() + ' ' + MONTHS[d.getMonth()] +
           (y === today().getFullYear() ? '' : ' ' + y);
  }

  function statusWord(s) { return String(s).replace(/-/g, ' '); }
  function statusRank(s) {
    var i = STATUS_ORDER.indexOf(String(s).replace(/ /g, '-'));
    return i < 0 ? STATUS_ORDER.length : i;
  }

  /* ---- State. localStorage remembers how you left the page, the
     query string carries a view you want to send to somebody, and the
     query string wins on load. Written with replaceState, so Back
     still means the previous page. ---- */
  var state = { view: '', group: '', sort: '', tags: [] };

  function readState() {
    var q = new URLSearchParams(location.search);
    Object.keys(AXES).forEach(function (name) {
      var a = AXES[name];
      var fromUrl = q.get(name);
      var fromLs  = lsGet(a.key);
      state[name] = a.ok.indexOf(fromUrl) > -1 ? fromUrl
                  : a.ok.indexOf(fromLs) > -1 ? fromLs
                  : a.def;
    });
    function known(t) { return !!tagCount[t]; }
    /* ?tag= присутствует, но пустой = «ни одного тега», и это не то
       же самое, что «ключа нет»: во втором случае вспоминается
       localStorage. */
    state.tags = q.has('tag')
      ? q.getAll('tag').filter(known)
      : (lsGet(TAGS_KEY) || '').split(',').filter(known);
  }

  function writeState() {
    Object.keys(AXES).forEach(function (name) { lsSet(AXES[name].key, state[name]); });
    lsSet(TAGS_KEY, state.tags.join(','));

    var q = new URLSearchParams(location.search);
    Object.keys(AXES).forEach(function (name) {
      q.delete(name);
      if (state[name] !== AXES[name].def) q.set(name, state[name]);
    });
    q.delete('tag');
    state.tags.forEach(function (t) { q.append('tag', t); });
    var s = q.toString();
    history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + location.hash);
  }

  /* ---- Filter, sort, group ---- */
  function visible() {
    if (!state.tags.length) return items.slice();
    /* ЛЮБОЙ из выбранных, не все сразу: чипы расширяют полку, а не
       сужают её до пересечения. Со счётчиком на чипе это читается. */
    return items.filter(function (it) {
      return state.tags.some(function (t) { return it.tags.indexOf(t) > -1; });
    });
  }

  function sortItems(list) {
    var by = state.sort;
    return list.slice().sort(function (a, b) {
      /* Имя = то, что стоит на карточке ПЕРВЫМ, то есть страница, а
         потом уже вариант (gbppl-sandbox-names-1). Внутри группы по
         странице первый ключ одинаков у всех и сортировка сама
         сваливается на вариант — ровно то, что там и нужно. */
      var byName = a.page.localeCompare(b.page) || a.label.localeCompare(b.label);
      /* Порядок реестра целиком: страница, потом вариант внутри неё. */
      var byReg = (a.pageIndex - b.pageIndex) || (a.varIndex - b.varIndex);
      if (by === 'name') return byName;
      if (by === 'status') return (statusRank(a.status) - statusRank(b.status)) || byReg;
      /* Last active: свежее сверху. Даты ISO, поэтому сравниваются
         строками. Ничья разводится ПОРЯДКОМ РЕЕСТРА (страница, затем
         вариант), и 31.08 это ничья у всех восьми: волна имён тронула
         копию каждого. Именем ничья больше не разводится: алфавит
         ставил «Shared quantity pool» впереди «Today’s flow», а в
         реестре сегодняшний поток стоит первым не случайно. */
      var byDate = a.updated === b.updated ? 0 : (a.updated < b.updated ? 1 : -1);
      return byDate || byReg;
    });
  }

  function groups(list) {
    if (state.group === 'none') return [{ label: '', items: list }];

    var bucket = {}, keys = [];
    list.forEach(function (it) {
      /* По тегу песочница попадает в НЕСКОЛЬКО групп, и это не
         ошибка: у варианта столько областей, сколько он трогает. */
      var ks = state.group === 'page'   ? [it.page]
             : state.group === 'status' ? [statusWord(it.status)]
             : (it.tags.length ? it.tags.slice() : ['no tags']);
      ks.forEach(function (k) {
        if (!bucket[k]) { bucket[k] = []; keys.push(k); }
        bucket[k].push(it);
      });
    });

    if (state.group === 'page') {
      keys.sort(function (a, b) { return bucket[a][0].pageIndex - bucket[b][0].pageIndex; });
    } else if (state.group === 'status') {
      keys.sort(function (a, b) { return statusRank(a) - statusRank(b); });
    } else {
      keys.sort(function (a, b) { return (bucket[b].length - bucket[a].length) || a.localeCompare(b); });
    }

    return keys.map(function (k) { return { label: k, items: bucket[k] }; });
  }

  /* Проекты для вида Cards. Группировкой это не является и на
     контролы не смотрит: карточка ПО ОПРЕДЕЛЕНИЮ страница. Порядок
     проектов = порядок, в котором их прототипы встретились в уже
     отсортированном списке, поэтому Sort работает и здесь: при «last
     active» первым стоит проект с самым свежим прототипом, при
     «name» — первый по алфавиту, при «status» — тот, у кого есть
     самый ранний по объявленному порядку статус. Внутри карточки
     прототипы идут в том же порядке, что и в списке. */
  function projects(list) {
    var bucket = {}, order = [];
    list.forEach(function (it) {
      if (!bucket[it.page]) { bucket[it.page] = []; order.push(it.page); }
      bucket[it.page].push(it);
    });
    return order.map(function (k) { return { label: k, items: bucket[k] }; });
  }

  /* ---- Drawing ---- */
  var step = 0;
  /* Каскад: шаг 40ms объявлен в studio.css, здесь только номер по
     порядку. Потолок 14, чтобы длинная полка не докладывалась
     дольше, чем человек на неё смотрит. */
  function stamp() { return ' style="--gbs-step: ' + Math.min(step++, 14) + '"'; }

  /* Уникальные теги всех прототипов проекта, в порядке первого
     появления: карточка отвечает на вопрос «чего эта страница
     касается» один раз за всю страницу, а не по разу за прототип. */
  function tagBadges(tags) {
    if (!tags.length) return '';
    return '<span class="gbs-badges gbs-badges--tags">' + tags.map(function (t) {
      return '<span class="gbs-chip gbs-chip--tag">' + esc(t) + '</span>';
    }).join('') + '</span>';
  }

  /* Полка сгруппирована страницей — значит страницу уже назвали
     сверху, и строка списка ведёт вариантом. Вопрос остался только у
     списка: у карточек группировки больше нет вовсе (см. render). */
  function inPageGroup() { return state.group === 'page'; }

  /* ---- Строка прототипа внутри карточки-проекта ----
     Имя со стрелкой, под ним описание в две строки, под ним ряд
     «статус слева, даты справа» — место, на которое Тон показал
     пальцем: «дата должна быть вверху справа, где Proposal, только
     справа». Кликается строка целиком; проект ссылкой быть перестал,
     потому что у страницы с двумя прототипами нет одного адреса. */
  function proto(it) {
    var body =
      '<span class="gbs-proto__name">' + esc(it.label) + '</span>' +
      (it.ready ? ARROW : '<span class="gbs-proto__note">not open yet</span>') +
      '<span class="gbs-proto__desc" title="' + esc(it.desc) + '">' + esc(it.desc) + '</span>' +
      '<span class="gbs-proto__meta">' +
        '<span class="gbs-chip">' + esc(statusWord(it.status)) + '</span>' +
        '<span class="gbs-proto__created" title="created ' + esc(absolute(it.created)) + '">created ' +
        esc(shortDay(it.created) || 'not recorded') + '</span>' +
        '<span class="gbs-proto__updated" title="updated ' + esc(absolute(it.updated)) + '">updated ' +
        esc(relative(it.updated) || 'not recorded') + '</span>' +
      '</span>';
    if (!it.ready) return '<div class="gbs-proto gbs-proto--coming">' + body + '</div>';
    return '<a class="gbs-proto" href="' + esc(it.href) + '">' + body + '</a>';
  }

  /* ---- Карточка = ПРОЕКТ (gbppl-sandbox-projects-1, Тон 31.08) ----
     «Прототипы дублируются: Checkout, Checkout, Category, Category —
     бред... Мы работаем как Figma: проект, внутри которого
     прототипы?» Да. Заголовок — имя страницы, справа тихий счётчик,
     дальше строки прототипов, внизу теги всех прототипов сразу.
     Даты в шапку не поднимаются: у проекта их столько, сколько
     прототипов, и любая из них наверху была бы датой не того. */
  function projectCard(p) {
    var tags = [];
    p.items.forEach(function (it) {
      it.tags.forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); });
    });
    var n = p.items.length;
    return '<div class="gbs-door gbs-door--box gbs-door--project"' + stamp() + '>' +
             '<div class="gbs-proj__head">' +
               '<h3 class="gbs-door-title">' + esc(p.label) + '</h3>' +
               '<span class="gbs-proj__count">' + n + (n === 1 ? ' prototype' : ' prototypes') + '</span>' +
             '</div>' +
             '<div class="gbs-protos">' + p.items.map(proto).join('') + '</div>' +
             tagBadges(tags) +
           '</div>';
  }

  function row(it) {
    var tags = it.tags.join(', ');
    /* Первая колонка — страница, вторая — вариант, тот же порядок,
       что на карточке. В группе по странице первой колонки нет, и
       имя варианта занимает её место (класс на .gbs-list).
       «Not open yet» ходит за ИМЕНЕМ ВАРИАНТА, в какой бы колонке
       оно ни стояло: комнаты нет у варианта, а не у страницы. */
    var note = it.ready ? '' : '<span class="gbs-row__note">· not open yet</span>';
    var body =
      '<span class="gbs-row__name">' + esc(inPageGroup() ? it.label : it.page) +
        (inPageGroup() ? note : '') +
      '</span>' +
      (inPageGroup() ? '' :
        '<span class="gbs-row__variant">' + esc(it.label) + note + '</span>') +
      '<span class="gbs-row__meta">' +
        '<span class="gbs-chip">' + esc(statusWord(it.status)) + '</span>' +
        '<span class="gbs-row__tags" title="' + esc(tags) + '">' + esc(tags) + '</span>' +
      '</span>' +
      /* Дата и стрелка стоят СНАРУЖИ меты: на узком экране они
         поднимаются к имени, а мета уходит под них целой строкой,
         и порядок переставляет CSS через order. */
      /* Строка списка осталась ровно той, что была: шесть колонок,
         поверенные на 1100 и на 390. День рождения в седьмую колонку
         не вставлен, он въехал в подсказку рядом с датой правки —
         список отвечает на вопрос «что шевелилось последним», а
         возраст прототипа читается на его карточке
         (gbppl-sandbox-projects-1). */
      '<span class="gbs-row__updated" title="created ' + esc(absolute(it.created)) +
      ' · updated ' + esc(absolute(it.updated)) + '">' +
      esc(relative(it.updated) || 'not recorded') + '</span>' +
      (it.ready ? ARROW : '');
    if (!it.ready) return '<div class="gbs-row gbs-row--coming"' + stamp() + '>' + body + '</div>';
    return '<a class="gbs-row" href="' + esc(it.href) + '"' + stamp() + '>' + body + '</a>';
  }

  function paintControls() {
    if (!controls) return;
    /* GROUP ПРЯЧЕТСЯ В CARDS (gbppl-sandbox-projects-1). Карточка
       теперь и есть страница, то есть группировка по странице уже
       произошла и отменить её нечем; предлагать Status или Tag —
       предлагать вернуться к плоским карточкам-вариантам, от которых
       Тон и отказался. Значение оси не сбрасывается, только ось не
       показывается: List стоит в одном клике и вспоминает её. */
    var groupAxis = controls.querySelector('[data-axis="group"]');
    if (groupAxis) groupAxis.hidden = state.view === 'cards';
    Object.keys(AXES).forEach(function (name) {
      var axis = controls.querySelector('[data-axis="' + name + '"]');
      if (!axis) return;
      Array.prototype.forEach.call(axis.querySelectorAll('.gbdoc-seg'), function (b) {
        var on = b.getAttribute('data-val') === state[name];
        b.classList.toggle('is-on', on);
        b.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
    if (!tagAxis) return;
    Array.prototype.forEach.call(tagAxis.querySelectorAll('.gbs-tagbtn'), function (b) {
      var on = state.tags.indexOf(b.getAttribute('data-tag')) > -1;
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function render() {
    step = 0;
    var list = sortItems(visible());

    if (!items.length) {
      mount.innerHTML = '<p class="gbs-empty">None yet.</p>';
    } else if (!list.length) {
      mount.innerHTML = '<p class="gbs-empty">No sandbox carries these tags. Turn one off to widen the shelf.</p>';
    } else if (state.view === 'cards') {
      /* Карточки не группируются ничем: проект и есть группа. */
      mount.innerHTML = '<div class="gbs-grid">' +
                        projects(list).map(projectCard).join('') + '</div>';
    } else {
      /* Модификатор говорит «страница уже названа сверху», и колонку
         страницы в строке убирает CSS (сетка строки объявлена на
         контейнере). Группировка осталась вопросом СПИСКА. */
      var ing = inPageGroup() ? ' gbs-list--ingroup' : '';
      mount.innerHTML = groups(list).map(function (g) {
        var inner = '<div class="gbs-list' + ing + '">' + g.items.map(row).join('') + '</div>';
        if (!g.label) return inner;
        return '<div class="gbs-room">' +
                 '<span class="gb-eyebrow">' + esc(g.label) + ' · ' + g.items.length + '</span>' +
                 inner +
               '</div>';
      }).join('');
    }
    paintControls();
  }

  /* ---- Wiring ---- */
  if (tagAxis) {
    if (!allTags.length) {
      tagAxis.hidden = true;
    } else {
      tagAxis.insertAdjacentHTML('beforeend', allTags.map(function (t) {
        return '<button class="gbs-chip gbs-tagbtn" type="button" aria-pressed="false" data-tag="' +
               esc(t) + '">' + esc(t) + ' · ' + tagCount[t] + '</button>';
      }).join(''));
    }
  }

  if (controls) {
    controls.addEventListener('click', function (e) {
      var el = e.target;
      if (!el || !el.closest) return;
      var seg = el.closest('.gbdoc-seg');
      if (seg && seg.parentNode) {
        var axis = seg.parentNode.getAttribute('data-axis');
        var val  = seg.getAttribute('data-val');
        if (AXES[axis] && state[axis] !== val) { state[axis] = val; writeState(); render(); }
        return;
      }
      var chip = el.closest('.gbs-tagbtn');
      if (chip) {
        var t = chip.getAttribute('data-tag');
        var i = state.tags.indexOf(t);
        if (i > -1) state.tags.splice(i, 1); else state.tags.push(t);
        writeState();
        render();
      }
    });
  }

  readState();
  writeState();
  render();
})();
</script>

<!-- THE CONSOLE, at last on the two studio pages too (gbppl-panel-6).
     studio-panel.css says it stands on EVERY page of the studio and the
     prototype; the hub and the shelf were the two that never got it,
     because their own bar already carries the four doors. Inspect mode
     ended that argument: the Mode switch lives in the console, and a
     page without a console is a page a designer cannot inspect. The
     doors repeat here, and repeating them is the point (Ton 26.08: one
     console, one logic, everywhere). -->
<!-- No page attribute: this IS the shelf of sandboxes, so a section
     naming the sandboxes of this page would be the page twice over. -->
<gb-studio-panel data-root=""></gb-studio-panel>
<script src="system/components/icon.js"></script>
<script src="system/components/studio-panel.js"></script>
<script src="system/type-scale.js"></script>
<script src="system/components/drawer.js"></script>
<script src="system/components/inspect.js"></script>
<script src="system/components/comments.js"></script>

</body>
</html>
