<!-- ============================================================
     DEMO-ЛАЙВ, страница авторизации (/guest/auth)
     ------------------------------------------------------------
     Пиксельная копия https://portal.gildedbox.com/guest/auth:
     гостевой хедер портала (fixed, #fcfdfd / white-90 + blur),
     колонка формы max-w 600 (Google + or + underline e-mail,
     семья контролов 48/56/64) и гостевой флоу за сабмитом: ошибка
     валидации → шаг верификации (Use code / Use password, OTP,
     пароль+confirm, Resend, Use a different email). Компоненты
     demo\components\auth.js (+ auth.css), числа = harvest
     public-login 2026-08-17 (7 ширин 360..2560), DOM и состояния
     сняты Playwright 18.08. Сверка прибором: конфиг
     harvest\configs\demo-auth.json (те же селекторы, что
     public-login.json), результаты в harvest\demo-auth\.
     Чего на живом /guest/auth НЕТ по факту: ссылок и статичных
     сообщений об ошибке в стартовой карточке, футера, serif на
     первом шаге; sign-in и sign-up НЕ разведены табами — флоу
     един и начинается с e-mail. Бэкенда demo не носит: код никуда
     не отправляется, Continue инертен.
     ============================================================ -->
