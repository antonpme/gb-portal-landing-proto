<!-- ============================================================
     gbppl-switch-1 — THE SWITCH PAGE
     ------------------------------------------------------------
     Ton, 15.09: «можно добавлять switch-компонент из Figma. У нас,
     по-моему, его до сих пор в дизайн-системе нет.» The third of
     the trio the Gifting Portal file draws (radio 03.09, checkbox
     11.09, switch today), and the last card on the components shelf
     that still said «Not in the system».

     THE NAME. PrimeVue calls this control a ToggleSwitch, but the
     house already spends «toggle» on the segmented control, so the
     page is Switch — which is also the mock's own frame name. The
     Overview prints both words, because a reader who arrives with
     either one has to land somewhere.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves and
     code blocks are the atoms of ..\components\docs.css; its
     specimens are the component itself.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement in every table is read back off a rendered specimen
     with getComputedStyle. Where a number is quoted from the design
     file rather than measured here, it stands in a provenance
     column and says Figma.
     ============================================================ -->

<script>
/* ============================================================
   gbppl-switch-1 — THE SWITCH READOUT
   ------------------------------------------------------------
   The template's small scripts come from oro.js (window.GbOro).
   What is here is the playground and the tables filled by measuring
   specimens on this page.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED. The thumb in
   particular is read off the ::before box rather than off the slot
   that sets it, because a ::before is exactly the place a value can
   be declared and never rendered.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* The thumb has no box of its own in the DOM: getComputedStyle
     with the second argument, the pseudo element's one door. */
  function thumbOf(input) {
    if (!input) return '';
    var d = getComputedStyle(input, '::before');
    return px(d.width) + ', ' + d.backgroundColor;
  }
  function lineOf(input) {
    if (!input) return '';
    var cs = getComputedStyle(input);
    return px(cs.borderTopWidth) + ' ' + cs.borderTopColor;
  }
  function trackOf(input) {
    if (!input) return '';
    var r = input.getBoundingClientRect();
    var cs = getComputedStyle(input);
    return Math.round(r.width) + ' by ' + Math.round(r.height) + ', ' + cs.backgroundColor;
  }

  /* ---------- the playground ----------
     Two axes: State is a Select by the canon, On is a yes and a no
     and wears the rail's own switch. */
  var PG_AXES = [
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['disabled', 'Disabled']] },
    { id: 'on', label: 'On', group: 'state', kind: 'bool',
      on: 'yes', off: 'no', def: 'yes' }
  ];

  var COPY = { label: 'Email me when it ships' };

  function pgSample(S, forCode) {
    var nl = forCode ? '\n  ' : ' ';
    var on = S.on === 'yes' ? ' checked' : '';
    var off = S.state === 'disabled' ? ' disabled' : '';
    return '<label class="gb-switch">' + nl +
           '<input class="gb-switch__input" type="checkbox" role="switch" id="pgSwitch"' + on + off + '>' + nl +
           '<span class="gb-switch__label">' + esc(COPY.label) + '</span>' +
           (forCode ? '\n' : ' ') + '</label>';
  }

  function pgAfter(S, hold) {
    var row = hold.querySelector('.gb-switch');
    var input = hold.querySelector('.gb-switch__input');
    if (!row || !input) return;
    if (S.state === 'hover') row.classList.add('is-hover');
    if (S.state === 'focus') input.classList.add('is-focus');
    paintPlayground();
  }

  function paintPlayground() {
    var input = document.getElementById('pgSwitch');
    if (!input) return;
    var row = input.closest('.gb-switch');
    var rs = getComputedStyle(row);
    var label = row.querySelector('.gb-switch__label');
    var ts = label ? getComputedStyle(label) : null;
    var d = getComputedStyle(input, '::before');
    txt('pgTrack', trackOf(input).split(',')[0]);
    txt('pgLine', lineOf(input));
    txt('pgThumb', thumbOf(input));
    txt('pgGap', px(rs.columnGap));
    txt('pgType', ts ? px(ts.fontSize) + ' / ' + ts.fontWeight + ' / ' + px(ts.lineHeight) : '');
    txt('pgGround', getComputedStyle(input).backgroundColor);
    txt('pgKnob', d.backgroundColor);
    txt('pgOpacity', rs.opacity);
  }

  /* ---------- the states table ---------- */
  function paintStates() {
    [['rest', 'sRest'], ['hover', 'sHover'], ['focus', 'sFocus'],
     ['on', 'sOn'], ['off', 'sOff'], ['onoff', 'sOnOff']].forEach(function (pair) {
      var el = document.getElementById('st-' + pair[0]);
      if (!el) return;
      var row = el.closest('.gb-switch');
      txt(pair[1] + 'Track', trackOf(el));
      txt(pair[1] + 'Thumb', thumbOf(el));
      txt(pair[1] + 'Op', getComputedStyle(row).opacity);
    });
  }

  /* ---------- sizes and anatomy ---------- */
  function paintRest() {
    var rest = document.getElementById('st-rest');
    var on = document.getElementById('st-on');
    if (rest) {
      var r = rest.getBoundingClientRect();
      txt('szTrack', Math.round(r.width) + ' by ' + Math.round(r.height));
      txt('szThumb', px(getComputedStyle(rest, '::before').width));
    }
    if (on) txt('szThumbOn', px(getComputedStyle(on, '::before').width));
  }

  function paintAnatomy() {
    var rest = document.getElementById('st-rest');
    var on = document.getElementById('st-on');
    if (rest) {
      var row = rest.closest('.gb-switch');
      var rr = row.getBoundingClientRect();
      var tr = rest.getBoundingClientRect();
      var tb = getComputedStyle(rest, '::before');
      txt('anRow', Math.round(rr.width) + ' by ' + Math.round(rr.height));
      txt('anTrack', Math.round(tr.width) + ' by ' + Math.round(tr.height) + ', line ' +
          px(getComputedStyle(rest).borderTopWidth) + ', radius ' +
          px(getComputedStyle(rest).borderTopLeftRadius));
      txt('anThumb', px(tb.width) + ' at rest' + (on ? ', ' + px(getComputedStyle(on, '::before').width) + ' when on' : ''));
      txt('anGap', px(getComputedStyle(row).columnGap));
      /* The inset is measured as the geometry the reader sees: from
         the track's outer left edge to the thumb's left edge. */
      var restThumb = rest.getBoundingClientRect();
      var offX = 0;
      try {
        var probe = getComputedStyle(rest, '::before');
        offX = parseFloat(probe.insetInlineStart || probe.left) + parseFloat(getComputedStyle(rest).borderLeftWidth);
      } catch (e) {}
      var onInset = '';
      if (on) {
        var ot = on.getBoundingClientRect();
        var op = getComputedStyle(on, '::before');
        var oLeft = parseFloat(op.insetInlineStart || op.left) + parseFloat(getComputedStyle(on).borderLeftWidth);
        onInset = ', on: ' + px(Math.round((ot.width - oLeft - parseFloat(op.width) - parseFloat(getComputedStyle(on).borderLeftWidth)) * 10) / 10 + 'px') + ' from the right';
      }
      txt('anInset', px(offX + 'px') + ' from the left at rest' + onInset);
    }
    ORO.widthNow('wnow');
  }

  function paintAll() { paintStates(); paintRest(); paintAnatomy(); }

  function start() {
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="switch"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter
      });
    }
    paintAll();
    /* TRAP 11 OF THE SKILL. A specimen wearing a demo state class at
       load is still inside its own colour transition on the first
       frame. The wait is read off the specimens rather than typed. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>

<script src="../../system/sandbox-registry.js"></script>
<script src="../../system/components/studio-panel.js"></script>
