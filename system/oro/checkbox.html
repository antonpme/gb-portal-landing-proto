<!-- ============================================================
     gbppl-checkbox-1 — THE CHECKBOX PAGE
     ------------------------------------------------------------
     The radio's sibling, and the page says so: the same Figma file,
     the same rungs, the same label role, the same law about what
     «off» is allowed to change. What this control has that the
     radio does not is a THIRD STATUS, and the mock draws it — nine
     variants against the radio's four.

     THE NAME IS EVERYBODY'S. PrimeVue, the stack the client builds
     on, calls this control a Checkbox; so does the Figma component
     set, so does every other house. There is nothing to settle, and
     that is worth one sentence rather than a section.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves,
     chips and code blocks are the atoms of ..\components\docs.css;
     its specimens are the component itself.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement in every table is read back off a rendered specimen
     with getComputedStyle. Where a number is quoted from the design
     file rather than measured here, it stands in a provenance
     column and says Figma.
     ============================================================ -->

        { note: '<b>THIS IS THE RADIO\'S SIBLING.</b> Same design file, same 12 between the mark and the word, same <code>small-400</code> label, same focus ring, same two rungs, same law about off. They stand on the same step of the same page, so a reader who learned one has learned the other, and the two places they differ are worth naming: a checkbox has a <b>third status</b> the radio cannot have, and a checkbox\'s box is a <b>complete control on its own</b>, which is why its colour cell is declared on the box and the radio\'s on the row.' }

        { note: '<b>THE MARK IS A MASK, NOT A CHARACTER.</b> Both glyphs are the exported paths of <code>1066:7748</code>, copied character for character, cut as a mask over a ground of <code>--gbc-mark</code>. So the mark takes the control\'s colour cell like everything else, no font has to be present for a form to be readable, and the tick is the same shape at every size on every platform. The mock knocks its glyph OUT of the fill, which on the white sheet it was drawn on is a white tick and on a coloured card would be that card; we paint white, because that is what all five live carriers render through <code>accent-color</code>, and because a mark whose colour is whatever happens to be behind it is not a mark.' }

        { table: {
            head: ['State', 'Frame', 'Ground', 'Opacity of the row', 'Provenance'],

                  + '<tr><td>Hover</td><td class="gbdoc-num" id="sHoverRing"></td><td class="gbdoc-num" id="sHoverBg"></td><td class="gbdoc-num" id="sHoverOp"></td><td><span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the form family\'s own hover: the field and the select both take their underline to Blue 600, and the frame is this control\'s underline. The file draws its three hovered variants identically to enabled</td></tr>\n'

        { note: '<b>OFF IS AN OPACITY AND NOTHING ELSE, and the law is written into the stylesheet twice because the browser breaks it.</b> Ton, 03.09, on the live checkout and about the radio beside this control: «Disabled радиоселекты для UPS Ground и для No Personalization выглядят по-разному. UPS Ground выбран, но почему-то чёрным цветом, а No Personalization — синим, как положено. Может это баг?» It was a bug, and it was Chrome\'s: <code>accent-color</code> has no effect on a control the browser considers disabled, so a native box that was ticked AND switched off lost its blue and came back in the browser\'s own grey. Every one of the five checkbox carriers is a native box on <code>accent-color</code> today, which is to say every one of them was one <code>disabled</code> away from the same bug. The organism paints its own box, so a ticked checkbox keeps Blue 600 however far it is faded, and the last three rules of <code>checkbox.css</code> say so again at a specificity nothing can beat.' },
        { note: '<b>AND THE MOCK ASKS FOR THE OPPOSITE, WHICH IS A QUESTION FOR TON RATHER THAN A THING TO SMOOTH OVER.</b> All nine variants of <code>1066:7748</code> that are disabled swap their ink to <code>tailwind/zinc/400</code> instead of fading. For seven of them that is not a different answer at all: Zinc 900 at 0.4 over white is <code>rgb(163, 163, 164)</code> and Zinc 400 is <code>rgb(161, 161, 170)</code>, the same colour to within six units of one channel. Where they part is a box that is ticked and off: the mock paints it neutral, the fade leaves it <code>rgb(168, 193, 247)</code>, which is Blue 600 seen through the fade. Ton asked for exactly the second thing on 03.09, «единый вид с No Personalization с поправкой на дим», and the radio two rows above this control on the same step already renders it. Two laws for «off» in one form is the defect, not the fix. <b>Standing with Ton:</b> keep the fade on both controls, or take the mock\'s Zinc 400 onto both.' },

      name: 'Sizes',
      blocks: [
        { p: 'The mock is the 2K variant and our curve runs down from it, which for a control the size of a glyph means exactly one step. The top rung is measured: 18 box, 2 frame, 2 corner. The bottom rung is the 16 box all five carriers render, and its frame and corner are <b>derived</b>, at the mock\'s own proportion of 2 in 18. That is said out loud because the radio could do better: a designed 16 radio existed on the live sign in flow and was measured. A designed 16 checkbox does not exist anywhere: every 16 box in the house is the browser\'s own, and the browser\'s frame is not a number anybody chose.' },

            rows: '<tr><td>Base</td><td class="gbdoc-num">16</td><td class="gbdoc-num">1.78</td><td class="gbdoc-num">1.78</td><td><span class="gbdoc-flag">Live</span> the box, from all five carriers; <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the frame and the corner, at the mock\'s proportion</td></tr>\n'
                  + '<tr><td>2000</td><td class="gbdoc-num">18</td><td class="gbdoc-num">2</td><td class="gbdoc-num">2</td><td><span class="gbdoc-flag gbdoc-flag--soft">Figma</span> <code>checkbox/icon/size</code> 18; the frame and the corner measured off the exported paths</td></tr>\n'
                  + '<tr><td>Right now</td><td class="gbdoc-num" id="szBox"></td><td class="gbdoc-num" id="szRing"></td><td class="gbdoc-num" id="szRad"></td><td>read off the Rest specimen above</td></tr>' } },
        { note: 'THE FRAME IN THE «RIGHT NOW» ROW READS 1 ON A 1&times; SCREEN AT THE BOTTOM RUNG, and that is the browser being honest rather than the table being wrong. Chrome floors a border to whole device pixels, so 1.78 draws one pixel where there is only one pixel to draw with, and draws its true width on a 2&times; screen; the top rung\'s 2 draws 2 everywhere. The radio does exactly the same thing with its 1.5, so the two controls are the same weight beside each other on a 1&times; screen, which is the thing that actually matters. Whether the ladder should be rounded to a flat 1 and 2 so the step shows on every screen is a question standing with Ton, and it is the same question the radio\'s own note carries.' },
        { note: 'The sentence does not climb with the box. It stands on <code>small-400</code>, a role of the type register that has one rung at every width, and the mock says the same thing: <code>Body/BP: XL/Small - 400</code>, Inter 14 / 400, tracking 0.5, line 1.5. So the only number the media query moves is the box, and the frame, the corner and the place the box sits on the line all follow it by arithmetic.' }
      ] },

                  + '<tr><td><code>.gb-checkbox__label</code></td><td>a span in the row</td><td>The sentence, on the <code>small-400</code> role: 14 / 400, tracking 0.5, Zinc 900</td></tr>\n'
                  + '<tr><td><code>.gb-checkbox__note</code></td><td>a span in the row, after the sentence</td><td>The quiet half: the same metrics, Zinc 500. It is not smaller, it is quieter</td></tr>\n'
                  + '<tr><td><code>is-disabled</code></td><td>the row</td><td>The whole row off. Put a real <code>disabled</code> on the input beside it; the fades will not multiply, because the box does not fade a second time inside a row</td></tr>\n'
                  + '<tr><td><code>is-hover</code> / <code>is-focus</code></td><td>the row / the box</td><td>Demo only, for a page that has to hold a state still. Never on a product page</td></tr>\n'
                  + '<tr><td><code>indeterminate</code></td><td>the input, as a <b>property</b></td><td>The mixed status. There is no attribute and no class: <code>el.indeterminate = true</code>, set by whoever owns the value, and the stylesheet answers <code>:indeterminate</code></td></tr>\n'
                  + '<tr><td><code>aria-label</code></td><td>a box with no row</td><td>Not optional there. A box in a table cell has no words of its own, so it has to carry them</td></tr>' } },
        { note: 'The Properties button in the corner of a specimen reads it into the drawer. The table is for reading the whole thing at once; the drawer answers about one control.' }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'When the question is yes or no about one thing',
      name: 'Usage',
      blocks: [
        { table: {
            head: ['Do', 'Do not'],
            rows: '<tr><td>Use a checkbox when the answer is yes or no about one thing, and the thing is either added to the order or not</td><td>Use one where exactly one answer out of several is wanted. That is a radio, and it is the control beside this one</td></tr>\n'
                  + '<tr><td>Write the sentence as the thing being added, and the quiet half as what adding it means</td><td>Repeat the sentence in the quiet half in other words. Two lines saying one thing is the noise this house spent 3 September removing</td></tr>\n'
                  + '<tr><td>Leave it unticked when off is the safe answer, and ticked when the common case is on</td><td>Tick something on the reader\'s behalf that costs money or changes what other steps say, without saying so on the row itself</td></tr>\n'
                  + '<tr><td>Give a box with no row an <code>aria-label</code> naming the row it selects</td><td>Put a box in a table cell and leave it nameless. The column head is not its name</td></tr>\n'
                  + '<tr><td>Use the mixed status only on a box that stands over others, and only when those others disagree</td><td>Use mixed as a third value of one fact. It is a summary of several, never an answer of its own</td></tr>\n'
                  + '<tr><td>Switch the row off when the answer depends on something not filled in yet, and say elsewhere what to fill in</td><td>Hide the row instead of switching it off. A control that vanishes teaches nothing about why</td></tr>' } },
        { note: 'There is no group element on this page, and the absence is the honest answer. The radio has one because a radio without a group is half a control; a list of checkboxes is a list of separate facts, no carrier in the house stacks one yet, and the law of the skill says a new name waits for the first carrier that asks for it.' }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Everything a native checkbox already does, and the one thing it needs told',
      name: 'Accessibility',
      blocks: [
        { p: 'This is the second component in the house with no JavaScript, and it is the radio\'s argument said again: the control IS the native one, with its paint taken off and ours put back on. Nothing about the keyboard, the role or the announced state is written by us, and so nothing about them can be broken by us.' },
        { table: {
            rows: '<tr><td>Keyboard</td><td>A tab stop of its own and Space to tick. Checkboxes are not a group, so the arrow keys do not move between them and should not</td></tr>\n'
                  + '<tr><td>Name</td><td>The control lives inside its <code>&lt;label&gt;</code>, so the words are the name and a click anywhere on the row ticks it. No <code>for</code> and no <code>id</code> to keep in step. A box with no row carries an <code>aria-label</code> instead, and that is not optional</td></tr>\n'
                  + '<tr><td>Mixed</td><td>The <code>indeterminate</code> property makes the browser announce «mixed» by itself. Nothing on our side has to say <code>aria-checked</code>, and nothing should: a hand written one would be a second source of truth about the same fact</td></tr>\n'
                  + '<tr><td>Disabled</td><td>Real <code>disabled</code>, so the tab order skips it and the screen reader says so. The fade alone tells nobody anything</td></tr>\n'
                  + '<tr><td>Focus</td><td><code>:focus-visible</code>, 2px of Blue 600 at 2px of offset, on the box. The pointer gets no ring; the keyboard always does</td></tr>\n'
                  + '<tr><td>Target size</td><td>The row is the target, not the box: 16 of box plus 12 of gap plus the whole sentence and its quiet half. A box with no row is 16, which is the size the browser has always drawn there and a thing to fix in the cell rather than in the control</td></tr>\n'
                  + '<tr><td>Contrast</td><td>Zinc 900 on white for the resting frame and the sentence, Blue 600 with a white mark when ticked. The quiet half is Zinc 500 on white, which is the pair the checkout has rendered since 21.08</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'The row, the bare box, and the one line no markup can say',
      name: 'Code',
      blocks: [
        { code: { id: 'codeBasics',
            text: '&lt;!-- a row: a box, a sentence, and the quiet half --&gt;\n'
                  + '&lt;label class="gb-checkbox"&gt;\n'
                  + '  &lt;input class="gb-checkbox__input" type="checkbox" name="card"&gt;\n'
                  + '  &lt;span class="gb-checkbox__label"&gt;Add a greeting card to all gifts&lt;/span&gt;\n'
                  + '  &lt;span class="gb-checkbox__note"&gt;One card, the same message in every box&lt;/span&gt;\n'
                  + '&lt;/label&gt;\n'
                  + '\n'
                  + '&lt;!-- a box with no row: a table\'s select column. The name is\n'
                  + '     not optional here, because there are no words to be it --&gt;\n'
                  + '&lt;td&gt;\n'
                  + '  &lt;input class="gb-checkbox__input" type="checkbox" aria-label="Select this gift"&gt;\n'
                  + '&lt;/td&gt;\n'
                  + '\n'
                  + '&lt;!-- the third status. There is no attribute for it: it is a\n'
                  + '     PROPERTY, set by whoever owns the value --&gt;\n'
                  + '&lt;script&gt;\n'
                  + '  const all = document.querySelector(\'#selectAll\');\n'
                  + '  all.checked       = every === total;\n'
                  + '  all.indeterminate = every &gt; 0 &amp;&amp; every &lt; total;\n'
                  + '&lt;/script&gt;\n'
                  + '\n'
                  + '&lt;!-- the whole row off: both markers, and the fades will not multiply --&gt;\n'
                  + '&lt;label class="gb-checkbox is-disabled"&gt;\n'
                  + '  &lt;input class="gb-checkbox__input" type="checkbox" disabled&gt;\n'
                  + '  &lt;span class="gb-checkbox__label"&gt;Pick an address first&lt;/span&gt;\n'
                  + '&lt;/label&gt;' } }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'What the checkbox used to be',
      name: 'Changelog',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>21 August</td><td>The checkout drew its first checkboxes as native boxes on <code>accent-color</code>, 16 by 16, which got the blue right and left every other thing about them to the browser</td></tr>\n'
                  + '<tr><td>27 August</td><td>The census of the checkout named the checkbox one of the four holes in the system, with three carriers and no owner</td></tr>\n'
                  + '<tr><td>3 September</td><td>The radio was lifted out of the same Figma file, and with it the law that off is an opacity and nothing else. Ton found the bug that produced the law on a native control painted by <code>accent-color</code>, which is what every checkbox on the page still was</td></tr>\n'
                  + '<tr><td>7 September</td><td>The prefill row of step two joined the greeting card row, and the two of them settled the shape: a wrapping row, 12 across and 4 down, a sentence and a quieter half</td></tr>\n'
                  + '<tr><td>11 September</td><td>The component. The box and both marks out of Figma <code>1066:7748</code>, the row off the live checkout, two rungs, three statuses, six states, no script. The five carriers of version 5 move onto it the same day</td></tr>' } }
      ] },

    { toc: 'Related', eyebrow: 'Where to go next',
      name: 'Related',
      blocks: [
        { p: '<a href="radio.html">Radio button</a>, this control\'s sibling out of the same design file and the answer when exactly one option is wanted, <a href="toggle.html">Toggle button</a>, which holds one value between two halves, and <a href="field.html">Field</a>, whose hover both of them borrow.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/checkbox.css">checkbox.css</a>, <a href="../components/radio.css">radio.css</a> (the sibling), <a href="../components/button.css">button.css</a> (the focus ring and the disabled cell), <a href="../components/docs.css">docs.css</a>, <a href="../components/drawer.css">drawer.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.'
});
</script>

<script src="../components/icon.js"></script>
<script src="../components/auth.js"></script>
<script src="../components/toggle.js"></script>
<script src="../components/drawer.js"></script>
<script src="../components/inspect.js"></script>
<script src="../components/comments.js"></script>
<script>
/* ============================================================
   gbppl-checkbox-1 — THE CHECKBOX READOUT
   ------------------------------------------------------------
   Five small scripts of the showcase template come from oro.js
   (window.GbOro): px, txt, the width readout, the clipboard and
   the contents. What is here is the playground, the four tables
   filled by measuring specimens on this page, and the ONE line of
   behaviour this page genuinely owes the component: `indeterminate`
   is a property, so a mixed specimen has to be told it is mixed.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED. The mark in
   particular is read off the ::before box rather than off the slot
   that sets it, because a ::before is exactly the place a value can
   be declared and never rendered.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* THE MIXED SPECIMENS, and this is the whole of the page's
     behaviour. A carrier does exactly this: the third status has no
     markup, so whoever owns the value sets the property. */
  var MIXED = ['q-mixed', 'st-mixoff'];
  function setMixed() {
    MIXED.forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.indeterminate = true;
    });
  }

  /* The mark has no box of its own in the DOM, so it is measured the
     only way a pseudo element can be: getComputedStyle with the
     second argument. Which of the two paths is cut is read off the
     mask rather than guessed from :checked. */
  function markOf(input) {
    if (!input) return '';
    var d = getComputedStyle(input, '::before');
    var on = d.transform && d.transform !== 'none' && d.transform.indexOf('matrix(0') !== 0;
    var img = d.maskImage || d.webkitMaskImage || '';
    var which = /H4V8/.test(img) ? 'bar' : (/L2 9L/.test(img) ? 'tick' : 'none');
    return px(d.width) + ' ' + which + ', ' + d.backgroundColor + (on ? '' : ', hidden');
  }
  function ringOf(input) {
    if (!input) return '';
    var cs = getComputedStyle(input);
    return px(cs.borderTopWidth) + ' ' + cs.borderTopColor;
  }
  function bgOf(input) {
    return input ? getComputedStyle(input).backgroundColor : '';
  }

  /* ---------- the playground ----------
     The schema, and the control the canon gives each axis:
       Status   a Select by the canon's `value`: three answers, each
                a phrase, picked rather than compared.
       State    a Select, always: the set is long and half of it is
                usually unavailable on any one specimen.
       Quiet half  the switch, by nature: yes and no is never a track.
     The specimen is the markup a consumer writes, which is also the
     markup the Code section prints. */
  var PG_AXES = [
    /* The canon settles both the control AND the group: `value` is
       «what is chosen», it is a Select, and it lives in Content. The
       first draft put it in State and the rail read STATE / Status /
       State, which is the canon being overruled and punished for it
       in the same breath. */
    { id: 'status', canon: 'value', label: 'Status', group: 'content', def: 'checked',
      values: [['unchecked', 'Unticked'], ['checked', 'Ticked'], ['mixed', 'Mixed']] },
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['disabled', 'Disabled']] },
    { id: 'note', label: 'Quiet half', group: 'content', kind: 'bool',
      on: 'yes', off: 'no', def: 'yes' }
  ];

  var COPY = {
    label: 'Add a greeting card to all gifts',
    note: 'One card, the same message in every box'
  };

  function pgSample(S, forCode) {
    var nl = forCode ? '\n  ' : ' ';
    var on = S.status === 'checked' ? ' checked' : '';
    var off = S.state === 'disabled' ? ' disabled' : '';
    return '<label class="gb-checkbox">' + nl +
           '<input class="gb-checkbox__input" type="checkbox" name="pgBox" id="pgCheck"' + on + off + '>' + nl +
           '<span class="gb-checkbox__label">' + esc(COPY.label) + '</span>' +
           (S.note === 'yes'
             ? nl + '<span class="gb-checkbox__note">' + esc(COPY.note) + '</span>'
             : '') +
           (forCode ? '\n' : ' ') + '</label>';
  }

  /* Hover and focus go on the way a consumer would put them: the two
     demo names the house declares. Disabled is the browser's own and
     is already on the element from the sample. Mixed is neither: it
     is the property, set here exactly as a carrier sets it. */
  function pgAfter(S, hold) {
    var row = hold.querySelector('.gb-checkbox');
    var input = hold.querySelector('.gb-checkbox__input');
    if (!row || !input) return;
    if (S.state === 'hover') row.classList.add('is-hover');
    if (S.state === 'focus') input.classList.add('is-focus');
    if (S.status === 'mixed') input.indeterminate = true;
    paintPlayground();
  }

  function paintPlayground() {
    var input = document.getElementById('pgCheck');
    if (!input) return;
    var row = input.closest('.gb-checkbox');
    var cs = getComputedStyle(input);
    var rs = getComputedStyle(row);
    var top = row.querySelector('.gb-checkbox__label');
    var ts = top ? getComputedStyle(top) : null;
    var r = input.getBoundingClientRect();
    txt('pgBox', Math.round(r.width * 100) / 100 + ' by ' + Math.round(r.height * 100) / 100);
    txt('pgRing', ringOf(input));
    txt('pgRad', px(cs.borderTopLeftRadius));
    txt('pgMark', markOf(input));
    txt('pgGap', px(rs.columnGap) + ' across, ' + px(rs.rowGap) + ' down');
    txt('pgType', ts ? px(ts.fontSize) + ' / ' + ts.fontWeight + ' / ' + px(ts.lineHeight) +
                       ' / ' + px(ts.letterSpacing) : '');
    txt('pgGround', cs.backgroundColor);
    txt('pgOpacity', rs.opacity + ' row, ' + cs.opacity + ' box');
  }

  /* ---------- the statuses table ---------- */
  function paintStatuses() {
    [['off', 'qOff'], ['on', 'qOn'], ['mixed', 'qMix']].forEach(function (pair) {
      var el = document.getElementById('q-' + pair[0]);
      if (!el) return;
      txt(pair[1] + 'Ring', ringOf(el));
      txt(pair[1] + 'Bg', bgOf(el));
      txt(pair[1] + 'Mark', markOf(el));
    });
  }

  /* ---------- the states table ---------- */
  function paintStates() {
    [['rest', 'sRest'], ['hover', 'sHover'], ['focus', 'sFocus'], ['on', 'sOn'],
     ['off', 'sOff'], ['onoff', 'sOnOff'], ['mixoff', 'sMixOff'],
     ['bare', 'sBare']].forEach(function (pair) {
      var el = document.getElementById('st-' + pair[0]);
      if (!el) return;
      var row = el.closest('.gb-checkbox');
      txt(pair[1] + 'Ring', ringOf(el));
      txt(pair[1] + 'Bg', bgOf(el));
      txt(pair[1] + 'Op', row ? getComputedStyle(row).opacity + ' row'
                              : getComputedStyle(el).opacity + ' box, no row');
    });
  }

  /* ---------- sizes and anatomy ---------- */
  function paintRest() {
    var el = document.getElementById('st-rest');
    if (!el) return;
    var r = el.getBoundingClientRect();
    var cs = getComputedStyle(el);
    txt('szBox', Math.round(r.width * 100) / 100);
    txt('szRing', px(cs.borderTopWidth));
    txt('szRad', px(cs.borderTopLeftRadius));
  }

  function paintAnatomy() {
    var row = document.getElementById('anRowEl');
    var box = document.getElementById('an-box');
    if (row && box) {
      var rr = row.getBoundingClientRect();
      var rs = getComputedStyle(row);
      var br = box.getBoundingClientRect();
      var lab = row.querySelector('.gb-checkbox__label');
      var note = row.querySelector('.gb-checkbox__note');
      var ls = lab ? getComputedStyle(lab) : null;
      var ns = note ? getComputedStyle(note) : null;
      txt('anRow', Math.round(rr.width) + ' by ' + Math.round(rr.height) +
                   ', ' + (note && lab && note.getBoundingClientRect().top > lab.getBoundingClientRect().top
                           ? 'stacked at this width' : 'one line at this width'));
      txt('anBox', Math.round(br.width * 100) / 100 + ' box, frame ' +
          px(getComputedStyle(box).borderTopWidth) + ', corner ' +
          px(getComputedStyle(box).borderTopLeftRadius));
      txt('anMark', markOf(box));
      txt('anGap', px(rs.columnGap) + ' across, ' + px(rs.rowGap) + ' down');
      txt('anType', ls ? px(ls.fontSize) + ' / ' + ls.fontWeight + ' / ' + px(ls.lineHeight) +
                         ' ' + ls.color + (ns ? ' · quiet half ' + ns.color : '') : '');
      txt('anOffset', px(getComputedStyle(box).marginTop));
    }
    ORO.widthNow('wnow');
  }

  function paintAll() { paintStatuses(); paintStates(); paintRest(); paintAnatomy(); }

  function start() {
    setMixed();
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="checkbox"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter
      });
    }
    paintAll();
    /* TRAP 11 OF THE SKILL. A specimen wearing a demo state class at
       load is still inside its own colour transition on the first
       frame, and a colour read there stands on no screen. The wait is
       read off the specimens rather than typed. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>
