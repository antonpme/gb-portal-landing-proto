<!-- ============================================================
     gbppl-timeline-1 — THE TIMELINE PAGE
     ------------------------------------------------------------
     The client, 21.09: «History должна выглядеть как вертикальный
     таймлайн, и для этого нам нужно создать соответствующий
     компонент». The law of 0a.2 orders the two halves of that
     sentence: the component first, the screen after it. So this
     page exists before the approvals History it was asked for, and
     that page will be assembled out of it rather than around it.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves and
     code blocks are the atoms of ..\components\docs.css; its
     specimens are the component itself.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement in every table is read back off a rendered specimen
     with getComputedStyle. Where a number is quoted from a source
     rather than measured here, it stands in a provenance column and
     says which source.
     ============================================================ -->

        { p: 'THE ONE DISTINCTION THAT MATTERS, because this house owns both and they look alike from across the room. A TIMELINE is the history of ONE thing, read by somebody who already has that thing open, and the question it answers is «how did this get here». A FEED is the latest of MANY things, read by somebody deciding where to go next, and the question it answers is «does anything need me». So the feed\'s rows are doors and every one of them leads somewhere else; a timeline\'s rows are not, because the place they would lead to is the page you are already on.' },

        { note: 'A timeline in a panel adds one word: <code>&lt;ol class="gb-tl gb-tl--small"&gt;</code>. A timeline on a tinted surface adds one more, and it is the ring: <code>style="--gb-tl-ring: var(--zinc-50)"</code>, because the ring is the ground the dot sits on rather than a colour of its own.' }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'What the timeline used to be',
      name: 'Changelog',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>10 September</td><td>The house learned to write events, in one place: the dashboard feed, with a dot, a sentence and a quiet time under it. It was never a component, and nothing else could wear it</td></tr>\n'
                  + '<tr><td>21 September</td><td>A layout sketch drew a vertical history for a gift approval, and the client asked for the control before the screen. The component, out of the feed\'s scale and the sketch\'s direction: four meanings, two rungs, no script. No carrier is dressed by this wave, and the feed is not migrated</td></tr>' } }
      ] },

    { toc: 'Related', eyebrow: 'Where to go next',
      name: 'Related',
      blocks: [
        { p: '<a href="tabs.html">Tabs</a>, which the History of an approval stands behind, and which was born the same way four days earlier. <a href="badge.html">Badge</a>, whose <code>--warning</code> and <code>--success</code> fills this component borrows for two of its four dots. <a href="colors.html">Colors</a>, which records that the system owns no amber and no green of its own, and why.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/timeline.css">timeline.css</a>, <a href="../components/badge.css">badge.css</a> (two of the four dots), <a href="../components/shell.css">shell.css</a> (the Eyebrow role), <a href="../components/button.css">button.css</a> (the focus ring), <a href="../components/docs.css">docs.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.'
});
</script>

<script src="../type-scale.js"></script>
<script src="../components/icon.js"></script>
<script src="../components/auth.js"></script>
<script src="../components/toggle.js"></script>
<script src="../components/drawer.js"></script>
<script src="../components/inspect.js"></script>
<script src="../components/comments.js"></script>

<script>
/* ============================================================
   gbppl-timeline-1 — THE TIMELINE READOUT
   ------------------------------------------------------------
   The template's small scripts come from oro.js (window.GbOro).
   What is here is the playground and the tables filled by measuring
   specimens on this page.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED. The rule in
   particular is read off the pseudo-element that draws it rather
   than off the custom property that sets it, because a property is
   exactly the place a value can be declared and never rendered.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function boxOf(el) {
    if (!el) return '';
    var r = el.getBoundingClientRect();
    return Math.round(r.width) + ' by ' + Math.round(r.height);
  }
  function typeOf(el) {
    if (!el) return '';
    var cs = getComputedStyle(el);
    return px(cs.fontSize) + ' / ' + cs.fontWeight + ' / ' + px(cs.lineHeight) + ', ' + cs.color;
  }
  function dotOf(el) {
    if (!el) return '';
    var cs = getComputedStyle(el);
    return boxOf(el) + ', ' + cs.backgroundColor;
  }
  /* The ring is a box shadow and the rule is a pseudo-element: both
     are read where they are actually drawn. */
  function ringOf(el) {
    if (!el) return '';
    return getComputedStyle(el).boxShadow;
  }
  function ruleOf(item) {
    if (!item) return '';
    var cs = getComputedStyle(item, '::before');
    return px(cs.width) + ' ' + cs.backgroundColor;
  }
  /* WHERE THE WORDS START, measured rather than added up: the left
     edge of the sentence against the left edge of the event. */
  function indentOf(item) {
    if (!item) return '';
    var what = item.querySelector('.gb-tl__what') || item.querySelector('.gb-tl__when');
    if (!what) return '';
    return Math.round(what.getBoundingClientRect().left - item.getBoundingClientRect().left) + 'px';
  }

  /* ---------- the playground ----------
     Rung is two values and wears the chips; Tone is the dictionary,
     four short words, so a toggle by the canon; the two halves of a
     sentence are each a yes and a no. */
  var PG_AXES = [
    /* THE GROUP IS `shape`, AND IT IS WRITTEN DOWN RATHER THAN
       COPIED: the canon of window.ORO_AXES orders exactly four
       groups (shape, state, content, ground) and the renderer drops
       an axis whose group is not one of them. A rung IS the shape of
       the thing, so it stands there. */
    { id: 'rung', label: 'Rung', group: 'shape', def: 'default',
      values: [['default', 'Default'], ['small', 'Small']] },
    { id: 'tone', label: 'Tone', group: 'shape', def: 'revision',
      values: [['milestone', 'Milestone'], ['you', 'You'], ['revision', 'Revision'], ['system', 'System']] },
    { id: 'note', label: 'Quiet half', group: 'content', kind: 'bool', on: 'yes', off: 'no', def: 'yes' },
    { id: 'link', label: 'A door in the sentence', group: 'content', kind: 'bool', on: 'yes', off: 'no', def: 'no' }
  ];

  /* The words of the specimen. The top one takes the Tone axis; the
     two under it stand still, because a dictionary read against a
     moving list is not read at all. */
  var REST = [
    { tone: 'you',       when: '<time datetime="2026-09-15T14:12">15 Sep, 2:12 pm</time> · You',
      what: 'Changes requested', note: '«The ribbon reads too bright against the navy»' },
    { tone: 'milestone', when: '<time datetime="2026-09-11T16:47">11 Sep, 4:47 pm</time>',
      what: 'Approval created' }
  ];

  function eventHTML(e, S, nl, first) {
    var out = nl + '<li class="gb-tl__item gb-tl__item--' + e.tone + '"' + (first ? ' id="pgItem"' : '') + '>' +
              nl + '  <span class="gb-tl__dot" aria-hidden="true"></span>' +
              nl + '  <p class="gb-tl__when">' + e.when + '</p>' +
              nl + '  <p class="gb-tl__what">' + e.what;
    if (S.link === 'yes' && first) {
      out += ' on <a class="gb-tl__link" href="#rev-3">revision 3</a>';
    }
    if (S.note === 'yes' && e.note) {
      out += '<span class="gb-tl__note">' + e.note + '</span>';
    }
    out += '</p>' + nl + '</li>';
    return out;
  }

  function pgSample(S, forCode) {
    var nl = forCode ? '\n  ' : ' ';
    var cls = 'gb-tl' + (S.rung === 'small' ? ' gb-tl--small' : '');
    var top = { tone: esc(S.tone),
                when: '<time datetime="2026-09-16T05:40">16 Sep, 5:40 am</time> · GildedBox',
                what: 'Design updated', note: 'new revision uploaded after your request' };
    var out = '<ol class="' + cls + '">';
    out += eventHTML(top, S, nl, true);
    REST.forEach(function (e) { out += eventHTML(e, S, nl, false); });
    return out + (forCode ? '\n' : ' ') + '</ol>';
  }

  function pgAfter(S, hold) {
    void S; void hold;
    paintPlayground();
  }

  function paintPlayground() {
    var list = document.querySelector('[data-pg="timeline"] .gb-tl');
    if (!list) return;
    var item = list.querySelector('.gb-tl__item');
    var last = list.querySelector('.gb-tl__item:last-child');
    var dot = item && item.querySelector('.gb-tl__dot');
    txt('pgDot', dotOf(dot));
    txt('pgRing', ringOf(dot));
    txt('pgRule', ruleOf(item));
    txt('pgIndent', indentOf(item));
    txt('pgWhen', typeOf(item && item.querySelector('.gb-tl__when')));
    txt('pgWhat', typeOf(item && item.querySelector('.gb-tl__what')));
    txt('pgGap', item ? px(getComputedStyle(item).paddingBottom) : '');
    txt('pgLast', last ? px(getComputedStyle(last).paddingBottom) : '');
  }

  /* ---------- the dictionary ---------- */
  function paintTones() {
    [['tn-you', 'tnYou'], ['tn-revision', 'tnRevision'],
     ['tn-milestone', 'tnMilestone'], ['tn-system', 'tnSystem']].forEach(function (pair) {
      var el = document.getElementById(pair[0]);
      txt(pair[1], el ? dotOf(el.querySelector('.gb-tl__dot')) : '');
    });
  }

  /* ---------- the two rungs ---------- */
  function paintRungs() {
    [['rgMd', 'rgMd'], ['rgSm', 'rgSm']].forEach(function (pair) {
      var list = document.getElementById(pair[0]);
      if (!list) return;
      var item = list.querySelector('.gb-tl__item');
      txt(pair[1] + 'Type', typeOf(item.querySelector('.gb-tl__what')));
      txt(pair[1] + 'Gap', px(getComputedStyle(item).paddingBottom));
      txt(pair[1] + 'Dot', dotOf(item.querySelector('.gb-tl__dot')));
      txt(pair[1] + 'Indent', indentOf(item));
    });
  }

  /* ---------- anatomy ---------- */
  function paintAnatomy() {
    var list = document.getElementById('rgMd');
    if (!list) return;
    var item = list.querySelector('.gb-tl__item');
    var last = list.querySelector('.gb-tl__item:last-child');
    txt('anList', boxOf(list) + ', padding ' + px(getComputedStyle(list).paddingLeft));
    txt('anItem', boxOf(item) + ', air under it ' + px(getComputedStyle(item).paddingBottom) +
                  ', under the last one ' + px(getComputedStyle(last).paddingBottom));
    txt('anRule', ruleOf(item) + ', from the first dot ' + px(getComputedStyle(item, '::before').top));
    txt('anDot', dotOf(item.querySelector('.gb-tl__dot')) + ', ring ' + ringOf(item.querySelector('.gb-tl__dot')));
    var note = list.querySelector('.gb-tl__note');
    txt('anWords', 'eyebrow ' + typeOf(item.querySelector('.gb-tl__when')) +
                   ' · quiet half ' + (note ? getComputedStyle(note).color : 'none on this specimen'));
    ORO.widthNow('wnow');
  }

  function paintAll() { paintTones(); paintRungs(); paintAnatomy(); }

  function start() {
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="timeline"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter,
        /* NO GROUND ROW, the drawer's own reason on a different
           component: Light | Dark is a real question wherever a
           control can stand on both, and this one cannot. It has no
           inverse family, and a family without a carrier is not born
           (law 0a.4). Dark was tried before it was removed and it is
           worth writing down what it looked like: Zinc 900 sentences
           vanished into the ground and the white rings became the
           loudest thing on the stage, which is a picture of a
           question the component has no answer to. The day a dark
           surface needs a history, the inverse is drawn with it. */
        ground: false
      });
    }
    paintAll();
    /* TRAP 11 OF THE SKILL. A specimen is still inside whatever
       transition its furniture carries on the first frame, and a
       colour read there describes a colour nobody sees. The wait is
       read off the specimens rather than typed. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { paintAll(); paintPlayground(); }, 120);
  });
})();
</script>
