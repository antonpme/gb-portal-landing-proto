<!-- ============================================================
     gbppl-inputnumber-1 — THE INPUT NUMBER PAGE
     ------------------------------------------------------------
     THE PAGE WAS CALLED stepper.html UNTIL 31.08. Ton, looking at
     it: «на странице компонента stepper показывается совершенно
     не stepper, а select плюс-минус (забыл, как этот input
     называется)». Two dictionaries had collided. The client's
     stack is PrimeVue, where Stepper is a wizard of steps — the
     rail our booking flow draws — and the minus-number-plus
     control is InputNumber. The control took the name its readers
     already know, the old address forwards once, and Stepper went
     back into the census as the step rail that has no card yet.

     ------------------------------------------------------------
     gbppl-oro-select-stepper-1 (2026-08-29) — WHERE IT CAME FROM
     ------------------------------------------------------------
     Skill, section 8, open since 27.08, in the words of that day:
     «STEPPER (минус / число / плюс): компонента НЕТ. Четыре штуки
     на чекауте. Это ОДИН контрол, а не три, и ничто в системе его
     не описывает.»

     THE PROVENANCE OF THE WHOLE PAGE, in one paragraph. The live
     site has no input number: measured 29.08 across the home page, the
     catalogue and its filter drawer, a product page in both of its
     variants, the lead form and the portal door. Quantity is not
     stepped anywhere on the public site, and the portal's own cart
     stands behind the sign in, where a wave does not go. So this
     component is DECLARED under Ton-17 — but not invented: every
     number on this page is one the checkout was already rendering
     before the migration, read off the page with the instrument.

     Ton-10: this page is a CONSUMER. Its furniture is the atoms of
     ..\components\docs.css; its specimens are the component.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED.

     ------------------------------------------------------------
     gbppl-showcase-canon-1, 01.09 — THE PLAYGROUND BECAME THE
     CANON CARD
     ------------------------------------------------------------
     Тон, 01.09, about the showcase and not about this control:
     «Главное, нам нужно разобраться с отображением компонентов...
     панель выбора сверху, а не справа. Из-за этого мне тяжело
     показывать работу людям.» One page cannot be the exception, so
     the four rows of segments over the stage became the same
     .gbdoc-pg card button.html carries: GbOro.controls draws the
     rail on the right out of a schema, picks one control per axis
     by the rule, puts Light | Dark on the stage and folds the
     markup behind Preview | Code.

     WHAT THE FOUR OLD ROWS BECAME:
       Size      a toggle, and its labels are now the rungs small
                 and medium (S and M until gbppl-btn-ladder-1 of
                 02.09) rather than «S · 40» and «M · 48». ORO_AXES.RENAMES
                 settles it: «a label is a rung, never a
                 measurement». The two heights did not disappear;
                 they are in the sentence over the card, in the
                 Variants table and in the Sizes table, all three of
                 which read them off a specimen.
       Density   a toggle, unchanged. The word was already the
                 canon's: the axis is the plain property and Well
                 stays the name of the part.
       Position  a Select, and it stands in the STATE group rather
                 than beside Density, because where the number
                 stands on its scale is a state of it. The canon
                 names the axis and the group both.
       State     a Select: the canon says State is never a toggle.

     The four values the old panel could build are the four it
     builds now, and the specimen is still the real control, with
     inputnumber.js booted over it so the glyphs, the bounds and
     the arrow keys are the component's own.

     ------------------------------------------------------------
     gbppl-oro-engine-1, 01.09 — THE PAGE IS A DECLARATION NOW
     ------------------------------------------------------------
     The shell went into system/oro/oro-page.js with Button's and
     Select's, and the six sections that had no heading over them
     got one: Overview, Properties, Usage, Accessibility, Code and
     Changelog each opened with a single serif word and no Eyebrow,
     which is the old .gbdoc-sub shape, and now open the way every
     other section on every other showcase does.

     Everything else came across word for word, including both
     ledes: the second one, about why this is not called Stepper any
     more, is the first thing a reader arriving from the old name
     needs, and the engine takes a lede of two paragraphs for it.
     Every measured number reads the same at 390, 1280 and 1920.
     ============================================================ -->

        { note: 'The Properties button in the corner of a specimen reads it into the drawer. The table is read whole; the drawer answers about one control.' }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'When a number is stepped, and when it is typed',
      blocks: [
        { table: {
            head: ['Do', 'Do not'],
            rows: '<tr><td>Use an input number where the number is small and changed by one or two at a time</td><td>Use it where the number is typed in full. Past two digits a person types, and a field is the control for typing</td></tr>\n'
                  + '<tr><td>Give it a floor, and let the minus go out when it is reached</td><td>Hide the minus at the floor. The plus slides under the pointer and the next click counts something nobody asked for</td></tr>\n'
                  + '<tr><td>Say what is being counted, in a label beside it or on the frame</td><td>Leave a bare number in a row and trust the column heading to explain it</td></tr>\n'
                  + '<tr><td>Leave the well typeable when a person may jump to a bigger number</td><td>Make the well read only and then set a ceiling far away, so the only route to it is thirty clicks</td></tr>\n'
                  + '<tr><td>Let the host own the value when the number means more than itself: a pool, a total, a recount</td><td>Wire a host handler and leave the component driving as well. Two owners count twice</td></tr>' } }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'Grouping, keyboard and bounds',
      blocks: [
        { table: {
            rows: '<tr><td>Grouping</td><td>The frame is <code>role="group"</code> with a name, so the two buttons and the number are announced as one thing</td></tr>\n'
                  + '<tr><td>Keyboard</td><td>Tab reaches the minus, the number and the plus. On a number input the arrows are the browser\'s own and they already honour <code>min</code> and <code>max</code>; on a span well the component gives the same two keys and the whole spinbutton contract with them</td></tr>\n'
                  + '<tr><td>The buttons</td><td>Each carries its own <code>aria-label</code>, because a glyph is not a name. Both glyphs are <code>aria-hidden</code></td></tr>\n'
                  + '<tr><td>Bounds</td><td>Real <code>disabled</code>, not a grey paint: at the floor the minus is out of the tab order and out of the accessibility tree\'s action list</td></tr>\n'
                  + '<tr><td>Target size</td><td>40 by 40 per button at the S rung, 48 at M. Nothing in the control goes under 40</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'The markup, and the glyphs it fills itself',
      blocks: [
        { p: 'The frame, two buttons and a well. Leave the glyph boxes empty and the component fills them from the icon record; write a glyph in by hand and it is left alone.' },
        { code: { id: 'codeBasics',
            text: '&lt;!-- the component owns the value --&gt;\n'
                  + '&lt;div class="gb-inputnumber" aria-label="Quantity"&gt;\n'
                  + '  &lt;button class="gb-btn gb-btn--icon gb-btn--small gb-btn--ghost gb-btn--secondary gb-btn--plain"\n'
                  + '          type="button" data-step="-1" aria-label="Decrease quantity"&gt;\n'
                  + '    &lt;span class="gb-btn__icon"&gt;&lt;/span&gt;\n'
                  + '  &lt;/button&gt;\n'
                  + '  &lt;input class="gb-inputnumber__value" type="number" min="1" value="1" aria-label="Quantity"&gt;\n'
                  + '  &lt;button class="gb-btn gb-btn--icon gb-btn--small gb-btn--ghost gb-btn--secondary gb-btn--plain"\n'
                  + '          type="button" data-step="1" aria-label="Increase quantity"&gt;\n'
                  + '    &lt;span class="gb-btn__icon"&gt;&lt;/span&gt;\n'
                  + '  &lt;/button&gt;\n'
                  + '&lt;/div&gt;\n'
                  + '\n'
                  + '&lt;!-- the host owns the value: bounds and aria only --&gt;\n'
                  + '&lt;div class="gb-inputnumber gb-inputnumber--dense" data-gb-inputnumber="host" aria-label="Gifts"&gt;\n'
                  + '  ...\n'
                  + '&lt;/div&gt;' } }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What the control used to be',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>27 August</td><td>The checkout census named the hole: four hand-drawn frames, minus and plus with no cell in the system</td></tr>\n'
                  + '<tr><td>28 August</td><td>The eight glyph buttons moved onto <code>.gb-btn--icon --small --plain</code>. The frames stayed page markup, called a temporary look out loud</td></tr>\n'
                  + '<tr><td>29 August</td><td>The component. The frame, the well, the bounds and the aria; minus and plus join the icon record; all four checkout carriers wear it, and every value on that page stays Alpine\'s</td></tr>\n'
                  + '<tr><td>31 August</td><td>Renamed. It shipped as Stepper, and in PrimeVue that word means a wizard of steps, so file, class, modifiers, data attribute and event all became <code>inputnumber</code>. The old address forwards here once. No alias was kept: the house migrates its consumers instead</td></tr>\n'
                  + '<tr><td>1 September</td><td>The playground became the canon card: the rail moved to the right of the stage, Size and Density became toggle buttons, Position and State became Selects, the ground switch arrived on the stage and the markup moved behind a Preview | Code fold. Size lost the pixels from its labels, because a label is a rung and the pixels are measured in the tables below</td></tr>' } }
      ] },

    { toc: 'Related', eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="icons.html#iconbutton">Icon button</a>, which the two glyphs are, <a href="field.html">Field</a>, whose ladder the number rides, and <a href="select.html">Select</a>, the other control the checkout was waiting on.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/inputnumber.css">inputnumber.css</a>, <a href="../components/button.css">button.css</a>, <a href="../components/icon.css">icon.css</a>, <a href="../components/toggle.css">toggle.css</a>, <a href="../components/auth.css">auth.css</a>, <a href="../components/docs.css">docs.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.'
});

<script>
/* ============================================================
   gbppl-inputnumber-1 — THE INPUT NUMBER READOUT
   ------------------------------------------------------------
   px, txt, the width readout, the clipboard and the contents come
   from window.GbOro (oro.js). What is here is the playground and
   the tables that are filled by measuring specimens on this page.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  /* ---------- the playground ----------
     gbppl-showcase-canon-1. The panel is not written here any more. This
     page hands GbOro.controls a SCHEMA — what an input number HAS, in what
     group, with what default — and a function that draws one out of a
     state object; the rail, the rule that picks each control, the More
     fold, the Reset, the ground on the stage and the Preview | Code fold
     belong to the renderer in oro.js and are the same on every showcase.

     THE FOUR AXES, AND THE CONTROL THE RULE GIVES EACH (canon in
     ORO_AXES):
       Size      a toggle, always: a short ordered ladder is compared,
                 and the rungs are lettered rather than measured
       Density   a toggle: two rungs of how tight, never of how big
       Position  a Select, in the State group: where the number stands
                 on its scale is a state of it, not a shape of it
       State     a Select, always */
  var PG_AXES = [
    { id: 'size', label: 'Size', group: 'shape', def: 'small',
      /* Initials, not words: see ORO_AXES.size in oro.js. */
      values: [['small', 'S'], ['medium', 'M']] },
    { id: 'density', label: 'Density', group: 'shape', def: 'standard',
      values: [['standard', 'Standard'], ['dense', 'Dense']] },
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['disabled', 'Disabled']] },
    { id: 'position', label: 'Position', group: 'state', def: 'mid',
      values: [['floor', 'At the floor'], ['mid', 'In the middle'],
               ['ceiling', 'At the ceiling']] }
  ];

  function pgSample(S, forCode) {
    var cls = 'gb-inputnumber';
    if (S.size === 'medium') cls += ' gb-inputnumber--medium';
    if (S.density === 'dense') cls += ' gb-inputnumber--dense';
    if (!forCode && S.state === 'hover') cls += ' is-hover';
    if (!forCode && S.state === 'focus') cls += ' is-focus';
    if (S.state === 'disabled') cls += ' is-disabled';

    var btn = 'gb-btn gb-btn--icon gb-btn--' + (S.size === 'medium' ? 'medium' : 'small') +
              ' gb-btn--ghost gb-btn--secondary gb-btn--plain';
    var value = S.position === 'floor' ? 1 : S.position === 'ceiling' ? 9 : 4;
    var off = S.state === 'disabled';

    if (forCode) {
      return '<div class="' + cls + '" aria-label="Quantity"' +
        (off ? ' aria-disabled="true"' : '') + '>\n' +
        '  <button class="' + btn + '" data-step="-1" aria-label="Decrease quantity">\n' +
        '    <span class="gb-btn__icon"></span>\n' +
        '  </button>\n' +
        '  <input class="gb-inputnumber__value" type="number" min="1" max="9" value="' + value + '">\n' +
        '  <button class="' + btn + '" data-step="1" aria-label="Increase quantity">\n' +
        '    <span class="gb-btn__icon"></span>\n' +
        '  </button>\n' +
        '</div>';
    }

    return '<div class="' + cls + '" id="pgInputNumber" aria-label="Quantity"' +
      (off ? ' aria-disabled="true"' : '') + '>' +
      '<button class="' + btn + '" type="button" data-step="-1" aria-label="Decrease quantity"' +
        (off ? ' disabled' : '') + '><span class="gb-btn__icon"></span></button>' +
      '<input class="gb-inputnumber__value" type="number" min="1" max="9" value="' + value + '"' +
        (off ? ' disabled' : '') + ' aria-label="Quantity">' +
      '<button class="' + btn + '" type="button" data-step="1" aria-label="Increase quantity"' +
        (off ? ' disabled' : '') + '><span class="gb-btn__icon"></span></button>' +
      '</div>';
  }

  /* The component enhances what the panel has just mounted: it fills the
     two glyphs from the record and reads the bounds off the number, which
     is what puts the minus out at the floor. */
  function pgAfter(S, hold) {
    if (window.GbInputNumber) window.GbInputNumber.boot(hold);
    paintPlayground();
  }

  function read(frame) {
    if (!frame) return null;
    var cs = getComputedStyle(frame);
    var r = frame.getBoundingClientRect();
    var v = frame.querySelector('.gb-inputnumber__value');
    var vs = getComputedStyle(v);
    var vr = v.getBoundingClientRect();
    var b = frame.querySelector('[data-step="-1"]');
    var br = b.getBoundingClientRect();
    var g = b.querySelector('.gb-icon') || b.querySelector('svg');
    var gr = g ? g.getBoundingClientRect() : null;
    return { cs: cs, r: r, vs: vs, vr: vr, br: br, gr: gr };
  }

  function paintPlayground() {
    var m = read(document.getElementById('pgInputNumber'));
    if (!m) return;
    txt('pgBox', Math.round(m.r.width) + ' by ' + Math.round(m.r.height));
    txt('pgWell', Math.round(m.vr.width) + ' by ' + Math.round(m.vr.height));
    txt('pgBtn', Math.round(m.br.width) + ' by ' + Math.round(m.br.height));
    txt('pgGlyph', m.gr ? Math.round(m.gr.width) + ' by ' + Math.round(m.gr.height) : 'no glyph');
    txt('pgLine', px(m.cs.borderTopWidth) + ' ' + m.cs.borderTopColor);
    txt('pgSeam', px(m.vs.borderLeftWidth) + ' ' + m.vs.borderLeftColor);
    txt('pgFont', px(m.vs.fontSize) + ' / ' + m.vs.fontWeight);
    txt('pgRadius', px(m.cs.borderTopLeftRadius));
  }

  /* ---------- the three variant captions ---------- */
  function paintVariants() {
    [['std', 'sp-std'], ['dense', 'sp-dense'], ['m', 'sp-m']].forEach(function (pair) {
      var m = read(document.getElementById(pair[1]));
      if (!m) return;
      var cap = document.querySelector('[data-m="' + pair[0] + '"]');
      if (cap) cap.textContent = Math.round(m.r.width) + ' by ' + Math.round(m.r.height) +
        ', well ' + Math.round(m.vr.width);
    });
  }

  /* ---------- the states table ---------- */
  function paintStates() {
    [['rest', 'sRest'], ['hover', 'sHover'], ['focus', 'sFocus'],
     ['floor', 'sFloor'], ['off', 'sOff']].forEach(function (pair) {
      var frame = document.getElementById('st-' + pair[0]);
      if (!frame) return;
      var cs = getComputedStyle(frame);
      var v = frame.querySelector('.gb-inputnumber__value');
      txt(pair[1] + 'Line', px(cs.borderTopWidth) + ' ' + cs.borderTopColor);
      txt(pair[1] + 'Bg', getComputedStyle(v).backgroundColor === 'rgba(0, 0, 0, 0)'
        ? 'transparent' : getComputedStyle(v).backgroundColor);
    });
  }

  function paintAnatomy() {
    var m = read(document.getElementById('st-rest'));
    if (!m) return;
    txt('szFrame', Math.round(m.r.height));
    txt('szBtn', Math.round(m.br.height));
    txt('szNum', px(m.vs.fontSize));

    txt('anFrame', Math.round(m.r.width) + ' by ' + Math.round(m.r.height) +
      ', radius ' + px(m.cs.borderTopLeftRadius));
    txt('anBtn', Math.round(m.br.width) + ' by ' + Math.round(m.br.height));
    txt('anGlyph', m.gr ? Math.round(m.gr.width) + ' by ' + Math.round(m.gr.height) : 'no glyph');
    txt('anWell', Math.round(m.vr.width) + ' by ' + Math.round(m.vr.height) +
      ', ' + px(m.vs.fontSize) + ' / ' + m.vs.fontWeight);
    txt('anSeam', px(m.vs.borderLeftWidth) + ' ' + m.vs.borderLeftColor +
      ' inside ' + px(m.cs.borderTopWidth) + ' ' + m.cs.borderTopColor);

    ORO.widthNow('wnow');
  }

  /* The playground is not in here: GbOro.controls answers resize for every
     panel on the page itself, and it repaints the readout through after(). */
  function paintAll() { paintVariants(); paintStates(); paintAnatomy(); }

  /* The glyph arrives with icon.js, which mounts on DOMContentLoaded,
     and this script runs while the document is still parsing. Painting
     now would print «no glyph» into a table that is describing a page
     that has one, so the first pass waits for the document. */
  function start() {
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="inputnumber"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter
      });
    }
    paintAll();
    /* TRAP 11 OF THE SKILL, caught here by measurement: a specimen
       that wears a demo state class at load is still INSIDE its own
       colour transition on the first frame, and a colour read there
       is a colour that stands on no screen (hover printed Zinc 500
       while the page was drawing Blue 600). So the tables are read
       again once the longest transition on a specimen has run out.
       The wait is not typed either: it is read off the specimen. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  /* The specimens on the shelves are real: stepping one has to move
     the numbers in the tables that describe it. */
  document.addEventListener('gbin:change', function () { paintAll(); paintPlayground(); });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>
