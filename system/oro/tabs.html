<!-- ============================================================
     gbppl-tabs-1 — THE TABS PAGE
     ------------------------------------------------------------
     Ton, 17.09, stating the law before the task: «если в дизайне
     появляется компонент, которого нет в системе — сначала
     добавляется компонент, потом строится дизайн». And about this
     one: «табы не такие, как мы используем».

     Four surfaces of this house already carry an underlined tab
     strip and no two of them agree. This page is where they stop
     disagreeing. It dresses none of them: migration is its own
     decision, and the Changelog says so.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves and
     code blocks are the atoms of ..\components\docs.css; its
     specimens are the component itself.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement in every table is read back off a rendered specimen
     with getComputedStyle. Where a number is quoted from the design
     file rather than measured here, it stands in a provenance
     column and says Figma.
     ============================================================ -->

        { table: {
            head: ['Do', 'Do not'],

                  + '<tr><td>Contrast</td><td>Blue 600 on white is 5.17:1 at 16px, and the chosen tab is never colour alone: it carries the underline as well, so the row survives greyscale</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'The strip, and the eleven lines the page owes it',
      name: 'Code',
      blocks: [
        { code: { id: 'codeBasics',
            text: '&lt;!-- the strip --&gt;\n'
                  + '&lt;div class="gb-tabs gb-tabs--ruled" role="tablist" aria-label="This approval"&gt;\n'
                  + '  &lt;button class="gb-tab" type="button" role="tab" id="t-preview"\n'
                  + '          aria-selected="true"  aria-controls="p-preview"&gt;Preview&lt;/button&gt;\n'
                  + '  &lt;button class="gb-tab" type="button" role="tab" id="t-messages"\n'
                  + '          aria-selected="false" aria-controls="p-messages"&gt;&lt;span class="gb-tab__label"&gt;Messages &lt;span class="gb-tab__count"&gt;(3)&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;\n'
                  + '&lt;/div&gt;\n'
                  + '\n'
                  + '&lt;div id="p-preview"  role="tabpanel" aria-labelledby="t-preview"&gt;…&lt;/div&gt;\n'
                  + '&lt;div id="p-messages" role="tabpanel" aria-labelledby="t-messages" hidden&gt;…&lt;/div&gt;' } },
        { code: { id: 'codeJs',
            text: '// the page owns the switching, and this is all of it\n'
                  + 'var tabs = [].slice.call(strip.querySelectorAll(\'.gb-tab\'));\n'
                  + 'function choose(tab) {\n'
                  + '  tabs.forEach(function (t) {\n'
                  + '    var on = t === tab;\n'
                  + '    t.setAttribute(\'aria-selected\', on ? \'true\' : \'false\');\n'
                  + '    document.getElementById(t.getAttribute(\'aria-controls\')).hidden = !on;\n'
                  + '  });\n'
                  + '}\n'
                  + 'strip.addEventListener(\'click\', function (e) {\n'
                  + '  var t = e.target.closest(\'.gb-tab\'); if (t) choose(t);\n'
                  + '});\n'
                  + 'strip.addEventListener(\'keydown\', function (e) {\n'
                  + '  var i = tabs.indexOf(document.activeElement), n = tabs.length;\n'
                  + '  if (e.key === \'ArrowRight\') tabs[(i + 1) % n].focus();\n'
                  + '  else if (e.key === \'ArrowLeft\') tabs[(i - 1 + n) % n].focus();\n'
                  + '  else if (e.key === \'Home\') tabs[0].focus();\n'
                  + '  else if (e.key === \'End\') tabs[n - 1].focus();\n'
                  + '  else return;\n'
                  + '  e.preventDefault(); choose(document.activeElement);\n'
                  + '});' } }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'What the tabs used to be',
      name: 'Changelog',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>1 September</td><td>The canon was recorded as a fact rather than built: underlined tabs are always 14 / 500 sentence case and never caps. Four surfaces carried a hand dressed strip and three of them already broke it</td></tr>\n'
                  + '<tr><td>17 September</td><td>The component, by Ton\'s own law: a design that needs a control the system does not have gets the control first. Two measured rungs, five states, three modifiers, no script, and five named divergences from the mock. No carrier is dressed by this wave</td></tr>\n'
                  + '<tr><td>17 September, the same evening</td><td>Ton settled four of the five against the live portal\'s own strip at <code>/customer/orders</code>: TABS GO IN CAPS, and the canon of 1 September is revoked for this component by his word; the tracking comes down to 0.2 with them; the default rung is confirmed; the row keeps no rule («у нас её нигде нет»); and the two widths become the two TYPES with a rule for choosing between them. The resting grey and its hover stay ours</td></tr>' } }
      ] },

    { toc: 'Related', eyebrow: 'Where to go next',
      name: 'Related',
      blocks: [
        { p: '<a href="toggle.html">Toggle button</a>, which holds one value out of a few and looks like a tab strip from a distance: a toggle CHANGES a value, a tab strip changes which side of one thing you are looking at. <a href="badge.html">Badge</a>, the thing that must not go inside a tab. <a href="button.html">Button</a>, whose focus ring this control borrows.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/tabs.css">tabs.css</a>, <a href="../components/docs.css">docs.css</a> (the small rung, value for value), <a href="../components/button.css">button.css</a> (the focus ring), <a href="../components/icon.css">icon.css</a>, <a href="../components/drawer.css">drawer.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.'
});

<script src="../type-scale.js"></script>
<script src="../components/icon.js"></script>

<script>
/* ============================================================
   gbppl-tabs-1 — THE TABS READOUT
   ------------------------------------------------------------
   The template's small scripts come from oro.js (window.GbOro).
   What is here is the playground and the tables filled by measuring
   specimens on this page.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED. The underline in
   particular is read off the tab's own border box rather than off
   the custom property that sets it, because a property is exactly
   the place a value can be declared and never rendered.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function inkOf(el) { return el ? getComputedStyle(el).color : ''; }
  function lineOf(el) {
    if (!el) return '';
    var cs = getComputedStyle(el);
    return px(cs.borderBottomWidth) + ' ' + cs.borderBottomColor;
  }
  function boxOf(el) {
    if (!el) return '';
    var r = el.getBoundingClientRect();
    return Math.round(r.width) + ' by ' + Math.round(r.height);
  }
  function padOf(el) {
    if (!el) return '';
    var cs = getComputedStyle(el);
    return px(cs.paddingTop) + ' / ' + px(cs.paddingLeft);
  }
  function typeOf(el) {
    if (!el) return '';
    var cs = getComputedStyle(el);
    return px(cs.fontSize) + ' / ' + cs.fontWeight + ' / ' + px(cs.lineHeight) +
           ', ls ' + px(cs.letterSpacing) + ', ' + cs.textTransform;
  }

  /* ---------- the playground ----------
     Rung is two values and wears the chips; the three shapes are
     each a yes and a no and wear the rail's own switch; State is a
     Select by the canon. */
  var PG_AXES = [
    { id: 'rung', label: 'Rung', group: 'size', def: 'default',
      values: [['default', 'Default'], ['small', 'Small']] },
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'], ['disabled', 'Disabled']] },
    { id: 'type', label: 'Type', group: 'shape', def: 'hug',
      values: [['hug', 'Hugging'], ['fill', 'Filling']] },
    { id: 'ruled', label: 'Rule under the row', group: 'shape', kind: 'bool', on: 'yes', off: 'no', def: 'yes' },
    { id: 'icon', label: 'Glyphs', group: 'shape', kind: 'bool', on: 'yes', off: 'no', def: 'no' }
  ];

  var COPY = [
    { word: 'Preview',  glyph: 'eye' },
    { word: 'Messages', glyph: 'chat', count: '(3)' },
    { word: 'History',  glyph: 'calendar' }
  ];

  function pgSample(S, forCode) {
    var nl = forCode ? '\n  ' : ' ';
    var cls = 'gb-tabs' +
              (S.rung === 'small' ? ' gb-tabs--small' : '') +
              (S.type === 'fill' ? ' gb-tabs--fill' : '') +
              (S.ruled === 'yes' ? ' gb-tabs--ruled' : '');
    var size = S.rung === 'small' ? '16' : '24';
    var out = '<div class="' + cls + '" role="tablist" aria-label="Sample">';
    COPY.forEach(function (c, i) {
      var on = i === 0;
      var off = (on && S.state === 'disabled') ? ' disabled' : '';
      /* The count goes INSIDE the label span, always: a tab is a flex
         container and flex eats the whitespace between its items, so
         a count written as a direct child would touch the word. */
      var label = c.count
        ? '<span class="gb-tab__label">' + esc(c.word) + ' <span class="gb-tab__count">' + esc(c.count) + '</span></span>'
        : esc(c.word);
      out += nl + '<button class="gb-tab" type="button" role="tab"' +
             (on ? ' id="pgTab"' : '') +
             ' aria-selected="' + (on ? 'true' : 'false') + '"' + off + '>' +
             (S.icon === 'yes'
               ? '<span class="gb-tab__icon" aria-hidden="true"><span data-gb-icon="' + c.glyph + '" data-gb-icon-size="' + size + '"></span></span><span class="gb-tab__label">' + label + '</span>'
               : label) +
             '</button>';
    });
    return out + (forCode ? '\n' : ' ') + '</div>';
  }

  /* ---------- THE SPECIMENS REALLY SWITCH ----------
     gbppl-tabs-3. Ton, on the showcase: the tabs in the Playground do
     not answer a click. They do now, and they answer with the ELEVEN
     LINES THIS PAGE PRINTS IN ITS OWN CODE SECTION, not with anything
     cleverer — which is the demonstration, not a shortcut: the
     component owns the look and the page owns the switching, so the
     page that documents it has to do the switching itself.

     Two honest differences from the snippet, both because a specimen
     is not a product page: a strip here may have no panels at all, so
     the panel half is skipped when `aria-controls` is missing, and
     the readouts are repainted after every switch because the tables
     under the stage describe the tab that is chosen RIGHT NOW.

     The States shelf is deliberately NOT wired: it exists to hold six
     states still side by side, and a frozen state that moves when you
     poke it is not a specimen of anything. */
  function wireTabs(strip, after) {
    if (!strip || strip.__gbWired) return;
    strip.__gbWired = true;
    var tabs = [].slice.call(strip.querySelectorAll('.gb-tab'));
    function choose(tab) {
      if (!tab || tab.disabled) return;
      tabs.forEach(function (t) {
        var on = t === tab;
        t.setAttribute('aria-selected', on ? 'true' : 'false');
        var id = t.getAttribute('aria-controls');
        var panel = id && document.getElementById(id);
        if (panel) panel.hidden = !on;
      });
      /* TRAP 11 OF THE SKILL, ON A CLICK THIS TIME. The ink and the
         underline cross over the micro clock, and a table painted in
         the same breath as the switch reads the colour halfway
         through the crossing: the first run of this reported the
         chosen tab in Zinc 500 and called the underline transparent.
         So the readouts are painted twice, and the wait is READ off
         the tab rather than typed. */
      if (after) {
        after();
        var ms = 0;
        String(getComputedStyle(tab).transitionDuration).split(',').forEach(function (one) {
          var n = parseFloat(one);
          if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
        });
        setTimeout(after, ms + 40);
      }
    }
    strip.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.gb-tab') : null;
      if (t) choose(t);
    });
    strip.addEventListener('keydown', function (e) {
      var i = tabs.indexOf(document.activeElement), n = tabs.length;
      if (i < 0) return;
      if (e.key === 'ArrowRight') tabs[(i + 1) % n].focus();
      else if (e.key === 'ArrowLeft') tabs[(i - 1 + n) % n].focus();
      else if (e.key === 'Home') tabs[0].focus();
      else if (e.key === 'End') tabs[n - 1].focus();
      else return;
      e.preventDefault();
      choose(document.activeElement);
    });
  }

  function pgAfter(S, hold) {
    var on = hold.querySelector('#pgTab');
    if (!on) return;
    if (S.state === 'hover') on.classList.add('is-hover');
    if (S.state === 'focus') on.classList.add('is-focus');
    if (window.GbIcons && window.GbIcons.mount) window.GbIcons.mount(hold);
    /* The stage is rebuilt from scratch on every axis change, so the
       wiring is put back on the new strip every time. */
    wireTabs(hold.querySelector('.gb-tabs'), paintPlayground);
    paintPlayground();
  }

  function paintPlayground() {
    var row = document.querySelector('[data-pg="tabs"] .gb-tabs');
    if (!row) return;
    /* THE TABLE DESCRIBES THE TAB THAT IS CHOSEN RIGHT NOW, not the
       one that happened to be chosen when the stage was built: after
       gbppl-tabs-3 the reader can change that with a click. */
    var on = row.querySelector('.gb-tab[aria-selected="true"]') || row.querySelector('.gb-tab');
    var rest = row.querySelector('.gb-tab[aria-selected="false"]');
    var glyph = on.querySelector('.gb-tab__icon');
    txt('pgBox', boxOf(on));
    txt('pgLine', lineOf(on));
    txt('pgType', typeOf(on));
    txt('pgPad', padOf(on));
    txt('pgOn', inkOf(on));
    txt('pgOff', inkOf(rest));
    txt('pgGap', px(getComputedStyle(row).columnGap));
    /* The air beside the glyph is the glyph's own margin, not a flex
       gap of the tab: a gap would also land between a word and its
       count. Measured where it actually lives. */
    txt('pgIcon', glyph ? boxOf(glyph) + ', gap ' + px(getComputedStyle(glyph).marginInlineEnd) : 'no glyph');
  }

  /* ---------- the states table ---------- */
  function paintStates() {
    [['rest', 'sRest'], ['hover', 'sHover'], ['focus', 'sFocus'],
     ['on', 'sOn'], ['off', 'sOff'], ['onoff', 'sOnOff']].forEach(function (pair) {
      var el = document.getElementById('st-' + pair[0]);
      if (!el) return;
      txt(pair[1] + 'Ink', inkOf(el));
      txt(pair[1] + 'Line', lineOf(el));
      txt(pair[1] + 'Op', getComputedStyle(el).opacity);
    });
  }

  /* ---------- the two rungs ---------- */
  function paintSizes() {
    [['sz-md', 'szMd'], ['sz-sm', 'szSm']].forEach(function (pair) {
      var el = document.getElementById(pair[0]);
      if (!el) return;
      txt(pair[1] + 'Type', typeOf(el));
      txt(pair[1] + 'Box', boxOf(el));
      txt(pair[1] + 'Pad', padOf(el));
      txt(pair[1] + 'Gap', px(getComputedStyle(el.closest('.gb-tabs')).columnGap));
    });
  }

  /* ---------- anatomy ---------- */
  function paintAnatomy() {
    var strip = document.querySelector('#sizeShelf .gb-tabs');
    /* CHOSEN AND RESTING ARE FOUND BY THE ATTRIBUTE, NOT BY AN ID.
       Since gbppl-tabs-3 the reader can move the choice in this very
       shelf with a click, and a table that kept measuring the first
       tab would start calling a transparent line «the underline». */
    var tab = strip && (strip.querySelector('.gb-tab[aria-selected="true"]') || strip.querySelector('.gb-tab'));
    var iconTab = document.getElementById('op-icon');
    var count = document.querySelector('#sizeShelf .gb-tab__count');
    if (strip) txt('anRow', boxOf(strip) + ', gap ' + px(getComputedStyle(strip).columnGap) + ', overflow-x ' + getComputedStyle(strip).overflowX);
    if (tab) txt('anTab', boxOf(tab) + ', padding ' + padOf(tab));
    if (tab) {
      var rest = strip.querySelector('.gb-tab[aria-selected="false"]');
      txt('anLine', lineOf(tab) + (rest ? ', not chosen: ' + lineOf(rest) : ''));
    }
    if (iconTab) {
      var g = iconTab.querySelector('.gb-tab__icon');
      txt('anIcon', g ? boxOf(g) + ', gap ' + px(getComputedStyle(g).marginInlineEnd) : '');
    }
    if (count) {
      var cs = getComputedStyle(count);
      txt('anCount', cs.color + ', ' + cs.fontVariantNumeric);
    }
    ORO.widthNow('wnow');
  }

  function paintAll() { paintStates(); paintSizes(); paintAnatomy(); }

  function start() {
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="tabs"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter
      });
    }
    /* THE SHELVES WITH SEVERAL TABS ANSWER A CLICK TOO. Sizes and
       Options each show a real strip of three, and a strip of three
       that cannot be switched teaches the opposite of what the page
       says. The States shelf is left alone on purpose: its six
       specimens are frozen states. */
    [].forEach.call(document.querySelectorAll('#sizeShelf .gb-tabs, #optShelf .gb-tabs'),
      function (strip) { wireTabs(strip, paintAll); });
    paintAll();
    /* TRAP 11 OF THE SKILL. A specimen wearing a demo state class at
       load is still inside its own colour transition on the first
       frame. The wait is read off the specimens rather than typed. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>
