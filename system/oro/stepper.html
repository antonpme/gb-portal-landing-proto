<!-- ============================================================
     gbppl-inputnumber-1 — THE ADDRESS THIS CARD USED TO HAVE
     ------------------------------------------------------------
     Ton, 31.08: «на странице компонента stepper показывается
     совершенно не stepper, а select плюс-минус (забыл, как этот
     input называется)». In PrimeVue, the client's stack, Stepper
     is a wizard of steps and the minus-number-plus control is
     InputNumber. The card moved to inputnumber.html and the word
     Stepper went back to meaning steps.

     A link that used to work is not allowed to stop working
     because a file was renamed. This page is nothing but the
     forward: replace(), so the dead address does not sit in the
     back button, with the query kept (device, studio and comment
     are context, not decoration) and the one anchor that changed
     its name translated on the way through. The remaining hashes
     — anatomy, playground, variants, states, sizes, properties,
     usage, a11y, code, changelog — are the same on both pages and
     ride across untouched.

     The same one time code components.html carries for its ten
     moved hashes, in the same manner, to be deleted when the old
     links are gone from the world. The body below is what a
     reader sees if scripts are off. -->
<script>
(function () {
  var HASH = { '#stepper': '#inputnumber' };
  var hash = HASH[location.hash] || location.hash || '';
  location.replace('inputnumber.html' + location.search + hash);
})();
</script>

<style>
  body { margin: 0; padding: 48px 24px; font: 400 16px/1.6 system-ui, sans-serif; color: #18181b; }
  a { color: #2563eb; }
</style>
</head>

</body>
