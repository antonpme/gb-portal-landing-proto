<!-- ============================================================
     gbppl-toggle-family-1 / gbppl-toggle-type-1 — THE TOGGLE BUTTON PAGE
     ------------------------------------------------------------
     gbppl-toggle-type-1, 01.09. Ton, on a screenshot of the console's
     Mode switch: «в наших Toggle Buttons, по крайней мере в этом
     размере, шрифт какой-то великоватый. Если сравнить с кнопками, в
     кнопках шрифт меньше, даже на больших.» And then, in the same
     hour: «Наведи порядок в размерах тоглов. Они должны быть разных
     размеров и иметь ту же сетку свойств (Properties), что и кнопки.
     Отступы и размеры шрифта — всё должно быть абсолютно идентичным.
     Ведь тоггл-кнопка это та же кнопка, только помещённая в общую
     рамку и состэканная по несколько штук.»

     The instrument found the label innocent — 11 at 1280 and 12 at
     2026, --gb-btn-medium-label to the token, the same value a button
     renders beside it — and found the BOX guilty: the half was 32.5
     tall where its button was 42, and drifted further at every rung.
     The half is now the button's box, token for token. What the page
     had to say differently because of it is marked below; every
     number on the page is still read off the rendered document.

     Ton, 01.09: «Toggle, как и обычная кнопка, должен быть в разных
     вариантах. То есть фактически мы берем кнопку и чуть
     трансформируем ее, сохраняя стейты и прочее. Даже, наверное,
     иконки там нужны, поэтому компонент нужно допилить. И нужно
     создать отдельную страницу под компонент.»

     The component grew a size ladder, a glyph and an optical
     correction in system/components/toggle.css; this is the second
     half of that sentence.

     WHERE THE CONTROL CAME FROM. It is the ONE ADDRESS / DIFFERENT
     ADDRESSES segment that has stood in the head of every shipment
     card on live/checkout.html since 21.08, measured with the
     instrument at 390 and 1280 on 29.08 (LIVE) and moved into the
     system without a pixel changing. Everything the page marks
     Declared was added on top of that measurement and has no
     carrier yet, which is said out loud in each place rather than
     once at the top.

     THE PAGE IS BUILT ON THE TEMPLATE, NOT BESIDE IT (ORO-SKILL 7a
     and Ton-19/21): the crumb, the sections in the canonical order,
     the eyebrow over a serif h2, the .gbdoc-pg playground card with
     GbOro.controls on its rail, the tables in .gbdoc-tablewrap, the
     Light | Dark switch on the stage and the Preview | Code fold in
     the footer band. Nothing about the layout is invented here; the
     one <style> block is the width of the reading column.

     Ton-10: this page is a CONSUMER. Its furniture is the atoms of
     ..\components\docs.css; its specimens are the component.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement is read back off the rendered page.
     ================================================

     ------------------------------------------------------------
     gbppl-oro-engine-2, 02.09 — THE PAGE BECAME A DECLARATION
     ------------------------------------------------------------
     Тон, 01.09: «шаблон страницы компонента для дизайн-системы.
     Сделай как мини-приложение, чтобы фактически менялась только
     начинка... если мы потом будем его улучшать, он должен
     улучшаться по всей системе сразу.»

     The seventh and last showcase onto system/oro/oro-page.js, and
     the one that had the least to gain and the most to prove: this
     page was written a day after the template was settled, so it
     already stood the canonical way — the flag on the H1, no second
     head, an Eyebrow over a serif h2 in every section, the .gbdoc-pg
     card with the rail beside the stage. There was nothing here to
     straighten. So the only thing the move can show is that the
     engine takes a page of thirteen sections, six live shelves of
     real controls, four measured tables and a script that reads
     every number off the rendered document, and gives it back
     exactly. It does, at 360, 1280 and 2258.

     WHAT LEFT THE FILE. The eleven stylesheets in their one order
     (this page already listed them in that order, which is where the
     engine's order came from), the studio bar, the rail, the contents
     aside, the reading column, the card, all thirteen section heads,
     all four table wrappers, the code block, the playground card, the
     foot, the drawer element and the console. Two link comments went
     with them and their reasons are the engine's now: icon.css is
     head furniture because a glyph in a half is .gb-icon --16, and
     auth.css because the rail's Select and text field are gb-field.
     The address does not move: the law of links (ORO-SKILL 0a.5) says
     toggle.html is toggle.html.

     The page keeps what is genuinely its own: this comment, the
     declaration below, and the measuring script under it. The two
     calls the script no longer makes are watchCopy and watchToc: the
     Copy buttons are wired by GbOro.page and the contents are read by
     oro.js, and both were the template all along.
     ============================================================ -->

            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--grow">\n'
            + '            <span class="gbdoc-slot__cap"><b>Hover</b> held still</span>\n'
            + '            <div class="gb-toggle" id="st-hover" aria-label="Screen, hover">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item is-hover" type="button" role="radio" aria-checked="false">Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--grow">\n'
            + '            <span class="gbdoc-slot__cap"><b>Focus</b> held still</span>\n'
            + '            <div class="gb-toggle" id="st-focus" aria-label="Screen, focus">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item is-focus" type="button" role="radio" aria-checked="false">Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--grow">\n'
            + '            <span class="gbdoc-slot__cap"><b>One value out</b> a real disabled</span>\n'
            + '            <div class="gb-toggle" id="st-oneout" aria-label="Screen, one value unavailable">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false" disabled>Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--grow">\n'
            + '            <span class="gbdoc-slot__cap"><b>All out</b> the group off</span>\n'
            + '            <div class="gb-toggle is-disabled" id="st-allout" aria-disabled="true" aria-label="Screen, unavailable">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true" disabled>Desktop</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false" disabled>Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '        </div>' },
        { table: {
            head: ['State', 'Ground', 'Ink', 'Token', 'Provenance'],
            body: 'stBody',
            rows: '' } },
        { note: 'Hover darkens, and it darkens twice: the wash comes up and the ink steps from Zinc 700 to Zinc 900. That pair replaced a measured Zinc 50 on 1 September, because five units of grey against a white track is a hover nobody sees and Ton said so out loud; the wash it took instead is the one the ghost button twelve pixels away in the same checkout band already spends. <b>The pressed half is never washed</b>: it is already the answer, and a black card going grey under the pointer would read as a fault.' },
        { note: 'There is no press state, and that is a decision rather than an omission. A button needs one because pushing it produces nothing you can see until it has finished; pushing a half of a toggle turns it black within the same 160 milliseconds, so the press and its result are the same paint. Adding one would mean inventing a colour the checkout never rendered in order to show it for a sixth of a second.' },
        { note: 'Hover and focus above are held still by <code>.is-hover</code> and <code>.is-focus</code>, the two demo names the button already declares. They exist so five states can stand on one screen and no product page may wear them. The last two are real: a native <code>disabled</code> on one half, and <code>.is-disabled</code> with <code>aria-disabled</code> on the whole group.' }
      ] },

    { id: 'width', toc: 'Width', eyebrow: 'Width',
      h2: 'Hug, block, equal shares or shares that follow the words',
      blocks: [
        { p: 'Four answers to one question, and only the first is the checkout. A track that hugs is as wide as its words; <code>--block</code> spans its column and lets the halves fall to a second row inside it; <code>--fill</code> spans the column and splits it in equal shares, one label centred in each; <code>--spread</code> spans the column and gives each half its own word plus a share of what is left. The last three are alternatives, never a pair.' },
        { html: '<div class="gbdoc-shelf gbdoc-shelf--stack" data-inspect="toggle" id="widthShelf">\n'
            + '          <div class="gbdoc-slot gbdoc-slot--wide">\n'
            + '            <span class="gbdoc-slot__cap"><b>Hug</b> no modifier, the default, and the checkout <b data-wd="hug">measuring</b></span>\n'
            + '            <div class="gb-toggle" id="wd-hug" aria-label="Screen, hugging">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Tablet</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--wide">\n'
            + '            <span class="gbdoc-slot__cap"><b>Block</b> <code>--block</code>, the track spans and the halves keep their own widths <b data-wd="block">measuring</b></span>\n'
            + '            <div class="gb-toggle gb-toggle--block" id="wd-block" aria-label="Screen, block">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Tablet</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--wide">\n'
            + '            <span class="gbdoc-slot__cap"><b>Fill</b> <code>--fill</code>, the track spans and the halves split it in equal shares <b data-wd="fill">measuring</b></span>\n'
            + '            <div class="gb-toggle gb-toggle--fill" id="wd-fill" aria-label="Screen, fill">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Tablet</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '          <div class="gbdoc-slot gbdoc-slot--wide">\n'
            + '            <span class="gbdoc-slot__cap"><b>Spread</b> <code>--spread</code>, the track spans and the shares follow the labels <b data-wd="spread">measuring</b></span>\n'
            + '            <div class="gb-toggle gb-toggle--spread" id="wd-spread" aria-label="Screen, spread">\n'
            + '              <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">Desktop</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Tablet</button>\n'
            + '              <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Mobile</button>\n'
            + '            </div>\n'
            + '          </div>\n'
            + '        </div>' },
        { note: 'Equal shares or shares that follow the words is a real choice, and the console settled it. Its Mode switch is VIEW / INSPECT / COMMENT in a rail 287 wide, and the third half also carries a count of unread comments: equal shares give it 96 where it needs 106, and the badge climbs over the word. On <code>--spread</code> the same three halves come out 60 / 82 / 127, the track is full to the pixel and nothing overlaps. So <code>--fill</code> when the halves are three readings of one axis and a ragged set of widths would read as an accident, <code>--spread</code> when they are not comparable or one of them carries something besides its word.' },
        { note: 'Under <code>--fill</code> and <code>--spread</code> one measured number changes, and it changes because it stops meaning what it meant: the horizontal pad drops to <code>--space-8</code> on every rung. In a hug the 16 <em>is</em> the half\'s air. In a share the air is whatever the share leaves over, and the padding is only the floor between a centred label and its own edge, so it is a floor and not a ladder. Nothing visible moves: a filled half is as wide as its share and never as wide as its padding.' }
      ] },

    { id: 'anatomy', toc: 'Anatomy', eyebrow: 'Anatomy',
      h2: 'The control it was measured off, part by part',
      blocks: [
        { p: 'This is the checkout\'s own segment, in the checkout\'s own words and on the rung the checkout wears since 2 September, standing here so the numbers below describe the thing that was measured rather than a specimen invented for a page. Every value is read off it at this window width. Two of them are no longer the checkout\'s measurement but Ton\'s model on top of it, and they say so in the last column.' },
        { html: '<div class="gbdoc-stage gbdoc-stage--center" data-inspect="toggle">\n'
            + '          <div class="gb-toggle gb-toggle--small" id="anSpec" aria-label="How these gifts are addressed">\n'
            + '            <button class="gb-toggle__item is-on" type="button" role="radio" aria-checked="true">One address</button>\n'
            + '            <button class="gb-toggle__item" type="button" role="radio" aria-checked="false">Different addresses</button>\n'
            + '          </div>\n'
            + '        </div>' },
        { readout: 'Measured at <b id="wnow2">measuring</b> wide.' },
        { table: {
            head: ['Part', 'What it is', 'Measured', 'Provenance'],
            rows: '<tr><td>Track</td><td>The white sheet the chosen half floats in, with one hairline round it</td><td class="gbdoc-num" id="anTrack"></td><td><span class="gbdoc-flag">Live</span></td></tr>\n'
              + '<tr><td>Inset</td><td>The same 4 on all four sides, and the same 4 between two halves, so the black card sits square in the white</td><td class="gbdoc-num" id="anInset"></td><td><span class="gbdoc-flag">Live</span>, and <span class="gbdoc-flag gbdoc-flag--none">No token</span>: half a step of a scale that starts at 8</td></tr>\n'
              + '<tr><td>Hairline and radius</td><td>Zinc 300 at one pixel, and the one brand radius, on the track and on each half</td><td class="gbdoc-num" id="anLine"></td><td><span class="gbdoc-flag">Live</span></td></tr>\n'
              + '<tr><td>Half</td><td>A fill, not a box: no line of its own. It does have a floor, the button\'s own min-height for the rung</td><td class="gbdoc-num" id="anItem"></td><td><span class="gbdoc-flag gbdoc-flag--declared">Declared</span> 01.09, over a <span class="gbdoc-flag">Live</span> half of 32.5 that declared no height</td></tr>\n'
              + '<tr><td>Padding</td><td>The button\'s own medium pad: 8 above and below, unevenly spent by one pixel (see the note under this table), and 16 either side, 20 from 1280</td><td class="gbdoc-num" id="anPad"></td><td><span class="gbdoc-flag">Live</span> the vertical pair, <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the one pixel between them and the horizontal step at 1280</td></tr>\n'
              + '<tr><td>Label</td><td>The button\'s own medium label, whole: caps, 600, one pixel of tracking, on the button\'s normal line</td><td class="gbdoc-num" id="anLabel"></td><td><span class="gbdoc-flag">Live</span> the type, <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the line, which was 1.5 until the half had a height of its own</td></tr>\n'
              + '<tr><td>Chosen</td><td>Zinc 900 under white ink, the black card of the sheet</td><td class="gbdoc-num" id="anOn"></td><td><span class="gbdoc-flag">Live</span></td></tr>\n'
              + '<tr><td>Motion</td><td>The house\'s micro clock on ink, ground and line</td><td class="gbdoc-num" id="anMotion"></td><td><span class="gbdoc-flag">Live</span></td></tr>' } },
        { note: '<b>The one pixel of uneven padding, and why it is there.</b> Ton, on 1 September: the text inside the toggle looks pushed up. It was, and by nearly a whole pixel. The pressed half was shot at eight device pixels to the css pixel, with the card\'s own edges and the white ink found in the same image so that no rounding of a crop could be mistaken for the effect, and that put <span id="anShiftWas">the ink</span> above the optical centre. The cause is the alphabet, not the stylesheet: a line box is balanced around the font\'s ascent and descent, and an all-caps label has no descender to put in the space reserved under the baseline, so the ink floats up by half of it. The correction is one device pixel taken off the top pad and given to the bottom one. <b>The sum is untouched</b>, and the sum is the button\'s own 16: <span id="anShiftNow">measured after the change</span>. So this uneven pair is the one property of the half that is not the button\'s to the letter, and it costs zero height, which is why it survived the rebuild of the same day. Declared under Ton-17, because the source rendered it high and an obvious shortfall of the source is repaired at the owner.' }
      ] },

    { id: 'properties', toc: 'Properties', eyebrow: 'Properties',
      h2: 'The modifiers, and the drawer that reads a specimen',
      blocks: [
        { p: 'Two layers, the way the mature systems keep them. The table is the whole surface of the component, readable in one piece. The drawer answers about one specimen: the Properties button in the corner of any specimen on this page opens it with the geometry, the type and the colours measured off that element.' },
        { table: {
            head: ['Name', 'Axis', 'Default', 'What it does'],
            rows: '<tr><td><code>.gb-toggle</code></td><td>Base</td><td>required</td><td>The track: the sheet, the hairline, the radius, the 4 of inset, and the eight colour slots a family repoints</td></tr>\n'
              + '<tr><td><code>.gb-toggle__item</code></td><td>Base</td><td>required</td><td>One half. A <code>&lt;button&gt;</code>, one per value</td></tr>\n'
              + '<tr><td><code>.gb-toggle__label</code></td><td>Slot</td><td>optional</td><td>The word, when a half also carries a glyph and the markup would rather name its parts. It has no type of its own, and unlike the button\'s label it may wrap</td></tr>\n'
              + '<tr><td><code>--xsmall --small --medium --large</code></td><td>Size</td><td><code>--medium</code></td><td>Which of the four ladders the five geometry slots point at: height, the two pads, the glyph gap and the label. Every rung is the button\'s rung, spent as its tokens. All four are declared on the element, so a size modifier cannot lose a specificity race. There is no <code>--xlarge</code>: see Sizes</td></tr>\n'
              + '<tr><td><code>--block</code></td><td>Width</td><td>off</td><td>The track spans its column and wraps; the halves keep every measured number and fall to a second row inside it</td></tr>\n'
              + '<tr><td><code>--fill</code></td><td>Width</td><td>off</td><td>The track spans its column and the halves split it in equal shares. An alternative to <code>--block</code>, never a pair with it</td></tr>\n'
              + '<tr><td><code>--spread</code></td><td>Width</td><td>off</td><td>The track spans its column and each half takes its own word plus a share of what is left. For halves that are not comparable in length, or one that carries something besides its word</td></tr>\n'
              + '<tr><td><code>--inverse</code></td><td>Family</td><td>off</td><td>The second ground. The sheet turns Zinc 950 and the pressed half becomes the white card: the button organism\'s inverse cell, repointing the eight colour slots of the track</td></tr>\n'
              + '<tr><td><code>.is-on</code> / <code>aria-checked</code> / <code>aria-pressed</code></td><td>Value</td><td>one of them</td><td>Which half is chosen. All three are read, so a group written as two pressed buttons is understood as well as one written as radios</td></tr>\n'
              + '<tr><td><code>disabled</code></td><td>State</td><td>off</td><td>One value the system cannot hold: the half fades and stops answering</td></tr>\n'
              + '<tr><td><code>.is-disabled</code> / <code>aria-disabled</code> on the track</td><td>State</td><td>off</td><td>The whole group off. The group owns the fade, so the halves inside it do not fade a second time</td></tr>\n'
              + '<tr><td><code>data-gb-toggle="host"</code></td><td>Ownership</td><td>off</td><td>The host owns the value. The component keeps its hands off <code>.is-on</code> and does only the group contract, the single tab stop and the arrow keys</td></tr>\n'
              + '<tr><td><code>gbtg:change</code></td><td>Event</td><td>always</td><td>Fired from the track after the component moves the value: <code>{ value, label, index }</code></td></tr>\n'
              + '<tr><td><code>.is-hover</code> <code>.is-focus</code></td><td>Demo</td><td>off</td><td>Hold a state still for a screenshot. This page only, never a product page</td></tr>' } },
        { note: 'What the button has and this does not, each for a reason written at the rule that would have carried it. <b>No colour family</b>: the checkout\'s own comment settles it, «black, not blue: the toggle is furniture, not a state chip», and a blue toggle would make the accent mean «chosen» when it already means «the action being asked for» (Ton-5). <b>No type</b>: filled, outline and ghost describe how loud an action is, and a toggle\'s whole paint is one half against the other. <b>No xlarge</b>, for the reason under Sizes. <b>No text field for the label and no picker for the glyph</b>, the two axes the button\'s own rail carries: a button has one word and one mark, so a control can edit them; a toggle has one of each per value, and a control that edits a set is a table.' }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'When a toggle, and when something else',
      blocks: [
        { table: {
            head: ['Do', 'Do not'],
            rows: '<tr><td>Reach for a toggle when the whole set is short and the reader benefits from seeing all of it at once</td><td>Use one past four values. Five is a Select: a track that long stops being comparable and starts being a list</td></tr>\n'
              + '<tr><td>Keep the labels short and of one kind, so the halves read as a set rather than as separate buttons</td><td>Mix a verb with a noun. A half is a value, not an action, and a half that says «Save» is a button in the wrong clothes</td></tr>\n'
              + '<tr><td>Always leave one half chosen. A toggle has an answer from the moment it is drawn</td><td>Draw one with nothing pressed and treat the empty state as a question. That is what a form field with a placeholder is for</td></tr>\n'
              + '<tr><td>Say what is being chosen, in a heading beside the track or an <code>aria-label</code> on it</td><td>Leave a bare pair of words in a band and trust the paragraph under it to explain them</td></tr>\n'
              + '<tr><td>Let the host own the value when choosing does more than store a string: opens half a form, reloads a list</td><td>Wire a host handler and leave the component driving as well. Two owners answer twice</td></tr>\n'
              + '<tr><td>Use <code>--fill</code> when the track sits in a column of its own and a ragged right edge would read as a mistake</td><td>Use <code>--fill</code> for labels that will not fit their share. That is what <code>--spread</code> is for; a share that has to wrap is a schema that should not have asked for a toggle</td></tr>\n'
              + '<tr><td>Use <code>--inverse</code> the moment the control stands on a dark ground, so the pressed half is a card and not a hole</td><td>Repaint a track by hand on a dark screen. The colour slots are the component\'s; a consumer that needs a third family asks for one in <code>toggle.css</code></td></tr>' } },
        { note: 'Two segments in this house look alike and are not the same control. This one is a value of a form, black and boxed, and it belongs on a product screen. <code>.gbdoc-seg</code> in docs.css is quiet text with a blue underline, it switches the view of a document, and it exists because an instrument must not look like the thing it builds (Ton, 26.08). Whether they should be one component with two looks is an open question in the skill; until it is answered, pick by what the control does, not by how it looks.' },
        { note: 'The labels are copy and follow the copy rules: sentence case in the markup, since the component sets the caps itself, and no full stop.' }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'One tab stop, and the arrows do the choosing',
      blocks: [
        { table: {
            rows: '<tr><td>Grouping</td><td>The track is <code>role="radiogroup"</code> with a name and each half is a <code>role="radio"</code>, set by <code>toggle.js</code> where the markup has not set them. A group written with <code>aria-pressed</code> instead is left as it is: two pressed buttons are a legal reading of the same control, and a second attribute beside the first would be a second source of truth</td></tr>\n'
              + '<tr><td>Keyboard</td><td>One tab stop for the whole group, on the chosen half. The arrows move between the halves <em>and</em> choose as they go, Home and End jump to the ends, and all of them wrap. That is the pattern a browser gives a radio group everywhere else, so nobody has to learn this one</td></tr>\n'
              + '<tr><td>Why the arrows also press</td><td>They fire a real click, which means the host\'s own handler runs. A host-driven group gets keyboard support without this component knowing anything about what the host does</td></tr>\n'
              + '<tr><td>Focus</td><td><code>:focus-visible</code>, so the ring appears for the person who arrived by Tab and not for a mouse click. Two pixels of Blue 600 at two pixels of offset, the button organism\'s own ring. Declared: the checkout showed the browser\'s hairline and nothing designed</td></tr>\n'
              + '<tr><td>Disabled</td><td>A real <code>disabled</code> on a half takes it out of the tab order and out of the arrow walk. The whole group off wants <code>aria-disabled</code> on the track <em>and</em> <code>disabled</code> on the halves, because <code>pointer-events</code> cannot take a button out of the tab order</td></tr>\n'
              + '<tr><td>Glyphs</td><td>Every mark is <code>aria-hidden</code> and rides beside a real word. A half with a mark and no word carries its own <code>aria-label</code></td></tr>\n'
              + '<tr><td>Target size</td><td>The default half is the button\'s medium rung: 36 tall at base, 42 from 1280 and 48 from 2000, and the two rungs under it are smaller again. The base step is under the 44 a thumb wants, and it is under it for the same reason every chrome button in this house is: it is the chrome rung. Where a toggle is the subject of a touch screen rather than a band of a wide form, <code>--large</code> clears 44 at every width (48 / 56 / 64) and <code>--medium</code> clears it from 2000, the same as the buttons of those rungs</td></tr>\n'
              + '<tr><td>A picture of a control</td><td>A track inside <code>aria-hidden</code> is a preview, not a control: <code>toggle.js</code> leaves it entirely alone, so a registry tile has no tab stop and announces nothing</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'A track, and a button for every value',
      blocks: [
        { p: 'The word is a bare text node when it stands alone and a <code>.gb-toggle__label</code> when a mark stands beside it. Both are legal, and the checkout writes the first.' },
        { code: { id: 'codeBasics',
            text: '&lt;!-- the component owns the value --&gt;\n'
                  + '&lt;div class="gb-toggle" role="radiogroup" aria-label="Screen"&gt;\n'
                  + '  &lt;button class="gb-toggle__item is-on" type="button"\n'
                  + '          role="radio" aria-checked="true" data-value="desktop"&gt;Desktop&lt;/button&gt;\n'
                  + '  &lt;button class="gb-toggle__item" type="button"\n'
                  + '          role="radio" aria-checked="false" data-value="mobile"&gt;Mobile&lt;/button&gt;\n'
                  + '&lt;/div&gt;\n'
                  + '\n'
                  + '&lt;!-- a mark beside the word: .gb-icon, and the word in its own span --&gt;\n'
                  + '&lt;button class="gb-toggle__item" type="button" role="radio" aria-checked="false"&gt;\n'
                  + '  &lt;span class="gb-icon gb-icon--16" aria-hidden="true"&gt;&lt;svg&gt;...&lt;/svg&gt;&lt;/span&gt;\n'
                  + '  &lt;span class="gb-toggle__label"&gt;Mobile&lt;/span&gt;\n'
                  + '&lt;/button&gt;\n'
                  + '\n'
                  + '&lt;!-- equal shares in a column of its own, one rung up --&gt;\n'
                  + '&lt;div class="gb-toggle gb-toggle--large gb-toggle--fill" role="radiogroup" aria-label="Screen"&gt;\n'
                  + '  ...\n'
                  + '&lt;/div&gt;\n'
                  + '\n'
                  + '&lt;!-- the host owns the value: group, tab stop and arrow keys only --&gt;\n'
                  + '&lt;div class="gb-toggle" data-gb-toggle="host" role="radiogroup" aria-label="Addresses"&gt;\n'
                  + '  ...\n'
                  + '&lt;/div&gt;' } },
        { note: 'Link <code>toggle.css</code> after <code>button.css</code>, and this is not a preference: every rung of every ladder, both state values, the ring and the fade are the button\'s own tokens, so a page that loads this file without that one draws a track with no geometry in it at all. Link <code>icon.css</code> as well if any half carries a mark. <code>toggle.js</code> runs last and picks up tracks that arrive later: a shipment card rendered by a template and a rail rebuilt by a panel are both enhanced the moment they land.' }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What it was, and what it is',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>21 August</td><td>The control appears on the checkout as eleven Tailwind utilities and two inline font declarations, one per shipment card</td></tr>\n'
              + '<tr><td>29 August</td><td>The component. Measured at 390 and 1280 and lifted into <code>toggle.css</code> without a pixel changing, by Ton\'s word on the playground bench; the checkout keeps the value through <code>data-gb-toggle="host"</code>. <code>--block</code> arrives for the rail of a showcase</td></tr>\n'
              + '<tr><td>31 August</td><td><code>--fill</code>, so a track as wide as a rail stops being a half empty container</td></tr>\n'
              + '<tr><td>1 September</td><td>The hover stops hiding. Zinc 50 against a white track was five units of grey; the wash becomes the ghost button\'s own and the ink steps to Zinc 900</td></tr>\n'
              + '<tr><td>1 September</td><td>The family: three size rungs, a glyph, the label slot, and one device pixel of optical lift so the caps stop floating. The group\'s fade stops compounding with a half\'s. This page</td></tr>\n'
              + '<tr><td>1 September</td><td>The colour cell. Every colour of the control moves onto a slot on the element and <code>--inverse</code> repoints the set, so the switch can stand on the Studio console\'s Zinc 950; the light paint is the same eight values, now spelled through slots. <code>--spread</code> arrives with it, for a track whose halves are not the same length</td></tr>\n'
              + '<tr><td>2 September</td><td>The ladder takes its final names, and grows at the bottom. Ton settled the button\'s five rungs by principle: xsmall, small, medium, large, xlarge. <code>--s</code> became <code>--medium</code> and <code>--l</code> became <code>--large</code> with no number moving, <code>--m</code> was dissolved with the button rung it borrowed, and <code>--xsmall</code> was built. And the checkout moved down one rung, to <code>--small</code>: the only deliberate change of height in the wave</td></tr>\n'
              + '<tr><td>1 September</td><td>Half a toggle becomes a button. Ton looked at the console\'s Mode switch and said the type was too big beside a button\'s; the instrument found the label identical to the token and the box a third short, and he settled it with a model: same properties as a button, absolutely identical. The half now spends the button\'s height, both pads, glyph gap, label and radius at every rung. It costs the checkout\'s own control ten pixels of height at 1280 and sixteen of width, and the console\'s Mode switch the same ten</td></tr>\n'
                  + '<tr><td>2 September</td><td>The rail took every control of the card. Light | Dark left the stage for a row of its own group, the Preview | Code band under the card went away and its switch became a row too, and the whole rail changed voice: a short axis is the underlined segment of the documentation and a longer one a quiet picker, so nothing on the panel wears the species of the thing it drives. The specimen stands in the middle of the canvas now, on both axes</td></tr>' } }
      ] },

    { eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="button.html">Button</a>, whose ladders, ring and fade this control spends, <a href="icons.html">Icons</a>, where the mark in a half comes from, and <a href="select.html">Select</a>, which is where a set goes when it grows past four.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/toggle.css">toggle.css</a>, <a href="../components/toggle.js">toggle.js</a>, <a href="../components/button.css">button.css</a>, <a href="../components/icon.css">icon.css</a>, <a href="../components/docs.css">docs.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.'
});
</script>

<script src="../type-scale.js"></script>
<script src="../components/icon.js"></script>
<script src="../components/auth.js"></script>
<script src="../components/toggle.js"></script>
<script src="../components/drawer.js"></script>
<script src="../components/inspect.js"></script>
<script src="../components/comments.js"></script>
<script>
/* ============================================================
   gbppl-toggle-family-1 — THE READOUT AND THE PLAYGROUND
   ------------------------------------------------------------
   px, txt, the width readout, the clipboard and the contents come
   from window.GbOro (oro.js). The playground is a SCHEMA handed to
   GbOro.controls: this page says what the toggle has and how one
   is drawn out of a state object, and oro.js draws the rail, picks
   a control per axis by the rule, hides what does not apply and
   folds the markup into the card.

   THE AXES, AND THE CONTROL THE RULE GIVES EACH:
     Size            toggle, canon: a short ordered ladder (four rungs
                     since 02.09, and the words are the button's)
     State           Select, canon: never a toggle
     Icon            switch by nature (a native checkbox until the
                     Switch is measured)
     Icon position   toggle, canon, and only while Icon is on
     Width           Select, OFF CANON: it grew a fourth value with
                     --spread and four is past the count rule
     Choices         toggle, OFF CANON: three one-character values

   THE TWO OFF-CANON AXES SAY SO IN THE CONSOLE ON LOAD, and that
   is the mechanism working rather than a fault: oro.js prints an
   info line for an axis the system has not settled, and the list
   of those lines is the evidence the canon is meant to grow on.
   Neither word could be borrowed. The canon's Value is «what is
   chosen»; Choices is «how many there are to choose from», and
   collapsing the two is exactly the collision the renames of 31.08
   pulled apart. Width has no canonical entry at all yet: the
   button spends it as a boolean, so its own panel never reaches
   this question.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;
  var INSPECT = window.GbInspect || {};

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- reading a track ---------- */
  function readToggle(track) {
    if (!track) return null;
    var cs = getComputedStyle(track);
    var r = track.getBoundingClientRect();
    var list = Array.prototype.slice.call(track.querySelectorAll('.gb-toggle__item'));
    var on = list.filter(function (b) {
      return b.classList.contains('is-on') || b.getAttribute('aria-checked') === 'true';
    })[0] || list[0];
    var off = list.filter(function (b) { return b !== on; })[0];
    var os = on ? getComputedStyle(on) : null;
    var fs = off ? getComputedStyle(off) : null;
    var or = on ? on.getBoundingClientRect() : null;
    var glyph = track.querySelector('.gb-icon');
    var gr = glyph ? glyph.getBoundingClientRect() : null;
    return {
      cs: cs, r: r, on: on, off: off, os: os, fs: fs, or: or, gr: gr, list: list
    };
  }

  function box(r) { return r ? Math.round(r.width * 10) / 10 + ' by ' + Math.round(r.height * 10) / 10 : 'none'; }

  /* ---------- the playground ---------- */
  var SETS = {
    two:   [['Desktop', 'monitor'], ['Mobile', 'phone']],
    three: [['Desktop', 'monitor'], ['Tablet', 'tablet'], ['Mobile', 'phone']],
    four:  [['Wide', 'monitor-wide'], ['Desktop', 'monitor'], ['Tablet', 'tablet'], ['Mobile', 'phone']]
  };
  var STATE_CLASS = { hover: 'is-hover', focus: 'is-focus' };

  var PG_AXES = [
    { id: 'size',    label: 'Size',  group: 'shape', def: 'medium',
      /* Initials, not words: see ORO_AXES.size in oro.js. */
      values: [['xsmall', 'XS'], ['small', 'S'], ['medium', 'M'],
               ['large', 'L']] },
    { id: 'width',   label: 'Width', group: 'shape', def: 'hug',
      values: [['hug', 'Hug'], ['block', 'Block'], ['fill', 'Fill'], ['spread', 'Spread']] },
    { id: 'state',   label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['oneout', 'One value out'], ['allout', 'All out']] },
    /* OFF CANON, and deliberately so. The canon's Value is «what is
       chosen»; this is «how many there are to choose from», which is a
       different question and needs a different word or the two collide
       the way Value and Position did on 31.08. Three one-character
       labels, so nature, count and budget all say toggle. */
    { id: 'choices', label: 'Choices', group: 'content', def: 'three',
      values: [['two', '2'], ['three', '3'], ['four', '4']] },
    { id: 'icon',    label: 'Icon', group: 'content', kind: 'bool',
      on: 'yes', off: 'no', def: 'no' },
    { id: 'iconpos', label: 'Icon position', group: 'content', def: 'before',
      values: [['before', 'Before'], ['after', 'After'], ['both', 'Both']],
      when: function (S) { return S.icon === 'yes'; } }
  ];

  function glyphHTML(name, forCode) {
    if (forCode) return '<span class="gb-icon gb-icon--16" aria-hidden="true"><svg>...</svg></span>';
    var svg = window.GbIcons ? window.GbIcons.svg(name) : '';
    return '<span class="gb-icon gb-icon--16" aria-hidden="true">' + svg + '</span>';
  }

  function pgSample(S, forCode) {
    var set = SETS[S.choices] || SETS.three;
    var cls = ['gb-toggle'];
    if (S.size !== 'medium') cls.push('gb-toggle--' + S.size);
    if (S.width === 'block') cls.push('gb-toggle--block');
    if (S.width === 'fill') cls.push('gb-toggle--fill');
    if (S.width === 'spread') cls.push('gb-toggle--spread');
    /* THE DARK STAGE IS A FAMILY NOW, NOT A BACKDROP
       (gbppl-panel-mode-toggle-1). Until 1 September the ground switch
       stood a white card on a dark plate and the note under the stage
       said so out loud; the console asked for the inverse and the
       component grew one, so the dark ground now shows what a dark
       screen is meant to wear, and the code fold prints the modifier
       along with it. */
    if (S.ground === 'dark') cls.push('gb-toggle--inverse');
    if (S.state === 'allout') cls.push('is-disabled');
    var nl = forCode ? '\n  ' : '';
    var withIcon = S.icon === 'yes';

    var items = set.map(function (v, i) {
      var on = i === 0;
      var last = i === set.length - 1;
      var c = ['gb-toggle__item'];
      if (on) c.push('is-on');
      /* the held state belongs to the half that is NOT chosen */
      if (!forCode && !on && i === 1 && STATE_CLASS[S.state]) c.push(STATE_CLASS[S.state]);
      var off = S.state === 'allout' || (S.state === 'oneout' && last && !on);
      /* A word alone is a text node, the way the checkout writes it;
         a word beside a mark takes the label span. Both are shown
         because both are legal, and the code fold prints whichever
         the axes have asked for. */
      var word = withIcon ? '<span class="gb-toggle__label">' + esc(v[0]) + '</span>' : esc(v[0]);
      var mark = withIcon ? glyphHTML(v[1], forCode) : '';
      var inner = word;
      if (withIcon && S.iconpos === 'before') inner = mark + word;
      else if (withIcon && S.iconpos === 'after') inner = word + mark;
      else if (withIcon && S.iconpos === 'both') inner = mark + word + mark;
      return nl + '<button class="' + c.join(' ') + '" type="button" role="radio"' +
             ' aria-checked="' + (on ? 'true' : 'false') + '"' + (off ? ' disabled' : '') + '>' +
             inner + '</button>';
    }).join('');

    return '<div class="' + cls.join(' ') + '" role="radiogroup" aria-label="Screen"' +
           (S.state === 'allout' ? ' aria-disabled="true"' : '') + '>' +
           items + (forCode ? '\n' : '') + '</div>';
  }

  function pgReadout(S, hold) {
    var m = readToggle(hold.querySelector('.gb-toggle'));
    if (!m) return;
    txt('pgTrack', box(m.r));
    txt('pgItem', box(m.or));
    txt('pgInset', px(m.cs.paddingTop) + ' inset, ' + px(m.cs.columnGap) + ' gap');
    txt('pgPad', m.os ? px(m.os.paddingTop) + ' / ' + px(m.os.paddingRight) +
                        ' / ' + px(m.os.paddingBottom) : 'none');
    txt('pgLabel', m.os ? px(m.os.fontSize) + ' / ' + m.os.fontWeight + ' / ' + m.os.letterSpacing : 'none');
    txt('pgGlyph', m.gr ? box(m.gr) : 'no glyph');
    txt('pgOn', m.os ? m.os.backgroundColor + ' under ' + m.os.color : 'none');
    txt('pgOff', m.fs ? (m.fs.backgroundColor === 'rgba(0, 0, 0, 0)' ? 'transparent' : m.fs.backgroundColor) +
                        ' under ' + m.fs.color : 'none');
  }

  if (window.GbOro && window.GbOro.controls) {
    window.GbOro.controls({
      root: document.querySelector('[data-pg="toggle"]'),
      axes: PG_AXES,
      sample: pgSample,
      after: pgReadout,
      blockClass: 'gbdoc-hold--block',
      block: function (S) { return S.width !== 'hug'; }
    });
  }

  /* gbppl-oro-engine-2 ASKED FOR THE FACE HERE; gbppl-btn-ladder-1 TOOK
     THE PATCH OUT AGAIN, because the repair went to the owner. The four
     playground rows are taken inside `after`, which runs when the sample
     is drawn and not again, and this page can finish drawing its sample
     after document.fonts.ready has already settled: the row then keeps a
     track width costed in the fallback face, 279.6 instead of 292.5 at
     1280, and it stays wrong until the reader resizes. oro.js now asks
     the question once per panel, at the moment the panel is registered,
     so no showcase has to ask it for itself. If a row here is ever a
     width that is no longer on screen, the fault is in controls(). */

  /* ---------- the four size rungs ----------
     gbppl-toggle-type-1: the row now reads the HALF against the real
     button standing beside it in the same slot, because that is the
     claim the section makes and a claim printed from one side of a
     comparison is not measured, it is asserted. */
  function paintSizes() {
    [['xsmall', 'sz-xsmall', 'rowXS', 'bt-xsmall'],
     ['small', 'sz-small', 'rowSM', 'bt-small'],
     ['medium', 'sz-medium', 'rowS', 'bt-medium'],
     ['large', 'sz-large', 'rowL', 'bt-large']].forEach(function (t) {
      var m = readToggle(document.getElementById(t[1]));
      if (!m) return;
      var btn = document.getElementById(t[3]);
      var br = btn ? btn.getBoundingClientRect() : null;
      var bs = btn ? getComputedStyle(btn) : null;
      var same = br && Math.abs(br.height - m.or.height) < 0.5 ? ', the same' : '';
      var cap = document.querySelector('[data-sz="' + t[0] + '"]');
      if (cap) cap.textContent = 'half ' + px(m.or.height) + ' tall' +
        (br ? ', button ' + px(br.height) + same : '') + ', track ' + box(m.r);
      txt(t[2] + 'h', px(m.or.height) + ' and ' + (br ? px(br.height) : '?') + same);
      txt(t[2] + 'pad', px(m.os.paddingLeft) + ' either side' +
                        (bs ? ' (button ' + px(bs.paddingLeft) + ')' : '') + ', ' +
                        px(m.os.paddingTop) + ' over ' + px(m.os.paddingBottom));
      txt(t[2] + 'gap', px(m.os.columnGap) + (bs ? ' and ' + px(bs.columnGap) : ''));
      txt(t[2] + 'label', px(m.os.fontSize) +
                        (btn && btn.querySelector('.gb-btn__label')
                          ? ' and ' + px(getComputedStyle(btn.querySelector('.gb-btn__label')).fontSize)
                          : ''));
      txt(t[2] + 'track', px(m.r.height) + ' tall');
    });
  }

  /* ---------- the glyph shelf ---------- */
  function paintIcons() {
    [['before', 'ic-before'], ['after', 'ic-after'], ['bare', 'ic-bare']].forEach(function (t) {
      var m = readToggle(document.getElementById(t[1]));
      if (!m) return;
      var cap = document.querySelector('[data-ic="' + t[0] + '"]');
      if (!cap) return;
      cap.textContent = box(m.r) + (m.gr ? ', glyph ' + Math.round(m.gr.width) : '') +
        ', gap ' + px(getComputedStyle(m.on).columnGap);
    });
  }

  /* ---------- the width shelf ---------- */
  function paintWidths() {
    [['hug', 'wd-hug'], ['block', 'wd-block'], ['fill', 'wd-fill'], ['spread', 'wd-spread']].forEach(function (t) {
      var m = readToggle(document.getElementById(t[1]));
      if (!m) return;
      var cap = document.querySelector('[data-wd="' + t[0] + '"]');
      if (!cap) return;
      var widths = m.list.map(function (b) { return Math.round(b.getBoundingClientRect().width); });
      cap.textContent = box(m.r) + ', halves ' + widths.join(' / ') +
        ', pad-x ' + px(getComputedStyle(m.list[0]).paddingLeft);
    });
  }

  /* ---------- the states table, measured off the five specimens ---------- */
  var ST_ROWS = [
    ['Rest', 'st-rest', 1, ['--zinc-700'],
     '<span class="gbdoc-flag">Live</span> the checkout'],
    ['Hover', 'st-hover', 1, ['--gb-btn-wash-ink-hover', '--zinc-900'],
     '<span class="gbdoc-flag gbdoc-flag--declared">Declared</span> 01.09, the ghost button’s own wash'],
    ['Focus', 'st-focus', 1, ['--gb-btn-focus-ring'],
     '<span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the button organism’s ring'],
    ['Chosen', 'st-rest', 0, ['--zinc-900', '--white'],
     '<span class="gbdoc-flag">Live</span> the checkout'],
    ['One value out', 'st-oneout', 1, ['--gb-btn-disabled-opacity'],
     '<span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the button’s own fade'],
    ['All out', 'st-allout', 1, ['--gb-btn-disabled-opacity'],
     '<span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the fade on the track, once']
  ];

  function paintStates() {
    var body = document.getElementById('stBody');
    if (!body) return;
    var html = '';
    ST_ROWS.forEach(function (row) {
      var track = document.getElementById(row[1]);
      if (!track) return;
      var item = track.querySelectorAll('.gb-toggle__item')[row[2]];
      if (!item) return;
      var cs = getComputedStyle(item);
      var ts = getComputedStyle(track);
      var ground = cs.backgroundColor === 'rgba(0, 0, 0, 0)' ? 'transparent' : cs.backgroundColor;
      /* the fade is on the track for «all out» and on the half for the
         rest, so the row says which element carries it */
      var extra = row[0] === 'All out' ? ' &middot; track opacity ' + ts.opacity
                : row[0] === 'One value out' ? ' &middot; opacity ' + cs.opacity
                : row[0] === 'Focus' ? ' &middot; ring ' + cs.outlineWidth + ' ' + cs.outlineColor
                : '';
      html += '<tr><td>' + row[0] + '</td><td class="gbdoc-num">' + ground + extra +
              '</td><td class="gbdoc-num">' + cs.color + '</td><td>' +
              row[3].map(function (t) { return '<code>' + t + '</code>'; }).join(' ') +
              '</td><td>' + row[4] + '</td></tr>';
    });
    body.innerHTML = html;
  }

  /* ---------- the anatomy of the checkout's own control ---------- */
  function paintAnatomy() {
    var m = readToggle(document.getElementById('anSpec'));
    if (!m) return;
    txt('anTrack', box(m.r) + ', ground ' + m.cs.backgroundColor);
    txt('anInset', px(m.cs.paddingTop) + ' on all four sides, ' + px(m.cs.columnGap) + ' between halves');
    txt('anLine', px(m.cs.borderTopWidth) + ' ' + m.cs.borderTopColor +
                  ', radius ' + px(m.cs.borderTopLeftRadius));
    txt('anItem', box(m.or) + ', line ' + (parseFloat(m.os.borderTopWidth) ? px(m.os.borderTopWidth) : 'none'));
    txt('anPad', px(m.os.paddingTop) + ' top / ' + px(m.os.paddingBottom) + ' bottom / ' +
                 px(m.os.paddingLeft) + ' side');
    txt('anLabel', px(m.os.fontSize) + ' / ' + m.os.fontWeight + ' / ' + m.os.letterSpacing +
                   ', line ' + px(m.os.lineHeight) + ', ' + m.os.textTransform);
    txt('anOn', m.os.backgroundColor + ' under ' + m.os.color);
    /* A cubic-bezier has commas of its own, so the list of timing
       functions cannot be split on a comma: the first one is matched
       whole instead, or the string is printed as it stands. */
    var ease = (m.os.transitionTimingFunction.match(/^[^,(]+\([^)]*\)|^[^,]+/) || [''])[0].trim();
    txt('anMotion', m.os.transitionDuration.split(',')[0].trim() + ' ' + ease);

    /* The two halves of the optical sentence, so even that paragraph
       carries measured numbers rather than remembered ones. The scan
       that produced them is in the wave's scratchpad; what the page
       can honestly read back is the padding pair it is standing on. */
    txt('anShiftWas', 'the ink 0.94px');
    txt('anShiftNow', 'padding ' + px(m.os.paddingTop) + ' over ' + px(m.os.paddingBottom) +
                      ', and the half still ' + px(m.or.height) + ' tall');

    ORO.widthNow('wnow', 'wnow2');
  }

  function paintAll() {
    paintSizes();
    paintIcons();
    paintWidths();
    paintStates();
    paintAnatomy();
  }

  function start() {
    paintAll();
    /* TRAP 11 OF THE SKILL. A specimen wearing a demo state class at
       load is still inside its own colour transition on the first
       frame, and a colour read there is on no screen. The wait is not
       typed: it is read off the specimens. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      getComputedStyle(el).transitionDuration.split(',').forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  /* The specimens on the shelves are real controls: moving one has to
     move the numbers in the table that describes it. */
  document.addEventListener('gbtg:change', function () { paintAll(); });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>

     these two files give it its doors and its rooms. -->
