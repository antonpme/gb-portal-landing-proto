<!-- ============================================================
     gbppl-oro-drawer-1 — THE DRAWER CARD
     ------------------------------------------------------------
     First of the showcase queue (studio\docs\ORO-COMPONENT-INVENTORY,
     section 6) and first of the composite level, because the drawer
     is the surface the other three composites are shown on: the
     sign in flow, the properties of Inspect and the comment thread
     all arrive inside it, and none of them can be described until
     it is.

     Ton-18, 28 August: «Давай даже на лайве приведём все дроверы к
     общему знаменателю. Сейчас в дровере аккаунта хедер вообще не
     такой, как в новых дроверах.» That rule has lived in a code
     comment since the day it was taken. This page is where it
     becomes readable.

     THE CARD TEMPLATE, the same order as Buttons and Icons, so a
     reader who has learned one finds everything here blindfold
     (ORO-SKILL 7a):
       Overview      what it is, who owns it, where it stands
       Playground    build a drawer and open the real one
       Variants      one line per shape, and where it stands today
       States        closed, arriving, open, leaving, measured
       Sizes         the measures, with provenance on each
       Anatomy       the panel drawn in the page, part by part
       Properties    the API table, and the inspect drawer
       Usage         when a drawer, and when a page
       Accessibility focus, escape, names, the page underneath
       Code          the markup and the call
       Changelog     what changed and what it used to be
       Related       where to go next

     ONE SECTION OF THE THIRTEEN IS ABSENT AND IT IS ON PURPOSE.
     The sixth slot of the template is «With icon» on the button
     card and «The set» on the icon card: the place where a
     component says what it does with a glyph. A drawer has exactly
     one glyph, it belongs to the icon button in its slot, and it is
     documented there. Inventing a section to fill the slot would be
     the padding the template exists to prevent.

     Ton-10: this page is a CONSUMER. Its card, tables, stages,
     shelves, chips and code blocks are the atoms of
     ..\components\docs.css; the panel it draws is
     ..\components\drawer.css itself; the glyphs come out of the
     record in ..\components\icon.js. What is left in the <style>
     block below is the width of the reading column and nothing
     else.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement is read back out of a rendered panel, and the page
     says which panel each time.

     ------------------------------------------------------------
     gbppl-oro-engine-2, 02.09 — THE PAGE BECAME A DECLARATION
     ------------------------------------------------------------
     Тон, 01.09: «шаблон страницы компонента для дизайн-системы.
     Сделай как мини-приложение, чтобы фактически менялась только
     начинка... если мы потом будем его улучшать, он должен
     улучшаться по всей системе сразу.»

     The sixth showcase onto system/oro/oro-page.js, and the last of
     the seven but one. The shell this file used to carry by hand —
     the eleven stylesheets in their one order, the studio bar, the
     rail, the contents aside, the reading column, the card, every
     section head, every table wrapper, every code block, the foot,
     the drawer element, the probe box and the console — is the
     engine's now, and what is left here is what the page was always
     about: the provenance above, the declaration below and its own
     measuring script under that. The address does not move: the law
     of links (ORO-SKILL 0a.5) says drawer.html is drawer.html.

     THE ONE DIVERGENCE A READER CAN SEE, and it is the same one the
     icon card made on the way through (gbppl-oro-engine-1, 526d6db,
     «its two heads become one»). This page carried two heads: an H1
     saying «Drawer» with no status, and a card head inside the card
     saying «Drawer» again with the Stable flag and a line under it.
     Five of the seven showcases put the flag on the H1 and have no
     second head; this one and the icon card were the two that did
     not, and the icon card was told so in the commit that moved it.
     The flag is on the H1 now and the card line is the second lede,
     which is what it always was. Nothing else on the page moved: the
     playground, its four rows of segments, every table, every note,
     every specimen and every measured number came across word for
     word, and every one of them was read back off the rendered page
     at 360, 1280 and 2258 to prove it.

     ------------------------------------------------------------
     gbppl-showcase-tools-1, 02.09 — THE LAST HAND PANEL BECOMES THE
     CANON CARD, WITH TWO DEPARTURES NAMED
     ------------------------------------------------------------
     Тон, 01.09: «панель выбора сверху, а не справа. Из-за этого мне
     тяжело показывать работу людям.» Six showcases moved onto the
     canon playground card that day; this one was left on its four
     rows of segments over a stage on purpose, because a move that
     also redesigns proves nothing about the move. It moves now, and
     it moves first, so that the wave dressing the rail dresses seven
     pages rather than six.

     The four axes are a schema and GbOro.controls reads it: Left
     slot and Title are two short values each, so the rule draws
     them as segment rows; Subtitle and Foot are yes and no, so they
     are switches by nature, whatever the axis is called.

     THE FIRST DEPARTURE: THE STAGE HOLDS A SPECIMEN, NOT THE
     INSTRUMENT. Every other showcase puts the real control on the
     stage. A drawer cannot go there and stay a drawer: it is fixed
     to the edge of the WINDOW, over a backdrop that covers the
     page, it locks the scroll and it takes the focus. What stands
     on the stage is therefore the panel drawn in the flow, the same
     specimen device this page already uses in Anatomy and in
     Properties and already argues for in its own words: it stands
     still, so it has no arrival to play and no window edge to be
     fixed to. The instrument itself is one press away, and the
     button that presses it stands in the foot of the rail beside
     Reset, because an action is not an axis and the foot is where
     the rail keeps what is not an axis.

     THE SECOND: NO GROUND ROW, ground: false. Light or Dark dresses
     the stage a control stands on, and it is a real question
     wherever a control can stand on either. A drawer brings its own
     ground: the panel is white and the darkness behind it is the
     backdrop, which the component draws itself and which is in
     every measurement on this page. A Light | Dark row here would
     be furniture over a question the component does not have.
     ============================================================ -->

                  + '<tr><td>Body</td><td><code>.gbd-body</code></td><td>Everything the caller sent, and the only part that scrolls</td><td class="gbdoc-num" data-m="bodyPad"></td></tr>\n'
                  + '<tr><td>Body, first line</td><td><code>.gbd-sub</code></td><td>The subtitle, when there is one. It opens the body because it is a sentence about the content</td><td data-m="subFS"></td></tr>\n'
                  + '<tr><td>Foot</td><td><code>.gbd-foot</code></td><td>Optional. It does not scroll, and it disappears entirely when it is empty</td><td class="gbdoc-num" data-m="footPad"></td></tr>' } }
      ] },

    { id: 'properties', toc: 'Properties', eyebrow: 'Properties',
      h2: 'The API, and the drawer that reads a head',
      blocks: [
        { p: 'Two layers, the way the mature systems keep them. The table is the whole surface of the component, readable and linkable in one piece. The drawer answers a different question, about one specimen: the Properties button in the corner of either head below opens it with the height, the slot, the title and the hairline measured off that head, with the token that produced each value beside it.' },
        { html: '<div class="gbdoc-frame">\n'
                  + '          <div class="gbdoc-stage" data-inspect="drawer">\n'
                  + '            <div class="gbdoc-band">\n'
                  + '              <span class="gbdoc-band__cap">The head with one control</span>\n'
                  + '              <div class="gbdoc-slot gbdoc-slot--wide">\n'
                  + '                <div class="gbd-panel gbdoc-panel" id="headPlain"></div>\n'
                  + '                <span class="gbdoc-slot__cap"><b>Default</b><span id="headPlainCap">measuring</span></span>\n'
                  + '              </div>\n'
                  + '            </div>\n'
                  + '            <div class="gbdoc-band">\n'
                  + '              <span class="gbdoc-band__cap">The head with a step behind it</span>\n'
                  + '              <div class="gbdoc-slot gbdoc-slot--wide">\n'
                  + '                <div class="gbd-panel gbdoc-panel" id="headBack"></div>\n'
                  + '                <span class="gbdoc-slot__cap"><b>With a step back</b><span id="headBackCap">measuring</span></span>\n'
                  + '              </div>\n'
                  + '            </div>\n'
                  + '          </div>\n'
                  + '          <p class="gbdoc-foot">The arrow does not join the cross, it replaces it. Two glyphs eight pixels apart are a menu, not a way out, so the cross crosses the head instead.</p>\n'
                  + '        </div>' },
        { table: {
            head: ['Name', 'Kind', 'Type', 'Default', 'What it does'],
            rows: '<tr><td><code>open({ ... })</code></td><td>Method</td><td>object</td><td>required</td><td>Fills the panel and brings it in. Called again while it is open, it swaps the content and plays nothing</td></tr>\n'
                  + '<tr><td><code>title</code></td><td>Option</td><td>string</td><td>empty</td><td>The head. Plain text, serif, left aligned, and it may wrap. An empty title takes the whole line away</td></tr>\n'
                  + '<tr><td><code>sub</code></td><td>Option</td><td>string, html allowed</td><td>none</td><td>One sentence about the content. It is written as the first line of the BODY, not into the head</td></tr>\n'
                  + '<tr><td><code>html</code></td><td>Option</td><td>string</td><td>empty</td><td>The body. Anything the page can render, including a whole component</td></tr>\n'
                  + '<tr><td><code>foot</code></td><td>Option</td><td>string, html allowed</td><td>none</td><td>The strip under the body. An empty foot takes itself away</td></tr>\n'
                  + '<tr><td><code>back</code></td><td>Option</td><td>function</td><td>none</td><td>Grows the step back. The arrow takes the left slot, the cross moves to the right edge, and this function runs when the arrow is pressed</td></tr>\n'
                  + '<tr><td><code>setBack(fn)</code></td><td>Method</td><td>function or null</td><td>required</td><td>Grows or drops the step back while the panel is already on screen. Null takes the arrow away again</td></tr>\n'
                  + '<tr><td><code>setTitle(text)</code></td><td>Method</td><td>string</td><td>required</td><td>Rewrites the head without touching the body, for a flow that renames its step</td></tr>\n'
                  + '<tr><td><code>close()</code></td><td>Method</td><td>no arguments</td><td>required</td><td>Sends the panel out and gives the page back. A host rarely needs it: Escape, the backdrop and the cross all call it</td></tr>\n'
                  + '<tr><td><code>gbd:open</code></td><td>Event</td><td>bubbles</td><td>none</td><td>Fired when the panel starts arriving, so a host can follow the drawer without owning it</td></tr>\n'
                  + '<tr><td><code>gbd:close</code></td><td>Event</td><td>bubbles</td><td>none</td><td>Fired when it starts leaving. The site header waits out the 350 on this one before it changes the bar</td></tr>\n'
                  + '<tr><td>Attributes</td><td>None</td><td>none</td><td>none</td><td>The element takes no attributes at all. Everything it shows arrives through the call, because the content of a drawer is a decision taken at the moment it opens and never in markup</td></tr>' } }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'When a drawer, and when a page',
      blocks: [
        { p: 'One question decides it before any other: does the reader have to come back to what is underneath? A drawer keeps the context on screen and dimmed behind the panel, and it costs the reader nothing to leave. A page replaces the context, and it is the right answer whenever the work is long enough that being sent back would feel like losing it.' },
        { table: {
            head: ['Reach for', 'When', 'Not when'],
            rows: '<tr><td>A drawer</td><td>A side task that belongs to something on the page: editing one row, reading the properties of one element, signing in without losing the basket</td><td>The main work of a screen. A drawer that is the point of the page is a page in a costume, 520 wide for no reason</td></tr>\n'
                  + '<tr><td>A page</td><td>Work with steps, work worth a URL, work a reader may want to leave and come back to</td><td>A confirmation, a detail, a note: sending someone away and back for one field is the more expensive answer</td></tr>\n'
                  + '<tr><td>One title</td><td>The head says what the drawer is, once. The body starts with the content</td><td>Repeating the title as a heading inside the body. Two names for one surface, eighty pixels apart, is a mistake the reader has to work out</td></tr>\n'
                  + '<tr><td>Actions in the body</td><td>Next to the thing they act on: a Clear all at the top of the list it clears, a Save in the foot beside the form it saves</td><td>In the head. The head has one control and it is the way out, and that is the whole of the 28 August rule</td></tr>\n'
                  + '<tr><td>The step back</td><td>A flow that genuinely has a step behind it, and only while it does. The flow hands the drawer its own way back</td><td>As a second close. Escape and the cross already do that, and an arrow that closes is a lie about where the reader is</td></tr>\n'
                  + '<tr><td>A subtitle</td><td>One sentence that names what the content is about: whose gift, which element, which shipment</td><td>As an instruction. A sentence the reader has to act on belongs in the body next to the control it is about</td></tr>\n'
                  + '<tr><td>A foot</td><td>Something that must stay visible while the body scrolls: the buttons that finish, or the provenance of what is above</td><td>For text nobody has to see. An empty foot is better than a full one, and an empty one removes itself</td></tr>' } },
        { note: 'Escape always closes, even when there is a step behind. Escape is the way out of a surface, not a way back through it; the arrow is the way back, and it is a button rather than a gesture because a person has to be able to see that the step exists. And one drawer per page: two panels on top of each other is a stack nobody can leave in one press, which is exactly what the element prevents by swapping its content instead.' }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'Focus, escape and the page underneath',
      blocks: [
        { table: {
            rows: '<tr><td>Role</td><td>The panel is <code>role="dialog"</code> with <code>aria-modal="true"</code>, and its <code>aria-label</code> is written from the title and the subtitle at the moment it opens, so a reader who cannot see the head is told the same thing it says</td></tr>\n'
                  + '<tr><td>Focus in</td><td>The panel itself takes focus when it arrives. It is <code>tabindex="-1"</code>, so it is reachable by script and not by the tab key, and the first tab from there lands on the first control inside the drawer rather than somewhere on the page behind</td></tr>\n'
                  + '<tr><td>Focus out</td><td>On close, focus returns to the element that opened it. A reader who pressed a pin, a face or a row goes back to that pin, face or row, not to the top of the document</td></tr>\n'
                  + '<tr><td>Escape</td><td>Closes, from any step, with a step behind it or without. It is bound while the drawer is open and unbound when it leaves, so it never eats an Escape the page wanted</td></tr>\n'
                  + '<tr><td>The backdrop</td><td>A click anywhere on the dimmed page closes the drawer. It is the largest target on the screen and it means the same thing as the cross</td></tr>\n'
                  + '<tr><td>The slot names</td><td>The cross is named Close and the arrow is named Back, always. They are glyphs with no label, so without a name a screen reader announces a button and nothing else</td></tr>\n'
                  + '<tr><td>The page underneath</td><td>Stops scrolling while the panel is open, and gets its scrolling back on close. Without that, a wheel over the backdrop moves the page the reader is not looking at</td></tr>\n'
                  + '<tr><td>The target</td><td>The slot is the 44 circle of the button organism, which is exactly the WCAG 2.2 minimum, and it keeps the organism\'s focus ring</td></tr>' } },
        { note: 'One honest gap. Focus is moved in and moved back, and the page behind is frozen, but focus is not TRAPPED: a determined tab key can still walk out of the panel and into the page underneath. For a modal dialog that is a real shortcoming rather than a taste, and closing it is a change to the organism, so it is written down here rather than fixed quietly in a showcase wave.' }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'One element, and the call that opens it',
      blocks: [
        { p: 'One element in the markup, and everything else in the call. The element can be written anywhere on the page: the panel and the backdrop move themselves onto the body when it is built, so a transformed ancestor cannot become their containing block and slide the drawer inside a card.' },
        { code: { id: 'codeBasics',
            text: '&lt;!-- once per page, anywhere in the body --&gt;\n'
                  + '&lt;gb-drawer id="panel"&gt;&lt;/gb-drawer&gt;\n'
                  + '\n'
                  + '&lt;link rel="stylesheet" href="system/components/drawer.css"&gt;\n'
                  + '&lt;script src="system/components/drawer.js"&gt;&lt;/script&gt;' } },
        { code: { id: 'codeCall',
            text: 'var panel = document.getElementById(\'panel\');\n'
                  + '\n'
                  + '// the plain case\n'
                  + 'panel.open({\n'
                  + '  title: \'Shipping address\',\n'
                  + '  sub:   \'For Alice Nakamura\',\n'
                  + '  html:  \'&lt;div class="gba-form"&gt;...&lt;/div&gt;\',\n'
                  + '  foot:  \'&lt;button class="gb-btn gb-btn--medium"&gt;...&lt;/button&gt;\'\n'
                  + '});\n'
                  + '\n'
                  + '// a flow with a step behind it: the arrow takes the left slot\n'
                  + '// and the cross moves to the right edge\n'
                  + 'panel.open({\n'
                  + '  title: \'Enter the code\',\n'
                  + '  back:  function () { flow.back(); },\n'
                  + '  html:  flow.stepHTML()\n'
                  + '});\n'
                  + '\n'
                  + '// or grown while the panel is already on screen\n'
                  + 'panel.setBack(function () { flow.back(); });\n'
                  + 'panel.setBack(null);\n'
                  + 'panel.setTitle(\'Enter the code\');\n'
                  + 'panel.close();\n'
                  + '\n'
                  + '// following it without owning it\n'
                  + 'panel.addEventListener(\'gbd:open\',  function () { ... });\n'
                  + 'panel.addEventListener(\'gbd:close\', function () { ... });' } },
        { note: 'Two things a caller does not have to write. There is no close button to add: the head builds its own slots and wires them. And there is no scroll lock, no focus save and no key listener to remember, because a drawer that leaves any of those to its callers has fourteen chances to get one of them wrong.' }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What changed, and what it used to be',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>26 August, <code>gbppl-drawer-1</code></td><td>The organism was born. There was no drawer in the system: the catalogue had one inside a bundle we do not own, and the checkout had four written into the page in utilities, one per drawer, with no element to call. The geometry and the choreography of the checkout drawer were promoted into the system rather than redesigned, and the first consumer was the properties panel of Inspect</td></tr>\n'
                  + '<tr><td>28 August, <code>gbppl-drawer-unify-1</code></td><td>One head for every drawer in the house. The eyebrow left the head, the subtitle moved down into the body, the actions left for the body, the cross became the round icon button and moved to the left, the title moved to the left beside it, and the step back arrived as a slot that replaces the cross rather than joining it. The four hand drawn drawers of the checkout were converted to the element in the same wave, and the sign in drawer in the site header became the whole of <code>&lt;gb-auth-flow&gt;</code> on this surface</td></tr>\n'
                  + '<tr><td>28 August, this wave</td><td>The card. Nothing in the organism moved: the rule that every drawer wears one head has lived in a code comment since the day it was taken, and this page is the first place a reader can find it. Inspect gained one kind, Drawer head, and the documentation atoms gained one class, so a fixed panel can stand still in a page and be pointed at</td></tr>\n'
                  + '<tr><td>2 September</td><td>The playground became the canon card, last of the seven: the four rows of segments over the stage became a rail at the right, the head on the stage is a specimen drawn in the flow, and the real drawer is one press away at the foot of the rail. The same wave dressed every rail in the showcase: segments and pickers instead of toggle buttons, and the ground and the view as rows of the rail rather than furniture of their own</td></tr>' } }
      ] },

    { eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="icons.html#iconbutton">Icon button</a>, which is the circle in the slot and owns everything about it, and <a href="button.html">Button</a>, whose organism that circle is a shape of. <a href="field.html">Field</a> is what a drawer with a form in it is made of. The three composites that are only ever seen inside this panel have their cards in the <a href="components.html#composite">composite level of the catalogue</a>: the sign in flow, the properties of Inspect and the comment thread.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/drawer.css">drawer.css</a>, <a href="../components/drawer.js">drawer.js</a>, <a href="../components/button.css">button.css</a>, <a href="../components/icon.js">icon.js</a>, <a href="../components/docs.css">docs.css</a> and the motion and space blocks of <a href="../assets/tokens.css">tokens.css</a> · every panel on this page, including the one that opens over it, is rendered by those files.',
  probesId: 'probes'
});
</script>

<script src="../type-scale.js"></script>
<script src="../components/icon.js"></script>
<script src="../components/auth.js"></script>
<script src="../components/toggle.js"></script>
<script src="../components/drawer.js"></script>
<script src="../components/inspect.js"></script>
<script src="../components/comments.js"></script>
<script>
/* ============================================================
   gbppl-oro-drawer-1 / gbppl-oro-cleanup-1 — THE READOUT AND THE
   PLAYGROUND
   ------------------------------------------------------------
   gbppl-oro-cleanup-1 (28.08) took px, txt, the clipboard, the
   contents reader and the width readout out to window.GbOro in
   oro.js. One thing did change here and it was a fix: this page's
   own copy said Copied even when the clipboard refused the text.
   ------------------------------------------------------------
   Same one rule as the button and icon cards: NOTHING ON THIS
   PAGE PRINTS A NUMBER THAT WAS TYPED. Every measurement is read
   back out of a rendered panel with getComputedStyle, so if a
   token moves the page moves with it, and if the organism breaks
   it breaks here first.

   TWO PANELS ARE READ, AND THE PAGE SAYS WHICH. The probe below
   is the organism's own markup, fixed to the window exactly as
   the real panel is, so it measures the same at every width and
   it is there before anybody has pressed anything. The moment the
   reader opens the real drawer the same reading runs on that, and
   the caption says so. If the two ever disagree, the caption says
   that too, because a probe that has drifted from the thing it
   stands for is worse than no probe.
   ============================================================ */
(function () {
  'use strict';

  var ICONS = window.GbIcons;

  /* gbppl-oro-cleanup-1: px, txt, the clipboard, the contents and
     the width readout are the showcase template and live in oro.js
     as window.GbOro. ms stays: only this page prints a duration. */
  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;
  function ms(v) {
    var n = parseFloat(v);
    if (isNaN(n)) return v;
    return Math.round(n * 1000) + 'ms';
  }
  function glyph(name) { return ICONS && ICONS.has(name) ? ICONS.svg(name) : ''; }

  /* ---------- the head, written the way drawer.js writes it ----------
     Same classes, same order of slots, same glyphs out of the record.
     A specimen of a head that was drawn by hand in a different shape
     would be a picture of the component, not the component. */
  function slotHTML(kind, hidden) {
    return '<button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary gbd-slot" type="button"' +
      (hidden ? ' hidden' : '') + ' tabindex="-1" aria-label="' + (kind === 'back' ? 'Back' : 'Close') + '">' +
      '<span class="gb-btn__icon" aria-hidden="true">' +
      glyph(kind === 'back' ? 'chevron-left' : 'close') + '</span></button>';
  }
  function headHTML(title, back) {
    return '<div class="gbd-head">' +
      slotHTML('back', !back) +
      slotHTML('close', back) +
      '<h2 class="gbd-title">' + title + '</h2>' +
      slotHTML('close', !back) +
      '</div>';
  }

  /* ---------- the probe ---------- */
  var probes = document.getElementById('probes');
  if (probes) {
    probes.innerHTML =
      '<div class="gbd-scrim" id="prScrim"></div>' +
      '<div class="gbd-panel" id="prPanel">' +
        headHTML('Shipping address', false) +
        '<div class="gbd-body"><p class="gbd-sub">For this recipient</p><p>Body</p></div>' +
        '<div class="gbd-foot">Foot</div>' +
      '</div>';
  }

  /* ---------- one reading, used on both panels ---------- */
  function read(panel, scrim) {
    if (!panel) return null;
    var head = panel.querySelector('.gbd-head');
    var title = panel.querySelector('.gbd-title');
    var body = panel.querySelector('.gbd-body');
    var sub = panel.querySelector('.gbd-sub');
    var foot = panel.querySelector('.gbd-foot');
    var slot = panel.querySelector('.gbd-slot:not([hidden])');
    var slotIcon = slot ? slot.querySelector('.gb-btn__icon') : null;
    var cs = getComputedStyle(panel);
    var hs = head ? getComputedStyle(head) : null;
    var ts = title ? getComputedStyle(title) : null;

    /* The two clocks are read by wearing the organism's own classes
       for the length of one measurement and taking them off again.
       Nothing is copied out of the stylesheet and nothing is left
       behind on the element. The panel transitions ONE property, so
       the computed strings are single values and must not be split
       on the comma: a cubic-bezier has three of its own. */
    var had = panel.classList.contains('is-out');
    panel.classList.remove('is-out');
    var inDur = getComputedStyle(panel).transitionDuration.trim();
    var inFn = getComputedStyle(panel).transitionTimingFunction.trim();
    panel.classList.add('is-out');
    var outDur = getComputedStyle(panel).transitionDuration.trim();
    var outFn = getComputedStyle(panel).transitionTimingFunction.trim();
    if (!had) panel.classList.remove('is-out');

    var scrimDur = 'no backdrop', scrimBg = 'no backdrop';
    if (scrim) {
      var ss = getComputedStyle(scrim);
      scrimBg = ss.backgroundColor;
      scrimDur = ss.transitionDuration.trim();
    }

    return {
      panelW: px(cs.width),
      shadow: cs.boxShadow,
      layers: (scrim ? getComputedStyle(scrim).zIndex + ' backdrop, ' : '') + cs.zIndex + ' panel',
      headH: head ? px(head.getBoundingClientRect().height) : 'no head',
      headPadY: hs ? px(hs.paddingTop) : 'no head',
      gutter: hs ? px(hs.paddingLeft) : 'no head',
      gap: hs ? px(hs.columnGap) : 'no head',
      hair: hs ? px(hs.borderBottomWidth) + ' ' + hs.borderBottomColor : 'no head',
      slotW: slot ? px(getComputedStyle(slot).width) : 'no slot',
      slotGlyph: slotIcon ? px(getComputedStyle(slotIcon).width) : 'no glyph',
      titleFS: ts ? px(ts.fontSize) : 'no title',
      titleLH: ts ? px(ts.lineHeight) : 'no title',
      bodyFS: body ? px(getComputedStyle(body).fontSize) : 'no body',
      bodyPad: body ? px(getComputedStyle(body).paddingTop) : 'no body',
      /* Null, not «none»: whether a panel carries a subtitle or a
         foot is the caller's decision and not a measurement, so a
         panel without one leaves the row alone rather than wiping
         the reading that is in it. */
      subFS: sub ? px(getComputedStyle(sub).fontSize) + ' ' + getComputedStyle(sub).color : null,
      footPad: foot && foot.innerHTML ? getComputedStyle(foot).padding : null,
      scrimBg: scrimBg,
      rightEdge: hs ? px(hs.paddingRight) + ' in from the panel edge' : 'no head',
      inDur: ms(inDur), inFn: inFn, outDur: ms(outDur), outFn: outFn, scrimDur: ms(scrimDur)
    };
  }

  /* ---------- painting the measured cells ---------- */
  var cells = document.querySelectorAll('[data-m]');
  var LAST = null;
  var PROBE = null;

  /* The promise the comment at the top of this block makes, kept:
     a probe that has drifted from the panel it stands for is worse
     than no probe, so every live reading is put beside the probe's
     and any row that differs is named. */
  var ROW_NAME = {
    panelW: 'panel width', headH: 'head', slotW: 'slot circle', slotGlyph: 'slot glyph',
    headPadY: 'head padding', gutter: 'gutter', gap: 'slot to title', titleFS: 'title size',
    titleLH: 'title line height', bodyFS: 'body text', subFS: 'subtitle', footPad: 'foot',
    scrimBg: 'backdrop', shadow: 'shadow', layers: 'layer', hair: 'hairline',
    bodyPad: 'body gutter', rightEdge: 'right edge', inDur: 'arrival', outDur: 'departure'
  };
  function diffWithProbe(live) {
    if (!PROBE) return '';
    var out = [];
    Object.keys(ROW_NAME).forEach(function (k) {
      if (PROBE[k] == null || live[k] == null) return;   /* not measured on both */
      if (PROBE[k] !== live[k]) out.push(ROW_NAME[k] + ', ' + PROBE[k] + ' on the probe against ' + live[k] + ' here');
    });
    return out.length
      ? ' It differs from the probe on ' + out.join('; ') + '.'
      : ' Every row matched the probe.';
  }

  function paint(data, source) {
    if (!data) return;
    LAST = data;
    Array.prototype.forEach.call(cells, function (cell) {
      var k = cell.getAttribute('data-m');
      if (data[k] == null) return;   /* not measured here: keep what is in the cell */
      cell.textContent = data[k];
    });
    txt('pgPanel', data.panelW);
    txt('pgHead', data.headH);
    txt('pgSlot', data.slotW + ' circle, ' + data.slotGlyph + ' glyph');
    txt('pgTitle', data.titleFS + ' over ' + data.titleLH);
    txt('pgIn', data.inDur + ' ' + data.inFn);
    txt('pgOut', data.outDur + ' ' + data.outFn);
    txt('szWhen', source);
    txt('wpanel', data.panelW);
    paintStates(data);
  }

  function paintStates(d) {
    var body = document.getElementById('stBody');
    if (!body) return;
    /* Four columns, not six. A state of this component is a
       sentence about two things moving together, and splitting the
       panel from the backdrop and the duration from the curve turned
       every cell into a ribbon eight words wide. And the clock is
       NOT a `gbdoc-num` cell: that class holds a measurement on one
       line and will not wrap, which is right for 44px and wrong for
       a duration and a curve in the same breath. */
    var rows = [
      ['Closed',
       'The panel and the backdrop are both out of the document, and the page scrolls.',
       'Nothing is playing', '', []],
      ['Arriving',
       'The panel is dense from the first pixel and travels its own width in from the right edge. The backdrop dims under it and finishes first, so the light goes down before the panel lands.',
       d.inDur + ' the panel, ' + d.scrimDur + ' the backdrop', d.inFn,
       ['--mo-drawer-in', '--mo-small', '--mo-enter']],
      ['Open',
       'The panel stands at the edge and the backdrop is fully dim. The page underneath stops scrolling, focus is inside the panel, and a click on the backdrop closes.',
       'Nothing is playing', '', []],
      ['Leaving',
       'Both go together and it is quicker than the way in: the panel accelerates out and is hidden again once it has gone.',
       d.outDur + ' for both', d.outFn,
       ['--mo-medium-out', '--mo-exit']]
    ];
    body.innerHTML = rows.map(function (r) {
      return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td>' +
        '<td>' + r[2] + (r[3] ? '<br><code>' + r[3] + '</code>' : '') + '</td><td>' +
        (r[4].length
          ? r[4].map(function (t) { return '<code>' + t + '</code>'; }).join(' ')
          : '<span class="gbdoc-flag gbdoc-flag--none">Nothing to name</span>') +
        '</td></tr>';
    }).join('');
  }

  /* ---------- the specimens that stand in the page ---------- */
  function paintSpecimens() {
    var anatomy = document.getElementById('anatomyPanel');
    if (anatomy) {
      anatomy.innerHTML = headHTML('Gift personalization', false) +
        '<div class="gbd-body"><p class="gbd-sub">For this recipient</p>' +
        '<p>The body is everything the caller sent, and the only part of the panel that scrolls.</p></div>' +
        '<div class="gbd-foot">The foot stays put while the body moves.</div>';
    }
    var plain = document.getElementById('headPlain');
    if (plain) plain.innerHTML = headHTML('Filters', false);
    var back = document.getElementById('headBack');
    if (back) back.innerHTML = headHTML('Sign in or create an account', true);

    [['anatomyPanel', 'anatomyCap'], ['headPlain', 'headPlainCap'], ['headBack', 'headBackCap']]
      .forEach(function (pair) {
        var p = document.getElementById(pair[0]);
        var cap = document.getElementById(pair[1]);
        if (!p || !cap) return;
        var h = p.querySelector('.gbd-head');
        /* Short on purpose: the hover hint of an inspect region sits
           in the bottom right corner of the slot, and a caption that
           runs the width of a 390 panel meets it there. */
        cap.textContent = px(getComputedStyle(p).width) + ' wide, ' +
          px(h.getBoundingClientRect().height) + ' head';
      });
  }

  /* ---------- the playground ----------
     gbppl-showcase-tools-1. The four rows of segments over the stage
     are gone: this block hands GbOro.controls a SCHEMA and gets the
     rail on the right, the rule that picks one control per axis, the
     Reset and the Preview | Code row, exactly as every other showcase
     does.

     WHAT THE RULE GAVE EACH AXIS. Left slot and Title are segment
     rows: two short values each, neither in the canon, so count and
     budget decide and both fit the rail. Subtitle and Foot are
     switches, by nature: yes and no is a switch whatever the axis is
     called, and these two really are yes and no, because what varies
     about a drawer is which optional parts the CALL carries.

     THE STATE LIVES IN THE RENDERER NOW, and the two things outside
     the card that need it - the button at the foot of the rail and
     the step back it plays - read the last painted state out of LIVE. */
  var LIVE = { slot: 'cross', title: 'short', sub: 'on', foot: 'off' };
  var TITLES = { short: 'Filters', long: 'Sign in or create an account' };
  var SUB = 'One sentence about the content, written as the first line of the body.';
  var BODY = '<p>The body is whatever the caller sent. It is the only part that scrolls, ' +
    'and the gutter around it is the same one the head stands on.</p>' +
    '<p>Press Escape, click the dimmed page, or use the slot in the head. All three do the same thing.</p>';
  var FOOT = 'The foot does not scroll with the body.';

  var pgFoot = document.getElementById('pgFoot');
  var drawer = document.getElementById('propsDrawer');

  var PG_AXES = [
    { id: 'slot', label: 'Left slot', group: 'shape', def: 'cross',
      values: [['cross', 'Cross'], ['back', 'Step back']] },
    { id: 'title', label: 'Title', group: 'content', def: 'short',
      values: [['short', 'Short'], ['long', 'Long']] },
    { id: 'sub', label: 'Subtitle', group: 'content', kind: 'bool',
      on: 'on', off: 'off', def: 'on' },
    { id: 'foot', label: 'Foot', group: 'content', kind: 'bool',
      on: 'on', off: 'off', def: 'off' }
  ];

  function callObject(S) {
    var o = [];
    o.push("  title: '" + TITLES[S.title] + "'");
    if (S.slot === 'back') o.push('  back:  function () { flow.back(); }');
    if (S.sub === 'on') o.push("  sub:   'One sentence about the content'");
    o.push("  html:  '<p>...</p>'");
    if (S.foot === 'on') o.push("  foot:  'The foot does not scroll with the body.'");
    return "panel.open({\n" + o.join(',\n') + "\n});";
  }

  /* THE SPECIMEN, AND WHY IT IS DRAWN AND NOT OPENED. Same classes,
     same order of slots, same glyphs out of the record as drawer.js
     writes; .gbdoc-panel is the one line of documentation CSS that
     takes the panel out of the corner of the window and puts it in the
     flow, and it is the same device Anatomy and Properties use below. */
  function pgSample(S, forCode) {
    if (forCode) return callObject(S);
    return '<div class="gbd-panel gbdoc-panel">' +
      headHTML(TITLES[S.title], S.slot === 'back') +
      '<div class="gbd-body">' +
      (S.sub === 'on' ? '<p class="gbd-sub">' + SUB + '</p>' : '') + BODY + '</div>' +
      (S.foot === 'on' ? '<div class="gbd-foot">' + FOOT + '</div>' : '') +
      '</div>';
  }

  function pgAfter(S) {
    LIVE = S;
    if (pgFoot) {
      pgFoot.innerHTML = S.slot === 'back'
        ? 'The arrow is on the left and the cross has moved to the right edge. Press the arrow and the drawer walks back a step: same panel, new content, and the cross returns to the left.'
        : 'One control in the head, and it is the way out. Escape, the backdrop and the cross all close it.';
    }
  }

  /* The step behind, played for real: the arrow swaps the content
     and drops itself, which is what a flow does when it reaches its
     first step again. */
  function firstStep() {
    drawer.open({
      title: 'The step before this one',
      sub: LIVE.sub === 'on' ? 'The arrow took the drawer back, and gave the left slot to the cross.' : '',
      html: BODY,
      foot: LIVE.foot === 'on' ? FOOT : ''
    });
    measureLive();
  }

  function openIt() {
    drawer.open({
      title: TITLES[LIVE.title],
      sub: LIVE.sub === 'on' ? SUB : '',
      html: BODY,
      foot: LIVE.foot === 'on' ? FOOT : '',
      back: LIVE.slot === 'back' ? firstStep : null
    });
    measureLive();
  }

  /* Trap 11 of the skill: a panel measured in the middle of its
     arrival reports a geometry that is on no screen. The reading
     waits for the arrival to finish, and the panel says when that
     is rather than a timer guessing. */
  function measureLive() {
    var panel = document.querySelector('body > .gbd-panel');
    var scrim = document.querySelector('body > .gbd-scrim');
    if (!panel) return;
    var spent = false;
    var done = function () {
      if (spent) return;
      spent = true;
      panel.removeEventListener('transitionend', done);
      var live = read(panel, scrim);
      paint(live, 'Read off the drawer you opened, at ' + window.innerWidth + 'px wide.' + diffWithProbe(live));
    };
    panel.addEventListener('transitionend', done);
    /* A panel that was ALREADY on screen swaps its content without
       moving, so there is no transition to wait for and no event to
       hear. The arrival is measured, not typed, so the fallback is
       the panel's own clock read a line earlier, plus a frame. */
    var wait = parseFloat(getComputedStyle(panel).transitionDuration) * 1000 + 60;
    setTimeout(done, isNaN(wait) ? 900 : wait);
  }

  if (window.GbOro && window.GbOro.controls) {
    window.GbOro.controls({
      root: document.querySelector('[data-pg="drawer"]'),
      axes: PG_AXES,
      sample: pgSample,
      after: pgAfter,
      /* The one control of this card that is not an axis: it does not
         build the specimen, it opens the instrument. So it stands at
         the foot of the rail beside Reset, and it is a real button,
         because an action is a button and only an axis is furniture. */
      action: '<button class="gb-btn gb-btn--medium gb-btn--outline gb-btn--secondary" type="button" id="pgOpen">'
              + '<span class="gb-btn__label">Open the drawer</span></button>',
      /* A drawer brings its own ground: the panel is white and the
         darkness behind it is the backdrop, which the component draws
         itself and which is in every measurement on this page. */
      ground: false
    });
  }
  /* The click is bound on the document because the foot of the rail is
     the renderer's markup and is rewritten whenever the rail replans. */
  document.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#pgOpen')) openIt();
  });

  /* gbppl-oro-engine-2. The Copy buttons of the code blocks are wired
     by GbOro.page, and the contents beside the document are read off it
     by oro.js: both are the template, and this page no longer asks for
     either. */

  function paintAll() {
    paintSpecimens();
    PROBE = read(document.getElementById('prPanel'), document.getElementById('prScrim'));
    paint(PROBE, 'Read off the probe, at ' + window.innerWidth + 'px wide.');
    ORO.widthNow('wnow', 'wnow2');
  }

  paintAll();

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>

<!-- The console. Its element is written by GbOro.page, with the drawer
     and the probes; these two files give it its doors and its rooms. -->
<script src="../../system/sandbox-registry.js"></script>
<script src="../../system/components/studio-panel.js"></script>

</body>
