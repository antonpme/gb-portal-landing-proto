<!-- ============================================================
     gbppl-radio-1 — THE RADIO BUTTON PAGE
     ------------------------------------------------------------
     Ton, 03.09: «В Фигме есть просто радио. Сначала перенести Radio
     Button Component в систему, потом сделать вторую версию — Radio
     Select.»

     THE NAME OF THIS PAGE IS THE CLIENT'S. Ton says «Radio select»
     and PrimeVue — the stack the client actually builds on — says
     RadioButton, so the page is Radio button and Radio select is a
     SECTION of it. Both words are printed in the Overview, because
     a reader who arrives with either one has to land somewhere.
     Same rule that named Input number after PrimeVue rather than
     after our own Stepper.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves,
     chips and code blocks are the atoms of ..\components\docs.css;
     its specimens are the component itself.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement in every table is read back off a rendered
     specimen with getComputedStyle. Where a number is quoted from
     the design file rather than measured here, it stands in a
     provenance column and says Figma.
     ============================================================ -->

                  + '<tr><td><code>--cards</code></td><td>the group</td><td>The same group as a grid: <code>auto-fit</code>, a 220 floor, 12 between</td></tr>\n'
                  + '<tr><td><code>is-disabled</code></td><td>the group</td><td>The whole set off. Put a real <code>disabled</code> on every input beside it, and the fades will not multiply</td></tr>\n'
                  + '<tr><td><code>name</code></td><td>every input of a group</td><td>What makes a group a group. Not ours, and not optional: without it the browser lets two of them be chosen at once</td></tr>' } },
        { note: 'The Properties button in the corner of a specimen reads it into the drawer. The table is for reading the whole thing at once; the drawer answers about one control.' }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'When one answer out of a few is the question',
      blocks: [
        { table: {
            head: ['Do', 'Do not'],
            rows: '<tr><td>Use a radio when the answers are few, known and visible all at once, and exactly one of them is the answer</td><td>Use one for a long list. Past a handful the person is scanning rather than comparing, and that is a select</td></tr>\n'
                  + '<tr><td>Use a radio select when each answer needs a line saying what it means or what it costs</td><td>Put a caption ABOVE the group repeating what the chosen card already says. The description belongs to the option, not to the group</td></tr>\n'
                  + '<tr><td>Have an answer chosen when there is a sensible default, and let the default be the common case</td><td>Open with nothing chosen when a default exists. An empty group asks the person to make a decision the page has already made</td></tr>\n'
                  + '<tr><td>Put the choice above what it governs. A radio decides what the rest of the section is</td><td>Hide the choice in the head of a band, beside the section title. It is an answer, and answers stand in the body</td></tr>\n'
                  + '<tr><td>Switch the set off when the answers depend on something not filled in yet, and say elsewhere what to fill in</td><td>Offer options the back end may refuse. A choice that cannot be honoured is worse than a choice not offered</td></tr>\n'
                  + '<tr><td>Write the title as the option and the sub as its consequence, both sentence case, both short</td><td>Repeat the title in the sub in other words. Two lines saying one thing is the noise this house spent 3 September removing</td></tr>' } }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'Everything a native radio already does',
      blocks: [
        { p: 'This is the one component in the house with no JavaScript, and that is the accessibility section in a sentence. The toggle needed a script because it is a row of buttons pretending to be a radio group; this is the radio group.' },
        { table: {
            rows: '<tr><td>Keyboard</td><td>One tab stop for the whole group, arrows to move the choice, Home and End to the ends, Space to choose. None of it is written by us and none of it can be broken by us</td></tr>\n'
                  + '<tr><td>The group</td><td>The <code>name</code> attribute is what makes several radios one control. <code>role="radiogroup"</code> and an <code>aria-label</code> on the wrapper give the set a name to be announced by</td></tr>\n'
                  + '<tr><td>Name</td><td>The control lives inside its <code>&lt;label&gt;</code>, so the word is the name and a click anywhere on the row chooses. No <code>for</code> and no <code>id</code> to keep in step</td></tr>\n'
                  + '<tr><td>Disabled</td><td>Real <code>disabled</code>, so the tab order skips it and the screen reader says so. A group also carries <code>aria-disabled</code>; the fade alone tells nobody anything</td></tr>\n'
                  + '<tr><td>Focus</td><td><code>:focus-visible</code>, 2px of Blue 600 at 2px of offset, on the circle. The pointer gets no ring; the keyboard always does</td></tr>\n'
                  + '<tr><td>Target size</td><td>The row is the target, not the circle: 16 of circle plus 12 of gap plus the whole label. In a card the whole card is the target</td></tr>\n'
                  + '<tr><td>Contrast</td><td>Zinc 900 on white for the resting ring and the label, Blue 600 for the mark. The chosen card puts Zinc 900 on Blue 50, which is the ground the checkout has been rendering since 21.08</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'The two looks, and the group around them',
      blocks: [
        { code: { id: 'codeBasics',
            text: '&lt;!-- a plain group --&gt;\n'
                  + '&lt;div class="gb-radio-group" role="radiogroup" aria-label="Delivery"&gt;\n'
                  + '  &lt;label class="gb-radio"&gt;\n'
                  + '    &lt;input class="gb-radio__input" type="radio" name="delivery" value="standard" checked&gt;\n'
                  + '    &lt;span class="gb-radio__label"&gt;Standard delivery&lt;/span&gt;\n'
                  + '  &lt;/label&gt;\n'
                  + '  &lt;label class="gb-radio"&gt;\n'
                  + '    &lt;input class="gb-radio__input" type="radio" name="delivery" value="express"&gt;\n'
                  + '    &lt;span class="gb-radio__label"&gt;Express delivery&lt;/span&gt;\n'
                  + '  &lt;/label&gt;\n'
                  + '&lt;/div&gt;\n'
                  + '\n'
                  + '&lt;!-- the same group as cards: Radio select --&gt;\n'
                  + '&lt;div class="gb-radio-group gb-radio-group--cards" role="radiogroup" aria-label="Delivery"&gt;\n'
                  + '  &lt;label class="gb-radio gb-radio--select"&gt;\n'
                  + '    &lt;input class="gb-radio__input" type="radio" name="d2" value="standard" checked&gt;\n'
                  + '    &lt;span class="gb-radio__copy"&gt;\n'
                  + '      &lt;span class="gb-radio__title"&gt;Standard delivery&lt;/span&gt;\n'
                  + '      &lt;span class="gb-radio__sub"&gt;Arrives in three to five working days&lt;/span&gt;\n'
                  + '    &lt;/span&gt;\n'
                  + '  &lt;/label&gt;\n'
                  + '&lt;/div&gt;\n'
                  + '\n'
                  + '&lt;!-- the whole set off: both markers, and the fades will not multiply --&gt;\n'
                  + '&lt;div class="gb-radio-group gb-radio-group--cards is-disabled"\n'
                  + '     role="radiogroup" aria-disabled="true" aria-label="Shipping method"&gt;\n'
                  + '  &lt;label class="gb-radio gb-radio--select"&gt;\n'
                  + '    &lt;input class="gb-radio__input" type="radio" name="ship" disabled&gt;\n'
                  + '    &lt;span class="gb-radio__copy"&gt;&amp;hellip;&lt;/span&gt;\n'
                  + '  &lt;/label&gt;\n'
                  + '&lt;/div&gt;' } }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What the radio used to be',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>18 August</td><td>The sign in flow got a choice card of its own, <code>.gba-method</code> in auth.css, measured off the live site: a 16 circle with a 1.5 ring and an 8 dot, drawn out of two spans, and a black mark rather than a blue one</td></tr>\n'
                  + '<tr><td>21 August</td><td>The checkout drew its shipping methods as cards around a native radio on <code>accent-color</code>. Two more groups followed, then a fifth card in the address drawer</td></tr>\n'
                  + '<tr><td>27 August</td><td>The census of the checkout named the radio one of the four holes in the system, with two groups and no owner</td></tr>\n'
                  + '<tr><td>3 September</td><td>The component. The circle out of Figma <code>10056:14561</code>, the card off the live checkout, two rungs, six states, no script. Three groups on version 2 of the checkout move onto it the same day, and the address mode of step one stops being a toggle in the head of the band and becomes a radio select under the question</td></tr>' } }
      ] },

    { toc: 'Related', eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="toggle.html">Toggle button</a>, which holds one value the same way and looks nothing like it, <a href="field.html">Field</a>, whose hover this control borrows, and <a href="select.html">Select</a>, the answer when the list is too long for a radio.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/radio.css">radio.css</a>, <a href="../components/button.css">button.css</a> (the focus ring and the disabled cell), <a href="../components/docs.css">docs.css</a>, <a href="../components/drawer.css">drawer.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.'
});

<script>
/* ============================================================
   gbppl-radio-1 — THE RADIO READOUT
   ------------------------------------------------------------
   Five small scripts of the showcase template come from oro.js
   (window.GbOro): px, txt, the width readout, the clipboard and
   the contents. What is here is the playground and the four tables
   filled by measuring specimens on this page.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED. The dot in
   particular is read off the ::before box rather than off the slot
   that sets it, because a ::before is exactly the place a value
   can be declared and never rendered.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* The dot has no box of its own in the DOM, so it is measured the
     only way a pseudo element can be: getComputedStyle with the
     second argument. */
  function dotOf(input) {
    if (!input) return '';
    var d = getComputedStyle(input, '::before');
    var on = d.transform && d.transform !== 'none' && d.transform.indexOf('matrix(0') !== 0;
    return px(d.width) + (on ? '' : ' hidden');
  }
  function ringOf(input) {
    if (!input) return '';
    var cs = getComputedStyle(input);
    return px(cs.borderTopWidth) + ' ' + cs.borderTopColor;
  }

  /* ---------- the playground ----------
     The schema, and the control the canon gives each axis:
       Look     a Select. Two faces of one control, picked once and
                named at length, which is what ORO_AXES.look says.
       State    a Select, always: the set is long and half of it is
                usually unavailable on any one specimen.
       Chosen   the switch, by nature: yes and no is never a track.
     The specimen is the markup a consumer writes, which is also
     the markup the Code section prints. */
  var PG_AXES = [
    { id: 'look', label: 'Look', group: 'shape', def: 'select',
      values: [['plain', 'Radio button'], ['select', 'Radio select']] },
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['disabled', 'Disabled']] },
    { id: 'chosen', label: 'Chosen', group: 'state', kind: 'bool',
      on: 'yes', off: 'no', def: 'yes' }
  ];

  var COPY = {
    title: 'Personalize each gift',
    sub: 'Add names and details per gift'
  };

  function pgSample(S, forCode) {
    var nl = forCode ? '\n  ' : ' ';
    var on = S.chosen === 'yes' ? ' checked' : '';
    var off = S.state === 'disabled' ? ' disabled' : '';
    if (S.look === 'plain') {
      return '<label class="gb-radio">' + nl +
             '<input class="gb-radio__input" type="radio" name="pgGroup" id="pgRadio"' + on + off + '>' + nl +
             '<span class="gb-radio__label">' + esc(COPY.title) + '</span>' +
             (forCode ? '\n' : ' ') + '</label>';
    }
    return '<label class="gb-radio gb-radio--select">' + nl +
           '<input class="gb-radio__input" type="radio" name="pgGroup" id="pgRadio"' + on + off + '>' + nl +
           '<span class="gb-radio__copy">' + nl +
           '  <span class="gb-radio__title">' + esc(COPY.title) + '</span>' + nl +
           '  <span class="gb-radio__sub">' + esc(COPY.sub) + '</span>' + nl +
           '</span>' + (forCode ? '\n' : ' ') + '</label>';
  }

  /* Hover and focus go on the way a consumer would put them: the two
     demo names the house declares. Disabled is the browser's own and
     is already on the element from the sample. */
  function pgAfter(S, hold) {
    var row = hold.querySelector('.gb-radio');
    var input = hold.querySelector('.gb-radio__input');
    if (!row || !input) return;
    if (S.state === 'hover') row.classList.add('is-hover');
    if (S.state === 'focus') input.classList.add('is-focus');
    paintPlayground();
  }

  function paintPlayground() {
    var input = document.getElementById('pgRadio');
    if (!input) return;
    var row = input.closest('.gb-radio');
    var cs = getComputedStyle(input);
    var rs = getComputedStyle(row);
    var top = row.querySelector('.gb-radio__title') || row.querySelector('.gb-radio__label');
    var ts = top ? getComputedStyle(top) : null;
    txt('pgBox', Math.round(input.getBoundingClientRect().width) + ' by ' +
                 Math.round(input.getBoundingClientRect().height));
    txt('pgRing', ringOf(input));
    txt('pgDot', dotOf(input));
    txt('pgGap', px(rs.columnGap));
    txt('pgType', ts ? px(ts.fontSize) + ' / ' + ts.fontWeight + ' / ' + px(ts.lineHeight) : '');
    txt('pgInk', ts ? ts.color : '');
    txt('pgGround', rs.backgroundColor + (rs.borderTopWidth === '0px' ? '' : ', line ' + rs.borderTopColor));
    txt('pgOpacity', rs.opacity);
  }

  /* ---------- the states table ---------- */
  function paintStates() {
    [['rest', 'sRest'], ['hover', 'sHover'], ['focus', 'sFocus'],
     ['on', 'sOn'], ['off', 'sOff'], ['onoff', 'sOnOff']].forEach(function (pair) {
      var el = document.getElementById('st-' + pair[0]);
      if (!el) return;
      var row = el.closest('.gb-radio');
      txt(pair[1] + 'Ring', ringOf(el));
      txt(pair[1] + 'Dot', dotOf(el));
      txt(pair[1] + 'Op', getComputedStyle(row).opacity);
    });
  }

  /* ---------- sizes, groups and anatomy ---------- */
  function paintRest() {
    var el = document.getElementById('st-rest');
    if (!el) return;
    var r = el.getBoundingClientRect();
    var cs = getComputedStyle(el);
    txt('szBox', Math.round(r.width));
    txt('szRing', px(cs.borderTopWidth));
    txt('szDot', dotOf(el).replace(' hidden', ''));
  }

  function paintGroups() {
    var stack = document.getElementById('grpStack');
    var cards = document.getElementById('grpCards');
    var off = document.getElementById('grpOff');
    if (stack) txt('gStackGap', px(getComputedStyle(stack).rowGap));
    if (cards) {
      var c = getComputedStyle(cards);
      txt('gCardsGap', px(c.columnGap) + ', tracks ' + c.gridTemplateColumns);
    }
    if (off) {
      var os = getComputedStyle(off);
      txt('gOffOp', 'opacity ' + os.opacity + ', pointer-events ' + os.pointerEvents);
      var one = off.querySelector('.gb-radio');
      txt('gOffItem', one ? 'opacity ' + getComputedStyle(one).opacity + ', once' : '');
    }
  }

  function paintAnatomy() {
    var plain = document.getElementById('st-rest');
    var card = document.querySelector('#grpCards .gb-radio--select');
    if (plain) {
      var row = plain.closest('.gb-radio');
      var rr = row.getBoundingClientRect();
      txt('anRow', Math.round(rr.width) + ' by ' + Math.round(rr.height));
      txt('anCircle', Math.round(plain.getBoundingClientRect().width) + ' box, ring ' +
          px(getComputedStyle(plain).borderTopWidth));
      txt('anDot', dotOf(plain).replace(' hidden', ' when chosen'));
      txt('anGap', px(getComputedStyle(row).columnGap));
    }
    if (card) {
      var cs = getComputedStyle(card);
      var cr = card.getBoundingClientRect();
      var inp = card.querySelector('.gb-radio__input');
      txt('anCard', Math.round(cr.width) + ' by ' + Math.round(cr.height) + ', padding ' +
          px(cs.paddingTop) + ', line ' + px(cs.borderTopWidth) + ', radius ' + px(cs.borderTopLeftRadius));
      txt('anOffset', inp ? px(getComputedStyle(inp).marginTop) : '');
    }
    ORO.widthNow('wnow');
  }

  function paintAll() { paintStates(); paintRest(); paintGroups(); paintAnatomy(); }

  function start() {
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="radio"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter
      });
    }
    paintAll();
    /* TRAP 11 OF THE SKILL. A specimen wearing a demo state class at
       load is still inside its own colour transition on the first
       frame, and a colour read there stands on no screen. The wait is
       read off the specimens rather than typed. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>
