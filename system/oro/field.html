     gbppl-oro-pages-1 — THE FIELD PAGE
     ------------------------------------------------------------
     Тон, 28.08 (Ton-19): «Каждый компонент должен быть представлен
     отдельной страницей, должна быть нормальная навигация...
     Пользователь заходит в раздел Components, никакого промежуточного
     каталога нет; сразу открывается вводная страница, что такое
     компоненты; дальше отдельные страницы самих компонентов.»

     So this card moved out of components.html and became a page.
     Old links still land: components.html keeps a redirect for the
     hashes that used to live on it, and the «Open in Oro» of
     Inspect now points here.

     ------------------------------------------------------------
     gbppl-oro-field-2 — ALL FIVE LOOKS, NOT ONE
     ------------------------------------------------------------
     Until this wave the page documented ONE look of the field, the
     underlined control with a caps label over it, and the system
     had five. The other four were built, measured and shipped, and
     a reader of this page could not tell they existed:

       floating label   auth.css, .gba-field--floating, the lead
                        form of the live contact page
       phone            booking.css, .gbb-phone*, one underlined
                        row: country box, hairline, number
       one time code    auth.css, .gba-otp, six cells
       password reveal  auth.css, .gba-eye, the eye in the corner

     NOTHING WAS BUILT BY THIS WAVE (rule 7.1 of the skill). Every
     specimen below is the organism itself: either the real
     <gb-field> of auth.js, with the real attributes and the real
     setError(), or markup copied character for character out of
     the file that owns it. Where a look has no answer for a state,
     the page says so out loud instead of inventing one.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves,
     chips and code blocks are the atoms of ..\components\docs.css;
     its drawer is ..\components\drawer.css; its specimens are the
     organisms themselves. What is left in the <style> block is the
     width of the reading column and the antidotes documented where
     they stand.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement is read back out of the rendered page.

     ------------------------------------------------------------
     gbppl-showcase-canon-1, 01.09 — THE PLAYGROUND BECAME THE
     CANON CARD
     ------------------------------------------------------------
     Тон, 01.09: «Главное, нам нужно разобраться с отображением
     компонентов... панель выбора сверху, а не справа. Из-за этого
     мне тяжело показывать работу людям.» Said of the select page,
     true of every one of them, so the four rows of segments over
     the stage became the .gbdoc-pg card button.html carries, and
     the panel inside it is GbOro.controls reading a schema.

     THE AXES WERE ALSO RE-CUT, AND THE CANON DID THE CUTTING. Until
     today Look held two values and Type held six, so Phone, One
     time code and Password — three separate faces of the field, in
     two different owner files — were sitting in the list of text
     types beside Text and Email, and the Look row had to be lit and
     locked from the Type row to keep the story straight.
     ORO_AXES.look settles it: «underline, floating, phone, one time
     code and password are five DIFFERENT COMPONENTS wearing one
     control». So Look is the five, a Select by the canon, and Type
     is the three text types it always was, a toggle, asked only of
     the two looks that have a choice. Nothing was added and nothing
     was dropped: the same eleven specimens the old panel could
     build, under the names the rest of the house uses.

     WHAT THE RULE GAVE EACH AXIS: Look a Select, Type a toggle,
     State a Select, Required the switch. An axis a look does not
     have is now REMOVED rather than greyed, which is the renderer's
     own idiom and reads better than a locked chip; a state a look
     does not have is greyed in place, because the axis still
     applies and only some of its values do not. The line under the
     card still says why, in the same words, and it is still the one
     sentence the stage cannot say for itself.

     ------------------------------------------------------------
     gbppl-oro-engine-1, 01.09 — AND THE PAGE IS A DECLARATION
     ------------------------------------------------------------
     The shell of this file went into system/oro/oro-page.js: the
     links, the studio bar, the rail, the contents, the card, the
     section heads, the table wrappers, the code blocks, the
     playground card, the drawer, the probe box and the console.
     This page already wrote its sections the canonical way, so
     nothing a reader can see moved: the document is the same height
     at 390, 1280 and 1920, every section stands at the same y with
     the same height, and all five probe readouts and every table
     cell print exactly what they printed before.

     WHAT STAYED IN THE FILE AND WHY. The four antidotes are page
     CSS and travel in the declaration, argued where they stand, as
     trap 3 asks; booking.css is named in the same place, with its
     reason, because it owns the phone row and one look here needs
     it.
     ============================================================ -->

     parser inserted script blocks the parser, and a lock that does not
     block the parser is a lock the page paints around. -->

                  + '<tr><td>Required asterisk</td><td>Printed by the label\'s <code>::after</code> when the wrapper is required</td><td class="gbdoc-num" id="anStar"></td><td><span class="gbdoc-flag">Live</span> the gold of the live form, matched to the value</td></tr>\n'
                  + '<tr><td>Error</td><td>One sentence under the field, in <code>role="alert"</code>, right aligned</td><td class="gbdoc-num" id="anErr"></td><td><span class="gbdoc-flag">Live</span> 11px Red 600, 18 August</td></tr>\n'
                  + '<tr><td>Radius</td><td>None, on every part. A field is an underline, not a box</td><td class="gbdoc-num" id="anR"></td><td><span class="gbdoc-flag">Live</span></td></tr>' } },
        { note: 'The asterisk is the one part of the field that is not on the palette: <code>--auth-required-gold</code> is <code>#bd9f58</code>, a colour of the live form and of nothing else in the system. It stayed a token of its own rather than being rounded into the zinc scale, and gold in the interface is otherwise vetoed, so this is the exception and it is written down here.' }
      ] },

    { id: 'properties', toc: 'Properties', eyebrow: 'Properties',
      h2: 'The attributes, and the drawer that reads a specimen',
      blocks: [
        { p: 'Two layers, the way the mature systems keep them. The table is the whole surface of the component, readable and linkable in one piece. The drawer answers a different question, about one specimen: the Properties button in the corner of any specimen on this page opens it with the geometry, the type, the colours and the label measured off that element, with the token that produced each value beside it.' },
        { table: {
            head: ['Attribute', 'Type', 'Default', 'What it does'],
            rows: '<tr><td><code>input-id</code></td><td>string</td><td>required</td><td>Ties the label to the input. Every field needs one, and it has to be unique on the page</td></tr>\n'
                  + '<tr><td><code>name</code></td><td>string</td><td>required</td><td>The name the form submits under</td></tr>\n'
                  + '<tr><td><code>type</code></td><td>string</td><td><code>text</code></td><td>Any input type, plus <code>textarea</code> for the multi line version, and <code>password</code>, which is the one that takes an eye</td></tr>\n'
                  + '<tr><td><code>label</code></td><td>string</td><td>required</td><td>The label. Sentence case in the markup: the caps belong to the role, not to the copy</td></tr>\n'
                  + '<tr><td><code>placeholder</code></td><td>string</td><td>empty</td><td>The hint inside the line. It fades out on focus, which is what live does. A floating single line field ignores it and takes one space of its own instead, because <code>:placeholder-shown</code> does not fire on an empty string and the label would never rise</td></tr>\n'
                  + '<tr><td><code>optional</code></td><td>boolean</td><td>off</td><td>Marks the field as not required. Required is the default, which is why the modifier names the exception, and it is the switch the gold asterisk reads</td></tr>\n'
                  + '<tr><td><code>label-style</code></td><td>string</td><td>empty</td><td><code>floating</code> puts the label inside the control and lets it rise. It changes one thing in the markup, the position of the label after the control, because the rise is CSS on a sibling and not a line of script</td></tr>\n'
                  + '<tr><td><code>eye</code></td><td>boolean</td><td>off</td><td>Adds the reveal button in the corner of the control. It flips <code>type</code> between password and text and does nothing else</td></tr>\n'
                  + '<tr><td><code>value</code></td><td>string</td><td>empty</td><td>The value the field opens with</td></tr>\n'
                  + '<tr><td><code>autocomplete</code></td><td>string</td><td>the name</td><td>Handed straight to the control, so the browser can fill it. A floating label rises for a browser fill too, since Chrome clears <code>:placeholder-shown</code></td></tr>\n'
                  + '<tr><td><code>wrap-mod</code></td><td>string</td><td>empty</td><td>An extra class on the wrapper, for the spacing a form needs: <code>.gba-field--flow</code> is the 24 / 32 / 40 rhythm of the live flow, <code>.gba-field--last</code> is the last field of a group</td></tr>\n'
                  + '<tr><td><code>el.setError(text)</code></td><td>method</td><td>none</td><td>Puts the control in error and prints the sentence under it; <code>clearError()</code> takes both away. This is how the specimens above go red: the page does not write the error markup itself</td></tr>\n'
                  + '<tr><td><code>.is-hover .is-focus</code></td><td>class</td><td>off</td><td>Demo only, the showcase. Hold a state still so a row of them can stand side by side</td></tr>' } },
        { note: 'The phone row and the code have no element of their own. The phone is markup inside the booking flow, because two controls share one underline and one row; the code is six inputs the flow drives as a single control, with paste and auto advance. Both are shown here as their owner writes them, character for character. If either ever gets a second consumer, that is the day it becomes an element.' }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'Which look, and when',
      blocks: [
        { table: {
            head: ['Do', 'Do not'],
            rows: '<tr><td>Reach for the underline with a caps label when the form owns the page and has room above every line</td><td>Mix the two looks in one form. One form, one look: two labels behaving differently in one column reads as a bug</td></tr>\n'
                  + '<tr><td>Reach for the floating label in a drawer, a panel or a dense column, where a row of labels would cost more height than the fields</td><td>Use the floating label for a field a person has to re read while it is full. Once it is filled the label is 11.2px above the line, a reminder rather than a heading</td></tr>\n'
                  + '<tr><td>Label every field, in sentence case, and let the role put the caps on</td><td>Use the placeholder as the label. It disappears the moment someone types, in both looks</td></tr>\n'
                  + '<tr><td>Say what is wrong under the field, in one sentence, through <code>setError()</code></td><td>Colour the line red and leave the person to guess what it means</td></tr>\n'
                  + '<tr><td>Mark the optional ones, since required is the default</td><td>Mark the required ones with an asterisk. There would be one on almost every field</td></tr>\n'
                  + '<tr><td>Let the multi line field size itself: it opens at two lines, grows with the text, stops at three rungs of 64 and scrolls inside itself past that, with a quiet ground behind the text while it does</td><td>Set a height on a textarea, or hand it a resize corner beside a field that grows on its own. The next keystroke overwrites whatever the corner was dragged to, and one look of the field, the live lead form, keeps the corner only because live has it</td></tr>\n'
                  + '<tr><td>Put the error under the field it belongs to</td><td>Move the error into a tooltip or a toast, or collect all of them at the top of the form. It has to stand where the answer is being typed</td></tr>' } },
        { note: 'Ton, 27 August, on the form we imitate: «Раз мы имитируем live, должно быть как там». That is why the floating ladder is not the guest ladder, why the phone line is a step darker than the four fields beside it, and why the error sentences of the booking read in the live wording. Copy quoted from a live page is quoted whole; the rules of our own copy apply to the words we write.' }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'Label, error, focus and target size',
      blocks: [
        { table: {
            rows: '<tr><td>Label</td><td>Every field carries a real <code>label</code> with <code>for</code> pointing at the control\'s <code>id</code>, in both looks. A floating label is still a label: it moves, it does not stop existing, and it is never replaced by a placeholder</td></tr>\n'
                  + '<tr><td>Error</td><td><code>setError()</code> sets <code>aria-invalid="true"</code> on the control and prints the sentence in a <code>role="alert"</code>, so it is announced when it appears. Tying the two together with <code>aria-describedby</code> is the gap here: the sentence is announced but it is not yet named as the description of the field, and closing it is a change at the owner</td></tr>\n'
                  + '<tr><td>Focus</td><td>Visible on every look since 28 August: the line goes Blue 600 when the caret arrives. Declared, not measured, and the one behaviour on this page live does not have yet</td></tr>\n'
                  + '<tr><td>Disabled</td><td>The native attribute, on the control. What it should look like is undecided, so what a person sees today is the browser\'s own grey</td></tr>\n'
                  + '<tr><td>Autofill</td><td>Every field takes <code>autocomplete</code> and defaults it to the field name. The floating label rises for a browser fill as well as for a keystroke, because the rise reads <code>:placeholder-shown</code> and not an input event</td></tr>\n'
                  + '<tr><td>The code</td><td>Six cells, each with a name of its own, Digit 1 to Digit 6, and <code>inputmode="numeric"</code> so a phone opens the number pad. A paste into any cell fills all six</td></tr>\n'
                  + '<tr><td>The eye</td><td>A real button with an <code>aria-label</code>, not a glyph on a div, and it sits inside the field\'s own box, so a tab reaches it right after the control</td></tr>\n'
                  + '<tr><td>Target size</td><td>The shortest control in the family is 48 tall at every width, which clears the 44 a touch target needs. The eye is an 18px glyph in the corner and is the one thing under it</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'One element, and the attributes on it',
      blocks: [
        { p: 'Four of the five looks are one element and its attributes. The phone is the one that is markup, and it is markup because two controls share a row.' },
        { code: { id: 'codeField',
            text: '&lt;!-- the default: underline, caps label over the line --&gt;\n'
                  + '&lt;gb-field input-id="email" name="email" type="email"\n'
                  + '          label="Work email" placeholder="you@company.com"&gt;&lt;/gb-field&gt;\n'
                  + '\n'
                  + '&lt;!-- multi line, and not required --&gt;\n'
                  + '&lt;gb-field input-id="brief" name="brief" type="textarea"\n'

                  + '&lt;!-- the floating label, with the rhythm of the live flow --&gt;\n'

        { code: { id: 'codeRow',
            text: '&lt;!-- the phone row, booking.css. Two controls, one underline.\n'
                  + '     The placeholder is one space on purpose: without it the\n'
                  + '     label cannot know the field is empty. --&gt;\n'
                  + '&lt;div class="gba-field gba-field--floating gbb-phone-field"&gt;\n'

                  + '            aria-haspopup="listbox" aria-expanded="false"\n'

                  + '    &lt;input type="tel" name="phone" id="phone" placeholder=" "\n'
                  + '           class="gba-input"&gt;\n'

                  + '\n'

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What each old class became',
      blocks: [
        { table: {
            head: ['When', 'What', 'Why'],
            rows: '<tr><td>18 August</td><td>The field is born in <code>auth.css</code> as a pixel copy of the guest sign in: underline, caps label, the control family 48 / 56 / 64 and Inter 300 at 14 / 16 / 18. The six cells and the eye arrive with it, inside the sign in flow</td><td>The sign in was the first live screen we rebuilt, and its field is the field</td></tr>\n'
                  + '<tr><td>25 August</td><td><code>.gba-textarea</code>, a version rather than a second field: three things change and everything that makes it a field stays</td><td>The booking needed a multi line answer</td></tr>\n'
                  + '<tr><td>26 August</td><td>The submit stops being the field\'s business: <code>.gba-btn</code> becomes the button organism, and <code>auth.css</code> is left owning fields only</td><td>One source of buttons, phase two</td></tr>\n'
                  + '<tr><td>27 August</td><td><code>label-style="floating"</code>, the second look, measured on the live contact page, with its own ladder of 13 / 14 / 16 at 48 / 48 / 56. The phone row lands with it, in <code>booking.css</code></td><td>Ton: the first step of the booking imitates the live form whole, and the live form floats its labels</td></tr>\n'
                  + '<tr><td>27 August</td><td>The caps label moves onto the Eyebrow role: 12 at 600, 0.12em, Zinc 500. A documented departure from the live 11 at 0.5px, and the checkout labels move onto it the same day</td><td>Ton: one caps voice in the system</td></tr>\n'
                  + '<tr><td>28 August</td><td>Focus. The line answers the caret with Blue 600, on input and textarea alike. DECLARED: the live form did not render that day and there was nothing to measure</td><td>Ton: «при постановке курсора полоса не становится активной». Ton-17: the gap is closed here and live catches up</td></tr>\n'
                  + '<tr><td>28 August</td><td>This page. The four looks that were built and undocumented come onto the showcase, with the playground, the workbench and the two ladders</td><td>The registry called Field documented while four of its five looks stood on no page at all</td></tr>\n'
                  + '<tr><td>1 September</td><td>The multi line field grows. <code>field-sizing: content</code> on <code>.gba-textarea</code>, a floor of two lines, a ceiling of three rungs of 64, a scroll inside itself past it and a Zinc 50 ground behind the text while it scrolls; the resize corner goes, and <code>auth.js</code> keeps the ground in step and answers for browsers without <code>field-sizing</code>. Two carriers had grown their own copy of this by hand, and the checkout and this page had none. The live lead form keeps its own live mechanics and is the one field that does</td><td>Ton: «я тоже склоняюсь к Auto-Grow, поле должно расти»</td></tr>\n'
                  + '<tr><td>1 September</td><td>The playground became the canon card: the rail moved to the right of the stage, Look and State became Selects, Type a toggle button and Required a switch, the ground switch arrived on the stage and the markup moved behind a Preview | Code fold. The axes were re-cut with it: Phone, One time code and Password left the list of text types and became what they are, three of the five looks</td><td>Ton: «панель выбора сверху, а не справа. Из-за этого мне тяжело показывать работу людям.» And the canon of axes, which says a look is a face and not a type</td></tr>\n'
                  + '<tr><td>2 September</td><td>The rail took every control of the card. Light | Dark left the stage for a row of its own group, the Preview | Code band under the card went away and its switch became a row too, and the whole rail changed voice: a short axis is the underlined segment of the documentation and a longer one a quiet picker, so nothing on the panel wears the species of the thing it drives. The specimen stands in the middle of the canvas now, on both axes</td><td>Ton, on a screenshot of the button card: a switch loose in the middle of the canvas, toggles as loud as the specimen, a footer band nobody could explain, and a button that was not centred</td></tr>' } }
      ] },

    { eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="button.html">Button</a>, which every form ends in, and <a href="icons.html#iconbutton">Icon button</a>, which the eye is not: the eye is an 18px glyph in the corner of a field and predates the round shape. <a href="drawer.html">Drawer</a> is where the floating look is worn most, in the comment thread. The two flows built out of all of this are the sign in, <code>&lt;gb-auth-flow&gt;</code>, and the booking, <code>&lt;gb-booking-flow&gt;</code>: the first owns the code and the password, the second owns the phone.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/auth.css">auth.css</a>, <a href="../components/auth.js">auth.js</a>, <a href="../components/booking.css">booking.css</a>, <a href="../components/button.css">button.css</a>, <a href="../components/toggle.css">toggle.css</a>, <a href="../components/docs.css">docs.css</a>, <a href="../components/drawer.css">drawer.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.',
  probes: '<div class="gba-field required">\n'
          + '  <label class="gba-label" for="probe-under">Probe</label>\n'

<script>
/* ============================================================
   gbppl-oro-field-2 / gbppl-oro-cleanup-1 — THE READOUT, THE
   PLAYGROUND AND THE VARIANT WORKBENCH
   ------------------------------------------------------------
   gbppl-oro-cleanup-1 (28.08) took px, txt, the clipboard, the
   contents reader and the width readout out to window.GbOro in
   oro.js, where all eight showcases read them. Nothing about how
   this page behaves changed with them.
   ------------------------------------------------------------
   Three jobs, one file, and two rules over all three.

   ONE: NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED.
   Every measurement is read back out of the rendered page with
   getComputedStyle, so if a token moves the page moves with it,
   and if an organism breaks it breaks here first.

   TWO: NOTHING ON THIS PAGE BUILDS A FIELD. Three of the five
   looks are the real <gb-field> of auth.js, created with the real
   attributes and put in error with the organism's own setError().
   The two that have no element, the phone row and the six cells,
   are markup copied character for character out of booking.js and
   auth.js, and the copies are marked below so the next reader can
   diff them against their owner.

   Where a look has no answer for a state, the chip goes
   unavailable and the foot says why. The alternative would be to
   draw a hover the system does not have, which is exactly what
   the instrument is not allowed to do.
   ============================================================ */
(function () {
  'use strict';

  var INSPECT = window.GbInspect || {};

  /* gbppl-oro-cleanup-1: px, txt, the clipboard, the contents and
     the width readout are the showcase template and live in oro.js
     as window.GbOro. The two names stay because every call site in
     this file spells them px and txt. */
  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  /* ---------- the two copied markups ----------
     COPIED, NOT WRITTEN. The phone row is the phone block of
     STEP1_TEMPLATE in booking.js and the caret is its ICON_CARET;
     the cells are the otpCells loop of auth.js and the label is
     the one its code panel prints. The country list stays with its
     owner: it is data of the booking flow, and a menu that cannot
     open is not a specimen. */
  var CARET =
    '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="m2.5 4.5 3.5 3.5 3.5-3.5"/></svg>';

  function phoneHTML(id, req, value) {
    return '<div class="input-field col active staticLabel ' + (req ? 'required ' : '') +
        'gba-field gba-field--floating gbb-phone-field">' +
        '<div class="relative gba-inputwrap gbb-phone">' +
          '<button class="gbb-phone-trigger" type="button" aria-haspopup="listbox" ' +
            'aria-expanded="false" aria-label="Country calling code">' +
            '<span>+1</span>' + CARET + '</button>' +
          '<input type="tel" name="phone" id="' + id + '" autocomplete="tel" placeholder=" " ' +
            'class="valid browser-default gba-input"' + (value ? ' value="' + value + '"' : '') + '>' +
          '<label for="' + id + '" class="active gba-label">Phone</label>' +
        '</div>' +
      '</div>';
  }

  function otpHTML(id, filled) {
    var cells = '';
    var digits = filled ? ['4', '7', '1', '9', '0', '2'] : ['', '', '', '', '', ''];
    for (var i = 0; i < 6; i++) {
      cells += '<input type="text" inputmode="numeric" maxlength="1" aria-label="Digit ' + (i + 1) + '"' +
        (i === 0 ? ' id="' + id + '"' : '') +
        (digits[i] ? ' value="' + digits[i] + '"' : '') + '>';
    }
    return '<div><label class="gba-vlabel">Verification Code</label>' +
      '<div class="gba-otp">' + cells + '</div></div>';
  }

  /* ---------- what each look can honestly show ----------
     Read this as the answer to «why is that chip grey». Every line
     is a fact about an owner file, not a decision of the showcase. */
  var LOOKS = {
    underline: { label: 'Underline', ladder: 'guest 48 / 56 / 64', line: '.gba-field' },
    floating:  { label: 'Floating',  ladder: 'lead form 48 / 48 / 56', line: '.gba-field--floating' },
    phone:     { label: 'Phone',     ladder: 'lead form 48 / 48 / 56', line: '.gbb-phone' },
    code:      { label: 'Code',      ladder: 'guest 48 / 56 / 64', line: '.gba-otp' },
    password:  { label: 'Password',  ladder: 'guest 48 / 56 / 64', line: '&lt;gb-field ... eye&gt;' }
  };

  var STATES_FOR = {
    underline: ['rest', 'hover', 'focus', 'filled', 'error', 'disabled'],
    floating:  ['rest', 'hover', 'focus', 'filled', 'error', 'disabled'],
    password:  ['rest', 'hover', 'focus', 'filled', 'error', 'disabled'],
    phone:     ['rest', 'filled', 'error', 'disabled'],
    code:      ['rest', 'filled', 'disabled']
  };
  var WHY_OUT = {
    phone: 'Hover and focus are out on the phone: the line belongs to the row, and booking.css gives the row a real hover but no demo class to hold it still. Hover it with the pointer instead.',
    code:  'Hover, focus and error are out on the code: auth.css gives a cell a real focus and nothing else, and there is no hover rule and no error state for the six cells anywhere in the system. Optional is out too, because .gba-vlabel prints its asterisk unconditionally.'
  };
  var LABEL_FOR = { code: ['required'] };

  function statesFor(look) { return STATES_FOR[look] || STATES_FOR.underline; }
  function labelsFor(look) { return LABEL_FOR[look] || ['required', 'optional']; }

  /* ---------- making one specimen ----------
     For the three looks that have an element this IS the element,
     with the attributes a consumer would write. The state is then
     put on the rendered control the way a consumer would: a value,
     a disabled attribute, the organism's setError, and for hover
     and focus the two demo classes auth.css declares beside the
     live rules they repeat. */
  var COPY = {
    text:     { label: 'Your Name', ph: 'Anna Weber', value: 'Anna Weber', error: 'this is a required field' },
    email:    { label: 'Work email', ph: 'you@company.com', value: 'anna@gildedbox.com', error: 'Enter a valid email address' },
    textarea: { label: 'What are you looking for?', ph: 'A few words is plenty', value: 'Twenty boxes for the sales team, before the end of the quarter.', error: 'this is a required field' },
    password: { label: 'Password', ph: 'Set your password', value: 'correcthorse', error: 'Enter at least eight characters' }
  };

  /* gbppl-showcase-canon-1: mount() SPLIT IN TWO, because the playground is
     rendered by GbOro.controls now and the renderer does the two halves at
     two different moments — it writes the markup itself (sample) and then
     hands the mounted specimen back (after). The workbench still owns its
     own stage and calls the two in a row, which is what mount() is; not a
     line of what either half does has changed.

     The attributes below were set one at a time on a created element and
     are written as a string here for the same reason: the renderer wants
     markup. Every value is a literal out of COPY, so there is nothing to
     escape. */
  function fieldMarkup(look, type, state, req, id) {
    if (look === 'phone') return phoneHTML(id, req, state === 'filled' ? '847 801 0345' : '');
    if (look === 'code') return otpHTML(id, state === 'filled');
    var name = look === 'password' ? 'password' : type;
    var copy = COPY[name] || COPY.text;
    var a = ['input-id="' + id + '"', 'name="' + name + '"', 'type="' + name + '"',
             'label="' + copy.label + '"'];
    if (type !== 'textarea' || look !== 'floating') a.push('placeholder="' + copy.ph + '"');
    if (look === 'floating') a.push('label-style="floating"');
    if (look === 'password') a.push('eye');
    if (!req) a.push('optional');
    return '<gb-field ' + a.join(' ') + '></gb-field>';
  }

  /* The state is put on the rendered control the way a consumer would: a
     value, a disabled attribute, the organism's setError, and for hover and
     focus the two demo classes auth.css declares beside the live rules they
     repeat. Returns the control the readers below measure. */
  function dressField(host, look, type, state) {
    if (look === 'phone') {
      var pin = host.querySelector('.gba-input');
      if (!pin) return null;
      if (state === 'error') {
        host.querySelector('.gbb-phone').classList.add('invalid');
        pin.setAttribute('aria-invalid', 'true');
      }
      if (state === 'disabled') { pin.disabled = true; host.querySelector('.gbb-phone-trigger').disabled = true; }
      return pin;
    }

    if (look === 'code') {
      var cells = host.querySelectorAll('.gba-otp input');
      if (!cells.length) return null;
      if (state === 'disabled') {
        Array.prototype.forEach.call(cells, function (c) { c.disabled = true; });
      }
      return cells[0];
    }

    var f = host.querySelector('gb-field');
    if (!f) return null;
    var copy = COPY[look === 'password' ? 'password' : type] || COPY.text;
    var input = f.input;
    if (state === 'filled') input.value = copy.value;
    if (state === 'hover') input.classList.add('is-hover');
    if (state === 'focus') input.classList.add('is-focus');
    if (state === 'error') {
      input.value = type === 'email' ? 'anna@' : '';
      f.setError(copy.error);
    }
    if (state === 'disabled') {
      input.disabled = true;
      var eye = f.querySelector('.gba-eye');
      if (eye) eye.disabled = true;
    }
    return input;
  }

  function mount(host, look, type, state, req, id) {
    host.innerHTML = fieldMarkup(look, type, state, req, id);
    return dressField(host, look, type, state);
  }

  /* ---------- reading one specimen back ---------- */
  function readField(el, look) {
    if (!el) return null;
    var cs = getComputedStyle(el);
    var lab = el.id ? document.querySelector('label[for="' + el.id + '"]') : null;
    if (!lab && look === 'code') lab = document.querySelector('.gbdoc-stage .gba-vlabel');
    var ls = lab ? getComputedStyle(lab) : null;
    /* The line belongs to the row on the phone and to the control
       everywhere else, and saying which is part of the reading. */
    var lineHost = look === 'phone' ? el.closest('.gbb-phone') : el;
    var lcs = lineHost ? getComputedStyle(lineHost) : cs;
    return {
      h: px(el.tagName === 'TEXTAREA' ? cs.height : (look === 'phone' ? lcs.minHeight : cs.minHeight)),
      font: px(cs.fontSize) + ' / ' + cs.fontWeight,
      pad: px(cs.paddingTop) + ' / ' + px(cs.paddingLeft),
      label: ls ? px(ls.fontSize) + ' / ' + ls.fontWeight + ' / ' + ls.letterSpacing : 'no label',
      line: px(lcs.borderBottomWidth) + ' ' + lcs.borderBottomColor,
      lineOn: look === 'phone' ? '.gbb-phone, the row'
            : look === 'code' ? '.gba-otp input, each cell'
            : (el.tagName === 'TEXTAREA' ? '.gba-textarea' : '.gba-input'),
      ink: cs.color
    };
  }

  function lightChips(row, chosen) {
    Array.prototype.forEach.call(row.querySelectorAll('.gbdoc-seg'), function (seg) {
      var on = seg.getAttribute('data-val') === chosen;
      seg.classList.toggle('is-on', on);
      seg.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }
  function markChips(row, allowed) {
    Array.prototype.forEach.call(row.querySelectorAll('.gbdoc-seg'), function (seg) {
      var ok = allowed.indexOf(seg.getAttribute('data-val')) !== -1;
      seg.classList.toggle('is-unavailable', !ok);
      seg.setAttribute('aria-disabled', ok ? 'false' : 'true');
    });
  }

  /* ============================================================
     THE PLAYGROUND
     ============================================================ */
  var pgFoot = document.getElementById('pgFoot');

  /* gbppl-showcase-canon-1. THE SCHEMA, and the control the rule gives
     each axis (canon in ORO_AXES):
       Look      a Select, always. The five are separate faces of the
                 field, in two owner files, picked once and named at
                 length; they are not rungs of anything
       Type      a toggle of the three text types, and it is asked only
                 of the two looks that have a choice. The phone, the code
                 and the password are looks, not types, which is the
                 re-cut this wave made
       State     a Select, always
       Required  the switch, by nature. The code has no optional label at
                 all, so the row is removed there rather than locked

     A state a look does not have is greyed IN PLACE by available(): the
     axis still applies and only some of its values do not, and the
     sentence under the stage says which and why. */
  var PG_AXES = [
    { id: 'look', label: 'Look', group: 'shape', def: 'underline',
      values: [['underline', 'Underline'], ['floating', 'Floating'], ['phone', 'Phone'],
               ['code', 'One time code'], ['password', 'Password']] },
    { id: 'type', label: 'Type', group: 'shape', def: 'email',
      values: [['text', 'Text'], ['email', 'Email'], ['textarea', 'Textarea']],
      when: function (S) { return S.look === 'underline' || S.look === 'floating'; } },
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['filled', 'Filled'], ['error', 'Error'], ['disabled', 'Disabled']] },
    { id: 'required', label: 'Required', group: 'content', kind: 'bool',
      on: 'yes', off: 'no', def: 'yes',
      when: function (S) { return labelsFor(S.look).indexOf('optional') !== -1; } }
  ];

  /* The two looks that are not text have no type to choose, and the
     password has only ever stood on the underline ladder with its own. */
  function pgType(S) {
    if (S.look === 'phone' || S.look === 'code') return 'tel';
    if (S.look === 'password') return 'password';
    return S.type;
  }

  function pgSnippet(look, type, req) {
    if (look === 'phone') {
      return '<!-- booking.css. Two controls, one underline. -->\n' +
        '<div class="gba-field gba-field--floating gbb-phone-field">\n' +
        '  <div class="gba-inputwrap gbb-phone">\n' +
        '    <button class="gbb-phone-trigger" type="button">+1 <svg>...</svg></button>\n' +
        '    <input type="tel" id="phone" placeholder=" " class="gba-input">\n' +
        '    <label for="phone" class="gba-label">Phone</label>\n' +
        '  </div>\n</div>';
    }
    if (look === 'code') {
      return '<!-- auth.css. Six cells the flow drives as one control. -->\n' +
        '<label class="gba-vlabel">Verification Code</label>\n' +
        '<div class="gba-otp">\n' +
        '  <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1">\n' +
        '  ... six of them\n</div>';
    }
    var name = look === 'password' ? 'password' : type;
    var copy = COPY[name] || COPY.text;
    var tail = ['label="' + copy.label + '"'];
    if (type !== 'textarea' || look !== 'floating') tail.push('placeholder="' + copy.ph + '"');
    if (look === 'floating') tail.push('label-style="floating"');
    if (look === 'password') tail.push('eye');
    if (!req) tail.push('optional');
    return '<gb-field input-id="' + name + '" name="' + name + '" type="' + name + '"\n' +
           '          ' + tail.join(' ') + '></gb-field>';
  }

  function pgSample(S, forCode) {
    var req = S.required === 'yes';
    if (forCode) return pgSnippet(S.look, S.type, req);
    return fieldMarkup(S.look, pgType(S), S.state, req, 'pgField');
  }

  function pgAfter(S, hold) {
    var look = S.look;
    var el = dressField(hold, look, pgType(S), S.state);

    var d = readField(el, look);
    if (d) {
      txt('pgH', d.h); txt('pgFont', d.font); txt('pgPad', d.pad);
      txt('pgLabel', d.label); txt('pgLine', d.line); txt('pgLineOn', d.lineOn);
      txt('pgInk', d.ink); txt('pgLadder', LOOKS[look].ladder);
    }

    /* WHY A VALUE IS OUT, and why a row is not there at all. Every
       sentence is a fact about an owner file, not a decision of the
       showcase; the three lead-ins were rewritten with the axes on
       01.09, because a look is no longer something the type decides. */
    var why = WHY_OUT[look] || '';
    if (look === 'code') why = 'The code is a look of its own, six cells under a caps label, so it is asked for no text type at all. ' + why;
    if (look === 'password') why = 'The password stands on the underline ladder only and brings its own type, so Type is not asked: the eye is placed for that box, and no live screen has ever shown a floating password.';
    if (look === 'phone') why = 'The phone is a look and not a type of text, so Type is not asked: .gbb-phone-field carries .gba-field--floating in its own file, and the row is always a phone. ' + why;
    /* gbppl-oro-props-1. What stood here read «On the stage:
       Underline, rest», which is the two chips the reader has just
       set, in the same words, a centimetre lower (Тон-21: строка под
       сценой дублирует видимое). The line is kept for the one thing
       the stage cannot say — why a value went quiet — and it is empty
       otherwise, which takes the whole strip away (docs.css,
       .gbdoc-foot:empty). */
    if (pgFoot) pgFoot.innerHTML = why || '';
  }

  /* ============================================================
     THE VARIANT WORKBENCH
     One look on the stage, walked through the states it has.
     ============================================================ */
  var WB = { look: 'underline', lines: 'one' };
  var wbControls = document.getElementById('wbControls');
  var wbStates = document.getElementById('wbStates');
  var wbCap = document.getElementById('wbCap');
  var wbFoot = document.getElementById('wbFoot');
  var stBody = document.getElementById('stBody');
  var STATE_WORD = { rest: 'Rest', hover: 'Hover', focus: 'Focus', filled: 'Filled', error: 'Error', disabled: 'Disabled' };

  function wbMulti() { return WB.lines === 'many' && (WB.look === 'underline' || WB.look === 'floating'); }

  function paintWorkbench() {
    if (!wbStates) return;
    var look = WB.look;
    var states = statesFor(look);
    var multi = wbMulti();
    var wide = look === 'code' || multi;

    wbStates.innerHTML = '';
    states.forEach(function (st, i) {
      var slot = document.createElement('div');
      slot.className = 'gbdoc-slot' + (wide ? ' gbdoc-slot--wide' : ' gbdoc-slot--grow');
      var hold = document.createElement('div');
      hold.className = 'gbdoc-hold gbdoc-hold--block';
      slot.appendChild(hold);
      var cap = document.createElement('span');
      cap.className = 'gbdoc-slot__cap';
      slot.appendChild(cap);
      wbStates.appendChild(slot);
      var el = mount(hold, look, multi ? 'textarea' : (look === 'password' ? 'password' : 'email'),
                     st, true, 'wb-' + look + '-' + i);
      var d = readField(el, look);
      cap.innerHTML = '<b>' + STATE_WORD[st] + '</b>' +
        (d ? d.h + ' tall, type ' + d.font.split(' / ')[0] : '');
    });

    Array.prototype.forEach.call(wbControls.querySelectorAll('.gbdoc-axis'), function (row) {
      var axis = row.getAttribute('data-axis');
      if (axis === 'look') {
        lightChips(row, WB.look);
        markChips(row, ['underline', 'floating', 'phone', 'code', 'password']);
      } else {
        lightChips(row, WB.lines);
        markChips(row, (look === 'underline' || look === 'floating') ? ['one', 'many'] : ['one']);
      }
    });

    wbCap.textContent = 'States of the ' + LOOKS[look].label.toLowerCase() + ' look' +
      (multi ? ', multi line' : '') + ', at ' + window.innerWidth + 'px';

    var why = WHY_OUT[look] || 'Six states, held still.';
    if (!multi && (look === 'phone' || look === 'code' || look === 'password')) {
      why += ' Multi line is out here as well: only the two text looks have a textarea version.';
    }
    wbFoot.innerHTML = 'On the stage: <code>' + LOOKS[look].line + '</code>. ' + why;

    paintStateTable(look, states);
  }

  /* The state table is filled by measuring the specimens standing
     above it, and the token beside each value is found by the same
     lookup the properties drawer uses. */
  function paintStateTable(look, states) {
    if (!stBody) return;
    var slots = wbStates.querySelectorAll('.gbdoc-slot');
    var candidates = ['--zinc-200', '--zinc-400', '--zinc-500', '--zinc-600',
                      '--zinc-800', '--zinc-900', '--blue-600', '--red-500', '--red-600'];
    var html = '';
    Array.prototype.forEach.call(slots, function (slot, i) {
      var el = slot.querySelector('.gba-input') || slot.querySelector('.gba-otp input');
      if (!el) return;
      var d = readField(el, look);
      var lineHost = look === 'phone' ? el.closest('.gbb-phone') : el;
      var lcs = getComputedStyle(lineHost);
      var tok = INSPECT.tokenFor ? INSPECT.tokenFor(lcs.borderBottomColor, candidates) : null;
      html += '<tr><td>' + STATE_WORD[states[i]] + '</td>' +
        '<td class="gbdoc-num">' + d.line + '</td>' +
        '<td class="gbdoc-num">' + d.ink + '</td>' +
        '<td class="gbdoc-num">' + d.label + '</td>' +
        '<td>' + (tok ? '<code>' + tok + '</code>'
                      : '<span class="gbdoc-flag gbdoc-flag--none">In the organism</span>') +
        (states[i] === 'focus' ? ' <span class="gbdoc-flag gbdoc-flag--declared">Declared</span>' : '') +
        '</td></tr>';
    });
    stBody.innerHTML = html;
  }

  if (wbControls) {
    wbControls.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('.gbdoc-seg[data-val]') : null;
      if (!chip || chip.classList.contains('is-unavailable')) return;
      var axis = chip.parentNode.getAttribute('data-axis');
      if (!axis) return;
      WB[axis] = chip.getAttribute('data-val');
      paintWorkbench();
    });
  }

  /* ============================================================
     THE LADDERS, THE LABELS AND THE ANATOMY, ALL OFF PROBES
     ============================================================ */
  function twoOf(id) {
    var el = document.getElementById(id);
    if (!el) return 'no probe';
    var cs = getComputedStyle(el);
    return px(cs.minHeight) + ' / ' + px(cs.fontSize);
  }

  function paintSizes() {
    txt('szUnder', twoOf('probe-under'));
    txt('szFloat', twoOf('probe-float'));
    var phone = document.getElementById('probe-phone');
    txt('szPhone', phone ? px(getComputedStyle(phone).minHeight) : 'no probe');
    txt('szOtp', twoOf('probe-otp'));
    var area = document.getElementById('probe-area');
    txt('szArea', area ? px(getComputedStyle(area).minHeight) : 'no probe');
    txt('szAreaMax', area ? px(getComputedStyle(area).maxHeight) : 'no probe');
  }

  var LABELS = [
    ['lab-field', '.gba-label', 'auth.css', 'on .required only'],
    ['lab-eyebrow', '.gb-eyebrow', 'shell.css', 'none'],
    ['lab-v', '.gba-vlabel', 'auth.css', 'always, no way to turn it off']
  ];

  function paintLabels() {
    var body = document.getElementById('labBody');
    if (!body) return;
    var html = '';
    LABELS.forEach(function (row) {
      var el = document.getElementById(row[0]);
      if (!el) return;
      var cs = getComputedStyle(el);
      var star = getComputedStyle(el, '::after');
      var hasStar = star && star.content && star.content !== 'none' && star.content !== 'normal';
      html += '<tr><td><code>' + row[1] + '</code></td><td>' + row[2] + '</td>' +
        '<td class="gbdoc-num">' + px(cs.fontSize) + ' / ' + cs.fontWeight + '</td>' +
        '<td class="gbdoc-num">' + cs.letterSpacing + '</td>' +
        '<td class="gbdoc-num">' + cs.textTransform + '</td>' +
        '<td class="gbdoc-num">' + cs.color + '</td>' +
        '<td>' + row[3] + (hasStar ? ', <span class="gbdoc-num">' + star.color + '</span>' : '') +
        '</td></tr>';
    });
    body.innerHTML = html;

    var cap = function (id, elId) {
      var el = document.getElementById(elId);
      if (!el) return;
      var cs = getComputedStyle(el);
      txt(id, px(cs.fontSize) + ' / ' + cs.fontWeight + ' / ' + cs.letterSpacing);
    };
    cap('capLab', 'lab-field'); cap('capEye', 'lab-eyebrow'); cap('capV', 'lab-v');
  }

  function paintAnatomy() {
    var input = document.getElementById('probe-under');
    var lab = document.querySelector('label[for="probe-under"]');
    var err = document.getElementById('probe-err');
    if (input && lab) {
      var cs = getComputedStyle(input);
      var ls = getComputedStyle(lab);
      var star = getComputedStyle(lab, '::after');
      var es = err ? getComputedStyle(err) : null;
      txt('anLabel', px(ls.fontSize) + ' / ' + ls.fontWeight + ' / ' + ls.letterSpacing + ' / ' + ls.color);
      txt('anCtl', px(cs.minHeight) + ' tall, ' + px(cs.fontSize) + ' / ' + cs.fontWeight + ', pad ' + px(cs.paddingLeft));
      txt('anLine', px(cs.borderBottomWidth) + ' ' + cs.borderBottomStyle + ' ' + cs.borderBottomColor);
      txt('anStar', (star.content && star.content !== 'none' ? star.content + ' ' : 'no asterisk ') +
        star.color + ', pad ' + px(star.paddingLeft));
      txt('anErr', es ? px(es.fontSize) + ' ' + es.color + ', ' + es.textAlign : 'no probe');
      txt('anR', px(cs.borderTopLeftRadius));
    }
    ORO.widthNow('wnow', 'wnow2', 'wnow3');
  }

  /* gbppl-oro-engine-1. The Copy buttons of the code blocks are
     wired by GbOro.page, and the contents beside the document are
     read off it by oro.js: both are the template, and this page no
     longer asks for either. */

  /* The address of a look puts that look on the workbench, so the
     row in the overview and the stage below say the same thing. */
  var hash = (location.hash || '').replace('#', '');
  if (LOOKS[hash]) WB.look = hash;

  paintAnatomy();
  paintSizes();
  paintLabels();
  /* gbppl-showcase-canon-1. The playground is a schema now: this page says
     what the field HAS and how one is drawn out of a state object, and
     oro.js draws the rail, picks a control per axis by the rule, removes
     the rows that do not apply, greys the values that do not, folds the
     markup into the card and answers resize for every panel on the page
     itself. That is why it is not in the two lists around it. */
  if (window.GbOro && window.GbOro.controls) {
    window.GbOro.controls({
      root: document.querySelector('[data-pg="field"]'),
      axes: PG_AXES,
      sample: pgSample,
      after: pgAfter,
      normalise: function (S) {
        if (statesFor(S.look).indexOf(S.state) === -1) S.state = 'rest';
        if (labelsFor(S.look).indexOf('optional') === -1) S.required = 'yes';
      },
      available: function (S, axis, val) {
        if (axis !== 'state') return true;
        return statesFor(S.look).indexOf(val) !== -1;
      }
    });
  }
  paintWorkbench();

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      paintAnatomy(); paintSizes(); paintLabels(); paintWorkbench();
    }, 120);
  });
})();
</script>

<!-- The console. Its element is written by GbOro.page, with the drawer
     and the probes; these two files give it its doors and its rooms. -->
<script src="../../system/sandbox-registry.js"></script>
<script src="../../system/components/studio-panel.js"></script>

</body>
