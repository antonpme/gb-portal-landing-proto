<!-- ============================================================
     gbppl-oro-icons-1 — THE ICON CARD
     ------------------------------------------------------------
     Ton, 28.08: «Нужны иконка и icon button. Те иконки, которые у
     нас стоят в хедере (круглые) или крестик закрытия drawer,
     должны быть вариативным компонентом. Разных размеров и с
     разными состояниями: интерактивные (с hover) и неинтерактивные
     (без hover, просто в блоках); с подложкой и обычные. Всё
     системно продумать и собрать.»

     TWO COMPONENTS ON ONE CARD, because they are one question with
     two answers: a glyph that answers the pointer is a button, and
     a glyph that does not is an icon. Splitting them across two
     pages would hide the line between them, which is the only part
     a reader actually has to learn.

     THE CARD TEMPLATE, the same thirteen sections in the same
     order as Buttons, so a reader who has learned that page finds
     everything here blindfold (ORO-SKILL 7a):
       Overview      what they are, who owns them, who wears them
       Playground    build one and read it back
       Variants      one at a time on a switchable stage
       States        a token table, measured off the stage
       Sizes         two scales, glyph and circle, with provenance
       Icons         the whole set, named and copyable
       Anatomy       the measured numbers at this window width
       Properties    the modifier table, and the inspect drawer
       Usage         when to reach for which, and when not to
       Accessibility the name, the target and the tooltip
       Code          the markup to copy
       Changelog     what changed and what it used to be called
       Related       where to go next

     Ton-10: this page is a CONSUMER. Its card, tables, stages,
     shelves, chips and code blocks are the atoms of
     ..\components\docs.css; its drawer is ..\components\drawer.css;
     its specimens are the organisms themselves. What is left in
     the <style> block below is the width of the reading column and
     nothing else.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement is read back out of the rendered page.

     ------------------------------------------------------------
     gbppl-showcase-canon-1, 01.09 — THE PLAYGROUND BECAME THE
     CANON CARD
     ------------------------------------------------------------
     Тон, 01.09: «панель выбора сверху, а не справа. Из-за этого мне
     тяжело показывать работу людям.» The seven rows of segments
     over the stage became the .gbdoc-pg card, and the panel inside
     it is GbOro.controls reading a schema.

     THE GLYPH GRID DID NOT MOVE. This page carries two things: a
     playground that builds one icon BUTTON, and a set of thirteen
     glyphs laid out as a grid with a name and a copy under each.
     The grid is a catalogue and not a specimen; a rail beside it
     would have nothing to set. Only the playground is a card.

     WHAT THE SEVEN ROWS BECAME: Behaviour, Wash, Size and Type are
     toggles, Colour, Glyph and State are Selects, all by the canon
     except Behaviour, which is not in it and gets its answer from
     count and budget instead, and says so once in the console.

     SIZE LOST THE PIXELS FROM ITS LABELS, and this is the one place
     where the canon and the arithmetic said the same thing twice.
     ORO_AXES.RENAMES asks for it outright («a label is a rung,
     never a measurement»), and the budget refuses «LIVE · 44» in a
     four-way track on a 320 rail anyway: the widest item would cost
     more than its quarter share and the rule would demote the whole
     axis to a Select. The four heights are in the sentence over the
     card, in the Sizes tables and in the readout under it, each one
     read off a specimen.

     AND THE GROUND STOPPED BEING A SIDE EFFECT OF THE COLOUR. The
     old playground darkened the stage when the colour was inverse,
     which made a property of the stage follow a property of the
     control. Now the stage has its own switch and the colour
     follows it, under the two rules the variant workbench below has
     always stated: a white cut on white is nothing, and black on
     Zinc 950 is nothing either.

     ------------------------------------------------------------
     gbppl-oro-engine-1, 01.09 — THE PAGE IS A DECLARATION, AND THE
     SECOND HEAD IS GONE
     ------------------------------------------------------------
     The shell went into system/oro/oro-page.js. One thing a reader
     will notice, and it is the drift the wave was called for: this
     page carried TWO heads. An H1 that said «Icons» with no status,
     and a .gbdoc-card__head inside the card that said «Icons and
     icon buttons» with the Draft flag on it and a line under that.
     Five of the seven showcases put the flag on the H1 and have no
     second head at all; this one and the drawer were the two that
     did not.

     So the head is one head now: the flag is on the H1 where the
     canon puts it, and the card line became the second lede, which
     is what it always was. The heading itself, «Icons and icon
     buttons», is the only text on this page the move did not keep:
     the H1 already names the page, the lede under it already says
     the page holds two objects, and the Overview heading right
     below already says which two. Every other word, every table,
     every specimen and every measured number came across unchanged,
     the contents list is the same fourteen entries, and the console
     is silent at 390, 1280 and 1920.

     The engine learned the one part of this card that is not the
     others: the .gbdoc-foot line under the playground, which the
     script fills with what is on the stage and why a value is out.
     ============================================================ -->

        { p: 'Measured, not typed: eight specimens standing off screen, four icons and four circles, are read with getComputedStyle every time the window changes size. The stroke row is the one worth reading twice. One drawing on a 24 grid puts a thinner line on the glass in a smaller box, so the weight the reader sees is not the weight in the file, and the component does not pretend otherwise.' },
        { readout: 'Measured at <b id="wnow2">measuring</b> wide.' },
        { table: {
            head: ['Measure', '16', '20', '22', '24', 'Provenance'],
            rows: '<tr><td>Box</td><td class="gbdoc-num" data-i="box" data-n="16"></td><td class="gbdoc-num" data-i="box" data-n="20"></td><td class="gbdoc-num" data-i="box" data-n="22"></td><td class="gbdoc-num" data-i="box" data-n="24"></td><td><span class="gbdoc-flag">Live</span> all four</td></tr>\n'
                  + '<tr><td>Stroke, on the grid</td><td class="gbdoc-num" data-i="sw" data-n="16"></td><td class="gbdoc-num" data-i="sw" data-n="20"></td><td class="gbdoc-num" data-i="sw" data-n="22"></td><td class="gbdoc-num" data-i="sw" data-n="24"></td><td><span class="gbdoc-flag">Live</span>, the catalogue drawers</td></tr>\n'
                  + '<tr><td>Stroke, on the glass</td><td class="gbdoc-num" data-i="rw" data-n="16"></td><td class="gbdoc-num" data-i="rw" data-n="20"></td><td class="gbdoc-num" data-i="rw" data-n="22"></td><td class="gbdoc-num" data-i="rw" data-n="24"></td><td>The consequence of one drawing</td></tr>' } },
        { table: {
            head: ['Measure', '40', '44 live', '48', '56', 'Provenance'],
            rows: '<tr><td>Circle</td><td class="gbdoc-num" data-c="box" data-n="small"></td><td class="gbdoc-num" data-c="box" data-n="live"></td><td class="gbdoc-num" data-c="box" data-n="medium"></td><td class="gbdoc-num" data-c="box" data-n="large"></td><td><span class="gbdoc-flag">Live</span> 44 · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the grid rungs</td></tr>\n'
                  + '<tr><td>Glyph</td><td class="gbdoc-num" data-c="glyph" data-n="small"></td><td class="gbdoc-num" data-c="glyph" data-n="live"></td><td class="gbdoc-num" data-c="glyph" data-n="medium"></td><td class="gbdoc-num" data-c="glyph" data-n="large"></td><td><span class="gbdoc-flag">Live</span> 22 · the rest are button rungs</td></tr>\n'
                  + '<tr><td>Glyph against circle</td><td class="gbdoc-num" data-c="ratio" data-n="small"></td><td class="gbdoc-num" data-c="ratio" data-n="live"></td><td class="gbdoc-num" data-c="ratio" data-n="medium"></td><td class="gbdoc-num" data-c="ratio" data-n="large"></td><td><span class="gbdoc-flag">Live</span>, held constant</td></tr>\n'
                  + '<tr><td>Radius</td><td class="gbdoc-num" data-c="r" data-n="small"></td><td class="gbdoc-num" data-c="r" data-n="live"></td><td class="gbdoc-num" data-c="r" data-n="medium"></td><td class="gbdoc-num" data-c="r" data-n="large"></td><td><span class="gbdoc-flag">Live</span>, the circle token</td></tr>\n'
                  + '<tr><td>Clears the 44 target</td><td class="gbdoc-num" data-c="tap" data-n="small"></td><td class="gbdoc-num" data-c="tap" data-n="live"></td><td class="gbdoc-num" data-c="tap" data-n="medium"></td><td class="gbdoc-num" data-c="tap" data-n="large"></td><td>WCAG 2.2 target size</td></tr>' } }
      ] },

    { id: 'properties', toc: 'Properties', eyebrow: 'Properties',
      h2: 'The modifiers, and the drawer that reads a specimen',
      blocks: [
        { p: 'Two layers, the way the mature systems keep them. The table is the whole surface of both components, readable and linkable in one piece. The drawer answers a different question, about one specimen: click any glyph on a stage or a shelf and it opens with the circle, the glyph, the ratio, the ink and the target measured off that element, with the token that produced each value beside it.' },
        { table: {
            head: ['Modifier', 'On', 'Axis', 'Default', 'What it does'],
            rows: '<tr><td><code>.gb-icon</code></td><td>Icon</td><td>Base</td><td>required</td><td>A box in the current ink holding one drawing. No hover, no cursor, no target</td></tr>\n'
                  + '<tr><td><code>--16 --20 --22 --24</code></td><td>Icon</td><td>Size</td><td><code>--20</code></td><td>Which rung of the glyph scale the box measures. Named by the number: the letters are taken, they mean a button ladder</td></tr>\n'
                  + '<tr><td><code>.gb-btn--icon</code></td><td>Button</td><td>Shape</td><td>off</td><td>A circle carrying one glyph and no label. Type, colour and state stay with the modifiers already in the class; only the box changes</td></tr>\n'
                  + '<tr><td><code>--small --medium --large</code></td><td>Icon button</td><td>Size</td><td>the live 44</td><td>40, 48 and 56 off the height grid, flat at every width, with the glyph at half the circle. Without one, the circle is the live 44</td></tr>\n'
                  + '<tr><td><code>--static</code></td><td>Icon button</td><td>Behaviour</td><td>interactive</td><td>Decoration. No hover, no target, and the cursor belongs to whatever it stands in. Use a <code>span</code> and hide it from the reader</td></tr>\n'
                  + '<tr><td><code>--plain</code></td><td>Icon button</td><td>Ground</td><td>washed</td><td>No wash in any state. Everything the control has to say is said in the ink</td></tr>\n'
                  + '<tr><td><code>--filled --outline --ghost</code></td><td>Icon button</td><td>Type</td><td><code>--filled</code></td><td>The organism\'s own axis, unchanged. Ghost is the one the chrome wears</td></tr>\n'
                  + '<tr><td><code>--primary --secondary --inverse</code></td><td>Icon button</td><td>Colour</td><td><code>--primary</code></td><td>The organism\'s own axis, unchanged. Inverse is the glyph on a dark or photographic ground</td></tr>\n'
                  + '<tr><td><code>.gb-btn__icon</code></td><td>Icon button</td><td>Slot</td><td>required</td><td>The glyph box inside the circle. It is the button\'s own slot and not <code>.gb-icon</code>: a glyph in a button is sized by the button</td></tr>\n'
                  + '<tr><td><code>.is-hover .is-focus .is-active</code></td><td>Both</td><td>Demo</td><td>off</td><td>Hold a state still for a screenshot. This page only, never a product page</td></tr>' } }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'Which one, and when',
      blocks: [
        { p: 'One question decides it before any other: does this glyph answer the pointer? If it does it is a button and it needs a name, a target and a tooltip. If it does not it is an icon, and it must not look like it might.' },
        { table: {
            head: ['Reach for', 'When', 'Not when'],
            rows: '<tr><td>Icon</td><td>A mark that belongs to a line of text, a row or a block: it carries meaning and never a click</td><td>Anywhere a person could reasonably try to press it. A glyph that looks pressable and is not is the most expensive thing a page can contain</td></tr>\n'
                  + '<tr><td>Icon button</td><td>A control whose meaning is universal and whose room is tight: a close, a step back, a search, a basket</td><td>For an action the reader has to think about. A word costs one line and saves a guess</td></tr>\n'
                  + '<tr><td>Icon button, static</td><td>The same circle standing in a block as decoration, so a mark and a control look like one family</td><td>As a substitute for a disabled control. Disabled is a state of a control and keeps its name; static is not a control at all</td></tr>\n'
                  + '<tr><td>Washed</td><td>A single glyph in a bar or a head, where the ground appearing under the pointer is the whole answer</td><td>In a tight row of glyphs, where a plate under each one turns the row into a fence</td></tr>\n'
                  + '<tr><td>Plain</td><td>A row of glyphs whose own ink is quiet enough to darken, so the row answers without changing shape</td><td>Where the ink at rest is already the darkest it goes: nothing will happen under the pointer, and a control that does not answer reads as broken</td></tr>\n'
                  + '<tr><td>Ghost</td><td>Permanent chrome, which is nearly every round glyph in the product</td><td>For the action a screen is asking for. That action deserves a word and a filled button</td></tr>\n'
                  + '<tr><td>Outline</td><td>A round control that has to read as a control on a busy or photographic ground</td><td>On a quiet white plate, where the hairline is louder than the job</td></tr>\n'
                  + '<tr><td>40</td><td>A dense toolbar, where a 44 circle would not fit the band</td><td>As the only control in a wide empty area, and never on a touch surface without room around it</td></tr>\n'
                  + '<tr><td>44</td><td>The default, and what every bar and drawer head in the product measures today</td><td>Inside a 36 high band, where it will not fit</td></tr>\n'
                  + '<tr><td>48 and 56</td><td>A single round action carrying a block of its own</td><td>In a row with other glyphs, where one big circle reads as an error rather than an emphasis</td></tr>' } },
        { note: 'A glyph is not a word. Reach for a label whenever the meaning is not already universal, and never invent a picture for an idea the product has not already taught: the reader is not going to learn a private alphabet for one screen. Where a glyph does stand alone, it takes the name of the action and not the name of the drawing: close, not cross.' }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'Names, targets and contrast',
      blocks: [
        { table: {
            rows: '<tr><td>Name</td><td>An interactive glyph carries <code>aria-label</code>, always. Without it a screen reader announces a button and nothing else, and the drawer on this page prints the name in red words when it is missing</td></tr>\n'
                  + '<tr><td>Silence</td><td>A decorative glyph carries <code>aria-hidden="true"</code> and no name at all. Two names for one thing, one spoken and one drawn, is worse than none</td></tr>\n'
                  + '<tr><td>Tooltip</td><td>A control with no label needs a hover and focus tooltip as well as a name: the name serves the screen reader, the tooltip serves the person who can see the glyph and still does not know it</td></tr>\n'
                  + '<tr><td>Target</td><td>WCAG 2.2 asks 44 by 44, and the default circle is exactly that. 40 clears it only with room around it; the anatomy table above says which rung passes on its own</td></tr>\n'
                  + '<tr><td>Keyboard</td><td>The focus ring is the organism\'s: <code>:focus-visible</code>, two pixels at two pixels offset, white instead of blue on a dark ground. It follows the circle, because an outline follows the radius</td></tr>\n'
                  + '<tr><td>Contrast</td><td>A glyph is a graphical object and has to clear 3 to 1 against its ground, not the 4.5 of text. Both figures on this page are measured off the rendered page rather than remembered</td></tr>\n'
                  + '<tr><td>Static is not disabled</td><td>A static glyph is invisible to the keyboard and to the reader by design. A control that is temporarily unavailable is <code>disabled</code> and keeps both</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'Four shapes, drawn inline',
      blocks: [
        { p: 'Four shapes, and the drawing is inline in every one of them. That is what makes the ink free: a glyph in markup is <code>currentColor</code>, and a glyph in an <code>img</code> is whatever grey it was exported with.' },
        { code: { id: 'codeBasics',
            text: '&lt;!-- an icon in a block: 20 is the default rung --&gt;\n'
                  + '&lt;span class="gb-icon gb-icon--20" aria-hidden="true"&gt;\n'
                  + '  &lt;svg viewBox="0 0 24 24"&gt;...&lt;/svg&gt;\n'
                  + '&lt;/span&gt;\n'
                  + '\n'
                  + '&lt;!-- the chrome control: the live circle, ghost, black --&gt;\n'
                  + '&lt;button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary"\n'
                  + '        type="button" aria-label="Close" title="Close"&gt;\n'
                  + '  &lt;span class="gb-btn__icon"&gt;&lt;svg viewBox="0 0 24 24"&gt;...&lt;/svg&gt;&lt;/span&gt;\n'
                  + '&lt;/button&gt;\n'
                  + '\n'
                  + '&lt;!-- the same control on a dark ground, one rung smaller --&gt;\n'
                  + '&lt;button class="gb-btn gb-btn--icon gb-btn--small gb-btn--ghost gb-btn--inverse"\n'
                  + '        type="button" aria-label="Search gifts" title="Search gifts"&gt;\n'
                  + '  &lt;span class="gb-btn__icon"&gt;&lt;svg viewBox="0 0 24 24"&gt;...&lt;/svg&gt;&lt;/span&gt;\n'
                  + '&lt;/button&gt;\n'
                  + '\n'
                  + '&lt;!-- decoration: a span, no name, no target --&gt;\n'
                  + '&lt;span class="gb-btn gb-btn--icon gb-btn--static gb-btn--ghost gb-btn--secondary"\n'
                  + '      aria-hidden="true"&gt;\n'
                  + '  &lt;span class="gb-btn__icon"&gt;&lt;svg viewBox="0 0 24 24"&gt;...&lt;/svg&gt;&lt;/span&gt;\n'
                  + '&lt;/span&gt;' } },
        { note: 'The set is a record and not a sprite. <code>window.GbIcons</code> hands back the drawing of a named glyph, or the whole span around it, so a page can write <code>GbIcons.html(\'close\', 20)</code> instead of pasting a path; a sprite would cost a request and take the ink away. Every consumer keeps writing inline markup, and what changes is that the drawing has one home instead of nine.' }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What changed, and what is still to move',
      blocks: [
        { table: {
            head: ['When', 'What'],
            rows: '<tr><td>28 August, with the drawer</td><td><code>.gb-btn--icon</code> arrived: one circle, 44, with a 22 glyph and a 5 per cent wash, and the drawer head became its first consumer. Section 8 of the skill had carried icon only as a hole in the organism since the checkout census counted twelve of them on one page</td></tr>\n'
                  + '<tr><td>28 August, with the showcase</td><td>The circle learned the size modifiers, on three flat rungs of the height grid with the glyph at half the circle, and gained two axes: <code>--static</code> and <code>--plain</code>. The bare glyph became a component of its own, <code>.gb-icon</code>, and the drawings the house had scattered across nine files were written down in one</td></tr>\n'
                  + '<tr><td>28 August, the consumers</td><td>Seventeen controls moved: the header\'s four round glyphs, pixel for pixel, and the checkout\'s twelve. The console\'s device row became the record\'s first reader, and its six screens were redrawn onto the set\'s grid on the way in. The organism gained one pair, <code>--icon --inverse</code>, so a round glyph on a dark ground keeps the white wash live measures</td></tr>\n'
                  + '<tr><td>1 September</td><td>The playground became the canon card: the rail moved to the right of the stage, Behaviour, Wash, Size and Type became toggle buttons, Colour, Glyph and State became Selects, and the markup moved behind a Preview | Code fold. Size lost the pixels from its four labels, because a label is a rung and the four heights are measured in the tables below. The stage got a Light or Dark switch of its own, so the ground is no longer a side effect of choosing inverse</td></tr>' } },
        { html: '<h3 class="oro-h3">What moves onto the organism next</h3>' },
        { p: 'Seventeen of the twenty three moved on 28 August, once the shape had settled. What is left is not waiting on the shape. It is waiting on a colour that does not exist yet, and on a wave of redrawing.' },
        { table: {
            head: ['Who', 'How many', 'Becomes', 'What has to be watched'],
            rows: '<tr><td><code>.gbh-pbar__icon</code>, the portal bar</td><td>3</td><td><code>--icon --ghost --plain</code>, once a quiet colour family exists</td><td>Its ink is Zinc 500 darkening to Zinc 700, which no colour family of the organism carries. It waits on that decision, and it is now the only thing <code>.gbh-icon-button</code> is still kept alive for</td></tr>\n'
                  + '<tr><td>The ten quiet checkout glyphs</td><td>10</td><td>They already wear <code>--icon --small --plain</code>. What they want is the same quiet family as the portal bar</td><td>The eight input number buttons and the two pager arrows rested at Zinc 500 and darkened on hover. <code>--secondary</code> is Zinc 900 at rest AND on hover, so under <code>--plain</code> they now have no hover at all. One colour decision closes this and the portal bar together</td></tr>\n'
                  + '<tr><td>The checkout row bin</td><td>1</td><td>It wears the organism. What it lost is the red hover</td><td>The same gap Remove shipment hit: there is no danger colour in the organism, and the wave did not invent one</td></tr>\n'
                  + '<tr><td>The four checkout input numbers</td><td>4 frames</td><td>An input number component, which owns minus, number and plus as one control</td><td>The buttons are on the organism and the frames are still page markup on tokens. The look is temporary and it is written into the head of the file</td></tr>\n'
                  + '<tr><td>Consumer drawings, the four weights</td><td>all of them</td><td>One weight, the house 1.5</td><td>The glyphs the converted controls carry kept their own strokes: 2.5 on the input numbers, 2 on the pager, 1.8 on every submit arrow, 1.2 on the envelope. Converting drawings is a wave of its own, and doing it inside a geometry change would have hidden one inside the other</td></tr>\n'
                  + '<tr><td>Portal navigation, <code>system/icons/*.svg</code></td><td>27</td><td>Nothing yet</td><td>They are Figma exports with a grey baked in and boxes like 22.8. Bringing them into the set is redrawing, and it is a wave of its own</td></tr>' } }
      ] },

    { eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="button.html">Button</a>, whose organism this shape belongs to and whose glyph slot sizes every icon that stands inside one, and <a href="colors.html">Colors</a>, where the ink and the washes are documented. The drawer and the header, which wear the round control on every screen, have their cards in the <a href="components.html#composite">composite level</a> of the components catalogue.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/icon.css">icon.css</a>, <a href="../components/icon.js">icon.js</a>, <a href="../components/button.css">button.css</a>, <a href="../components/toggle.css">toggle.css</a>, <a href="../components/auth.css">auth.css</a>, <a href="../components/docs.css">docs.css</a>, <a href="../components/drawer.css">drawer.css</a> and the icon and button blocks of <a href="../assets/tokens.css">tokens.css</a> · every specimen on this page, including the page\'s own furniture, is rendered by those files.',
  probesId: 'probes'
});
</script>

<script src="../type-scale.js"></script>
<script src="../components/icon.js"></script>
<script src="../components/auth.js"></script>
<script src="../components/toggle.js"></script>
<script src="../components/drawer.js"></script>
<script src="../components/inspect.js"></script>
<script src="../components/comments.js"></script>
<script>
/* ============================================================
   gbppl-oro-icons-1 / gbppl-oro-cleanup-1 — THE READOUT, THE
   PLAYGROUND AND THE VARIANT WORKBENCH
   ------------------------------------------------------------
   gbppl-oro-cleanup-1 (28.08) took px, txt, the clipboard, the
   contents reader and the width readout out to window.GbOro in
   oro.js. What stayed is what belongs to this page: the glyph
   rows, which copy one icon each and answer with a tick.
   ------------------------------------------------------------
   Same three jobs and the same one rule as the button card:
   NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
   measurement is read back out of the rendered page with
   getComputedStyle, so if a token moves the page moves with it,
   and if the organism breaks it breaks here first.
   ============================================================ */
(function () {
  'use strict';

  var INSPECT = window.GbInspect || {};
  var ICONS = window.GbIcons;

  /* gbppl-oro-cleanup-1: px, txt, the clipboard, the contents and
     the width readout are the showcase template and live in oro.js
     as window.GbOro. */
  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;
  function glyph(name) { return ICONS && ICONS.has(name) ? ICONS.svg(name) : ''; }

  /* Relative luminance and the WCAG ratio, so the contrast claims
     on this page are measured rather than remembered. */
  function lum(c) {
    var m = String(c).match(/[\d.]+/g);
    if (!m) return 0;
    var f = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(+m[0]) + 0.7152 * f(+m[1]) + 0.0722 * f(+m[2]);
  }
  function ratio(a, b) {
    var x = lum(a), y = lum(b);
    if (y > x) { var t = x; x = y; y = t; }
    return Math.round(((x + 0.05) / (y + 0.05)) * 100) / 100;
  }

  /* One drawing on a 24 grid renders a thinner line in a smaller
     box. The number the reader actually sees is the attribute times
     the box over the grid, and it is worth printing because it is
     the argument for or against three stroke steps. */
  function onGlass(box, svgEl) {
    if (!svgEl || !box) return 'no drawing';
    var sw = parseFloat(getComputedStyle(svgEl).strokeWidth);
    var vb = /0 0 ([\d.]+) /.exec(svgEl.getAttribute('viewBox') || '');
    if (!sw || !vb) return 'no drawing';
    return Math.round((sw * box / parseFloat(vb[1])) * 100) / 100 + 'px';
  }

  /* ---------- the probes ---------- */
  var ICON_RUNGS = ['16', '20', '22', '24'];
  /* gbppl-btn-ladder-1, 02.09: the circle rungs are words now, and the
     three circles are the ones they always were. */
  var CIRCLES = [['small', '40'], ['live', '44'], ['medium', '48'], ['large', '56']];

  var probes = document.getElementById('probes');
  if (probes) {
    var html = '';
    ICON_RUNGS.forEach(function (n) {
      html += '<span class="gb-icon gb-icon--' + n + '" id="pi-' + n + '">' + glyph('close') + '</span>';
    });
    CIRCLES.forEach(function (c) {
      html += '<button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary' +
        (c[0] === 'live' ? '' : ' gb-btn--' + c[0]) + '" id="pc-' + c[0] + '" type="button" tabindex="-1" ' +
        'aria-label="Probe"><span class="gb-btn__icon">' + glyph('close') + '</span></button>';
    });
    probes.innerHTML = html;
  }

  /* ---------- the anatomy readout ---------- */
  var iconCells = document.querySelectorAll('[data-i][data-n]');
  var circleCells = document.querySelectorAll('[data-c][data-n]');

  function paintAnatomy() {
    var icons = {};
    ICON_RUNGS.forEach(function (n) {
      var el = document.getElementById('pi-' + n);
      if (!el) return;
      var cs = getComputedStyle(el);
      var svgEl = el.querySelector('svg');
      icons[n] = {
        box: px(cs.width),
        sw: svgEl ? getComputedStyle(svgEl).strokeWidth : 'no drawing',
        rw: onGlass(parseFloat(cs.width), svgEl)
      };
    });
    Array.prototype.forEach.call(iconCells, function (cell) {
      var d = icons[cell.getAttribute('data-n')];
      var k = cell.getAttribute('data-i');
      cell.textContent = d && d[k] ? d[k] : 'no value';
    });

    var circles = {};
    CIRCLES.forEach(function (c) {
      var el = document.getElementById('pc-' + c[0]);
      if (!el) return;
      var cs = getComputedStyle(el);
      var ic = el.querySelector('.gb-btn__icon');
      var box = parseFloat(cs.width) || 0;
      var g = ic ? (parseFloat(getComputedStyle(ic).width) || 0) : 0;
      circles[c[0]] = {
        box: px(cs.width),
        glyph: ic ? px(g) : 'no glyph',
        ratio: g && box ? Math.round((g / box) * 100) + ' per cent' : 'no glyph',
        /* A circle is 50 PER CENT, not 50 pixels. */
        r: /%\s*$/.test(cs.borderTopLeftRadius) ? cs.borderTopLeftRadius : px(cs.borderTopLeftRadius),
        tap: Math.round(box) >= 44 ? 'yes' : 'only with room around it'
      };
    });
    Array.prototype.forEach.call(circleCells, function (cell) {
      var d = circles[cell.getAttribute('data-n')];
      var k = cell.getAttribute('data-c');
      cell.textContent = d && d[k] ? d[k] : 'no value';
    });

    ORO.widthNow('wnow', 'wnow2');
  }

  /* ---------- the glyph shelf of the sizes section ---------- */
  var szIcons = document.getElementById('szIcons');
  function paintShelf() {
    if (!szIcons) return;
    szIcons.innerHTML = ICON_RUNGS.map(function (n) {
      return '<div class="gbdoc-slot">' +
        '<span class="gb-icon gb-icon--' + n + '" data-icon-name="close" aria-hidden="true">' + glyph('close') + '</span>' +
        '<span class="gbdoc-slot__cap"><b>' + n + '</b><span data-shelf="' + n + '">measuring</span></span>' +
        '</div>';
    }).join('');
    Array.prototype.forEach.call(szIcons.querySelectorAll('[data-shelf]'), function (cap) {
      var el = szIcons.querySelector('.gb-icon--' + cap.getAttribute('data-shelf'));
      if (!el) return;
      cap.textContent = px(getComputedStyle(el).width) + ' box, ' + onGlass(parseFloat(getComputedStyle(el).width), el.querySelector('svg')) + ' on the glass';
    });
  }

  /* ---------- the playground ----------
     gbppl-showcase-canon-1. The panel is not written here any more. This
     page hands GbOro.controls a SCHEMA — what an icon button HAS, in what
     group, with what default — and a function that draws one out of a
     state object; the rail, the rule that picks each control, the removed
     rows, the Reset, the ground on the stage and the Preview | Code fold
     belong to the renderer in oro.js.

     THE SEVEN AXES AND THE CONTROL THE RULE GIVES EACH:
       Behaviour  a toggle, and the ONE axis on this page the canon does
                  not name: two short values, so count and budget answer
                  it, and the console says so once
       Wash       a toggle, by the canon, which renamed it off Ground
       Size       a toggle of four rungs, lettered rather than measured
       Type       a toggle of three
       Colour     a Select, always: the longest words in the house
       Glyph      a Select: the set grows and the names are long
       State      a Select, always, and it is not asked of a static mark

     Ground is the stage's own switch, standing on the stage. */
  var STATE_CLASS = { hover: 'is-hover', focus: 'is-focus', active: 'is-active' };
  var GLYPH_NAME = { close: 'Close', search: 'Search gifts', cart: 'Cart', user: 'Account', filters: 'Filters' };

  var pgFoot = document.getElementById('pgFoot');

  var PG_AXES = [
    { id: 'behaviour', label: 'Behaviour', group: 'shape', def: 'interactive',
      values: [['interactive', 'Interactive'], ['static', 'Static']] },
    { id: 'wash', label: 'Wash', group: 'shape', def: 'washed',
      values: [['washed', 'Washed'], ['plain', 'Plain']] },
    { id: 'size', label: 'Size', group: 'shape', def: 'live',
      /* Initials, not words: see ORO_AXES.size in oro.js. Live keeps
         its word, because the 44 circle is not a rung of the ladder
         and has no initial to borrow. */
      values: [['small', 'S'], ['live', 'Live'], ['medium', 'M'],
               ['large', 'L']] },
    { id: 'type', label: 'Type', group: 'shape', def: 'ghost',
      values: [['ghost', 'Ghost'], ['outline', 'Outline'], ['filled', 'Filled']] },
    { id: 'colour', label: 'Colour', group: 'shape', def: 'secondary',
      values: [['primary', 'Primary'], ['secondary', 'Secondary'], ['inverse', 'Inverse']] },
    { id: 'glyph', label: 'Glyph', group: 'content', def: 'close',
      values: [['close', 'Close'], ['search', 'Search'], ['cart', 'Cart'],
               ['user', 'User'], ['filters', 'Filters']] },
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['active', 'Active'], ['disabled', 'Disabled']],
      when: function (S) { return S.behaviour !== 'static'; } }
  ];

  function pgClasses(S) {
    var c = ['gb-btn', 'gb-btn--icon'];
    if (S.size !== 'live') c.push('gb-btn--' + S.size);
    c.push('gb-btn--' + S.type, 'gb-btn--' + S.colour);
    if (S.wash === 'plain') c.push('gb-btn--plain');
    if (S.behaviour === 'static') c.push('gb-btn--static');
    return c;
  }

  function sampleHTML(S, forCode) {
    var c = pgClasses(S);
    var isStatic = S.behaviour === 'static';
    if (!forCode && !isStatic && STATE_CLASS[S.state]) c.push(STATE_CLASS[S.state]);
    var tag = isStatic ? 'span' : 'button';
    var name = GLYPH_NAME[S.glyph];
    /* The attributes go on a line of their own in the snippet: the
       class list of a four axis control is longer than the code
       block, and a line that runs under the copy pill is a line
       nobody can read. */
    var attr = isStatic
      ? ' aria-hidden="true"'
      : ' type="button" aria-label="' + name + '" title="' + name + '"' +
        (S.state === 'disabled' ? ' disabled' : '');
    var inner = '<span class="gb-btn__icon"' + (forCode ? '' : ' aria-hidden="true"') + '>' +
      (forCode ? '<svg viewBox="0 0 24 24">...</svg>' : glyph(S.glyph)) + '</span>';
    if (!forCode) {
      return '<' + tag + ' class="' + c.join(' ') + '"' + attr + '>' + inner + '</' + tag + '>';
    }
    return '<' + tag + ' class="' + c.join(' ') + '"\n' +
      new Array(tag.length + 3).join(' ') + attr.slice(1) + '>\n  ' + inner + '\n</' + tag + '>';
  }

  function lightChips(row, chosen) {
    Array.prototype.forEach.call(row.querySelectorAll('.gbdoc-seg'), function (seg) {
      var on = seg.getAttribute('data-val') === chosen;
      seg.classList.toggle('is-on', on);
      seg.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  function pgAfter(S, hold) {
    var el = hold.firstElementChild;
    if (!el) return;
    var cs = getComputedStyle(el);
    var ic = el.querySelector('.gb-btn__icon');
    var box = parseFloat(cs.width) || 0;
    var g = ic ? (parseFloat(getComputedStyle(ic).width) || 0) : 0;
    txt('pgBox', px(cs.width));
    txt('pgGlyph', ic ? px(g) : 'no glyph');
    txt('pgRatio', g && box ? Math.round((g / box) * 100) + ' per cent' : 'no glyph');
    txt('pgR', /%\s*$/.test(cs.borderTopLeftRadius) ? cs.borderTopLeftRadius : px(cs.borderTopLeftRadius));
    txt('pgBg', cs.backgroundColor);
    txt('pgInk', cs.color);
    txt('pgTarget', Math.round(box) + ' by ' + Math.round(parseFloat(cs.height) || 0) +
      (Math.round(box) >= 44 ? ', clears 44' : ', under 44'));
    txt('pgName', el.getAttribute('aria-label') || 'hidden from the reader');

    if (pgFoot) {
      pgFoot.innerHTML = S.behaviour === 'static'
        ? 'A static mark is a <code>span</code> with no name and no target: the pointer never lands on it, so it has no states to show, and the State row is not there to offer any.'
        : 'A live control: hover it, tab to it, hold the pointer down on it. The four held states are the demo classes, and no product page may wear them.';
    }
  }

  /* The two rules of the stage, and they are the workbench's own, said
     here for the second surface that needs them: a white cut on white is
     nothing, and black on Zinc 950 is nothing either. Filled inverse does
     exist on the circle, unlike on the button, which is why there is no
     third rule. */
  if (window.GbOro && window.GbOro.controls) {
    window.GbOro.controls({
      root: document.querySelector('[data-pg="iconbutton"]'),
      axes: PG_AXES,
      sample: sampleHTML,
      after: pgAfter,
      normalise: function (S) {
        if (S.ground === 'light' && S.colour === 'inverse') S.colour = 'secondary';
        if (S.ground === 'dark' && S.colour === 'secondary') S.colour = 'inverse';
        if (S.behaviour === 'static') S.state = 'rest';
      },
      available: function (S, axis, val) {
        if (axis !== 'colour') return true;
        if (val === 'inverse') return S.ground === 'dark';
        if (val === 'secondary') return S.ground === 'light';
        return true;
      }
    });
  }

  /* ---------- the variant workbench ---------- */
  var WB = { type: 'ghost', colour: 'secondary', wash: 'washed', ground: 'light' };
  var WB_STATES = [
    ['Rest', '', ''],
    ['Hover', ' is-hover', ''],
    ['Focus', ' is-focus', ''],
    ['Active', ' is-active', ''],
    ['Disabled', '', ' disabled']
  ];
  var WB_GLYPH = {
    'ghost secondary': 'close',
    'ghost inverse': 'search',
    'ghost primary': 'filters',
    'outline secondary': 'user',
    'outline inverse': 'user',
    'outline primary': 'user',
    'filled primary': 'cart',
    'filled secondary': 'cart',
    'filled inverse': 'cart'
  };

  var wbControls = document.getElementById('wbControls');
  var wbStage = document.getElementById('wbStage');
  var wbSizes = document.getElementById('wbSizes');
  var wbStates = document.getElementById('wbStates');
  var wbFoot = document.getElementById('wbFoot');
  var stBody = document.getElementById('stBody');

  /* The rules of the stage, said in one place: a white cut on white
     is nothing, and black on Zinc 950 is nothing either. */
  function wbNormalise() {
    if (WB.ground === 'light' && WB.colour === 'inverse') WB.colour = 'secondary';
    if (WB.ground === 'dark' && WB.colour === 'secondary') WB.colour = 'inverse';
  }
  function wbAvailable(axis, val) {
    if (axis !== 'colour') return true;
    if (val === 'inverse') return WB.ground === 'dark';
    if (val === 'secondary') return WB.ground === 'light';
    return true;
  }
  function wbGlyph() { return WB_GLYPH[WB.type + ' ' + WB.colour] || 'close'; }

  function circleHTML(size, extra, attr) {
    var c = ['gb-btn', 'gb-btn--icon'];
    if (size !== 'live') c.push('gb-btn--' + size);
    c.push('gb-btn--' + WB.type, 'gb-btn--' + WB.colour);
    if (WB.wash === 'plain') c.push('gb-btn--plain');
    return '<button class="' + c.join(' ') + extra + '" type="button" aria-label="Sample"' + attr + '>' +
      '<span class="gb-btn__icon" aria-hidden="true">' + glyph(wbGlyph()) + '</span></button>';
  }

  function paintWorkbench() {
    if (!wbStage) return;
    wbNormalise();
    var dark = WB.ground === 'dark';
    wbStage.classList.toggle('gbdoc-stage--dark', dark);

    wbSizes.innerHTML = CIRCLES.map(function (c) {
      return '<div class="gbdoc-slot">' + circleHTML(c[0], '', '') +
        '<span class="gbdoc-slot__cap"><b>' + c[1] + (c[0] === 'live' ? ' live' : '') + '</b>' +
        '<span data-cap="' + c[0] + '">measuring</span></span></div>';
    }).join('');

    wbStates.innerHTML = WB_STATES.map(function (st) {
      return '<div class="gbdoc-slot">' + circleHTML('live', st[1], st[2]) +
        '<span class="gbdoc-slot__cap"><b>' + st[0] + '</b></span></div>';
    }).join('');

    document.getElementById('wbSizesCap').textContent = 'Sizes, at rest';
    document.getElementById('wbStatesCap').textContent = 'States, on the live circle';

    Array.prototype.forEach.call(wbSizes.querySelectorAll('.gbdoc-slot'), function (slot) {
      var b = slot.querySelector('.gb-btn');
      var cap = slot.querySelector('[data-cap]');
      var ic = b.querySelector('.gb-btn__icon');
      cap.textContent = px(getComputedStyle(b).width) + ' circle, ' +
        (ic ? px(getComputedStyle(ic).width) : 'no') + ' glyph';
    });

    Array.prototype.forEach.call(wbControls.querySelectorAll('.gbdoc-axis'), function (row) {
      var axis = row.getAttribute('data-axis');
      lightChips(row, WB[axis]);
      Array.prototype.forEach.call(row.querySelectorAll('.gbdoc-seg'), function (chip) {
        var ok = wbAvailable(axis, chip.getAttribute('data-val'));
        chip.classList.toggle('is-unavailable', !ok);
        chip.setAttribute('aria-disabled', ok ? 'false' : 'true');
      });
    });

    var cls = 'gb-btn gb-btn--icon gb-btn--' + WB.type + ' gb-btn--' + WB.colour +
      (WB.wash === 'plain' ? ' gb-btn--plain' : '');
    wbFoot.innerHTML = 'On the stage: <code>' + cls + '</code>. ' + (dark
      ? 'Secondary is out on a dark ground: black on Zinc 950 is nothing.'
      : 'Inverse is out on a light ground: a white cut on white is nothing.');

    paintStateTable();
  }

  function paintStateTable() {
    if (!stBody) return;
    var slots = wbStates.querySelectorAll('.gbdoc-slot');
    var fam = WB.colour === 'primary' ? 'accent' : WB.colour === 'secondary' ? 'ink' : 'inverse';
    var candidates = [
      '--gb-btn-wash-icon-hover',
      '--gb-btn-fill-' + WB.colour, '--gb-btn-fill-' + WB.colour + '-hover', '--gb-btn-fill-' + WB.colour + '-active',
      '--gb-btn-wash-' + fam + '-hover', '--gb-btn-wash-' + fam + '-active',
      '--gb-btn-ink-' + WB.colour, '--gb-btn-ink-on-' + WB.colour,
      '--gb-btn-ink-' + WB.colour + '-hover', '--gb-btn-ink-' + WB.colour + '-active'
    ];
    stBody.innerHTML = Array.prototype.map.call(slots, function (slot, i) {
      var b = slot.querySelector('.gb-btn');
      var cs = getComputedStyle(b);
      var name = WB_STATES[i][0];
      var line = parseFloat(cs.borderTopWidth) ? px(cs.borderTopWidth) + ' ' + cs.borderTopColor : 'none';
      var tok = INSPECT.tokenFor
        ? (INSPECT.tokenFor(cs.backgroundColor, candidates) || INSPECT.tokenFor(cs.color, candidates))
        : null;
      if (name === 'Focus') tok = '--gb-btn-focus-ring' + (WB.colour === 'inverse' ? '-inverse' : '');
      if (name === 'Disabled') tok = '--gb-btn-disabled-opacity';
      return '<tr><td>' + name + '</td><td class="gbdoc-num">' + cs.backgroundColor +
        '</td><td class="gbdoc-num">' + cs.color + '</td><td class="gbdoc-num">' + line + '</td><td>' +
        (tok ? '<code>' + tok + '</code>' : '<span class="gbdoc-flag gbdoc-flag--none">In the organism</span>') +
        '</td></tr>';
    }).join('');
  }

  if (wbControls) {
    wbControls.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('.gbdoc-seg[data-val]') : null;
      if (!chip || chip.classList.contains('is-unavailable')) return;
      var axis = chip.parentNode.getAttribute('data-axis');
      if (!axis) return;
      WB[axis] = chip.getAttribute('data-val');
      paintWorkbench();
    });
  }

  /* The contrast figures are measured once, at load, on static
     plates: a stage in the middle of its 280ms transition reports a
     colour that is on no screen (trap 11 of the skill). */
  function paintContrastOnce() {
    var plate = document.createElement('div');
    plate.style.cssText = 'position:absolute;left:-9999px;top:0;background:var(--zinc-950);color:var(--zinc-900);';
    document.body.appendChild(plate);
    var dark = getComputedStyle(plate).backgroundColor;
    var chrome = getComputedStyle(plate).color;
    document.body.removeChild(plate);
    txt('ctInv', String(ratio('rgb(255, 255, 255)', dark)));
    txt('ctInk', String(ratio(chrome, 'rgb(255, 255, 255)')));
  }

  /* ---------- the set ---------- */
  var COPY_GLYPH =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" ' +
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<rect x="9" y="9" width="12" height="12" rx="2"/>' +
    '<path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>';

  function paintSet() {
    var body = document.getElementById('setBody');
    if (!body || !ICONS) return;
    body.innerHTML = ICONS.names().map(function (name) {
      var e = ICONS.entry(name);
      var cells = ['16', '20', '24'].map(function (n) {
        return '<td><span class="gb-icon gb-icon--' + n + '" aria-hidden="true">' + ICONS.svg(name) + '</span></td>';
      }).join('');
      return '<tr>' + cells +
        '<td><code>' + name + '</code></td>' +
        '<td>' + e.from + '</td>' +
        '<td class="gbdoc-num">' + e.stroke + '</td>' +
        '<td><button class="gbdoc-copybtn gbdoc-copybtn--inline" type="button" data-copy-icon="' + name + '" ' +
        'title="Copy the markup of this glyph" aria-label="Copy the markup of ' + name + '">' + COPY_GLYPH + '</button></td>' +
        '</tr>';
    }).join('');
  }

  /* ---------- copying ----------
     The snippet buttons are the showcase template and oro.js wires
     them (gbppl-oro-cleanup-1). The glyph rows are this page's own:
     a row copies the markup of ONE icon and answers with a tick on
     the button rather than a word, because the button is a glyph. */

  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('[data-copy-icon]') : null;
    if (!btn || !ICONS) return;
    var name = btn.getAttribute('data-copy-icon');
    ORO.copy('<span class="gb-icon gb-icon--20" aria-hidden="true">' + ICONS.svg(name) + '</span>')
      .then(function (ok) {
        if (!ok) return;
        btn.classList.add('is-done');
        setTimeout(function () { btn.classList.remove('is-done'); }, 1400);
      });
  });

  paintSet();
  paintShelf();
  paintAnatomy();
  /* gbppl-showcase-canon-1: the playground paints itself, on load and on
     resize alike, because GbOro.controls answers both for every panel on
     the page. That is why it is not in either list here. */
  paintWorkbench();
  paintContrastOnce();

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      paintAnatomy(); paintShelf(); paintWorkbench();
    }, 120);
  });
})();
</script>

<!-- The console. Its element is written by GbOro.page, with the drawer
     and the probes; these two files give it its doors and its rooms. -->
<script src="../../system/sandbox-registry.js"></script>
<script src="../../system/components/studio-panel.js"></script>
