<!-- ============================================================
     gbppl-oro-pages-1 / gbppl-btn-ladder-1 — THE BUTTON PAGE
     ------------------------------------------------------------
     Тон, 28.08 (Ton-19): «Каждый компонент должен быть представлен
     отдельной страницей, должна быть нормальная навигация...
     Пользователь заходит в раздел Components, никакого промежуточного
     каталога нет; сразу открывается вводная страница, что такое
     компоненты; дальше отдельные страницы самих компонентов.
     Посмотри, как это сделано в Tailwind, PrimeVue.»

     So this card moved out of components.html and became a page.
     WHAT MOVED AND WHAT DID NOT. Every section below is the same
     markup it was on the catalogue, in the same order, with the
     same ids: #buttons on the card, and #variants, #states,
     #sizes, #icons, #properties, #usage inside it. Nothing was
     rewritten, nothing was dropped, and the workbench and the
     playground were the same scripts (the playground became
     GbOro.controls on 31.08, gbppl-oro-canon-1: see the script at
     the foot of the page). Two things changed and both
     are structure, not content: the card head became the crumb at
     the top of the page, because a page about one component says
     its name once; and the five sections that had no id got one,
     so the contents list on the left can reach them.

     Old links still land. components.html keeps a redirect for the
     hashes that used to live on it (#buttons, #variants and the
     rest), and the «Open in Oro» of Inspect now points here.

     THE CARD TEMPLATE, the same thirteen sections in the same
     order as every other component page (ORO-SKILL 7a):
       Overview      what it is, status, which file owns it
       Playground    build one and read it back
       Variants      one at a time on a switchable stage
       States        a token table, measured
       Sizes         the height grid and its provenance
       With icon     the glyph subsection
       Anatomy       the measured numbers at this window width
       Properties    the modifier table, and the inspect drawer
       Usage         when to reach for which, and when not to
       Accessibility what the organism does for the keyboard
       Code          the markup to copy
       Changelog     what changed and what it used to be called
       Related       where to go next

     Ton-10: this page is a CONSUMER. Its card, tables, stages,
     chips and code blocks are the atoms of ..\components\docs.css;
     its drawer is ..\components\drawer.css; its specimens are the
     organism itself. What is left in the <style> block is the
     width of the reading column and nothing else.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement is read back out of the rendered page.

     .is-hover / .is-focus / .is-active are DEMO-ONLY classes,
     declared in button.css and said out loud below.

     gbppl-btn-ladder-1, 02.09 — THE RUNGS ARE WORDS, AND THERE ARE
     FIVE OF THEM. Ton settled the ladder by principle after the DS-2
     reconciliation of 01.09: the system speaks the mock's names
     (xsmall / small / medium / large / xlarge, 32 / 40 / 48 / 64 / 72
     at 2K), the curve down to small screens stays ours because the
     mock has none, and the rung at 56 is dissolved. So this page
     shows five rungs where it showed four, every letter in it is a
     word now, and Sizes, Anatomy, With icon, Properties and Usage
     were all rewritten to the new vocabulary. The heights of the four
     surviving ladders did not move by a pixel; what moved is the
     showcase's own M specimens, which are medium specimens now.

     gbppl-button-roles-1, 01.09 — WHICH RUNG GOES WHERE.
     Тон: «системное правило нужно чтобы мы знали какие кнопки
     куда... формы и флоу конверсии не могут иметь мелкие основные
     кнопки». Usage asks the rung question before the colour
     question, and since 02.09 in the new words: small is the
     furniture of a component, medium is a surface action and the
     confirm of a drawer that holds a form, large is the main action
     of a conversion flow, xlarge is that same rule's top rung on the
     one height live measured for it, and xsmall is waiting for its
     first carrier. The mirror is the half that catches mistakes: a
     form's main button is never small, furniture is never large.

     TWO THINGS THE WAVE DID NOT DO. It did not touch button.css:
     the ladders are August's measured ones, and this is a rule about
     where they may stand, not a change of what they are. And it did
     not move a single carrier onto its right rung. A census of every
     .gb-btn outside this showcase, 92 of them, found eight reading
     the chrome rung where the rule asks for the confirm rung: the four drawer Saves of the checkout,
     its Overwrite all, the Import all of its CSV dialog, and the two
     Post buttons of the comment thread. Five Cancels and one Resolve
     stand in those same rows and follow whatever their confirm does.
     Every one of them is a decision for Ton, one at a time, and not a
     cleanup done in passing.

     WHERE THE FOUR SIZE ROWS WENT. They used to sit at the foot of
     the colour table, which is a table about cells; the rung is a
     different question and now has a table of its own directly above
     it. Nothing they said was dropped.

     ------------------------------------------------------------
     gbppl-oro-engine-1, 01.09 — THE PAGE MOVED ONTO THE ENGINE, AND
     THIS ONE WENT FIRST BECAUSE IT IS THE PROOF
     ------------------------------------------------------------
     Тон, 01.09: «шаблон страницы компонента для дизайн-системы.
     Сделай как мини-приложение, чтобы фактически менялась только
     начинка... если мы потом будем его улучшать, он должен
     улучшаться по всей системе сразу.»

     So the shell of this page is gone from this file: the eleven
     stylesheet links, the studio bar, the rail, the contents aside,
     the reading column, the card, the section heads, the table
     wrappers, the code blocks, the playground card, the drawer, the
     probe box and the console element are all system/oro/oro-page.js
     now, and what is left here is the DECLARATION of what this page
     says. Not one word of it changed: this page is the reference
     showcase, and the wave's own gate was that it come back
     identical. It did. 390 is the same image to the byte; 1280 and
     1920 differ only in the antialiasing of text inside the sticky
     scene, at most 3 of 255 on a channel. Every section stands at
     the same y with the same height at all three widths, every
     measured number in every table reads the same, and the console
     is silent.

     ONE DEFECT THE MOVE FOUND, and it is worth the sentence because
     it would have been invisible: a <link> a script APPENDS does not
     block the script that comes after it, only a <link> the parser
     reads does. The first draft appended, the page looked perfectly
     right, and every colour in the state table came back as the
     browser's own button grey, because the measuring script had run
     before button.css was in. The engine writes its head into the
     parse stream for that reason and says so where it does it.
     ============================================================ -->

<!-- THE GATE, and the one line of the shell a page still writes: a
     parser inserted script blocks the parser, and a lock that does not
     block the parser is a lock the page paints around. -->
<script src="../components/studio.js" data-home="../../index.html"></script>

                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--medium gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__label">Continue</span><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span></button></div>\n'
                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--medium gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span><span class="gb-btn__label">Continue</span><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span></button></div>\n'
                  + '\n'

                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--large gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span><span class="gb-btn__label">Continue</span></button></div>\n'
                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--large gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__label">Continue</span><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span></button></div>\n'
                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--large gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span><span class="gb-btn__label">Continue</span><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span></button></div>\n'
                  + '\n'
                  + '            <div class="gbdoc-rowhead">xlarge · committing<small>glyph <b data-mi="xlarge">measuring</b>, label <b data-ml="xlarge">measuring</b></small></div>\n'
                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--xlarge gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span><span class="gb-btn__label">Continue</span></button></div>\n'
                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--xlarge gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__label">Continue</span><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span></button></div>\n'
                  + '            <div class="gbdoc-cell"><button class="gb-btn gb-btn--xlarge gb-btn--filled gb-btn--primary" type="button"><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span><span class="gb-btn__label">Continue</span><span class="gb-btn__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg></span></button></div>\n'
                  + '\n'
                  + '          </div>\n'
                  + '          </div>\n'
                  + '        </div>' },
        { note: 'The glyph does not have five scales, and that is deliberate: medium is flat at 16 because the live header carries no glyph inside a button at all, large climbs 16 then 20 then 24, xlarge is the only ladder with a rung of its own at 28 from 2000, and the two smallest are flat at 12 and at 12 then 16, which is where the mock floors its own. A glyph under 12 stops being a drawing. In a <code>--block</code> button the glyph leaves the row and parks against the padding edge, which is what the width axis of the playground shows. An icon only button is the <code>--icon</code> shape, added 28.08: a 44px circle holding one glyph and no label, measured off the v1 catalogue drawers and the header. It is a shape rather than a size, because "no label" and "how loud" are separate questions, and it carries an <code>aria-label</code> always: a glyph alone is only legible when its name is available some other way.' }
      ] },

    { id: 'anatomy', toc: 'Anatomy', eyebrow: 'Anatomy',
      h2: 'What each ladder measures right now',
      blocks: [
        { p: 'The table is measured, not typed: five hidden buttons wearing the five sizes are read with getComputedStyle every time the window changes size, so what you see is what this browser is rendering at this moment. Resize the window and the table moves with the ladders, which is the only honest way to show a scale that depends on screen width.' },
        { readout: 'Measured at <b id="wnow2">measuring</b> wide.' },
        { table: {
            head: ['Measure', 'xsmall · the floor', 'small · dense', 'medium · chrome', 'large · forms', 'xlarge · committing', 'Provenance'],
            rows: '<tr><td>Height</td><td class="gbdoc-num" data-m="h" data-s="xsmall"></td><td class="gbdoc-num" data-m="h" data-s="small"></td><td class="gbdoc-num" data-m="h" data-s="medium"></td><td class="gbdoc-num" data-m="h" data-s="large"></td><td class="gbdoc-num" data-m="h" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span> medium, large, xlarge · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the two smallest</td></tr>\n'
                  + '<tr><td>Padding, vertical</td><td class="gbdoc-num" data-m="py" data-s="xsmall"></td><td class="gbdoc-num" data-m="py" data-s="small"></td><td class="gbdoc-num" data-m="py" data-s="medium"></td><td class="gbdoc-num" data-m="py" data-s="large"></td><td class="gbdoc-num" data-m="py" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span>, a flat 8 everywhere but xsmall, where 8 would make the rung taller than itself</td></tr>\n'
                  + '<tr><td>Padding, horizontal</td><td class="gbdoc-num" data-m="px" data-s="xsmall"></td><td class="gbdoc-num" data-m="px" data-s="small"></td><td class="gbdoc-num" data-m="px" data-s="medium"></td><td class="gbdoc-num" data-m="px" data-s="large"></td><td class="gbdoc-num" data-m="px" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span> medium, large, xlarge · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the two smallest, flat at 16</td></tr>\n'
                  + '<tr><td>Gap</td><td class="gbdoc-num" data-m="gap" data-s="xsmall"></td><td class="gbdoc-num" data-m="gap" data-s="small"></td><td class="gbdoc-num" data-m="gap" data-s="medium"></td><td class="gbdoc-num" data-m="gap" data-s="large"></td><td class="gbdoc-num" data-m="gap" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span> medium and large · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> xsmall, small and xlarge</td></tr>\n'
                  + '<tr><td>Label</td><td class="gbdoc-num" data-m="label" data-s="xsmall"></td><td class="gbdoc-num" data-m="label" data-s="small"></td><td class="gbdoc-num" data-m="label" data-s="medium"></td><td class="gbdoc-num" data-m="label" data-s="large"></td><td class="gbdoc-num" data-m="label" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span> medium, large, xlarge · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the two smallest, floored at 10</td></tr>\n'
                  + '<tr><td>Icon</td><td class="gbdoc-num" data-m="icon" data-s="xsmall"></td><td class="gbdoc-num" data-m="icon" data-s="small"></td><td class="gbdoc-num" data-m="icon" data-s="medium"></td><td class="gbdoc-num" data-m="icon" data-s="large"></td><td class="gbdoc-num" data-m="icon" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span> large · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the rest</td></tr>\n'
                  + '<tr><td>Outer type</td><td class="gbdoc-num" data-m="font" data-s="xsmall"></td><td class="gbdoc-num" data-m="font" data-s="small"></td><td class="gbdoc-num" data-m="font" data-s="medium"></td><td class="gbdoc-num" data-m="font" data-s="large"></td><td class="gbdoc-num" data-m="font" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span> medium, large, xlarge · <span class="gbdoc-flag gbdoc-flag--declared">Declared</span> the two smallest</td></tr>\n'
                  + '<tr><td>Radius</td><td class="gbdoc-num" data-m="r" data-s="xsmall"></td><td class="gbdoc-num" data-m="r" data-s="small"></td><td class="gbdoc-num" data-m="r" data-s="medium"></td><td class="gbdoc-num" data-m="r" data-s="large"></td><td class="gbdoc-num" data-m="r" data-s="xlarge"></td><td><span class="gbdoc-flag">Live</span>, the one brand radius</td></tr>' } },
        { note: 'A note on the proportion formula of 17 August, pad-y = 0.24H and pad-x = 0.5H with the gap equal to pad-y. It still describes the small end well: 36 gives 8.6, which rounds to the live 8. Above that, live and the formula part company. The live form submit and the live product CTA both hold pad-y at 8 and run their gaps two or three times wider than that. Where live has measured a number, live wins, and the formula is the tie breaker for the sizes live has never shown, which is why every number the live product has never shown is marked declared.' }
      ] },

    { id: 'properties', toc: 'Properties', eyebrow: 'Properties',
      h2: 'The modifiers, and the drawer that reads a specimen',
      blocks: [
        { p: 'Two layers, the way the mature systems keep them. The table is the whole surface of the component, readable and linkable in one piece. The drawer answers a different question, about one specimen: the Properties button in the corner of any specimen on this page opens it with the geometry, the type, the colours and the transition measured off that element, with the token that produced each value beside it. It is the first brick of the dev mode Ton asked for, and it means a developer never has to open a stylesheet to learn what a component measures.' },
        { table: {
            head: ['Modifier', 'Axis', 'Default', 'What it does'],
            rows: '<tr><td><code>--xsmall --small --medium --large --xlarge</code></td><td>Size</td><td><code>--large</code></td><td>Chooses which of the five ladders the geometry slots point at. All five are declared on the element, so a size modifier can never lose a specificity race. Beside <code>--icon</code> the same three middle words mean the three flat circles instead: 40, 48 and 56</td></tr>\n'
                  + '<tr><td><code>--filled --outline --ghost</code></td><td>Type</td><td><code>--filled</code></td><td>How the paint slots read the palette: filled spends the fill, outline and ghost spend the accent and lay a wash under themselves on hover</td></tr>\n'
                  + '<tr><td><code>--primary --secondary --inverse</code></td><td>Colour</td><td><code>--primary</code></td><td>Which palette the paint slots point at. Blue is state, black is furniture, white is for a dark ground</td></tr>\n'
                  + '<tr><td><code>--block</code></td><td>Width</td><td>off</td><td>The button takes the whole row: 100 per cent wide, the glyph parked against the padding edge and the label centred in the full width</td></tr>\n'
                  + '<tr><td><code>--icon</code></td><td>Shape</td><td>off</td><td>A 44px circle carrying one glyph and no label, at every width. Type, colour and state stay with the modifiers already in the class; only the box changes. Needs an <code>aria-label</code></td></tr>\n'
                  + '<tr><td><code>.gb-btn__label</code></td><td>Slot</td><td>required</td><td>The label span. Carries the label type on top of the ladder type, so the two never drift apart</td></tr>\n'
                  + '<tr><td><code>.gb-btn__icon</code></td><td>Slot</td><td>optional</td><td>A square box in the current ink. Before or after the label is DOM order; two glyphs is two spans</td></tr>\n'
                  + '<tr><td><code>disabled</code></td><td>State</td><td>off</td><td>The native attribute. On a link use <code>aria-disabled="true"</code>, which the organism honours the same way</td></tr>\n'
                  + '<tr><td><code>.is-hover .is-focus .is-active</code></td><td>Demo</td><td>off</td><td>Hold a state still for a screenshot. This page only, never a product page</td></tr>' } }
      ] },

    { id: 'usage', toc: 'Usage', eyebrow: 'Usage',
      h2: 'Which rung, which cell, and when',
      blocks: [
        { p: 'Two questions, and the rung is asked first. Ton settled it on 1 September: what an action is decides how tall its button is, and the room the button happens to stand in decides nothing. So the ladders are ranks of action, and someone who learns them on one screen can predict the next one. The heights themselves are not repeated here: they are measured, not typed, in Sizes and Anatomy above.' },
        { table: {
            head: ['Rung', 'The action it carries', 'Never'],
            rows: '<tr><td>xsmall</td><td>Nothing yet, and that is the honest answer. The rung exists because the mock draws it and because the curve reaches it; the first control to stand on it arrives with a reason of its own and a measurement</td><td>Anywhere, until that reason exists. A rung with no carrier is a guess, and this one is drawn on this page so the guess can be looked at rather than shipped</td></tr>\n'
                  + '<tr><td>small</td><td>The furniture of a component: what a bar, a header, a table row, a panel or a drawer\'s own chrome carries. Add, remove, filter, paginate, close, the quiet actions that move things around rather than answer anything</td><td>The main action of a form, or the committing step of a flow. A form that is asking a question never gets a furniture button to collect the answer</td></tr>\n'
                  + '<tr><td>medium</td><td>A standalone action on the surface of a page, and the confirm of a dialog or of a drawer that holds a form of its own: Save, Apply, Post. Heavier than furniture, lighter than a flow. The site header is measured at this rung</td><td>The one action a conversion flow is asking for</td></tr>\n'
                  + '<tr><td>large</td><td>The main action of a conversion flow: the submit of a form, the Continue of a step, a sign in, the hero action that opens the flow. The default, and one of them per screen</td><td>Furniture, and a bar, where it will not fit</td></tr>\n'
                  + '<tr><td>xlarge</td><td>The single completing action of a whole template, on the one height live measured for it: the one that spends the money or ends the flow</td><td>More than once on a page, or anywhere the flow still has a step after it</td></tr>' } },
        { table: {
            head: ['Do', 'Do not'],
            rows: '<tr><td>Ask what the action is before asking where it stands. A submit is a submit on a page, in a drawer and in a popup, and it keeps its rung in all three</td><td>Pick the rung from the room. A tight footer is a reason to change the layout, not a reason to hand a form a chrome button</td></tr>\n'
                  + '<tr><td>Give one screen one L, and separate a second action of the same rank by cell so the pair stands on one line</td><td>Answer a pair by shrinking the second half. Two rungs side by side read as two heights, not as two ranks</td></tr>\n'
                  + '<tr><td>Let furniture stay small. An action inside a component is small because it is meant to be quiet, and quiet is the whole of its job</td><td>Reach for a large inside a component to make it louder. That loudness belongs to a flow, and the flow is somewhere else</td></tr>\n'
                  + '<tr><td>Move a confirm up to medium when the drawer or the dialog it closes holds a form of its own</td><td>Leave a Save or a Post on the chrome rung because its neighbours are chrome. The cross and the back arrow are chrome; the answer to a form is not</td></tr>' } },
        { note: 'Ton, 1 September: «формы и флоу конверсии не могут иметь мелкие основные кнопки». The mirror of the rule is the half that catches mistakes. The main button of a form is never small: a conversion flow takes large, a form living inside a dialog or a drawer takes medium. Furniture is never large, and wanting a large inside a component is the sign that the action is a conversion standing in the wrong room.' },
        { p: 'The second question is the cell. Blue is state, black is furniture. That split is not decoration either: it is the rule that keeps the accent meaning something, and it decides the colour once the rank is known.' },
        { table: {
            head: ['Reach for', 'When', 'Not when'],
            rows: '<tr><td>Filled primary</td><td>The single action the screen is asking for</td><td>Never twice in one view. Two blue buttons side by side means neither of them is the answer</td></tr>\n'
                  + '<tr><td>Filled secondary</td><td>Furniture that still has to carry weight, standing where no blue action competes with it</td><td>Beside a filled primary. Use an outline there instead</td></tr>\n'
                  + '<tr><td>Outline primary</td><td>A second action of the same rank, beside a filled one</td><td>Alone on a screen. If it is the only action, it is the primary and should be filled</td></tr>\n'
                  + '<tr><td>Outline secondary</td><td>Permanent chrome: the action that is simply always there, whatever the screen state</td><td>For the thing you actually want the visitor to do</td></tr>\n'
                  + '<tr><td>Ghost</td><td>The quiet exit: Cancel, Not now, Change choice. Present, never loud</td><td>Alone in an empty area. A ghost with no neighbour reads as text, and a faint tertiary reads as disabled</td></tr>\n'
                  + '<tr><td>Outline inverse</td><td>Chrome standing on a dark or photographic ground</td><td>On white, where the white cut disappears</td></tr>\n'
                  + '<tr><td>Ghost inverse</td><td>The quiet action on a dark panel that is already busy</td><td>Where it is the only thing on the plate</td></tr>\n'
                  + '<tr><td>Filled inverse</td><td>Nowhere yet. No live screen wears a solid white button, so the workbench does not offer one. Ask Ton before the first one ships</td><td>On a dark ground, where the blue filled primary is the live answer: it stays blue and it stays the action being asked for</td></tr>\n'
                  + '<tr><td>Width block</td><td>A form submit that owns its column: the glyph parks at the padding edge and the label centres</td><td>In a row of actions, where two block buttons would stack</td></tr>' } },
        { note: 'The label is copy and follows the copy rules: sentence case in the markup, since the organism sets the caps itself, a verb first, no full stop.' }
      ] },

    { id: 'a11y', toc: 'Accessibility', eyebrow: 'Accessibility',
      h2: 'Keyboard, contrast and target size',
      blocks: [
        { table: {
            rows: '<tr><td>Keyboard</td><td>The focus ring is <code>:focus-visible</code>, so it appears for the person who arrived by Tab and not for a mouse click. Two pixels at two pixels offset, and white instead of blue on a dark ground</td></tr>\n'
                  + '<tr><td>Disabled</td><td><code>disabled</code> on a button, <code>aria-disabled="true"</code> on a link. The organism disarms both with pointer-events, and the button keeps its colour rather than turning grey so the person can still see which action is waiting on them</td></tr>\n'
                  + '<tr><td>Icons</td><td>Every glyph is <code>aria-hidden="true"</code> and rides beside a real label. A button with a glyph and no label needs a name of its own, and it needs a tooltip</td></tr>\n'
                  + '<tr><td>Contrast</td><td>The label on every filled variant clears 4.5 to 1, and the hairline of an outline clears 3 to 1 against its ground. The two dark ground pairs are measured live in the variants section above</td></tr>\n'
                  + '<tr><td>Target size</td><td>The floor of the organism is 28, on xsmall, and Ton set it there rather than at the 24 the curve asks for, because a finger matters more than a curve. It still does not clear the 44 a thumb wants, and neither do small, medium or large at base: the rungs that clear 44 at every width are large from 1280 and xlarge everywhere. A control that is the subject of a touch screen takes one of those</td></tr>' } }
      ] },

    { id: 'code', toc: 'Code', eyebrow: 'Code',
      h2: 'The class, and three words after it',
      blocks: [
        { p: 'The base class plus three words. Filled, primary and large are the defaults, so a bare <code>gb-btn</code> is already the button most screens want.' },
        { code: { id: 'codeBasics',
            text: '&lt;!-- the default: filled, primary, large --&gt;\n'
                  + '&lt;button class="gb-btn" type="button"&gt;\n'
                  + '  &lt;span class="gb-btn__label"&gt;Book a meeting&lt;/span&gt;\n'
                  + '&lt;/button&gt;\n'
                  + '\n'
                  + '&lt;!-- a header button: the chrome rung, outlined, black --&gt;\n'
                  + '&lt;a class="gb-btn gb-btn--medium gb-btn--outline gb-btn--secondary" href="#"&gt;\n'
                  + '  &lt;span class="gb-btn__label"&gt;My portal&lt;/span&gt;\n'
                  + '&lt;/a&gt;\n'
                  + '\n'
                  + '&lt;!-- the same button on a dark ground --&gt;\n'
                  + '&lt;a class="gb-btn gb-btn--medium gb-btn--outline gb-btn--inverse" href="#"&gt;\n'
                  + '  &lt;span class="gb-btn__label"&gt;My portal&lt;/span&gt;\n'
                  + '&lt;/a&gt;\n'
                  + '\n'
                  + '&lt;!-- a form submit: full width, glyph at the padding edge --&gt;\n'
                  + '&lt;button class="gb-btn gb-btn--large gb-btn--block" type="submit"&gt;\n'
                  + '  &lt;span class="gb-btn__label"&gt;Continue&lt;/span&gt;\n'
                  + '  &lt;span class="gb-btn__icon"&gt;&lt;svg&gt;...&lt;/svg&gt;&lt;/span&gt;\n'
                  + '&lt;/button&gt;' } }
      ] },

    { id: 'changelog', toc: 'Changelog', eyebrow: 'Changelog',
      h2: 'What each old class became',
      blocks: [
        { p: 'Ton approved the migration on 26 August. Four local button ladders lived across the prototypes, each written for the screen it was needed on, and all four are gone. Nothing was left behind as an alias: an alias is a second name for the same thing, and a second name is the drift this organism exists to end.' },
        { table: {
            head: ['Was', 'Where it lived', 'Is now', 'What moved'],
            rows: '<tr><td><code>.gbh-cta</code></td><td>Header, Book a meeting</td><td><code>--medium --filled --primary</code></td><td>Nothing. Identical to the pixel at 1280, 1920 and 2258, label included</td></tr>\n'
                  + '<tr><td><code>.gbh-cta--outline</code></td><td>Header, My portal</td><td><code>--medium --outline --secondary</code></td><td>Nothing. Geometry, ink, hairline and hover wash all match</td></tr>\n'
                  + '<tr><td><code>.gbh-cta--inverted</code></td><td>The dark Gifts panel and the transparent header</td><td><code>--medium --outline --inverse</code></td><td>Nothing. The inverse colour was built out of these live values. On the transparent header the variant is now swapped by script instead of repainted by a second copy of the same numbers</td></tr>\n'
                  + '<tr><td><code>.gba-btn</code></td><td>Guest sign in, booking, the studio gate</td><td><code>--large --filled --primary --block</code></td><td>Nothing. Its full width anatomy became the <code>--block</code> modifier, so the arrow still sits at the padding edge</td></tr>\n'
                  + '<tr><td><code>.gba-btn--inline</code></td><td>Nowhere, since the hub door lost its button</td><td><code>--large</code>, the plain default</td><td>Deleted. It had no consumers left</td></tr>\n'
                  + '<tr><td><code>.btn-xl</code></td><td>Checkout, Place order</td><td><code>--xlarge --filled --primary --block</code></td><td>The label grows from 11 to the live 15. It was XL geometry wearing S typography, which is the mismatch we were caught on once already</td></tr>\n'
                  + '<tr><td><code>.btn-cta</code></td><td>Portal landing, the two hero CTAs</td><td><code>--large --filled --primary</code> and <code>--secondary</code>, both <code>--block</code></td><td>Padding at 1280 moves from 28 to the live 32, the text moves into the label span and takes the live label with it, and the ink moves from white to Zinc 50</td></tr>\n'
                  + '<tr><td><code>.btn-start</code></td><td>Portal, the Start Gifting block</td><td><code>--large --filled --primary</code> and <code>--outline --secondary</code></td><td>The same three as above. The felt minimum width stays on the page as <code>.hs-cta</code>, because it is composition and not a property of the button</td></tr>\n'
                  + '<tr><td><code>.btn-bar</code></td><td>Portal, the sticky bar</td><td><code>--medium --filled --primary</code> and <code>--outline --secondary</code></td><td>Horizontal padding at base width moves from 20 to the live 16. The 20 was the wide step spent early, and the file already called it an anomaly</td></tr>\n'
                  + '<tr><td><code>.gsp-btn</code></td><td>Portal, the start popup</td><td><code>--large --filled --primary</code></td><td>It stops being flat at 48 and climbs with the window like everything else</td></tr>\n'
                  + '<tr><td><code>.gsp-btn--quiet</code></td><td>Portal, Copy number</td><td><code>--large --outline --secondary</code></td><td>The same quiet white and hairline, said in the system\'s words</td></tr>\n'
                  + '<tr><td><code>.btn-send</code></td><td>Portal, the gift card</td><td><code>--large --filled --secondary --block</code></td><td>Zinc 800 becomes the system\'s Zinc 900, and the hover finally darkens instead of lightening</td></tr>' } },
        { note: 'What the consumers kept is layout only: where the button stands, how wide its row is, what margin sits over it. One button on the checkout still asks for a colour the organism does not have, the red Overwrite all. Since 27 August it wears the organism and repaints that one instance through the component\'s own accent slots, because there is no danger cell to point at. The cell is a decision for Ton, not a cleanup.' },
        { note: '2 September: the ladder gets its final names. Ton settled it by principle after the reconciliation with DS-2: five rungs at 2K, 32 / 40 / 48 / 64 / 72, called xsmall, small, medium, large and xlarge, because the system should speak the language of the file the team reads. Our S became medium, L became large, XL became xlarge, and not one height moved with the word. The rung at 56 was dissolved: the old M was the only ladder here that neither the live product nor the mock had ever shown, and small now stands on the 40 step it was cut to fill. xsmall was built the same day, on the same curve, with a floor of 28 rather than the 24 the curve asks for. No alias was left behind and every carrier moved in the same commit.' },
        { note: '1 September: the rungs get a rule. Which size an action wears is now answered in Usage by what the action is, not by the room it stands in, and the four size rows leave the colour table for a table of their own. Nothing in <code>button.css</code> moved: the ladders are the ones measured in August, and the carriers that read the wrong rung are listed for Ton one at a time rather than corrected in passing.' }
      ] },

    { eyebrow: 'Related',
      h2: 'Where to go next',
      blocks: [
        { p: '<a href="field.html">Field</a>, which the button submits, and <a href="colors.html">Colors</a>, where the blue and the zinc it spends are documented.' }
      ] }
  ],
  sources: 'Sources: <a href="../components/button.css">button.css</a>, <a href="../components/auth.css">auth.css</a>, <a href="../components/docs.css">docs.css</a>, <a href="../components/drawer.css">drawer.css</a> and the token blocks of <a href="../assets/tokens.css">tokens.css</a> · every component on this page, including the page\'s own furniture, is rendered by those files.',
  probes: '<button class="gb-btn gb-btn--xsmall" id="probe-xsmall" type="button" tabindex="-1"><span class="gb-btn__icon"><svg viewBox="0 0 24 24"></svg></span><span class="gb-btn__label">Probe</span></button>\n'
          + '<button class="gb-btn gb-btn--small" id="probe-small" type="button" tabindex="-1"><span class="gb-btn__icon"><svg viewBox="0 0 24 24"></svg></span><span class="gb-btn__label">Probe</span></button>\n'
          + '<button class="gb-btn gb-btn--medium" id="probe-medium" type="button" tabindex="-1"><span class="gb-btn__icon"><svg viewBox="0 0 24 24"></svg></span><span class="gb-btn__label">Probe</span></button>\n'
          + '<button class="gb-btn gb-btn--large" id="probe-large" type="button" tabindex="-1"><span class="gb-btn__icon"><svg viewBox="0 0 24 24"></svg></span><span class="gb-btn__label">Probe</span></button>\n'
          + '<button class="gb-btn gb-btn--xlarge" id="probe-xlarge" type="button" tabindex="-1"><span class="gb-btn__icon"><svg viewBox="0 0 24 24"></svg></span><span class="gb-btn__label">Probe</span></button>'
});
</script>

<script src="../type-scale.js"></script>
<script src="../components/icon.js"></script>
<script src="../components/auth.js"></script>
<script src="../components/toggle.js"></script>
<script src="../components/drawer.js"></script>
<script src="../components/inspect.js"></script>
<script src="../components/comments.js"></script>
<script>
/* ============================================================
   gbppl-oro-components-3 / gbppl-oro-pages-1 / gbppl-oro-cleanup-1
   — THE READOUT, THE PLAYGROUND AND THE VARIANT WORKBENCH
   ------------------------------------------------------------
   gbppl-oro-cleanup-1 (28.08) took the five things that were not
   about buttons at all — px, txt, the clipboard, the contents
   reader and the width readout — out to window.GbOro in oro.js,
   where the other seven showcases read them too. This page was
   the reference the other seven were levelled to, so not one of
   the five behaves differently here than it did.
   ------------------------------------------------------------
   Three jobs, one file, and one rule over all three: NOTHING ON
   THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every measurement is
   read back out of the rendered page with getComputedStyle, so
   if a token moves the page moves with it, and if an organism
   breaks it breaks here first.

   THE READOUT fills the anatomy tables from four probe buttons
   standing off screen in the four sizes.

   THE PLAYGROUND is a schema handed to GbOro.controls
   (gbppl-oro-canon-1): this page says what the button HAS and how
   one is drawn out of a state object, and oro.js draws the rail,
   picks a control per axis by the rule, hides what does not apply
   and folds the markup into the card. The snippet is generated
   from the same state as the specimen, so the code cannot drift
   from the thing beside it.

   THE WORKBENCH shows ONE variant: the chips choose it, the top
   band renders it in the four sizes and the band below in the
   five states, each specimen captioned with its own measured
   height and label. Its state table is filled by measuring those
   five specimens. This is the shape every mature system uses and
   the answer to Ton's «матрица должна быть гибче и показывать не
   всё сразу».
   ============================================================ */
(function () {
  'use strict';

  var INSPECT = window.GbInspect || {};

  /* ---------- shared readers ----------
     gbppl-oro-cleanup-1: px, txt, the clipboard, the contents and
     the width readout are the showcase template, not this page.
     They live in oro.js as window.GbOro; the two names below stay
     because every call site in this file spells them px and txt. */
  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  function readBtn(el) {
    var cs = getComputedStyle(el);
    var label = el.querySelector('.gb-btn__label');
    var icon = el.querySelector('.gb-btn__icon');
    var ls = label ? getComputedStyle(label) : null;
    var is = icon ? getComputedStyle(icon) : null;
    return {
      h: px(cs.minHeight),
      py: px(cs.paddingTop),
      px: px(cs.paddingLeft),
      gap: px(cs.columnGap),
      label: ls ? px(ls.fontSize) + ' / ' + ls.fontWeight : 'no label',
      labelSize: ls ? px(ls.fontSize) : 'no label',
      icon: is ? px(is.width) : 'no icon',
      font: px(cs.fontSize) + ' / ' + cs.fontWeight,
      r: px(cs.borderTopLeftRadius),
      bg: cs.backgroundColor,
      ink: cs.color
    };
  }

  /* Relative luminance and the WCAG ratio, so the dark ground
     claims on this page are measured rather than remembered. */
  function lum(c) {
    var m = String(c).match(/[\d.]+/g);
    if (!m) return 0;
    var f = function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    return 0.2126 * f(+m[0]) + 0.7152 * f(+m[1]) + 0.0722 * f(+m[2]);
  }
  function ratio(a, b) {
    var x = lum(a), y = lum(b);
    if (y > x) { var t = x; x = y; y = t; }
    return Math.round(((x + 0.05) / (y + 0.05)) * 100) / 100;
  }

  /* ---------- the anatomy readout ---------- */
  var sizes = {
    xsmall: 'probe-xsmall', small: 'probe-small', medium: 'probe-medium',
    large: 'probe-large', xlarge: 'probe-xlarge'
  };
  var cells = document.querySelectorAll('[data-m][data-s]');
  var iconCaps = document.querySelectorAll('[data-mi]');
  var labelCaps = document.querySelectorAll('[data-ml]');

  function paintAnatomy() {
    var data = {};
    for (var k in sizes) {
      var el = document.getElementById(sizes[k]);
      data[k] = el ? readBtn(el) : null;
    }
    Array.prototype.forEach.call(cells, function (cell) {
      var d = data[cell.getAttribute('data-s')];
      var m = cell.getAttribute('data-m');
      cell.textContent = d && d[m] ? d[m] : 'no value';
    });
    Array.prototype.forEach.call(iconCaps, function (cap) {
      var d = data[cap.getAttribute('data-mi')];
      cap.textContent = d ? d.icon : 'no value';
    });
    Array.prototype.forEach.call(labelCaps, function (cap) {
      var d = data[cap.getAttribute('data-ml')];
      cap.textContent = d ? d.labelSize : 'no value';
    });

    ORO.widthNow('wnow', 'wnow2');
  }

  /* ---------- the playground ----------
     gbppl-oro-canon-1. The panel is not here any more. This page hands
     GbOro.controls a SCHEMA — what the button has, in what group, with
     what default — and a function that draws one button out of a state
     object; the rail, the rule that picks each control, the conditional
     rows, the More fold, the Reset, the ground on the stage and the
     Preview | Code fold all belong to the renderer in oro.js and are the
     same on every showcase after this one.

     THE AXES, AND THE CONTROL THE RULE GIVES EACH (canon in ORO_AXES):
       Size          toggle, always: a short ordered ladder is compared
       Type          toggle up to four; a fifth type splits the axis
       Colour        Select, always: the longest words in the house
       State         Select, always: five values, half unavailable
       Icon          switch (a native checkbox until Figma is opened)
       Icon position toggle, and only while Icon is on
       Block width   switch, under More
       Label         field, under More
       Glyph         Select, under More, and only while Icon is on

     WHAT CHANGED IN WHAT THE PANEL CAN SAY. The old six rows had one
     Icon axis of four values (None / Before / After / Both); the canon
     splits it, because «is there a glyph» and «where does it stand» are
     two questions and the first one is a boolean. And Ground arrived:
     the old playground darkened the stage when the colour was inverse,
     which made a property of the stage a side effect of a property of
     the button. Now the stage has its own switch, and the three rules
     the variant workbench below states hold here too — a white cut on
     white is nothing, black on Zinc 950 is nothing, and no live screen
     wears a solid white button — said once in normalise and available. */
  var GLYPHS = {
    box:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 8.5h17v12h-17zM3.5 8.5l2-4h13l2 4M12 4.5v16"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h14M12.5 6l6 6-6 6"/></svg>',
    plus:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m4.5 12.5 5 5 10-11"/></svg>'
  };
  var STATE_CLASS = { hover: 'is-hover', focus: 'is-focus', active: 'is-active' };

  function escHTML(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var PG_AXES = [
    { id: 'size',    label: 'Size',   group: 'shape', def: 'large',
      /* Initials, not words: see ORO_AXES.size in oro.js. The full
         rung name is in the code fold and in every table below. */
      values: [['xsmall', 'XS'], ['small', 'S'], ['medium', 'M'],
               ['large', 'L'], ['xlarge', 'XL']] },
    { id: 'type',    label: 'Type',   group: 'shape', def: 'filled',
      values: [['filled', 'Filled'], ['outline', 'Outline'], ['ghost', 'Ghost']] },
    { id: 'colour',  label: 'Colour', group: 'shape', def: 'primary',
      values: [['primary', 'Primary'], ['secondary', 'Secondary'], ['inverse', 'Inverse']] },
    { id: 'state',   label: 'State',  group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['active', 'Active'], ['disabled', 'Disabled']] },
    { id: 'icon',    label: 'Icon',   group: 'content', kind: 'bool',
      on: 'yes', off: 'no', def: 'no' },
    { id: 'iconPos', label: 'Icon position', group: 'content', def: 'before',
      values: [['before', 'Before'], ['after', 'After'], ['both', 'Both']],
      when: function (S) { return S.icon === 'yes'; } },
    { id: 'width',   label: 'Block width', group: 'content', kind: 'bool', advanced: true,
      on: 'block', off: 'auto', def: 'auto' },
    { id: 'label',   label: 'Label', group: 'content', kind: 'text', advanced: true,
      def: 'Book a meeting' },
    { id: 'glyph',   label: 'Glyph', group: 'content', def: 'box', advanced: true,
      values: [['box', 'Box'], ['arrow', 'Arrow'], ['plus', 'Plus'], ['check', 'Check']],
      when: function (S) { return S.icon === 'yes'; } }
  ];

  function pgSample(S, forCode) {
    var c = ['gb-btn', 'gb-btn--' + S.size, 'gb-btn--' + S.type, 'gb-btn--' + S.colour];
    if (S.width === 'block') c.push('gb-btn--block');
    if (!forCode && STATE_CLASS[S.state]) c.push(STATE_CLASS[S.state]);
    var dis = S.state === 'disabled' ? ' disabled' : '';
    var nl = forCode ? '\n  ' : '';
    var g = forCode ? '<svg>...</svg>' : (GLYPHS[S.glyph] || GLYPHS.box);
    var pos = S.icon === 'yes' ? S.iconPos : 'none';
    var inner = '';
    if (pos === 'before' || pos === 'both') {
      inner += nl + '<span class="gb-btn__icon"' + (forCode ? '' : ' aria-hidden="true"') + '>' + g + '</span>';
    }
    inner += nl + '<span class="gb-btn__label">' + escHTML(S.label || 'Book a meeting') + '</span>';
    if (pos === 'after' || pos === 'both') {
      inner += nl + '<span class="gb-btn__icon"' + (forCode ? '' : ' aria-hidden="true"') + '>' + g + '</span>';
    }
    return '<button class="' + c.join(' ') + '" type="button"' + dis + '>' +
           inner + (forCode ? '\n' : '') + '</button>';
  }

  /* The eight measured values under the card, read off the specimen the
     panel has just mounted. This is the readout of the playground and
     the only one it has: the footer band carries the view switch and no
     second copy of these numbers. */
  function pgReadout(S, hold) {
    var el = hold.querySelector('.gb-btn');
    if (!el) return;
    var d = readBtn(el);
    txt('pgH', d.h);
    txt('pgPad', d.py + ' / ' + d.px);
    txt('pgGap', d.gap);
    txt('pgLabel', d.label);
    txt('pgIcon', d.icon);
    txt('pgFont', d.font);
    txt('pgBg', d.bg);
    txt('pgInk', d.ink);
  }

  if (window.GbOro && window.GbOro.controls) {
    window.GbOro.controls({
      root: document.querySelector('[data-pg="button"]'),
      axes: PG_AXES,
      sample: pgSample,
      after: pgReadout,
      normalise: function (S) {
        if (S.ground === 'light' && S.colour === 'inverse') S.colour = 'secondary';
        if (S.ground === 'dark' && S.colour === 'secondary') S.colour = 'inverse';
        if (S.colour === 'inverse' && S.type === 'filled') S.colour = 'primary';
      },
      available: function (S, axis, val) {
        if (axis !== 'colour') return true;
        if (val === 'inverse') return S.ground === 'dark' && S.type !== 'filled';
        if (val === 'secondary') return S.ground === 'light';
        return true;
      },
      blockClass: 'gbdoc-hold--block',
      block: function (S) { return S.width === 'block'; }
    });
  }

  /* ---------- the variant workbench ----------
     Still on .gbdoc-seg, and deliberately: the workbench chooses which
     VARIANT the two bands below are drawn in, which is navigation of a
     document rather than the building of a specimen, and the playground
     above is the one block Ton chose the new rule for. One showcase per
     wave (spec section 5); the workbench follows on its own. */
  var WB = { type: 'filled', colour: 'primary', ground: 'light' };
  var WB_SIZES = [['xsmall', 'xsmall', 'the floor'], ['small', 'small', 'furniture'],
                  ['medium', 'medium', 'chrome'], ['large', 'large', 'forms'],
                  ['xlarge', 'xlarge', 'committing']];
  var WB_STATES = [
    ['Rest', '', ''],
    ['Hover', ' is-hover', ''],
    ['Focus', ' is-focus', ''],
    ['Active', ' is-active', ''],
    ['Disabled', '', ' disabled']
  ];
  /* A real label per variant, so the specimen reads as the button
     it actually is somewhere in the product. */
  var WB_LABEL = {
    'filled primary': 'Book a meeting',
    'filled secondary': 'Send gift card',
    'outline primary': 'Add gift',
    'outline secondary': 'My portal',
    'ghost primary': 'Details',
    'ghost secondary': 'Cancel',
    'outline inverse': 'My portal',
    'ghost inverse': 'Not now'
  };

  var wbControls = document.getElementById('wbControls');
  var wbStage = document.getElementById('wbStage');
  var wbSizes = document.getElementById('wbSizes');
  var wbStates = document.getElementById('wbStates');
  var wbFoot = document.getElementById('wbFoot');
  var stBody = document.getElementById('stBody');

  /* Controls are not buttons (Ton 26.08: «the top buttons work as a
     showcase while they are meant to build the button below»). A segment
     is quiet text with a blue underline when chosen: the instrument must
     not look like the thing it builds. */
  function lightChips(row, chosen) {
    Array.prototype.forEach.call(row.querySelectorAll('.gbdoc-seg'), function (seg) {
      var on = seg.getAttribute('data-val') === chosen;
      seg.classList.toggle('is-on', on);
      seg.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  }

  function wbLabel() { return WB_LABEL[WB.type + ' ' + WB.colour] || 'Continue'; }
  function wbStateSize() { return WB.ground === 'dark' ? 'medium' : 'large'; }

  /* The rules of the stage, said in one place:
       light ground has no inverse, because a white cut on white
       is nothing;
       dark ground has no secondary, because black on Zinc 950 is
       nothing either;
       and filled inverse does not exist anywhere, because no live
       screen wears a solid white button. */
  function wbNormalise() {
    if (WB.ground === 'light' && WB.colour === 'inverse') WB.colour = 'secondary';
    if (WB.ground === 'dark' && WB.colour === 'secondary') WB.colour = 'inverse';
    if (WB.colour === 'inverse' && WB.type === 'filled') WB.colour = 'primary';
  }

  function wbAvailable(axis, val) {
    if (axis !== 'colour') return true;
    if (val === 'inverse') return WB.ground === 'dark' && WB.type !== 'filled';
    if (val === 'secondary') return WB.ground === 'light';
    return true;
  }

  function btnHTML(size, extra, attr, label) {
    return '<button class="gb-btn gb-btn--' + size + ' gb-btn--' + WB.type + ' gb-btn--' + WB.colour + extra +
      '" type="button"' + attr + '><span class="gb-btn__label">' + label + '</span></button>';
  }

  function paintWorkbench() {
    if (!wbStage) return;
    wbNormalise();
    var label = wbLabel();
    var dark = WB.ground === 'dark';
    wbStage.classList.toggle('gbdoc-stage--dark', dark);

    /* sizes band */
    var html = '';
    WB_SIZES.forEach(function (s) {
      html += '<div class="gbdoc-slot">' + btnHTML(s[0], '', '', label) +
        '<span class="gbdoc-slot__cap"><b>' + s[1] + ' &middot; ' + s[2] + '</b>' +
        '<span data-cap="' + s[0] + '">measuring</span></span></div>';
    });
    wbSizes.innerHTML = html;

    /* states band */
    var ssize = wbStateSize();
    html = '';
    WB_STATES.forEach(function (st) {
      html += '<div class="gbdoc-slot">' + btnHTML(ssize, st[1], st[2], label) +
        '<span class="gbdoc-slot__cap"><b>' + st[0] + '</b></span></div>';
    });
    wbStates.innerHTML = html;

    document.getElementById('wbSizesCap').textContent = 'Sizes, at rest';
    document.getElementById('wbStatesCap').textContent =
      'States, size ' + ssize + (dark ? ': the ladder chrome walks' : '');

    /* the captions are measured off the specimens beside them */
    Array.prototype.forEach.call(wbSizes.querySelectorAll('.gbdoc-slot'), function (slot) {
      var b = slot.querySelector('.gb-btn');
      var cap = slot.querySelector('[data-cap]');
      var d = readBtn(b);
      cap.textContent = d.h + ' tall, label ' + d.labelSize;
    });

    /* chips */
    Array.prototype.forEach.call(wbControls.querySelectorAll('.gbdoc-axis'), function (row) {
      var axis = row.getAttribute('data-axis');
      lightChips(row, WB[axis]);
      Array.prototype.forEach.call(row.querySelectorAll('.gb-btn'), function (chip) {
        var ok = wbAvailable(axis, chip.getAttribute('data-val'));
        chip.classList.toggle('is-unavailable', !ok);
        chip.setAttribute('aria-disabled', ok ? 'false' : 'true');
      });
    });

    /* the foot says what is on the stage and why a chip is out */
    var cls = 'gb-btn gb-btn--' + wbStateSize() + ' gb-btn--' + WB.type + ' gb-btn--' + WB.colour;
    var why = dark
      ? 'Secondary is out on a dark ground: black on Zinc 950 is nothing. Filled inverse is out everywhere: no live screen wears a solid white button.'
      : 'Inverse is out on a light ground: a white cut on white is nothing.';
    wbFoot.innerHTML = 'On the stage: <code>' + cls + '</code>. ' + why;

    paintStateTable();
  }

  /* The state table is filled by measuring the five specimens
     standing above it, and the token beside each value is found
     by the same lookup the properties drawer uses. */
  function paintStateTable() {
    if (!stBody) return;
    var slots = wbStates.querySelectorAll('.gbdoc-slot');
    var fam = WB.colour === 'primary' ? 'accent' : WB.colour === 'secondary' ? 'ink' : 'inverse';
    var candidates = [
      '--gb-btn-fill-' + WB.colour, '--gb-btn-fill-' + WB.colour + '-hover', '--gb-btn-fill-' + WB.colour + '-active',
      '--gb-btn-wash-' + fam + '-hover', '--gb-btn-wash-' + fam + '-active',
      '--gb-btn-ink-' + WB.colour, '--gb-btn-ink-on-' + WB.colour,
      '--gb-btn-ink-' + WB.colour + '-hover', '--gb-btn-ink-' + WB.colour + '-active'
    ];
    var html = '';
    Array.prototype.forEach.call(slots, function (slot, i) {
      var b = slot.querySelector('.gb-btn');
      var cs = getComputedStyle(b);
      var name = WB_STATES[i][0];
      var line = parseFloat(cs.borderTopWidth)
        ? px(cs.borderTopWidth) + ' ' + cs.borderTopColor
        : 'none';
      var tok = INSPECT.tokenFor ? (INSPECT.tokenFor(cs.backgroundColor, candidates) || INSPECT.tokenFor(cs.color, candidates)) : null;
      if (name === 'Focus') tok = '--gb-btn-focus-ring' + (WB.colour === 'inverse' ? '-inverse' : '');
      if (name === 'Disabled') tok = '--gb-btn-disabled-opacity';
      html += '<tr><td>' + name + '</td><td class="gbdoc-num">' + cs.backgroundColor + '</td><td class="gbdoc-num">' +
        cs.color + '</td><td class="gbdoc-num">' + line + '</td><td>' +
        (tok ? '<code>' + tok + '</code>' : '<span class="gbdoc-flag gbdoc-flag--none">In the organism</span>') +
        '</td></tr>';
    });
    stBody.innerHTML = html;
    /* The contrast figures are NOT recomputed here. The stage
       transitions its background over 280ms, and a reading taken
       during the switch measures a colour that exists for a
       quarter of a second and is on no screen. They are measured
       once, off a static plate, in paintContrastOnce below. */
  }

  if (wbControls) {
    wbControls.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('.gbdoc-seg[data-val]') : null;
      if (!chip || chip.classList.contains('is-unavailable')) return;
      var axis = chip.parentNode.getAttribute('data-axis');
      if (!axis) return;
      WB[axis] = chip.getAttribute('data-val');
      paintWorkbench();
    });
  }

  /* The contrast figures belong to the dark ground, so they are
     measured once at load on a throwaway dark plate even while the
     stage is light. */
  function paintContrastOnce() {
    var plate = document.createElement('div');
    plate.style.cssText = 'position:absolute;left:-9999px;top:0;background:var(--zinc-950);';
    document.body.appendChild(plate);
    var ground = getComputedStyle(plate).backgroundColor;
    var white = 'rgb(255, 255, 255)';
    var blue = INSPECT.tokenValue ? INSPECT.tokenValue('--gb-btn-fill-primary') : '#2563eb';
    var blueRgb = INSPECT.norm ? INSPECT.norm(blue) : blue;
    txt('ctInv', String(ratio(white, ground)));
    txt('ctBlue', String(ratio(blueRgb, ground)));
    txt('ctBlueInk', String(ratio(white, blueRgb)));
    document.body.removeChild(plate);
  }

  /* gbppl-oro-engine-1. The Copy buttons of the code blocks are
     wired by GbOro.page, and the contents beside the document are
     read off it by oro.js: both are the template, and this page no
     longer asks for either. */

  /* The playground paints itself: GbOro.controls draws it on the call
     above and answers resize and the late web face for every panel on
     the page, so it is not in either list here. */
  paintAnatomy();
  paintWorkbench();
  paintContrastOnce();

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { paintAnatomy(); paintWorkbench(); }, 120);
  });
})();
</script>
