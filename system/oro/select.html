<!-- ============================================================
     gbppl-oro-select-stepper-1 — THE SELECT PAGE
     ------------------------------------------------------------
     Skill, section 8, open since 27.08: «SELECT: компонента НЕТ...
     Поле и селект это не одно и то же, и система обязана это
     сказать.» This page is the system saying it.

     WHAT IS MEASURED AND WHAT IS DECLARED, said once here and
     again in the provenance column of every table below. The live
     site has NO select: measured 29.08 across the home page, the
     catalogue and its filter drawer, a product page in both of its
     variants, the lead form and the portal door. Not one native
     <select>, not one PrimeVue dropdown. The only list-opening
     control the site owns is the country picker of a third party
     phone library, and its arrow is a text glyph (U+25BC) at
     9.6px / 12.8px in #666, on the LEFT of the field.

     So the ladder, the underline, the ink and both state colours
     are the FIELD's, measured on the live sign in and already
     documented on field.html; the chevron is DECLARED under
     Ton-17, drawn from the icon record at the 20 rung.

     Ton-10: this page is a CONSUMER. Its card, tables, shelves,
     chips and code blocks are the atoms of ..\components\docs.css;
     its specimens are the component itself.

     NOTHING ON THIS PAGE PRINTS A NUMBER THAT WAS TYPED. Every
     measurement is read back out of the rendered page.

     ------------------------------------------------------------
     gbppl-showcase-canon-1, 01.09 — THE PLAYGROUND BECAME THE
     CANON CARD
     ------------------------------------------------------------
     Тон, 01.09: «Компонент Select: там до сих пор вообще старое
     отображение, нет даже последней версии: панель выбора сверху,
     а не справа. Из-за этого мне тяжело показывать работу людям.»

     So the playground of this page is now the same object as the
     one on button.html: .gbdoc-pg out of components/docs.css with
     GbOro.controls out of oro.js inside it. The page hands over a
     SCHEMA and gets the rail on the right, the rule that picks one
     control per axis, the Light | Dark switch on the stage and the
     Preview | Code band in the footer. What stood here before was
     three hand written rows of .gbdoc-seg over the specimen, one
     control shape for every axis whatever the axis was.

     WHAT THE THREE OLD ROWS BECAME, one by one:
       State (five segments)   a Select. The canon says State is
                               never a toggle: the set is long and
                               half of it is usually unavailable.
       Value (three segments)  a Select. The canon names Value and
                               names it a Select, because what is
                               chosen is a phrase and not a rung.
       Required (Yes | No)     the switch. It was called Label and
                               its two values were «Caps label» and
                               «None»; ORO_AXES.RENAMES settles that
                               («a label that is not there is a
                               label not asked for»), and this page
                               now spends the FIELD'S OWN meaning of
                               the word: Required off is the
                               `optional` attribute, the label stays
                               and the gold asterisk goes. A select
                               with no label at all is the one thing
                               Usage and Accessibility below both
                               forbid, so the panel no longer offers
                               to build it.

     AND THE SPECIMEN IS NOW THE ELEMENT. The old panel wrote the
     wrapper, the control and the glyph by hand; the schema hands
     `<gb-field type="select">` to the stage, which is what the
     Overview table says the element does and what a consumer
     actually writes. The by-hand markup did not disappear: it is
     the second half of the Code section, where it always was.

     ONE DEVIATION FROM THE BENCH'S CARD, THE SAME ONE BUTTON MAKES:
     the footer band carries the view switch and no measured line,
     because the eight measured values already stand in the table
     directly under the card.

     ------------------------------------------------------------
     gbppl-oro-engine-1, 01.09 — AND THE PAGE ITSELF MOVED ONTO THE
     ENGINE, WHICH IS WHERE THE REST OF «тяжело показывать» WAS
     ------------------------------------------------------------
     The rail moved to the right earlier today; this is the other
     half. The shell of this file is gone into
     system/oro/oro-page.js, and the document is a declaration.

     WHAT THE READER SEES DIFFERENTLY, and it is the whole point of
     the wave: this page used to write its sections as a .gbdoc-sub
     with an .oro-h3 under it, and six of the twelve had no h3 at
     all, so their name WAS the heading and they carried no Eyebrow.
     Overview, Properties, Usage, Accessibility, Code and Changelog
     each opened with one serif word and nothing over it, while the
     same six on button.html opened with an Eyebrow over a sentence.
     Every section now has both, and the six sentences that were
     missing are written here for the first time. Nothing else was
     touched: every table, every note, every measured number and the
     whole of the playground came across word for word, the contents
     list is the same eleven entries pointing at the same eleven
     ids, and the console is silent at 390, 1280 and 1920.
     ============================================================ -->

                  + '<tr><td>29 August</td><td><code>.gba-select</code>, the fourth look of the field. Both checkout selects wear it; the chevron comes from the icon record; the page is written</td></tr>\n'
                  + '<tr><td>1 September</td><td>The playground became the canon card: the rail moved to the right of the stage, the three rows of segments became a Select for State, a Select for Value and a switch for Required, the ground switch arrived on the stage and the markup moved behind a Preview | Code fold. The axis that used to add and remove the label is now the field\'s own Required, and the specimen is <code>&lt;gb-field type="select"&gt;</code> rather than markup this page wrote by hand</td></tr>' } }

<script>
/* ============================================================
   gbppl-oro-select-stepper-1 — THE SELECT READOUT
   ------------------------------------------------------------
   Five small scripts of the showcase template come from oro.js
   (window.GbOro): px, txt, the width readout, the clipboard and
   the contents. What is here is the playground and the two tables
   that are filled by measuring specimens on this page.

   NOTHING HERE PRINTS A NUMBER THAT WAS TYPED.
   ============================================================ */
(function () {
  'use strict';

  var ORO = window.GbOro;
  var px = ORO.px;
  var txt = ORO.txt;

  /* ---------- the playground ----------
     gbppl-showcase-canon-1. The panel is not written here any more. This
     page hands GbOro.controls a SCHEMA — what a select HAS, in what group,
     with what default — and a function that draws one out of a state
     object; the rail, the rule that picks each control, the More fold, the
     Reset, the ground on the stage and the Preview | Code fold all belong
     to the renderer in oro.js and are the same on every showcase.

     THE THREE AXES, AND THE CONTROL THE RULE GIVES EACH (canon in
     ORO_AXES):
       State     a Select, always: the set is long and half of it is
                 usually unavailable on any one specimen
       Value     a Select, because what is chosen is a phrase
       Required  the switch, by nature: yes and no is never a track

     The specimen is the ELEMENT, not markup written by this page: the
     Overview table says gb-field writes the wrapper, the control and the
     glyph, and a playground that wrote them itself would be describing
     something a consumer never types. */
  var OPTIONS = ['12 Park Ave, New York', '5 Bay St, San Francisco',
                 'Hauptstrasse 118, 10827 Berlin, Germany, attention of the office manager'];
  /* Nothing picked leaves the value empty, so the element selects its own
     disabled first row; the other two name one of the options above. */
  var VALUES = { placeholder: '', picked: OPTIONS[0], long: OPTIONS[2] };
  var STATE_CLASS = { hover: 'is-hover', focus: 'is-focus' };

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var PG_AXES = [
    { id: 'state', label: 'State', group: 'state', def: 'rest',
      values: [['rest', 'Rest'], ['hover', 'Hover'], ['focus', 'Focus'],
               ['error', 'Error'], ['disabled', 'Disabled']] },
    { id: 'value', label: 'Value', group: 'content', def: 'placeholder',
      values: [['placeholder', 'Nothing picked'], ['picked', 'Picked'],
               ['long', 'A long one']] },
    { id: 'required', label: 'Required', group: 'content', kind: 'bool',
      on: 'yes', off: 'no', def: 'yes' }
  ];

  function pgSample(S, forCode) {
    var nl = forCode ? '\n          ' : ' ';
    return '<gb-field input-id="pgSelect" name="billing" type="select"' + nl +
           'label="Billing address"' + nl +
           'placeholder="Select a billing address"' + nl +
           'options="' + esc(OPTIONS.join('|')) + '"' +
           (VALUES[S.value] ? nl + 'value="' + esc(VALUES[S.value]) + '"' : '') +
           (S.required === 'no' ? nl + 'optional' : '') +
           '></gb-field>';
  }

  /* The state is put on the rendered control the way a consumer would: the
     browser's own disabled, the invalid class the form sets after a submit,
     and the two demo names auth.css declares. Hover and focus are read on
     the WRAPPER for the glyph and on the control for the underline, because
     that is where auth.css declares each of them. */
  function pgAfter(S, hold) {
    var el = hold.querySelector('select');
    if (!el) return;
    var wrap = el.closest('.gba-select');
    if (STATE_CLASS[S.state]) {
      el.classList.add(STATE_CLASS[S.state]);
      if (wrap) wrap.classList.add(STATE_CLASS[S.state]);
    }
    if (S.state === 'error') { el.classList.remove('valid'); el.classList.add('invalid'); }
    if (S.state === 'disabled') el.disabled = true;
    paintPlayground();
  }

  function paintPlayground() {
    var el = document.getElementById('pgSelect');
    if (!el) return;
    var cs = getComputedStyle(el);
    var chev = el.parentNode.querySelector('.gb-icon');
    var ccs = chev ? getComputedStyle(chev) : null;
    var cr = chev ? chev.getBoundingClientRect() : null;
    txt('pgH', px(cs.minHeight));
    txt('pgFont', px(cs.fontSize) + ' / ' + cs.fontWeight);
    txt('pgPadL', px(cs.paddingLeft));
    txt('pgPadR', px(cs.paddingRight));
    txt('pgLine', px(cs.borderBottomWidth) + ' ' + cs.borderBottomColor);
    txt('pgInk', cs.color);
    txt('pgChev', cr ? Math.round(cr.width) + ' by ' + Math.round(cr.height) : 'no glyph');
    txt('pgChevInk', ccs ? ccs.color : 'no glyph');
  }

  /* ---------- the states table ----------
     Every row is read off the specimen that stands above it, so a
     row cannot describe a rule the page is not rendering. */
  function paintStates() {
    [['rest', 'sRest'], ['hover', 'sHover'], ['focus', 'sFocus'],
     ['error', 'sError'], ['disabled', 'sDis']].forEach(function (pair) {
      var el = document.getElementById('st-' + pair[0]);
      if (!el) return;
      var cs = getComputedStyle(el);
      var chev = el.parentNode.querySelector('.gb-icon');
      txt(pair[1] + 'Line', px(cs.borderBottomWidth) + ' ' + cs.borderBottomColor);
      txt(pair[1] + 'Chev', chev ? getComputedStyle(chev).color : 'no glyph');
    });
  }

  /* ---------- sizes and anatomy ---------- */
  function paintAnatomy() {
    var el = document.getElementById('st-rest');
    if (!el) return;
    var wrap = el.parentNode;
    var chev = wrap.querySelector('.gb-icon');
    var cs = getComputedStyle(el);
    var r = el.getBoundingClientRect();
    var wr = wrap.getBoundingClientRect();
    var cr = chev ? chev.getBoundingClientRect() : null;

    txt('szH', px(cs.minHeight));
    txt('szFont', px(cs.fontSize));
    txt('szPad', px(cs.paddingTop) + ' ' + px(cs.paddingLeft));

    txt('anWrap', Math.round(wr.width) + ' by ' + Math.round(wr.height));
    txt('anCtl', Math.round(r.width) + ' by ' + Math.round(r.height));
    txt('anChev', cr ? Math.round(cr.width) + ' by ' + Math.round(cr.height) +
        ', ' + Math.round(r.right - cr.right) + ' from the right edge' : 'no glyph');
    txt('anRoom', px(cs.paddingRight));

    ORO.widthNow('wnow');
  }

  /* The playground is not in here: GbOro.controls answers resize for every
     panel on the page itself, and it repaints the readout through after(). */
  function paintAll() { paintStates(); paintAnatomy(); }

  /* The glyph arrives with icon.js, which mounts on DOMContentLoaded,
     and this script runs while the document is still parsing. Painting
     now would print «no glyph» into a table that is describing a page
     that has one, so the first pass waits for the document. */
  function start() {
    if (window.GbOro && window.GbOro.controls) {
      window.GbOro.controls({
        root: document.querySelector('[data-pg="select"]'),
        axes: PG_AXES,
        sample: pgSample,
        after: pgAfter
      });
    }
    paintAll();
    /* TRAP 11 OF THE SKILL, caught here by measurement: a specimen
       that wears a demo state class at load is still INSIDE its own
       colour transition on the first frame, and a colour read there
       is a colour that stands on no screen (hover printed Zinc 500
       while the page was drawing Blue 600). So the tables are read
       again once the longest transition on a specimen has run out.
       The wait is not typed either: it is read off the specimen. */
    var ms = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.gbdoc-shelf *'), function (el) {
      var d = getComputedStyle(el).transitionDuration.split(',');
      d.forEach(function (one) {
        var n = parseFloat(one);
        if (!isNaN(n)) ms = Math.max(ms, /ms$/.test(one.trim()) ? n : n * 1000);
      });
    });
    if (ms) setTimeout(paintAll, ms + 40);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(paintAll, 120);
  });
})();
</script>
