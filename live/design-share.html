<!-- ============================================================
     gbppl-design-share-4 — FOUR CONCEPTS ON ONE ENGINE, AND THE
                            HOUSE LIGHTS COME BACK UP
     ------------------------------------------------------------
     Ton, 11.09, judging build 3 (the ink frame): «украшал интерфейс
     вместо подарка». The dark theatre box is dead as an idea, not
     as a detail. What replaced it is his own instruction, word for
     word: «взять то, что у них, и сделать лучше: правильные шрифты,
     правильные компоненты, просто красиво... сделай несколько
     разных концептов, а не один».

     SO THE BEARING IS THE CLIENT'S OWN LIVE PAGE, because its
     INFORMATION ARCHITECTURE IS RIGHT and ours was not:
       the name of the gift stands where reading starts, on the left
       the utilities stand on the same line, IN WORDS
       the gesture hint is permanent, at the foot of the object, and
         it names every gesture the viewer really answers
       Powered by GildedBox is one quiet line with a real link
     Everything else about that page — the pills of two different
     heights, the monospace kbd, the ruler that drifts, the serif
     that is never loaded — is where «сделать лучше» happens.

     THE FOUR, on ?c=a|b|c|d, default a. One document, one engine,
     four skins: the model, the film, the drawer and the canvas art
     are the same objects, and the axis repaints them WITHOUT
     RELOADING THE MODEL (the viewer element never leaves the DOM;
     only the camera is re-framed, because the stage changes shape).

       a  THE ONE LINE CABINET (Ton's own example, the default).
          One top line on the light: the handwritten mark on the
          left, the name in the serif beside it with «Prepared for»
          under it, the two utilities in words at the right end. The
          preview is a big plate (Zinc 50, hairline, --radius) on a
          Zinc 100 page, the hint centred at the foot of the plate,
          and the footer is one small centred line.
       b  THE OBJECT AND THE COLUMN. The viewer takes the full
          height on the left, a quiet white column stands to its
          right behind one hairline: the name large in the serif,
          whose it is, air, the two utilities stacked, and the
          signature at the foot. The grammar of a luxury product
          page. ?actions=on lands the decision at the bottom of the
          column, Approve filled and on top.
       c  THE CLEAN FRAME. The object on the warm light, edge to
          edge, and NOT ONE BAND OR PLATE anywhere: the name in the
          top left corner over the ground, the utilities in the top
          right, the hint centred at the foot, the signature small
          in the bottom left. No vignette and no wash: a gradient
          that wide with a range that small is bands, not depth
          (ловушка 13), and the object's own contact shadow already
          separates it from the paper.
       d  THEIR PAGE, HONESTLY. The live layout one to one — the
          centred mark in a white band, the name-left / utilities-
          right row on the grey, the white plate full width, the
          hint under the model, the centred Powered by — with every
          element ours: the serif name, our button ladder instead of
          two mismatched pills, our hint with glyphs instead of a
          monospace kbd, our gutters and our rungs.

     WHAT IS NOT ON ANY OF THEM BY DEFAULT: THE ANSWER. There is no
     approval on the client's live page at all, so view-only is the
     default everywhere and ?actions=on is what adds Request changes
     beside Approve design, each concept in its own provided place
     (a: a quiet row between the plate and the footer, right end;
     b: the foot of the column; c: the bottom right corner; d: a
     row under the plate). ?mode=view|approve, shipped by build 1,
     is still read forever and translated (law of links, Ton 01.09).

     THE HINT IS PERMANENT AND IT NAMES THREE GESTURES. Build 3
     faded it on the first turn; a permanent hint is what the live
     page has and what Ton asked back. The third gesture was
     MEASURED, not assumed: a right-button drag on the instrument
     moves camera-target and leaves the orbit alone, a left drag
     orbits. So the words are «Drag to turn», «Scroll to zoom»,
     «Right-drag to move», each with its glyph from icon.js.
     OPEN: the touch wording (pinch, two fingers) is a second set of
     words for a second pointer, and the live page does not have it
     either. Named in the report rather than invented here.

     ------------------------------------------------------------
     SOURCE. DD-149, harvested 11.09 off the client staging route
     /shared/design-preview/<uuid>: report and instruments in
     studio\harvest\dd149\HARVEST-REPORT.md. The GLB, the loader,
     the copy and the two CTA labels are taken from there; none of
     the client's own textures are on this page and none ever will
     be (harvest §PII).

     WHAT IS WORN, BY NAME (Ton-6):
       .gb-btn       every control. Utilities --small --outline
                     --secondary, THE SAME RUNG AND THE SAME SHAPE
                     for both (the live pair is 33.5 beside 31.5,
                     a pill beside a not-pill); the decision pair
                     --medium, outline beside filled
       .gb-eyebrow   the gesture hint, the one caption role
       .gb-icon      every glyph, by name out of icon.js
       <gb-field>    every field of the personalize surface
       <gb-drawer>   the personalize surface itself
       <gb-studio-panel>, Inspect, Comment: the studio's chrome

     WHAT THIS FILE OWNS, and only because the house has no atom
     for it (law 0a.2 / 0a.4, both in the report, neither promoted
     into system\ by this wave):
       1. THE FOUR LAYOUTS. Six flat children of one grid, placed
          by four sets of grid-template-areas. No page in the house
          is built this way because no other page is one decision
          seen four ways.
       2. THE LOADER. No loading organism exists in the house. The
          gold film is Russell and Dima's own (Ton 11.09), value
          for value off the harvest, UNTOUCHED by this wave except
          that its exit now rises into the ground of whichever
          concept is showing.
       3. THE OBJECT'S OWN GRAPHIC. Canvas art for a rendered
          product is not UI and has no place in system\.

     THE AXES: ?c=a|b|c|d (default a, in GB_KEEP), ?actions=on|off
     (default off, legacy ?mode= read forever), ?state=loading|
     scene|error (default scene), ?loader=gold|ink (default gold).

     THE LAW OF THE SURFACE (Ton 10.09). Two voices and the eyebrow
     on every surface of every concept, full table in the report:
       leading   Noto Serif 300 — the name of the gift, and in the
                 error state the one line that says what happened
       working   Inter 400 — «Prepared for ...» and «Powered by
                 GildedBox»
       eyebrow   .gb-eyebrow — the gesture hint, and the two group
                 captions inside the personalize drawer
     Button labels are not a page voice: they belong to button.css
     and speak its label role wherever they stand.

     NO TOKEN, each with its reason:
       #f3efe8                 THE WARM LIGHT OF CONCEPT C ONLY.
                               Every rung of the Zinc scale is cold
                               and --live-body is colder still; a
                               rendered object laid edge to edge on
                               a cold near-white loses its edges and
                               the navy goes violet. This is gallery
                               paper. FLAT, never a gradient
                               (ловушка 13). Open to Ton: if he
                               keeps concept c, it becomes the
                               system's first warm ground.
       the object's colours    the paper of a rendered object is
                               not ink and not ground; the long
                               note at the dressing block argues it
       the gold loader's       Russell and Dima's own, off the
       palette and timings     harvest, shut inside .gbds-loader
       the camera's radii      a camera has no scale in any design
                               system. Measured, not felt: the
                               render is scanned for its own
                               painted extent and the four gaps are
                               read off it until top equals bottom
                               and left equals right, per concept,
                               at 390 / 1440 / 2560. The numbers
                               are in the report.
     And one derived rather than invented:
       --gbds-film = calc(--mo-large * 2)
     ============================================================ -->

<style>
/* ============================================================
   FOUR SKINS, ONE ENGINE                  gbppl-design-share-4
   ------------------------------------------------------------
   THE STAGE IS SIX FLAT CHILDREN OF ONE GRID: the mark, the id
   (name + whose it is), the utilities, the scene, the decision
   and the signature. Every concept is one set of
   grid-template-areas plus its two grounds, which is why the axis
   can repaint the page without the model ever leaving the DOM.

   Every length is a rung of --space-*, a token, or a NO TOKEN
   marked on its own line with the reason.
   ============================================================ */

/* Ловушка 29: [hidden] loses to any author display of equal
   specificity, and this page hides four things by the attribute. */
.gbds-page [hidden] { display: none !important; }

.gbds-page {
  /* THE FILM'S LENGTH, derived from the scale rather than invented:
     the loader runs longer than any single move on the page. */
  --gbds-film: calc(var(--mo-large) * 2);
  /* ONE GUTTER HOLDS EVERY FRAME, and it is the live container
     ladder, so the mark, the name, the utilities and the signature
     stand on the same verticals as every other page in the house. */
  --gbds-gutter: var(--container-pad-narrow);
  /* THE TWO GROUNDS EVERY CONCEPT REDECLARES: the paper of the
     page, and the ground the object itself stands on. The loader's
     exit rises into the second one, so the last frame of the film
     is the first frame of whichever concept is showing. */
  --gbds-paper: var(--zinc-100);
  --gbds-ground: var(--zinc-50);
}
@media (min-width: 768px)  { .gbds-page { --gbds-gutter: var(--container-pad); } }
@media (min-width: 1920px) { .gbds-page { --gbds-gutter: var(--container-pad-wide); } }

.gbds-html, .gbds-page { height: 100%; }
.gbds-page { background: var(--gbds-paper); color: var(--zinc-900); }

/* A, B and C ARE ONE SCREEN AND NEVER SCROLL. D is a reproduction
   of a page rather than a stage, so it is allowed the little it
   needs; it is still built to land on one screen, and the gate
   records the height it actually reaches. */
.gbds-html[data-gbds-c="a"], .gbds-html[data-gbds-c="a"] .gbds-page,
.gbds-html[data-gbds-c="b"], .gbds-html[data-gbds-c="b"] .gbds-page,
.gbds-html[data-gbds-c="c"], .gbds-html[data-gbds-c="c"] .gbds-page { overflow: hidden; }
.gbds-html[data-gbds-c="d"], .gbds-html[data-gbds-c="d"] .gbds-page { height: auto; }

.gbds-stage { display: grid; min-height: 100dvh; }
[data-gbds-c="a"] .gbds-stage,
[data-gbds-c="b"] .gbds-stage,
[data-gbds-c="c"] .gbds-stage { height: 100dvh; }

/* The six names are assigned once; the concepts only re-draw the
   map. Concept c ignores them: it is not a grid at all. */
.gbds-mark   { grid-area: mark; }
.gbds-id     { grid-area: id; }
.gbds-utils  { grid-area: utils; }
.gbds-scene  { grid-area: scene; }
.gbds-decide { grid-area: decide; }
.gbds-foot   { grid-area: foot; }

/* ---- the handwritten mark ---------------------------------- */
/* The system's NARROW box, 126x42, exactly as header.css measures
   it below 768. Ink on light, so it is inline SVG on currentColor
   and not an <img> that cannot be recoloured. */
.gbds-mark { display: block; width: 126px; height: 42px; color: var(--zinc-900); }
.gbds-mark svg { display: block; width: 100%; height: 100%; fill: currentColor; }

/* ---- the name of the object, and whose it is ---------------- */
/* ONE OBJECT, NOT TWO LINES (Ton 11.09): no margin between them at
   all, so the half leading of the two line boxes is the only air. */
.gbds-id { min-width: 0; }
.gbds-name {
  margin: 0;
  font-family: var(--font-serif);
  font-size: 24px;                 /* TYPE-SCALE «H3 card title» */
  font-weight: 300;
  line-height: 1.25;
  letter-spacing: -0.4px;
  color: var(--zinc-900);
}
.gbds-for {
  margin: 0;
  font-size: 14px;                 /* TYPE-SCALE «Small regular» */
  font-weight: 400;
  line-height: 1.5;
  color: var(--zinc-500);
}
@media (min-width: 1280px) { .gbds-for { font-size: 16px; } }  /* TYPE-SCALE «Body base» */

/* ---- the two utilities, IN WORDS, on every concept ----------
   Ton: words, not glyphs. Both wear the SAME rung and the SAME
   shape, which is the first thing «сделать лучше» fixes about the
   live pair: theirs is a 33.5px pill beside a 31.5px thing that is
   not a pill at all (harvest §5). */
.gbds-utils  { display: flex; align-items: center; gap: var(--space-8); }

/* ---- the decision, when it is asked for --------------------- */
.gbds-decide { display: flex; align-items: center; gap: var(--space-16); }

/* ---- the signature ------------------------------------------
   Ton: a quiet ordinary size, sentence case, and GildedBox a real
   link. Not the eyebrow role: the eyebrow is caps, and caps is not
   sentence case. */
.gbds-poweredby {
  margin: 0;
  font-size: 14px;                 /* TYPE-SCALE «Small regular» */
  font-weight: 400;
  line-height: 1.5;
  color: var(--zinc-500);
}
@media (min-width: 1280px) { .gbds-poweredby { font-size: 16px; } }  /* LIVE dd149: 16 */
/* ЛОВУШКА 1: `body.gb-demo a { color: inherit }` weighs 0-1-2 and
   would win. The antidote is always a pair. */
.gbds-poweredby a,
body.gb-demo .gbds-poweredby a {
  color: var(--zinc-700);
  text-decoration: underline;
  text-underline-offset: 3px;      /* LIVE dd149 footer */
  transition: color var(--mo-micro) var(--mo-move);
}
.gbds-poweredby a:hover,
body.gb-demo .gbds-poweredby a:hover { color: var(--zinc-900); }

/* ---- the scene, its plate and the object -------------------- */
.gbds-scene { position: relative; min-width: 0; min-height: 0; }
.gbds-plate {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--gbds-ground);
}
.gbds-viewer {
  display: block;
  width: 100%;
  height: 100%;
  background: transparent;
  --poster-color: transparent;
  --progress-bar-color: transparent;
  --progress-mask: transparent;
}

/* ---- the gesture hint, and it never leaves ------------------
   Ton: the hint is permanent, at the foot of the object, and it
   names every gesture the viewer really answers. All three were
   measured on the instrument, not assumed. */
.gbds-hint {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  bottom: var(--space-16);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: var(--space-8) var(--space-16);
  margin: 0;
  padding-inline: var(--gbds-gutter);
  line-height: 1.5;
  pointer-events: none;            /* a caption is not a target, and the object behind it must stay draggable */
}
.gbds-hint__bit { display: inline-flex; align-items: center; gap: var(--space-8); }
/* Nothing to turn on the error plate, and a caption that says
   otherwise is a lie in small caps. */
body[data-gbds-state="error"] .gbds-hint { display: none; }

/* ============================================================
   A — THE ONE LINE CABINET (the default)
   ------------------------------------------------------------
   One line at the top, a big plate under it, one small centred
   line at the foot. The head row is EXACTLY --space-64 where the
   content is shorter than that, and grows to the content where it
   is not: --space-8 of air above and below, equal (6a.3).
   ============================================================ */
[data-gbds-c="a"] .gbds-page { --gbds-paper: var(--zinc-100); --gbds-ground: var(--zinc-50); }
[data-gbds-c="a"] .gbds-stage {
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-rows: minmax(var(--space-64), auto) minmax(0, 1fr) auto auto;
  grid-template-areas:
    "mark   id     utils"
    "scene  scene  scene"
    "decide decide decide"
    "foot   foot   foot";
  column-gap: var(--space-24);
}
[data-gbds-c="a"] .gbds-mark,
[data-gbds-c="a"] .gbds-id,
[data-gbds-c="a"] .gbds-utils { align-self: center; padding-block: var(--space-8); }
/* THE NAME OF THE GIFT IS THE SUBJECT OF THE PAGE, and at the desk
   widths it takes the rung above: looked at on the screen, 24 beside
   a 1392px plate reads as a caption for the plate. */
@media (min-width: 1280px) { [data-gbds-c="a"] .gbds-name { font-size: 28px; } }  /* TYPE-SCALE «H2 section» */
[data-gbds-c="a"] .gbds-mark  { padding-inline-start: var(--gbds-gutter); }
[data-gbds-c="a"] .gbds-utils { padding-inline-end: var(--gbds-gutter); }
[data-gbds-c="a"] .gbds-scene { padding: var(--gbds-gutter); }
[data-gbds-c="a"] .gbds-plate {
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
}
/* THE PROVIDED PLACE FOR THE ANSWER: a quiet row between the plate
   and the signature, at the right end, on the same gutter. With no
   answer asked for there is no row at all (the item is hidden and
   its grid row collapses), and the footer is the one small line
   Ton drew. */
[data-gbds-c="a"] .gbds-decide {
  justify-content: flex-end;
  padding: var(--space-16) var(--gbds-gutter) 0;
}
[data-gbds-c="a"] .gbds-foot {
  padding: var(--space-16) var(--gbds-gutter);
  text-align: center;
}

/* ============================================================
   B — THE OBJECT AND THE COLUMN
   ------------------------------------------------------------
   The viewer takes the full height on the left, the quiet column
   stands to its right behind one hairline. The column is 30% of
   the window, floored at 300 so it never becomes a margin and
   capped at 460 so it never becomes a second stage.
   ============================================================ */
[data-gbds-c="b"] .gbds-page { --gbds-paper: var(--white); --gbds-ground: var(--zinc-100); }
[data-gbds-c="b"] .gbds-stage {
  grid-template-columns: minmax(0, 1fr) clamp(300px, 30%, 460px);
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-areas:
    "scene id"
    "scene utils"
    "scene ."
    "scene decide"
    "scene foot";
}
/* THE HAIRLINE IS THE EDGE OF THE SCENE, one declaration rather
   than a border on five stacked items that would break at the
   empty row. */
[data-gbds-c="b"] .gbds-scene { border-right: 1px solid var(--zinc-200); }
[data-gbds-c="b"] .gbds-mark  { display: none; }   /* the column signs itself at its foot, once */
[data-gbds-c="b"] .gbds-id,
[data-gbds-c="b"] .gbds-utils,
[data-gbds-c="b"] .gbds-decide,
[data-gbds-c="b"] .gbds-foot  { padding-inline: var(--space-32); }
[data-gbds-c="b"] .gbds-id    { padding-top: var(--space-48); }
[data-gbds-c="b"] .gbds-name  { font-size: 28px; }                        /* TYPE-SCALE «H2 section» */
@media (min-width: 1280px) { [data-gbds-c="b"] .gbds-name { font-size: 32px; } }
/* THE UTILITIES STACK, full column width: a product page states
   its secondary actions as a block, and two rungs of the same
   width read as one pair rather than two loose words. */
[data-gbds-c="b"] .gbds-utils {
  flex-direction: column;
  align-items: stretch;
  padding-top: var(--space-32);
}
/* THE ANSWER SITS AT THE FOOT OF THE COLUMN, and Approve stands on
   top: column-reverse so the DOM order stays the same as every
   other concept (changes, then approve) while the eye meets the
   leading action first. */
[data-gbds-c="b"] .gbds-decide {
  flex-direction: column-reverse;
  align-items: stretch;
  gap: var(--space-8);
  padding-bottom: var(--space-24);
}
[data-gbds-c="b"] .gbds-foot { padding-bottom: var(--space-32); }

/* ============================================================
   C — THE CLEAN FRAME
   ------------------------------------------------------------
   The object edge to edge on the warm light. No band, no plate,
   no rule anywhere: four corners of text over the ground and one
   caption between them. NO VIGNETTE AND NO WASH — a gradient that
   wide with a range that small is bands, not depth (ловушка 13),
   and the object's own contact shadow already does the work.
   ============================================================ */
[data-gbds-c="c"] .gbds-page {
  --gbds-paper: #f3efe8;           /* NO TOKEN: the warm light, argued in the head */
  --gbds-ground: #f3efe8;
}
[data-gbds-c="c"] .gbds-stage { display: block; position: relative; }
[data-gbds-c="c"] .gbds-scene { position: absolute; inset: 0; }
[data-gbds-c="c"] .gbds-mark  { display: none; }
[data-gbds-c="c"] .gbds-id,
[data-gbds-c="c"] .gbds-utils,
[data-gbds-c="c"] .gbds-decide,
[data-gbds-c="c"] .gbds-foot  { position: absolute; z-index: 2; }
[data-gbds-c="c"] .gbds-id     { top: var(--gbds-gutter);    left: var(--gbds-gutter); }
[data-gbds-c="c"] .gbds-utils  { top: var(--gbds-gutter);    right: var(--gbds-gutter); }
[data-gbds-c="c"] .gbds-decide { bottom: var(--gbds-gutter); right: var(--gbds-gutter); }
[data-gbds-c="c"] .gbds-foot   { bottom: var(--gbds-gutter); left: var(--gbds-gutter); }
/* The hint joins the bottom line rather than floating above it:
   signature left, hint centred, answer right, one baseline. */
[data-gbds-c="c"] .gbds-hint   { bottom: var(--gbds-gutter); }

/* ============================================================
   D — THEIR PAGE, HONESTLY
   ------------------------------------------------------------
   The live layout one to one (harvest shots/clean-1440.png): a
   white band with the mark centred in it, the name-left /
   utilities-right row on the grey, the white plate full width,
   the hint under the model, the centred signature. Every element
   is ours.
   ============================================================ */
[data-gbds-c="d"] .gbds-page { --gbds-paper: var(--zinc-100); --gbds-ground: var(--white); }
[data-gbds-c="d"] .gbds-stage {
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto auto minmax(0, 1fr) auto auto;
  grid-template-areas:
    "mark   mark"
    "id     utils"
    "scene  scene"
    "decide decide"
    "foot   foot";
}
/* LIVE dd149: the band is white and about 103 tall with the mark
   centred in it. Ours is 42 of mark between two --space-32. */
[data-gbds-c="d"] .gbds-mark {
  width: auto;
  height: auto;
  display: flex;
  justify-content: center;
  padding-block: var(--space-32);
  background: var(--white);
}
[data-gbds-c="d"] .gbds-mark svg { width: 126px; height: 42px; }
[data-gbds-c="d"] .gbds-id,
[data-gbds-c="d"] .gbds-utils { align-self: center; padding-block: var(--space-16); }
[data-gbds-c="d"] .gbds-id    { padding-inline-start: var(--gbds-gutter); }
[data-gbds-c="d"] .gbds-utils { padding-inline-end: var(--gbds-gutter); }
[data-gbds-c="d"] .gbds-name  { font-size: 28px; }                        /* LIVE dd149: 32 Inter; ours is the serif, one rung down */
@media (min-width: 1280px) { [data-gbds-c="d"] .gbds-name { font-size: 32px; } }
[data-gbds-c="d"] .gbds-scene { padding: 0 var(--gbds-gutter) var(--gbds-gutter); }
[data-gbds-c="d"] .gbds-plate {

}
[data-gbds-c="d"] .gbds-decide {

}
/* LIVE dd149 footer: pt 40 / pb 48 round to the one rung 32 above
   and below, equal air (6a.3). */
[data-gbds-c="d"] .gbds-foot {
  padding: var(--space-32) var(--gbds-gutter);

}

/* ============================================================
   THE PHONE
   ------------------------------------------------------------
   Below 768 every concept that has a band becomes ONE COLUMN: the
   mark, the name, the two utilities side by side at half width
   each, the object, the answer, the signature. Concept c keeps its
   corners and drops its bottom line to the middle, because two
   corner texts and a caption do not share 358px.
   ============================================================ */
@media (max-width: 767px) {
  [data-gbds-c="a"] .gbds-stage,
  [data-gbds-c="b"] .gbds-stage,
  [data-gbds-c="d"] .gbds-stage {

  }
  [data-gbds-c="a"] .gbds-mark,
  [data-gbds-c="a"] .gbds-id,
  [data-gbds-c="b"] .gbds-id,
  [data-gbds-c="d"] .gbds-id { padding-inline: var(--gbds-gutter); }
  [data-gbds-c="a"] .gbds-mark { padding-block: var(--space-16) 0; }
  [data-gbds-c="a"] .gbds-id   { padding-block: var(--space-8) 0; }
  [data-gbds-c="b"] .gbds-id,
  [data-gbds-c="d"] .gbds-id   { padding-block: var(--space-16) 0; }
  [data-gbds-c="b"] .gbds-scene { border-right: 0; }
  [data-gbds-c="b"] .gbds-name,
  [data-gbds-c="d"] .gbds-name { font-size: 24px; }
  [data-gbds-c="a"] .gbds-utils,
  [data-gbds-c="b"] .gbds-utils,
  [data-gbds-c="d"] .gbds-utils {
    flex-direction: row;
    align-items: stretch;
    padding: var(--space-16) var(--gbds-gutter) 0;
  }
  [data-gbds-c="a"] .gbds-utils .gb-btn,
  [data-gbds-c="b"] .gbds-utils .gb-btn,
  [data-gbds-c="d"] .gbds-utils .gb-btn { flex: 1 1 0; min-width: 0; }
  [data-gbds-c="a"] .gbds-scene,
  [data-gbds-c="d"] .gbds-scene { padding: var(--gbds-gutter); }
  [data-gbds-c="b"] .gbds-decide,
  [data-gbds-c="d"] .gbds-decide { flex-direction: row; gap: var(--space-8); }
  [data-gbds-c="a"] .gbds-decide,
  [data-gbds-c="b"] .gbds-decide,
  [data-gbds-c="d"] .gbds-decide { padding: 0 var(--gbds-gutter) var(--space-16); }
  [data-gbds-c="b"] .gbds-decide { align-items: center; }
  [data-gbds-c="a"] .gbds-decide .gb-btn,
  [data-gbds-c="b"] .gbds-decide .gb-btn,

  [data-gbds-c="b"] .gbds-foot,
  [data-gbds-c="d"] .gbds-foot { padding: var(--space-16) var(--gbds-gutter); text-align: center; }

  /* Concept c: the utilities stack into the top right corner, and
     the bottom line becomes two centred lines, caption above
     signature, because 358px does not hold three texts side by

  /* The two corners share one line here, so the name is given the
     share of it that is left after the stacked buttons (measured on
     the screen: at full width «Stags' Leap Cabernet» runs straight

  [data-gbds-c="c"] .gbds-id    { max-width: 45%; }

/* ============================================================
   THE LOADER                              gbppl-design-share-2
   ------------------------------------------------------------
   AN EXACT RECONSTRUCTION, AND IT IS THE DEFAULT.

   The gold loader on the live page was drawn by Russell with Dima
   (Ren, 11.09), so every value in the gold skin is theirs,
   transcribed from the harvest's own raw chunk
   (LoadingAnimation.raw.css) rather than re-derived: the radial
   ground #1a1a1a to #0d0d0d, the five letters of the mark fading
   in at 0 / .1 / .2 / .3 / .4s, the words at .6 / .7 / .8 / .9s,
   the dots pulsing on 1.4s at .2s apart, the meter arriving at
   1.2s over .8s, the 2px track, the 90deg #c9a961 / #f0d78c bar,
   the 12x12 travelling glow, the two ornaments, the forty
   particles, the diagonal sheen, the centre glow breathing between
   .4 and .8, and the two-stage exit. The rhythms of this block are
   NOT our --mo-* scale on purpose: this is the reproduction of a
   published surface, which Ton-3 governs.

   WHAT THE NEW STAGE CHANGED, and only this:
     1. THE FILM IS THE WHOLE WINDOW. In build 1 it covered a plate
        inside a scrolling document. There is no plate now: the
        thing being prepared is the whole screen, so the curtain is
        the whole screen. It sits under the console (z 60) and
        under the drawer (z 80), so the studio is never locked out.
     2. THE EXIT LANDS ON THE STAGE. Their white overlay rises into
        #fff because their scene is white; ours rises into
        --gbds-ground, the warm light of our own scene, and the
        last frame of the film is the first frame of the stage.

   THE ONE DELIBERATE IMPROVEMENT, carried over from build 1 (Ton,
   11.09): THE SERIF IS ACTUALLY LOADED. Their .loading-text
   declares «Cormorant Garamond, Georgia, serif» and never requests
   the face — not one network call for it in the whole harvest — so
   the live loader plays Georgia by accident. Ours speaks
   var(--font-serif). Same design, finally rendered as designed.

   ?loader=ink IS THE SAME FILM RECOLOURED. Not a second mechanism:
   identical markup, identical timings, Zinc instead of gold.

   Ton-7: the branded film plays always. No prefers-reduced-motion
   branch exists here, and none is to be added.
   ============================================================ */
.gbds-loader {
  position: fixed;
  inset: 0;
  z-index: 50;                                    /* under the console 60 and the drawer 80 */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: var(--space-32);                       /* LIVE dd149: 2rem */
  background: var(--gbds-l-ground);
  transition: opacity 1.2s ease-out .5s;          /* LIVE dd149 .loading-container */
}
/* THE CENTRE GLOW, breathing (LIVE dd149 .loading-container:after) */
.gbds-loader::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--gbds-l-halo);
  animation: gbds-centerGlow 3s ease-in-out infinite;   /* LIVE dd149 */
  pointer-events: none;
}
/* THE OVERLAY THAT RISES INTO THE LIGHT (LIVE dd149 .white-overlay) */
.gbds-loader__veil {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: var(--gbds-l-light);
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease-in-out;             /* LIVE dd149 */
}
.gbds-loader.is-leaving .gbds-loader__veil { opacity: 1; }
.gbds-loader.is-gone .gbds-loader__veil { opacity: 0; transition: opacity 1.2s ease-out .5s; }  /* LIVE dd149 */
.gbds-loader.is-gone { opacity: 0; pointer-events: none; }
/* One frame with every animation off: the rewind, see the script. */
.gbds-loader.is-rewound,
.gbds-loader.is-rewound * { animation: none !important; }

.gbds-loader__wrap {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: opacity .4s ease-out;               /* LIVE dd149 .content-wrapper */
}
.gbds-loader.is-gone .gbds-loader__wrap { opacity: 0; }

/* ---- GOLD, Russell and Dima's, and what the page opens on ---- */
.gbds-loader {
  --gbds-l-ground: radial-gradient(ellipse at center, #1a1a1a 0, #0d0d0d 100%);      /* LIVE dd149 */
  --gbds-l-light:  var(--gbds-ground);                                                /* deviation, written above: their #fff is our stage's warm light */
  --gbds-l-halo:   radial-gradient(ellipse 50% 50% at 50% 50%, rgba(201,169,97,.02) 0, transparent 70%);  /* LIVE dd149 */
  --gbds-l-mark:   url(#gbdsGold);                                                    /* LIVE dd149 goldGradient */
  --gbds-l-shadow: drop-shadow(0 0 15px rgba(139,115,85,.25));                        /* LIVE dd149 */
  --gbds-l-ink:    rgba(201,169,97,.8);                                               /* LIVE dd149 */
  --gbds-l-quiet:  rgba(201,169,97,.7);                                               /* LIVE dd149 */
  --gbds-l-orn:    rgba(160,131,71,.5);                                               /* LIVE dd149 */
  --gbds-l-track:  rgba(201,169,97,.2);                                               /* LIVE dd149 */
  --gbds-l-bar:    linear-gradient(90deg, #c9a961, #f0d78c 50%, #c9a961);             /* LIVE dd149 */
  --gbds-l-glow:   radial-gradient(circle, rgba(166,136,92,.6) 0, transparent 70%);   /* LIVE dd149 */
  --gbds-l-spark:  rgba(201,169,97,.6);                                               /* LIVE dd149 */
  --gbds-l-diag:   linear-gradient(45deg, transparent, transparent 40%, rgba(201,169,97,.012), rgba(201,169,97,.031), rgba(201,169,97,.012), transparent 60%, transparent);  /* LIVE dd149 */
}
/* ---- INK, ours: the same film, recoloured ---- */
.gbds-loader[data-gbds-loader="ink"] {
  --gbds-l-ground: var(--zinc-950);   /* ловушка 13: a wide gradient of small range is bands. Ours is flat by choice */
  --gbds-l-halo:   none;
  --gbds-l-mark:   var(--zinc-100);
  --gbds-l-shadow: none;
  --gbds-l-ink:    var(--zinc-100);
  --gbds-l-quiet:  var(--zinc-400);
  --gbds-l-orn:    var(--zinc-600);
  --gbds-l-track:  var(--zinc-800);
  --gbds-l-bar:    var(--zinc-100);
  --gbds-l-glow:   radial-gradient(circle, rgba(244,244,245,.5) 0, transparent 70%);
  --gbds-l-spark:  rgba(244,244,245,.5);
  --gbds-l-diag:   none;
}
/* ---- THE TURN: everything painted goes dark on light ----
   (LIVE dd149: the .transitioning block, whole.) */
.gbds-loader.is-leaving {
  --gbds-l-mark:   #1a1a1a;                                                        /* LIVE dd149 */
  --gbds-l-shadow: none;                                                           /* LIVE dd149 */
  --gbds-l-ink:    rgba(26,26,26,.8);                                              /* LIVE dd149 */
  --gbds-l-quiet:  rgba(26,26,26,.6);                                              /* LIVE dd149 */
  --gbds-l-orn:    rgba(26,26,26,.4);                                              /* LIVE dd149 */
  --gbds-l-track:  rgba(26,26,26,.15);                                             /* LIVE dd149 */
  --gbds-l-bar:    linear-gradient(90deg, #333, #555 50%, #333);                   /* LIVE dd149 */
  --gbds-l-glow:   radial-gradient(circle, rgba(50,50,50,.4) 0, transparent 70%);  /* LIVE dd149 */
}
.gbds-loader[data-gbds-loader="ink"].is-leaving {
  --gbds-l-mark:  var(--zinc-900);
  --gbds-l-ink:   var(--zinc-900);
  --gbds-l-quiet: var(--zinc-600);
  --gbds-l-orn:   var(--zinc-400);
  --gbds-l-track: var(--zinc-200);
  --gbds-l-bar:   linear-gradient(90deg, var(--zinc-700), var(--zinc-500) 50%, var(--zinc-700));
}

/* ---- the mark, five letters, one at a time ---- */
.gbds-loader__logo {
  width: 200px;                     /* LIVE dd149: w-[200px] h-[70px] */
  height: 70px;
  filter: var(--gbds-l-shadow);
  transition: filter 1s ease-out;   /* LIVE dd149 */
}
@media (min-width: 1024px) {        /* LIVE dd149: lg:w-[320px] lg:h-[110px] */
  .gbds-loader__logo { width: 320px; height: 110px; }
}
@media (max-width: 768px) { .gbds-loader__logo { filter: none; } }  /* LIVE dd149 */
.gbds-loader__letter {
  fill: var(--gbds-l-mark);
  opacity: 0;
  animation: gbds-fadeInLetter .4s ease-out forwards;  /* LIVE dd149 */
  transition: fill 1s ease-out;                        /* LIVE dd149 */
}
.gbds-loader__letter:nth-child(1) { animation-delay: 0s; }     /* LIVE dd149 */
.gbds-loader__letter:nth-child(2) { animation-delay: .1s; }
.gbds-loader__letter:nth-child(3) { animation-delay: .2s; }
.gbds-loader__letter:nth-child(4) { animation-delay: .3s; }
.gbds-loader__letter:nth-child(5) { animation-delay: .4s; }

/* ---- the line ----
   THE DEVIATION LIVES ON THIS RULE: var(--font-serif) instead of
   the Cormorant Garamond they declare and never load. Everything
   else on it is theirs: 12px, 16px from the xl step, .15em of
   tracking, uppercase, .4rem between words. */
.gbds-loader__head { display: flex; flex-direction: column; align-items: center; gap: var(--space-24); }  /* LIVE dd149: 1.5rem */
.gbds-loader__text {
  display: flex;
  gap: 6.4px;                       /* LIVE dd149: .4rem */
  margin: 0;
  font-family: var(--font-serif);   /* DEVIATION, Ton 11.09: theirs never loads and plays Georgia */
  font-size: 12px;                  /* LIVE dd149: text-[12px] */
  letter-spacing: .15em;            /* LIVE dd149 */
  text-transform: uppercase;        /* LIVE dd149 */
  color: var(--gbds-l-ink);
  transition: color .2s ease-out;   /* LIVE dd149 */
}
@media (min-width: 1280px) { .gbds-loader__text { font-size: 16px; } }  /* LIVE dd149: xl:text-[16px] */
.gbds-loader__word {
  opacity: 0;
  animation: gbds-fadeInWord .5s ease-out forwards;   /* LIVE dd149 */
}
.gbds-loader__word:nth-child(1) { animation-delay: .6s; }   /* LIVE dd149 */
.gbds-loader__word:nth-child(2) { animation-delay: .7s; }
.gbds-loader__word:nth-child(3) { animation-delay: .8s; }
.gbds-loader__word:nth-child(4) { animation-delay: .9s; }
.gbds-loader__dots {
  display: flex;
  opacity: 0;
  animation: gbds-fadeInWord .5s ease-out 1s forwards;  /* LIVE dd149 */
}
.gbds-loader__dot { animation: gbds-pulseDot 1.4s ease-in-out infinite; }  /* LIVE dd149 */
.gbds-loader__dot:nth-child(1) { animation-delay: 0s; }
.gbds-loader__dot:nth-child(2) { animation-delay: .2s; }
.gbds-loader__dot:nth-child(3) { animation-delay: .4s; }

/* ---- the meter ---- */
.gbds-loader__meter {
  position: relative;
  width: 100%;
  max-width: 320px;                 /* LIVE dd149 */
  margin-top: var(--space-48);      /* LIVE dd149: 3rem */
  opacity: 0;
  animation: gbds-fadeIn .8s ease-out 1.2s forwards;   /* LIVE dd149 */
}
.gbds-loader__track {
  position: relative;
  height: 2px;                      /* LIVE dd149 */
  border-radius: 2px;               /* LIVE dd149; a 2px bar, so the pill radius and 2 are the same shape */
  background: var(--gbds-l-track);
  overflow: visible;                /* LIVE dd149: the glow leans out */
  transition: background 1s ease-out;  /* LIVE dd149 */
}
.gbds-loader__bar {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: 2px;               /* LIVE dd149 */
  background: var(--gbds-l-bar);
  transition: width .3s ease-out, background 1s ease-out;   /* LIVE dd149 */
}
.gbds-loader__glow {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 12px;                      /* LIVE dd149 */
  height: 12px;                     /* LIVE dd149 */
  border-radius: var(--radius-circle);
  background: var(--gbds-l-glow);
  transform: translate(-50%, -50%);
  transition: left .3s ease-out, background 1s ease-out;    /* LIVE dd149 */
  pointer-events: none;
}
.gbds-loader__orn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-16);             /* LIVE dd149: 1rem */
  margin-top: var(--space-16);      /* LIVE dd149: 1rem */
}
.gbds-loader__ornament {
  width: 24px;                      /* LIVE dd149 */
  height: 24px;
  color: var(--gbds-l-orn);
  transition: color 1s ease-out;    /* LIVE dd149 */
}
.gbds-loader__pct {
  min-width: 48px;                  /* LIVE dd149: 3rem */
  font-family: var(--font-serif);   /* same deviation as the line */
  font-size: 12px;                  /* LIVE dd149: .85rem of their 14px root, measured 11.9 */
  letter-spacing: .1em;             /* LIVE dd149 */
  text-align: center;
  color: var(--gbds-l-quiet);
  transition: color 1s ease-out;    /* LIVE dd149 */
}

/* ---- the sparks and the sheen ---- */
.gbds-loader__particles {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateY(-60px);     /* LIVE dd149 */
  pointer-events: none;
  transition: opacity .8s ease-out; /* LIVE dd149 */
}
.gbds-loader.is-leaving .gbds-loader__particles,
.gbds-loader.is-leaving .gbds-loader__diag { opacity: 0; }
.gbds-loader__particle {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--size);
  height: var(--size);
  border-radius: var(--radius-circle);
  background: var(--gbds-l-spark);
  opacity: 0;
  animation: gbds-particleExplode var(--duration) ease-out infinite;  /* LIVE dd149 */
  animation-delay: var(--delay);
}
.gbds-loader__diag {
  position: absolute;
  top: -100%;
  left: -100%;
  width: 300%;
  height: 300%;
  background: var(--gbds-l-diag);
  animation: gbds-diagonalShift 6s ease-in-out infinite;   /* LIVE dd149 */
  transition: opacity .8s ease-out;
  pointer-events: none;
}
/* LIVE dd149: below 768 the sheen, the sparks and the centre glow
   are all switched off, and so is the mark's drop shadow. */
@media (max-width: 768px) {
  .gbds-loader__diag,
  .gbds-loader__particle,
  .gbds-loader::after { display: none; }
}

/* Every keyframe below is transcribed from LoadingAnimation.raw.css */
@keyframes gbds-fadeInLetter { 0% { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes gbds-fadeInWord   { to { opacity: 1; } }
@keyframes gbds-fadeIn       { to { opacity: 1; } }
@keyframes gbds-pulseDot     { 0%, 60%, to { opacity: .3; } 30% { opacity: 1; } }
@keyframes gbds-centerGlow   { 0%, to { opacity: .4; } 50% { opacity: .8; } }
@keyframes gbds-diagonalShift { 0%, to { transform: translate(2%) translateY(-2%); } 50% { transform: translate(-2%) translateY(2%); } }
@keyframes gbds-particleExplode {
  0%  { opacity: 0;  transform: rotate(var(--angle)) translate(var(--start-offset)) scale(1); }
  10% { opacity: .5; }
  70% { opacity: .3; }
  to  { opacity: 0;  transform: rotate(var(--angle)) translate(var(--distance)) scale(.3); }
}

/* ============================================================
   THE ERROR, ON THE STAGE
   ------------------------------------------------------------
   Ton: the error belongs ON the scene, not in an empty window.
   The stage keeps its warm light, says what happened in the
   leading voice, offers the way back and keeps the quiet road
   open beside it.
   ============================================================ */
.gbds-error {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-24);
  padding: var(--space-24);
  text-align: center;
  background: var(--gbds-ground);
}
.gbds-error__line {
  margin: 0;
  max-width: 46ch;
  font-family: var(--font-serif);
  font-size: 18px;                 /* TYPE-SCALE «H1 panel title», recorded */
  font-weight: 300;
  line-height: 1.4;
  letter-spacing: -0.4px;
  color: var(--zinc-900);
}
@media (min-width: 768px) { .gbds-error__line { font-size: 26px; } }
.gbds-error__acts { display: flex; flex-wrap: wrap; gap: var(--space-16); justify-content: center; }

/* ============================================================
   THE PERSONALIZE SURFACE lives in <gb-drawer>, so this page
   writes only the rhythm of the form inside it: 32 between named
   groups, 24 between the rows of one group. Rungs, not derived
   tokens (ловушка 21в).
   ============================================================ */
.gbd-sub + .gbds-pz__group,
.gbds-pz__group + .gbds-pz__group { margin-top: var(--space-32); }
.gbds-pz__group .gb-eyebrow { display: block; margin-bottom: var(--space-16); }
.gbds-pz__group gb-field { display: block; }
.gbds-pz__group gb-field + gb-field { margin-top: var(--space-24); }
.gbds-pz__foot { display: flex; gap: var(--space-16); }
.gbds-pz__foot .gb-btn { flex: 1 1 auto; }

/* ЛОВУШКА 3, and the antidote is the one comments.css already
   writes for the very same drawer: auth.css reproduces a preflight
   inside gb-guest-header / gb-auth-flow only, so a field standing
   anywhere else keeps the browser's own border and the underlined
   control becomes a box. Local, commented, at the consumer. */
.gbds-pz__group .gba-input {
  box-sizing: border-box;
  border-style: solid;
  border-width: 0;
  border-bottom-width: 1px;
}
/* ONE COLUMN, the drawer's rule (gbppl-comments-dress-1). */
.gbds-pz__group .gba-input { padding-inline: 0; }
.gbds-pz__group .gba-field { padding: 0; }
</style>

<body class="gb-demo gbds-page">

<!-- THE MARK, ONCE, AND NOW LITERALLY ONCE. The five letters of the
     handwritten gilded box wordmark are the system's own

<!-- SIX FLAT CHILDREN, FOUR MAPS. The order below is the reading
     order of concept a and of the DOM everywhere: who made it, what
     it is, what you can do to it, the thing itself, what you are
     being asked, and the signature. The concepts move the boxes;
     none of them rewrites the order, and none of them touches the
     viewer, which is why the axis costs no reload. -->
<div class="gbds-stage">

  <div class="gbds-mark"><svg viewBox="0 0 168 56" role="img" aria-label="GildedBox"><use href="#gbdsMark"></use></svg></div>

  <div class="gbds-id">
    <p class="gbds-name">Stags' Leap Cabernet</p>
    <p class="gbds-for">Prepared for Acme Aviation</p>
  </div>

  <!-- THE UTILITIES, IN WORDS, ON EVERY CONCEPT (Ton 11.09). Same
       rung, same shape, same family: the live page's own pair is a
       pill beside a not-pill, two heights apart. -->
  <div class="gbds-utils">
    <button type="button" class="gb-btn gb-btn--small gb-btn--outline gb-btn--secondary" data-gbds="download">
      <span class="gb-btn__label">Download mockup</span>
    </button>
    <button type="button" class="gb-btn gb-btn--small gb-btn--outline gb-btn--secondary" data-gbds="personalize">
      <span class="gb-btn__label">See it personalized</span>
    </button>
  </div>

  <main class="gbds-scene" id="gbdsScene">
    <div class="gbds-plate">
      <model-viewer
        class="gbds-viewer"
        id="gbdsViewer"
        alt="A navy Acme Aviation gift box holding a bottle of Stags' Leap Cabernet, its lid beside it and a greeting card in front"
        camera-controls
        touch-action="none"
        interaction-prompt="none"
        loading="eager"
        reveal="manual"
        exposure="1.05"
        shadow-intensity="1.1"
        shadow-softness="0.9"
        environment-image="neutral"
        camera-orbit="24deg 68deg 63%"
        camera-target="-0.026m -0.018m auto"
        min-field-of-view="18deg"
        max-field-of-view="45deg"
        field-of-view="30deg"></model-viewer>

      <!-- THE HINT, PERMANENT, AT THE FOOT OF THE OBJECT. Three
           gestures, three glyphs from the record, and all three
           were measured on the instrument: a left drag orbits, the
           wheel zooms, and a right-button drag moves camera-target
           without touching the orbit. The live page says the same
           three things in a monospace kbd; these are our words and
           our glyphs. -->
      <p class="gb-eyebrow gbds-hint" id="gbdsHint">
        <span class="gbds-hint__bit"><span data-gb-icon="rotate" data-gb-icon-size="16"></span>Drag to turn</span>
        <span class="gbds-hint__bit"><span data-gb-icon="mouse" data-gb-icon-size="16"></span>Scroll to zoom</span>
        <span class="gbds-hint__bit"><span data-gb-icon="move" data-gb-icon-size="16"></span>Right-drag to move</span>
      </p>

            <span class="gb-btn__label">Retry</span>
          </button>
          <button type="button" class="gb-btn gb-btn--medium gb-btn--outline gb-btn--secondary" data-gbds="download">
            <span class="gb-btn__label">Download mockup</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- THE ANSWER, AND IT IS NOT THERE BY DEFAULT. There is no

<!-- VENDORED, NOT HOTLINKED. The harvest proved the GLB opens in
     @google/model-viewer@4.0.0; the file is that exact build,
     copied into the repo, and the Draco decoder it would otherwise
     pull from gstatic sits beside it. The page needs no network. -->
<script type="module" src="../assets/vendor/model-viewer/model-viewer.min.js"></script>

<script>
(function () {
  'use strict';

  /* ============================================================
     THE AXES                                gbppl-design-share-2
     ------------------------------------------------------------
     Read once out of the address, written back with replaceState,
     offered as choice rows of the one console.

     THE LAW OF LINKS. Build 1 shipped ?mode=view|approve; that key
     is read here forever and translated, and the address is
     rewritten to ?actions=. A link already in somebody's inbox
     still opens on the view it promised.
     ============================================================ */
  var params = new URLSearchParams(location.search);

  function writeKey(key, value, drop) {
    try {
      var u = new URL(location.href);
      u.searchParams.set(key, value);
      if (drop) u.searchParams.delete(drop);
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) {}
  }

  var CONCEPTS = { a: 1, b: 1, c: 1, d: 1 };
  var ACTIONS = { on: 1, off: 1 };
  var STATES  = { loading: 1, scene: 1, error: 1 };
  var SKINS   = { ink: 1, gold: 1 };

  /* THE ANSWER IS NOT THE DEFAULT ANYWHERE. There is no approval on
     the client's live page at all, so every concept opens view-only
     and ?actions=on is what asks for a decision. ?mode= from build
     1 is still read and translated, forever. */
  var LEGACY_MODE = { approve: 'on', view: 'off' };
  var concept = CONCEPTS[params.get('c')] ? params.get('c') : 'a';
  var actions = ACTIONS[params.get('actions')] ? params.get('actions')
              : (LEGACY_MODE[params.get('mode')] || 'off');
  var state   = STATES[params.get('state')] ? params.get('state') : 'scene';
  /* Ren, 11.09: gold is Russell and Dima's own design, so gold is
     what the page opens on. Ink is the proposal beside it. */
  var skin    = SKINS[params.get('loader')] ? params.get('loader') : 'gold';

  var viewer  = document.getElementById('gbdsViewer');
  var loader  = document.getElementById('gbdsLoader');
  var errbox  = document.getElementById('gbdsError');
  var bar     = document.getElementById('gbdsBar');
  var glowDot = document.getElementById('gbdsGlowDot');
  var pct     = document.getElementById('gbdsPct');
  var decide  = document.getElementById('gbdsDecide');
  var utils   = document.querySelector('.gbds-utils');

  /* ONE AXIS REPAINTS THE PAGE AND THE MODEL NEVER MOVES. The four
     concepts are four sets of grid-template-areas on the same six
     children, so switching them costs one attribute, one re-frame
     of the camera (the stage changes shape, and a frame measured
     against another shape is a number nobody checked) and one
     honest word to the viewer about touch: on the three concepts
     that never scroll the finger belongs to the object, on d it
     belongs to the page, exactly as on the live page it copies. */
  function setConcept(v) {
    concept = CONCEPTS[v] ? v : 'a';
    document.documentElement.setAttribute('data-gbds-c', concept);
    viewer.setAttribute('touch-action', concept === 'd' ? 'pan-y' : 'none');
    writeKey('c', concept);
    frameCamera();
  }

  function setActions(v) {
    actions = ACTIONS[v] ? v : 'off';
    decide.hidden = (actions !== 'on');
    document.body.setAttribute('data-gbds-actions', actions);
    writeKey('actions', actions, 'mode');
  }

  /* Changing the skin REPLAYS THE FILM. A loader you cannot see is
     not a thing anyone can choose between, and by the time the row
     is clicked the first film has always finished. */
  function setSkin(v, replay) {
    skin = SKINS[v] ? v : 'gold';
    loader.setAttribute('data-gbds-loader', skin);
    writeKey('loader', skin);
    if (replay && state === 'scene') setState('scene');
  }

  /* ============================================================
     THE SPARKS
     ------------------------------------------------------------
     Forty of them, and the four numbers each one carries are not
     guessed: they are the recurrences read straight off the
     client's own markup (harvest loader.html), particle by
     particle, and they reproduce it exactly.
     ============================================================ */
  (function sparks() {
    var host = document.getElementById('gbdsParticles');
    if (!host) return;
    var angle = 347, dist = 383, delay = 6.9, frag = document.createDocumentFragment();
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('span');
      s.className = 'gbds-loader__particle';
      s.style.setProperty('--angle', ((angle % 360) + 360) % 360 + 'deg');
      s.style.setProperty('--distance', dist + 'px');
      s.style.setProperty('--size', (i % 2 === 0 ? 2 : 1) + 'px');
      s.style.setProperty('--delay', Math.round(delay * 10) / 10 + 's');
      s.style.setProperty('--duration', '5s');
      s.style.setProperty('--start-offset', (38 - 2 * (i % 15)) + 'px');
      frag.appendChild(s);
      angle -= 13;
      dist -= 67; if (dist < 208) dist += 250;
      delay -= 1.1; if (delay < 0) delay += 8;
    }
    host.appendChild(frag);
  })();

  /* ============================================================
     THE FILM
     ------------------------------------------------------------
     The bar shows the SMALLER of two numbers: what the file has
     really loaded, and how far the film has run. So the film
     always plays even when the model is already in cache, and it
     never claims a hundred per cent the loader does not have.
     ============================================================ */
  var FILM = 2400;
  var METER_IN = 1200;               /* LIVE dd149: the meter's own delay */
  try {
    var raw = getComputedStyle(document.body).getPropertyValue('--gbds-film').trim();
    if (/ms$/.test(raw)) FILM = parseFloat(raw);
    else if (/s$/.test(raw)) FILM = parseFloat(raw) * 1000;
  } catch (e) {}

  var realProgress = 0;
  var filmStart = 0;
  var loaded = false;
  var left = false;

  function paint() {
    var run = filmStart ? (Date.now() - filmStart - METER_IN) / FILM : 0;
    var filmProgress = Math.max(0, Math.min(1, run));
    var shown = Math.min(realProgress, filmProgress);
    bar.style.width = (shown * 100).toFixed(1) + '%';
    if (glowDot) glowDot.style.left = (shown * 100).toFixed(1) + '%';
    pct.textContent = Math.round(shown * 100) + '%';
    return shown;
  }

  /* One run of the film at a time. */
  var runId = 0;
  function tick(mine) {
    if (mine !== runId || left) return;
    var shown = paint();
    if (state === 'loading') { requestAnimationFrame(function () { tick(mine); }); return; }
    if (loaded && shown >= 1) { leave(); return; }
    requestAnimationFrame(function () { tick(mine); });
  }

  /* THE EXIT IN TWO STAGES, theirs to the millisecond (LIVE dd149):
       1  .is-leaving   the overlay rises over 2s while every
                        painted thing under it turns dark on light.
       2  .is-gone      the sheet and the wrapper go, opacity 0
                        over 1.2s after a .5s wait, and the stage
                        is simply there.
     The only change is the colour it rises into: our warm ground,
     so the film hands over to the scene without a step. */
  var VEIL_UP = 2000;                /* LIVE dd149: .white-overlay transition */
  var FADE_OUT = 1700;               /* LIVE dd149: 1.2s ease-out with .5s delay */
  function leave() {
    if (left) return;
    left = true;
    loader.classList.add('is-leaving');
    window.setTimeout(function () {
      if (viewer && typeof viewer.dismissPoster === 'function') viewer.dismissPoster();
      loader.classList.add('is-gone');
      document.body.setAttribute('data-gbds-scene', 'on');
      window.setTimeout(function () { loader.hidden = true; }, FADE_OUT);
    }, VEIL_UP);
  }

  function setState(v) {
    state = STATES[v] ? v : 'scene';
    errbox.hidden = (state !== 'error');
    /* There is no object to download and no card to personalize on
       the error plate, and a control nobody can see must not stay
       in the tab order. The loading film needs no rule: it covers
       the whole window while it runs. */
    if (utils) utils.hidden = (state === 'error');
    document.body.setAttribute('data-gbds-scene', 'off');
    /* The hint is permanent now (Ton 11.09, off the live page), so
       the only thing that takes it away is the error plate, and the
       rule reads the state straight off the body. */
    document.body.setAttribute('data-gbds-state', state);
    if (state === 'error') {
      /* The error is the end of the film, not an interruption of
         it: the loader goes at once and the stage says the thing
         in words. */
      left = true;
      loader.hidden = true;
      loader.classList.remove('is-leaving', 'is-gone');
    } else {
      left = false;
      loader.hidden = false;
      loader.classList.remove('is-leaving', 'is-gone');
      /* REWIND. Every entrance in this loader is a CSS animation
         with `forwards`, so a second run would show a finished
         film. One frame with the animations off restarts them all,
         which is what the console needs to put the two skins side
         by side. */
      loader.classList.add('is-rewound');
      void loader.offsetWidth;
      loader.classList.remove('is-rewound');
      filmStart = Date.now();
      runId++;
      (function (mine) { requestAnimationFrame(function () { tick(mine); }); })(runId);
    }
    writeKey('state', state);
  }

  /* ============================================================
     THE SCENE
     ------------------------------------------------------------
     The Draco decoder location has to be set BEFORE the file is
     asked for, so the element is given its src from here rather
     than from the markup.
     ============================================================ */
  var MODEL = '../assets/models/design-share/gift-box.glb';

  if (window.customElements) {
    customElements.whenDefined('model-viewer').then(function () {
      var MV = customElements.get('model-viewer');
      try {
        MV.dracoDecoderLocation = new URL('../assets/vendor/model-viewer/draco/', location.href).href;
      } catch (e) {}
      viewer.src = MODEL;
    });
  }

  /* THE FRAME IS MEASURED, NOT FELT, AND IT IS MEASURED PER CONCEPT.
     A camera has no scale in any design system, so the numbers are
     found with the instrument: a render of the viewer is scanned
     for its own painted extent and the four gaps are read off it,
     until the top gap equals the bottom and the left equals the
     right (ORO-SKILL 6a.3). The radius is a PERCENTAGE of the
     framing distance model-viewer computes for the box it is given,
     so it already answers the shape of each stage; what differs
     between the four is how much air that shape deserves, and the
     one that differs most is b, where the object stands in a tall
     70% window rather than a wide band.

     MEASURED (the painted extent of the render, scanned for alpha,
     against the plate; top / bottom / left / right):
       a  1440  793x548 in 1392x721   89 / 84 / 299 / 299
          2560 1178x814 in 2464x1070 132 / 124 / 643 / 644
       c  1440  991x685 in 1440x900  111 / 104 / 224 / 225
          2560 1429x986 in 2560x1297 161 / 150 / 565 / 566
       d  1440  644x446 in 1392x586   72 / 68 / 374 / 375
       b  1440  770x517 in 1007x900  174 / 209 / 134 / 103
     THE ONE THAT IS NOT TRUE IS B, and it is named rather than
     hidden: the object sits about 16px right of centre and 17px
     above it in a 1007px window, which is 1.6% and invisible on the
     screen (looked at), and the offset is the soft tail of the
     object's own contact shadow, which a scan counts and an eye does
     not. Tightening it would mean moving camera-target per concept,
     that is, aiming the camera at something other than the object.
     THE PHONE gets one radius for all four (82%): a stage 390 wide
     is a portrait window holding a landscape object, so the frame is
     bound by WIDTH at every concept and the vertical air is the
     shape of the thing, not a setting. At 78% the left gap was 27
     and the right 16; at 82% it is 36 and 23. */
  var RADIUS = { a: '63%', b: '80%', c: '63%', d: '63%' };
  var RADIUS_PHONE = { a: '82%', b: '82%', c: '82%', d: '82%' };
  function frameCamera() {
    var narrow = window.matchMedia('(max-width: 767px)').matches;
    var r = (narrow ? RADIUS_PHONE : RADIUS)[concept] || '63%';
    viewer.setAttribute('camera-orbit', '24deg 68deg ' + r);
  }
  window.addEventListener('resize', frameCamera);

  viewer.addEventListener('progress', function (e) {
    realProgress = (e.detail && typeof e.detail.totalProgress === 'number') ? e.detail.totalProgress : 0;
  });
  viewer.addEventListener('error', function () {
    realProgress = 0;
    setState('error');
  });

  /* ============================================================
     THE DESIGN ON THE OBJECT, AND IT IS OURS
     ------------------------------------------------------------
     Ton, 11.09: «модель неполная без дизайна». Build 1 dressed the
     box in blank kraft, and a blank box is a sample, not a design:
     a client looking at it has nothing to approve.

     The GLB carries geometry and near black placeholder materials.
     The client's own application swaps a baseColorTexture onto
     each of them at runtime, and those textures carry the branding
     of a REAL GildedBox customer (harvest §PII). None of that
     graphic is on this page and none ever will be. Every surface
     below is drawn into a canvas here, at runtime, for a brand
     that does not exist:

       Lid_1, Tray_1      the wrap: deep navy, a lattice of
                          hairlines, and the Acme Aviation lockup
                          repeated across it the way a real
                          corporate wrapping paper repeats
       Blank, Blank.001   the unprinted inner walls (the client
                          paints these flat too: their own map
                          sends both to a solid colour)
       Insert_1           the tray insert, a shade deeper
       Card_1.001         the greeting card, and the only surface
                          the personalize drawer rewrites
       Bottle_1           glass with transmission: untouched
       Paper_1            the foil of the bottle: untouched
       Label_1            the wine's own label, the one texture the
                          GLB carries itself: untouched. It is the
                          product, not a customer's brand.

     baseColorFactor is LINEAR in glTF, so every flat colour goes
     through the sRGB transfer function on its way in.

     THE OBJECT'S COLOURS ARE NO TOKEN, and the reason is not
     laziness: the Zinc scale is INK AND GROUND, the colours of a
     surface a reader looks AT. These are the colours of a printed
     paper object inside a rendered scene, lit by an environment
     map and seen through a tone mapper, and putting Zinc 900 on a
     box only guarantees that the box is not Zinc 900 on screen.
     Navy is also the honest answer to the warm ground: a dark
     noble wrap on a lit paper is the oldest gift language there
     is, and it gives the white lockup somewhere to live.
     ============================================================ */
  var CARD = {
    box:  'Acme Aviation',
    intro: 'Dear Morgan,',
    message: 'Thank you for a remarkable year in the air.',
    signature: 'The Acme Aviation team'
  };

  /* NO TOKEN, every one of them, reason above. */
  var NAVY      = '#152a46';   /* the wrap */
  var NAVY_IN   = '#1d3757';   /* the inner walls, one step up so the box has depth */
  var NAVY_DEEP = '#11223a';   /* the insert, one step down */
  var PAPER     = '#fbfaf7';   /* the card stock, warm white */

  function srgbToLinear(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [16, 8, 0].map(function (sh) {
      var c = ((n >> sh) & 255) / 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }).concat([1]);
  }

  function canvas(size) {
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    return c;
  }

  /* Canvas has no letter-spacing in every engine we run on, so the
     tracking of a caps lockup is walked by hand. */
  function tracked(g, text, cx, y, track) {
    var i, total = 0;
    for (i = 0; i < text.length; i++) total += g.measureText(text[i]).width + track;
    total -= track;
    var x = cx - total / 2;
    var prev = g.textAlign;
    g.textAlign = 'left';
    for (i = 0; i < text.length; i++) {
      g.fillText(text[i], x, y);
      x += g.measureText(text[i]).width + track;
    }
    g.textAlign = prev;
    return total;
  }

  /* THE MARK. A roundel with a swept wing in it: the oldest shape
     an airline has ever used, drawn in four lines so it survives
     being a hundred pixels wide on a box and forty on a card. */
  function wing(g, cx, cy, r, color, weight) {
    g.save();
    g.strokeStyle = color;
    g.fillStyle = color;
    g.lineWidth = r * (weight || 0.1);
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.stroke();
    g.beginPath();
    g.moveTo(cx + r * 0.68, cy - r * 0.56);
    g.lineTo(cx - r * 0.70, cy + r * 0.44);
    g.lineTo(cx - r * 0.12, cy + r * 0.12);
    g.lineTo(cx - r * 0.26, cy + r * 0.66);
    g.closePath();
    g.fill();
    g.restore();
  }

  /* THE WRAP. Deep navy, a lattice of hairlines at four per cent,
     and the lockup repeated on a staggered grid. The UV of this
     model is not uniform across the faces, so nothing is placed:
     the art REPEATS, which is what printed gift paper does, and
     every face of the box therefore shows the brand whichever way
     the reader turns it. */
  function wrapTexture() {
    var S = 2048, c = canvas(S), g = c.getContext('2d');
    g.fillStyle = NAVY;
    g.fillRect(0, 0, S, S);

    /* the lattice: two diagonals, a hairline each */
    g.strokeStyle = 'rgba(255,255,255,.05)';
    g.lineWidth = 3;
    var step = 112, k;
    for (k = -S; k < S * 2; k += step) {
      g.beginPath(); g.moveTo(k, 0); g.lineTo(k + S, S); g.stroke();
      g.beginPath(); g.moveTo(k, S); g.lineTo(k + S, 0); g.stroke();
    }

    /* THE LOCKUP, REPEATED. The tile is deliberately small: the UV
       of this model runs at very different scales from face to
       face (the lid reads the texture about three times finer than
       the tray front), so a big lockup that sits right on one face
       is a billboard on the next. A dense repeat is readable at
       both scales, and that is exactly how printed gift paper
       behaves. */
    var word = String(CARD.box || 'Acme Aviation').toUpperCase();
    var tileX = 470, tileY = 235, x, y, row = 0;
    g.textBaseline = 'middle';
    g.textAlign = 'center';
    g.font = '600 29px Inter, sans-serif';
    for (y = -tileY; y < S + tileY; y += tileY, row++) {
      for (x = -tileX; x < S + tileX; x += tileX) {
        var cx = x + (row % 2 ? tileX / 2 : 0);
        g.fillStyle = 'rgba(255,255,255,.92)';
        var w = g.measureText(word).width + word.length * 6;
        tracked(g, word, cx + 32, y, 6);
        wing(g, cx - w / 2 - 6, y, 21, 'rgba(255,255,255,.92)', 0.13);
      }
    }
    return c.toDataURL('image/png');
  }

  /* THE CARD. Warm white stock, the lockup in navy at the top, the
     words in the page's own serif, a navy band along the foot. The
     UV of this mesh runs the whole square, so the copy is set in
     the middle band and the margins are generous enough that a
     wrap of a few per cent either way costs nothing. */
  function cardTexture() {
    var S = 2048, c = canvas(S), g = c.getContext('2d');
    g.fillStyle = PAPER;
    g.fillRect(0, 0, S, S);

    /* the foot band: the wrap's own navy, so card and box are one
       design and not two */
    g.fillStyle = NAVY;
    g.fillRect(0, S - 150, S, 150);

    g.textAlign = 'center';
    g.textBaseline = 'middle';

    /* THE COPY IS SET LARGE ON PURPOSE. A greeting card is about
       200px wide on a 1440 screen, so type that would be handsome
       at print scale is four pixels tall and reads as grey noise
       (build 1 proved it). Everything here is sized so the words
       are legible AT THE SIZE THE CARD IS ACTUALLY SEEN, which is
       what makes the reader believe there is a design on it. */
    var mark = String(CARD.box || 'Acme Aviation').toUpperCase();
    wing(g, S / 2, 470, 88, NAVY, 0.1);
    g.fillStyle = NAVY;
    g.font = '600 70px Inter, sans-serif';
    tracked(g, mark, S / 2, 660, 14);

    g.strokeStyle = 'rgba(21,42,70,.3)';
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(S / 2 - 380, 780); g.lineTo(S / 2 + 380, 780); g.stroke();

    g.fillStyle = '#18181b';                       /* --zinc-900 */
    g.font = '300 140px "Noto Serif", Georgia, serif';
    g.fillText(CARD.intro, S / 2, 980);

    g.font = '300 120px "Noto Serif", Georgia, serif';
    var words = String(CARD.message || '').split(/\s+/);
    var line = '', lines = [], i, max = S * 0.82;
    for (i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (g.measureText(test).width > max && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (i = 0; i < lines.length; i++) g.fillText(lines[i], S / 2, 1190 + i * 165);

    g.fillStyle = '#52525b';                       /* --zinc-600 */
    g.font = '300 96px "Noto Serif", Georgia, serif';
    g.fillText(CARD.signature, S / 2, 1190 + lines.length * 165 + 60);

    return c.toDataURL('image/png');
  }

  var FLAT = {
    'Blank':     srgbToLinear(NAVY_IN),
    'Blank.001': srgbToLinear(NAVY_IN),
    'Insert_1':  srgbToLinear(NAVY_DEEP)
  };

  var dressing = false;
  function dress() {
    if (dressing || !viewer.model) return Promise.resolve();
    dressing = true;
    var wrapUrl = wrapTexture(), cardUrl = cardTexture();
    var jobs = viewer.model.materials.map(function (m) {
      var url = null;
      if (m.name === 'Lid_1' || m.name === 'Tray_1') url = wrapUrl;
      else if (m.name === 'Card_1.001') url = cardUrl;
      if (url) {
        return viewer.createTexture(url).then(function (tex) {
          m.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
          m.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]);
          m.pbrMetallicRoughness.setRoughnessFactor(0.7);
        });
      }
      if (FLAT[m.name]) {
        m.pbrMetallicRoughness.setBaseColorFactor(FLAT[m.name]);
        m.pbrMetallicRoughness.setRoughnessFactor(0.9);
      }
      return Promise.resolve();
    });
    return Promise.all(jobs).then(function () { dressing = false; });
  }

  viewer.addEventListener('load', function () {
    /* fonts.ready before the canvas is drawn: a texture painted in
       the fallback face would bake the wrong metrics into the
       object and never recover (the fix oro.js already carries). */
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    ready.then(dress).then(function () {
      loaded = true;
      realProgress = 1;
      window.__gbdsReady = true;
    });
  });

  /* ============================================================
     SEE IT PERSONALIZED
     ------------------------------------------------------------
     Their surface is a centred modal. Ours is <gb-drawer>, and
     that is a decision, not a shortcut: the house has ONE overlay
     organism, it already carries Esc, the backdrop, the focus trip
     and the scroll lock, and a second overlay pattern may not be
     born without Ton's word (law 0a.4).

     AND IT REALLY WORKS. The card and the wrap are our own canvas,
     so «Show it on the model» repaints both and the object on the
     stage changes in front of the reader, ON TOP OF the demo
     design rather than instead of it. Nothing is sent anywhere and
     nothing is remembered, which is exactly what the helper says.
     ============================================================ */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function pzBody() {
    return '' +
      /* `optional` on every field, and it is not a detail: without
         it the organism draws the gold required star, and nothing
         here is required. */
      '<div class="gbds-pz__group">' +
        '<span class="gb-eyebrow">Gift box</span>' +
        '<gb-field optional input-id="gbdsBox" name="box" label="Brand line"' +
          ' value="' + esc(CARD.box) + '"' +
          ' helper="A short line, printed across the wrap."></gb-field>' +
      '</div>' +
      '<div class="gbds-pz__group">' +
        '<span class="gb-eyebrow">Greeting card</span>' +
        '<gb-field optional input-id="gbdsIntro" name="intro" label="Intro" value="' + esc(CARD.intro) + '"></gb-field>' +
        '<gb-field optional input-id="gbdsMessage" name="message" type="textarea" label="Message"' +
          ' value="' + esc(CARD.message) + '"' +
          ' helper="Two lines sit comfortably on the card."></gb-field>' +
        '<gb-field optional input-id="gbdsSign" name="signature" label="Signature" value="' + esc(CARD.signature) + '"></gb-field>' +
      '</div>';
  }

  function pzFoot() {
    return '' +
      /* --medium, not --large: large is the conversion rung, and the
         confirm of a drawer form is the medium one (components.md,
         btn-ladder-1). */
      '<div class="gbds-pz__foot">' +
        '<button type="button" class="gb-btn gb-btn--medium gb-btn--ghost gb-btn--secondary" data-gbds="pz-cancel">' +
          '<span class="gb-btn__label">Cancel</span></button>' +
        '<button type="button" class="gb-btn gb-btn--medium gb-btn--filled gb-btn--secondary" data-gbds="pz-show">' +
          '<span class="gb-btn__label">Show it on the model</span></button>' +
      '</div>';
  }

  var drawer = document.querySelector('gb-drawer');

  function openPersonalize() {
    if (!drawer || typeof drawer.open !== 'function') return;
    drawer.open({
      title: 'See it personalized',
      sub: 'Type the names or messages you would put on this gift. Nothing is saved, it only changes what you see here.',
      html: pzBody(),
      foot: pzFoot()
    });
  }

  function readField(id, fallback) {
    var el = document.getElementById(id);
    return el && el.value != null && el.value !== '' ? el.value : fallback;
  }

  /* ============================================================
     THE QUIET ROADS
     ------------------------------------------------------------
     Download mockup keeps the promise the client's page breaks: an
     honest extension. Theirs writes a WEBP and calls it
     Stags-Leap-Cabernet.png (harvest §5), which some readers
     cannot open at all. Ours asks the canvas for a real PNG.
     ============================================================ */
  function download() {
    var url = null;
    try { url = viewer.toDataURL('image/png'); } catch (e) {}
    if (!url) return;
    var a = document.createElement('a');
    a.href = url;
    a.download = 'stags-leap-cabernet.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-gbds]') : null;
    if (!t) return;
    var what = t.getAttribute('data-gbds');
    if (what === 'personalize') { openPersonalize(); return; }
    if (what === 'download') { download(); return; }
    if (what === 'retry') { setState('scene'); viewer.src = MODEL; return; }
    if (what === 'pz-cancel') { drawer.close(); return; }
    if (what === 'pz-show') {
      CARD.box       = readField('gbdsBox', CARD.box);
      CARD.intro     = readField('gbdsIntro', CARD.intro);
      CARD.message   = readField('gbdsMessage', CARD.message);
      CARD.signature = readField('gbdsSign', CARD.signature);
      dressing = false;
      dress();
      drawer.close();
      return;
    }
    /* Approve design and Request changes are the decision of a real
       route and have nowhere to go inside a prototype. They say so
       in the console rather than pretending. */
    if (what === 'approve' || what === 'changes') {
      console.log('[design-share] ' + (what === 'approve' ? 'Approve design' : 'Request changes') + ': the route behind this button is not built in the prototype.');
    }
  });

  /* ============================================================
     ONE ROW PER AXIS IN THE ONE CONSOLE
     ============================================================ */
  var panel = document.querySelector('gb-studio-panel');
  function wirePanel() {
    if (!panel || typeof panel.addGroup !== 'function') return;
    panel.addGroup({
      type: 'choice',
      title: 'Concept',
      value: concept,
      options: [
        { label: 'One line cabinet', value: 'a', note: 'The mark, the name and the two utilities on one light line; the object on a big plate; one small centred signature at the foot.' },
        { label: 'Object and column', value: 'b', note: 'The viewer takes the full height, a quiet white column stands beside it behind one hairline. The grammar of a product page.' },
        { label: 'Clean frame', value: 'c', note: 'The object edge to edge on warm light. No band and no plate: four corners of text and one caption.' },
        { label: 'Their page, honestly', value: 'd', note: 'The live layout one to one, with every element ours: the serif name, our button ladder, our hint, our gutters.' }
      ],
      onChange: setConcept
    });
    panel.addGroup({
      type: 'choice',
      title: 'Actions',
      value: actions,
      options: [
        { label: 'Off', value: 'off', note: 'What the client\'s page does: the design is shown, no answer is asked for. The default on every concept.' },
        { label: 'On', value: 'on', note: 'An answer is being asked for. Request changes beside Approve design, in the place each concept provides for them.' }
      ],
      onChange: setActions
    });
    panel.addGroup({
      type: 'choice',
      title: 'State',
      value: state,
      options: [
        { label: 'Scene', value: 'scene', note: 'The film plays and the object arrives. What a reader sees.' },
        { label: 'Loading', value: 'loading', note: 'The loader is held so it can be looked at.' },
        { label: 'Error', value: 'error', note: 'The design did not arrive. The stage says so and keeps both roads open.' }
      ],
      onChange: setState
    });
    panel.addGroup({
      type: 'choice',
      title: 'Loader',
      value: skin,
      options: [
        { label: 'Gold', value: 'gold', note: 'Russell and Dima\'s own film, reconstructed from the client\'s CSS: the mark letter by letter, the sparks, the sheen, the exit into the light. Our serif is the only change, and it is loaded.' },
        { label: 'Ink', value: 'ink', note: 'The same film in Zinc, offered beside it. Identical timings, no gold, no sheen.' }
      ],
      onChange: function (v) { setSkin(v, true); }
    });
  }
  if (panel && typeof panel.addGroup === 'function') wirePanel();
  else if (window.customElements) customElements.whenDefined('gb-studio-panel').then(function () {
    panel = document.querySelector('gb-studio-panel');
    setTimeout(wirePanel, 0);
  });

  setConcept(concept);
  setActions(actions);
  setSkin(skin);
  setState(state);
})();
</script>

</body>
</html>
