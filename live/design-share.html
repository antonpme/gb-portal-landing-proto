<!-- ============================================================
     gbppl-design-share-1 — THE PAGE A CLIENT OPENS FROM A LINK
     ------------------------------------------------------------
     SOURCE. DD-149, harvested 11.09 off the client staging route
     /shared/design-preview/<uuid>: report and instruments in
     studio\harvest\dd149\HARVEST-REPORT.md. What the harvest gave
     us, and what this page does with each piece:

       the GLB           taken. 119 192 bytes, valid glTF 2.0, Draco
                         + EXT_texture_webp, ten meshes, nine
                         materials. Vendored to
                         assets\models\design-share\gift-box.glb.
       their textures    NOT taken. They carry the real branding of
                         a live GildedBox customer (harvest §PII).
                         Every surface on this page is painted by us
                         at runtime, on the house scale, for a
                         fictional brand, Acme Aviation.
       three.js + TresJS NOT taken. model-viewer carries camera,
                         orbit, zoom, environment and shadow out of
                         the box; a render loop of our own would be
                         weeks of upkeep for what one tag does
                         (harvest §7). Vendored, not hotlinked:
                         assets\vendor\model-viewer\ plus the Draco
                         decoder beside it, so the page runs with no
                         network at all.
       the loader        TAKEN, AND IT IS THE DEFAULT. Ren, 11.09,
                         mid wave: the gold loader on the live page
                         was drawn by Russell with Dima, so the gold
                         there is legitimate and not a stray. The
                         gold skin is therefore reproduced faithfully
                         off the harvest, values and all — the
                         radial ground #1a1a1a to #0d0d0d, the
                         #c9a961 / #f0d78c bar with its travelling
                         glow, the word by word arrival of the line,
                         the exit that REPAINTS ITSELF INTO THE
                         LIGHT instead of blinking out — and it is
                         what ?loader= opens on.
                         ?loader=ink is OUR QUIET PROPOSAL beside
                         it: the same three beats in Zinc and the
                         system serif. One mechanism, two skins,
                         and Ton picks.
                         Two things are ours in both skins: the
                         words («PREPARING YOUR DESIGN EXPERIENCE
                         . . .» became one short line) and the
                         serif, because theirs declares Cormorant
                         Garamond, never loads it, and plays
                         Georgia by accident.
       their two CTAs    taken as a LESSON. 33.5px beside 31.5px, a
                         pill beside a thing that is not a pill.
                         Every control here is one organism on one
                         rung: .gb-btn --large.
       their copy        rewritten. «See what this gift will look
                         personalized» is broken English; ours says
                         «See it personalized». Their modal's
                         subtitle carries an em dash; ours does not.

     ------------------------------------------------------------
     WHAT IS WORN, BY NAME (Ton-6, name the component before you
     draw one):
       .gb-container  the one ruler of the page
       .gb-eyebrow    the eyebrow of the title zone, the gesture
                      hint, the loader percentage
       .gb-btn        every control, all on the --large rung
       <gb-field>     every field of the personalize surface
       <gb-drawer>    the personalize surface itself
       <gb-studio-panel>, Inspect, Comment: the studio's chrome

     WHAT THIS FILE OWNS, and only because the system has no atom
     for it yet (both recorded in the wave report, neither invented
     into system\ by this wave, law 0a.2 / 0a.4):

       1. THE BARE HEADER. A recipient of this link is not
          necessarily a portal user, so the bar carries no
          navigation at all: one centred wordmark on an 80px band.
          header.css has --studio, --studio-hub, --transparent,
          --sticky, --auth and the portal bar, and none of them is
          «the mark alone, centred». The MARK ITSELF is the system's
          .gbh-brand box (168x56, 126x42 below 768) out of
          header.css, worn and not redrawn; this file writes the
          PLACEMENT only, exactly the way header.css writes
          placement for the buttons it does not own.
       2. THE SCENE PLATE. The frame rule is the dashboard's, quoted
          rather than re-derived: «a photograph dropped on a white
          card is a picture; the same photograph on a quiet ground
          inside a hairline is an OBJECT» (live\portal-dashboard
          .html, .gbppd-thumbwrap). Zinc 50 ground, Zinc 200
          hairline, --radius, the thing centred inside with room to
          breathe. Same rule, a bigger square.
       3. THE LOADER. No loading organism exists in the house.

     ------------------------------------------------------------
     THE THREE AXES, written in the grammar of the live pages
     (live\portal-dashboard.html): read once out of the address,
     written back with replaceState, offered as choice rows of the
     one console. Nothing is remembered anywhere but the address,
     because a variant is a view and the address is how a view is
     shared.

       ?mode=view|approve     default approve
       ?state=loading|scene|error   default scene
       ?loader=gold|ink       default gold (Ren, 11.09)

     ------------------------------------------------------------
     THE LAW OF THE SURFACE. Two voices and one eyebrow, and the
     full table is in the wave report:
       leading  Noto Serif 300, the product name and the loader line
       working  Inter 400, the sender line, the helpers, the footer
       eyebrow  .gb-eyebrow, and it is the SAME role on all four
                captions: the title eyebrow, the gesture hint, the
                loader percentage, the field labels of the drawer
     Button labels are not a page voice: they belong to button.css
     and speak its label role wherever they stand.

     NO TOKEN, and every one of them named with its reason:
       plate height 70vh / min 480      LIVE dd149 from 768 up, the
       plate height 56vh / min 360      client's own frame rule;
                                        below 768 it is ours, and
                                        the paragraph at the rule
                                        says why (Ton-17)
       the gold loader's whole palette  Russell and Dima's own, off
       and every duration in it         the harvest, shut inside
                                        .gbds-loader so nothing else
                                        on the page can reach them.
                                        Reproduction of a published
                                        surface is Ton-3, not our
                                        --mo-* scale
       the four material colours        the paper of a rendered
                                        object is not ink and not
                                        ground; the long note at
                                        the dressing block argues it
       the camera's five numbers        orbit, target, field of
                                        view: a camera has no scale
                                        in any design system, and
                                        these were found by eye on
                                        screenshots at 1440 and 390
     And one derived rather than invented:
       --gbds-film = calc(--mo-large * 2)  the bar's own ramp; the
                                        loader is longer than any
                                        single move on the page
     ============================================================ -->

<style>
/* ============================================================
   THE PAGE'S OWN RULES. Placement, and the three things the
   system has no atom for. Every length is a rung of --space-*
   or a token, and the three exceptions are marked NO TOKEN with
   their reason on the line.
   ============================================================ */

/* Ловушка 29: [hidden] loses to any author display of equal
   specificity, and this page hides four things by the attribute
   (the loader, the error, and each half of the action ladder). */
.gbds-page [hidden] { display: none !important; }

/* THE FILM'S LENGTH, derived from the scale rather than invented:
   the loader runs longer than any single move on the page. The
   only reader is the script, which takes it off the body so the
   number is written once. */
.gbds-page { --gbds-film: calc(var(--mo-large) * 2); }

/* ---- the bare header ------------------------------------- */
.gbds-head {
  display: flex;
  align-items: center;
  justify-content: center;
  height: var(--header-h);
  background: var(--white);
  border-bottom: 1px solid var(--zinc-200);
}
.gbds-head .gbh-brand { justify-content: center; }

/* ---- the page column ------------------------------------- */
/* Top gap == bottom gap: --space-32 of air above the title zone
   and the same below the ladder, at every width. */
.gbds-main { padding-block: var(--space-32); }

/* THE 2:1 RHYTHM. 16 inside a zone, 32 between zones. The only
   tighter step is the eyebrow against the name it explains, and
   8 is a rung of the same scale. */
.gbds-title { margin: 0 0 var(--space-32); }
.gbds-title .gb-eyebrow { display: block; }
.gbds-name {
  margin: var(--space-8) 0 0;
  font-family: var(--font-serif);
  font-size: 28px;                 /* TYPE-SCALE «H1 page title», verified live */
  font-weight: 300;
  line-height: 35px;
  letter-spacing: -0.4px;
  color: var(--zinc-900);
}
@media (min-width: 1280px) { .gbds-name { font-size: 36px; line-height: 45px; } }
@media (min-width: 2000px) { .gbds-name { font-size: 40px; line-height: 50px; } }
.gbds-from {
  margin: var(--space-16) 0 0;
  font-size: 16px;                 /* TYPE-SCALE «Body base» */
  font-weight: 400;
  line-height: 24px;
  color: var(--zinc-600);
}

/* ---- the scene plate ------------------------------------- */
/* The dashboard's frame rule at a bigger size: quiet ground,
   hairline, our radius, and the object inside with room. */
.gbds-stage {
  position: relative;
  display: block;
  padding: var(--space-16);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
  background: var(--zinc-50);
  overflow: hidden;
}
@media (min-width: 768px) { .gbds-stage { padding: var(--space-24); } }

/* THE HEIGHT IS THEIRS FROM 768 UP AND OURS BELOW IT (Ton-17).
   LIVE dd149 is h-[70vh] min-h-[480px] at every width, and the
   harvest's own eye note says the rhythm does not hold: a wide,
   flat object inside a tall portrait frame leaves a third of the
   plate empty over it. So the phone gets a shorter plate and the
   object fills it; from 768 the frame is the client's, to the
   digit. Both pairs are NO TOKEN: the viewport is on no scale of
   ours, and the 480 is measured. */
.gbds-viewer {
  display: block;
  width: 100%;
  height: 56vh;                    /* NO TOKEN: ours, see above */
  min-height: 360px;               /* NO TOKEN: ours, see above */
  background: transparent;
  --poster-color: transparent;
  --progress-bar-color: transparent;
  --progress-mask: transparent;
}
@media (min-width: 768px) {
  .gbds-viewer {
    height: 70vh;                  /* NO TOKEN: LIVE dd149, h-[70vh] */
    min-height: 480px;             /* NO TOKEN: LIVE dd149, min-h-[480px] */
  }
}

/* ---- the row under the plate ----------------------------- */
/* The hint on the left, the quiet pair on the right, one row,
   16 under the plate. Below 768 the row stacks and the pair
   goes full width, because two ghost buttons side by side at
   390 would each be narrower than their own label. */
.gbds-under {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-16);
  margin-top: var(--space-16);
}
/* THE HINT ARRIVES WITH THE OBJECT IT DESCRIBES. While the film is
   running, and on the error plate, there is nothing to turn and
   nothing to zoom, and a caption that says otherwise is a lie in
   small caps. It fades rather than appears, so the row below the
   plate never changes height. */
.gbds-hint {
  margin: 0;
  line-height: 1.5;
  opacity: 0;
  transition: opacity var(--mo-medium) var(--mo-arrive);
}
body[data-gbds-scene="on"] .gbds-hint { opacity: 1; }
.gbds-quiet { display: flex; flex-wrap: wrap; gap: var(--space-8); }
/* IN VIEW MODE THE TWO ROADS ARE THE LADDER, so they do not also
   stand by the plate. Two identical labels one above the other is
   not a choice offered twice, it is a reader wondering which one
   is the real button. */
body[data-gbds-mode="view"] .gbds-quiet { display: none; }
@media (max-width: 767px) {
  .gbds-quiet { width: 100%; }
  .gbds-quiet .gb-btn { flex: 1 1 100%; }
}

/* ---- the decision ladder --------------------------------- */
.gbds-ladder {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-16);
  margin-top: var(--space-32);
}
@media (max-width: 767px) {
  .gbds-ladder .gb-btn { flex: 1 1 100%; }
}

/* ---- the foot -------------------------------------------- */
.gbds-foot {
  margin-top: var(--space-32);
  padding-top: var(--space-16);
  border-top: 1px solid var(--zinc-200);
  font-size: 14px;                 /* TYPE-SCALE «Small regular» */
  font-weight: 400;
  line-height: 1.5;
  color: var(--zinc-500);
}

/* ============================================================
   THE LOADER                              gbppl-design-share-1
   ------------------------------------------------------------
   AN EXACT RECONSTRUCTION, AND IT IS THE DEFAULT.

   Ren, 11.09, correcting the brief mid wave: the gold loader on
   the live page was drawn by Russell with Dima. Ton, the same
   hour: not «after the motif» but an EXACT reconstruction from
   the harvest, which carries the client's own raw CSS chunk
   (LoadingAnimation.raw.css), the logo SVG with its goldGradient,
   the markup and the computed styles at four moments of the load.

   So every value in the gold skin below is theirs, transcribed
   from that chunk rather than re-derived: the radial ground
   #1a1a1a to #0d0d0d, the five letters of the mark fading in at
   0 / .1 / .2 / .3 / .4s, the words at .6 / .7 / .8 / .9s, the
   dots pulsing on 1.4s at .2s apart, the progress container
   arriving at 1.2s over .8s, the 2px track, the 90deg
   #c9a961 / #f0d78c bar, the 12x12 travelling glow, the two
   ornaments, the forty particles, the diagonal sheen, the centre
   glow breathing between .4 and .8, and the two-stage exit: a
   white overlay rising over 2s while every painted thing under it
   turns dark-on-light, and only then opacity 0 over 1.2s with a
   .5s wait. The rhythms of this file are NOT our --mo-* scale on
   purpose: this is the reproduction of a published surface, which
   Ton-13 and Ton-3 govern, not a motion of ours.

   THE ONE DELIBERATE IMPROVEMENT (Ton, 11.09; Ton-3 says
   deviations are allowed when they are conscious and written
   down): THE SERIF IS ACTUALLY LOADED. Their .loading-text and
   .progress-label declare «Cormorant Garamond, Georgia, serif»
   and never request the face — there is not one network call for
   it in the whole harvest — so the live loader plays Georgia by
   accident. Ours speaks var(--font-serif), the system's Noto
   Serif, which is loaded at the top of this file. Same design,
   finally rendered as designed.

   THE SECOND, SMALLER DEVIATION: their exit lands on #fff
   because the ground of their scene is white. Ours lands on
   var(--zinc-50) because that is the ground of OUR plate, and
   landing on their white would leave a two unit step at the last
   frame of the film.

   ?loader=ink IS THE SAME FILM RECOLOURED. Not a second
   mechanism: identical markup, identical timings, Zinc instead of
   gold, offered as our quiet proposal beside Russell's.

   The overlay covers the PLATE, not the window, because the thing
   being prepared is the object on the plate and nothing else on
   the page is waiting.

   Ton-7: the branded film plays always. No prefers-reduced-motion
   branch exists here, and none is to be added.
   ============================================================ */
.gbds-loader {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: var(--space-32);                       /* LIVE dd149: 2rem */
  background: var(--gbds-l-ground);
  transition: opacity 1.2s ease-out .5s;          /* LIVE dd149 .loading-container */
}
/* THE CENTRE GLOW, breathing (LIVE dd149 .loading-container:after) */
.gbds-loader::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--gbds-l-halo);
  animation: gbds-centerGlow 3s ease-in-out infinite;   /* LIVE dd149 */
  pointer-events: none;
}
/* THE OVERLAY THAT RISES INTO THE LIGHT (LIVE dd149 .white-overlay) */
.gbds-loader__veil {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: var(--gbds-l-light);
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease-in-out;             /* LIVE dd149 */
}
.gbds-loader.is-leaving .gbds-loader__veil { opacity: 1; }
.gbds-loader.is-gone .gbds-loader__veil { opacity: 0; transition: opacity 1.2s ease-out .5s; }  /* LIVE dd149 */
.gbds-loader.is-gone { opacity: 0; pointer-events: none; }
/* One frame with every animation off: the rewind, see the script. */
.gbds-loader.is-rewound,
.gbds-loader.is-rewound * { animation: none !important; }

.gbds-loader__wrap {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: opacity .4s ease-out;               /* LIVE dd149 .content-wrapper */
}
.gbds-loader.is-gone .gbds-loader__wrap { opacity: 0; }

/* ---- GOLD, Russell and Dima's, and what the page opens on ---- */
.gbds-loader {
  --gbds-l-ground: radial-gradient(ellipse at center, #1a1a1a 0, #0d0d0d 100%);      /* LIVE dd149 */
  --gbds-l-light:  var(--zinc-50);                                                    /* deviation, written above: their #fff is our plate's ground */
  --gbds-l-halo:   radial-gradient(ellipse 50% 50% at 50% 50%, rgba(201,169,97,.02) 0, transparent 70%);  /* LIVE dd149 */
  --gbds-l-mark:   url(#gbdsGold);                                                    /* LIVE dd149 goldGradient */
  --gbds-l-shadow: drop-shadow(0 0 15px rgba(139,115,85,.25));                        /* LIVE dd149 */
  --gbds-l-ink:    rgba(201,169,97,.8);                                               /* LIVE dd149 */
  --gbds-l-quiet:  rgba(201,169,97,.7);                                               /* LIVE dd149 */
  --gbds-l-orn:    rgba(160,131,71,.5);                                               /* LIVE dd149 */
  --gbds-l-track:  rgba(201,169,97,.2);                                               /* LIVE dd149 */
  --gbds-l-bar:    linear-gradient(90deg, #c9a961, #f0d78c 50%, #c9a961);             /* LIVE dd149 */
  --gbds-l-glow:   radial-gradient(circle, rgba(166,136,92,.6) 0, transparent 70%);   /* LIVE dd149 */
  --gbds-l-spark:  rgba(201,169,97,.6);                                               /* LIVE dd149 */
  --gbds-l-diag:   linear-gradient(45deg, transparent, transparent 40%, rgba(201,169,97,.012), rgba(201,169,97,.031), rgba(201,169,97,.012), transparent 60%, transparent);  /* LIVE dd149 */
}
/* ---- INK, ours: the same film, recoloured ---- */
.gbds-loader[data-gbds-loader="ink"] {
  --gbds-l-ground: var(--zinc-950);   /* ловушка 13: a wide gradient of small range is bands. Ours is flat by choice */
  --gbds-l-halo:   none;
  --gbds-l-mark:   var(--zinc-100);
  --gbds-l-shadow: none;
  --gbds-l-ink:    var(--zinc-100);
  --gbds-l-quiet:  var(--zinc-400);
  --gbds-l-orn:    var(--zinc-600);
  --gbds-l-track:  var(--zinc-800);
  --gbds-l-bar:    var(--zinc-100);
  --gbds-l-glow:   radial-gradient(circle, rgba(244,244,245,.5) 0, transparent 70%);
  --gbds-l-spark:  rgba(244,244,245,.5);
  --gbds-l-diag:   none;
}
/* ---- THE TURN: everything painted goes dark on light ----
   The gold skin turns over into THEIR measured values; the ink
   skin into ours, one rung deeper so it stays legible on Zinc 50.
   (LIVE dd149: the .transitioning block, whole.) */
.gbds-loader.is-leaving {
  --gbds-l-mark:   #1a1a1a;                                                        /* LIVE dd149 */
  --gbds-l-shadow: none;                                                           /* LIVE dd149 */
  --gbds-l-ink:    rgba(26,26,26,.8);                                              /* LIVE dd149 */
  --gbds-l-quiet:  rgba(26,26,26,.6);                                              /* LIVE dd149 */
  --gbds-l-orn:    rgba(26,26,26,.4);                                              /* LIVE dd149 */
  --gbds-l-track:  rgba(26,26,26,.15);                                             /* LIVE dd149 */
  --gbds-l-bar:    linear-gradient(90deg, #333, #555 50%, #333);                   /* LIVE dd149 */
  --gbds-l-glow:   radial-gradient(circle, rgba(50,50,50,.4) 0, transparent 70%);  /* LIVE dd149 */
}
.gbds-loader[data-gbds-loader="ink"].is-leaving {
  --gbds-l-mark:  var(--zinc-900);
  --gbds-l-ink:   var(--zinc-900);
  --gbds-l-quiet: var(--zinc-600);
  --gbds-l-orn:   var(--zinc-400);
  --gbds-l-track: var(--zinc-200);
  --gbds-l-bar:   linear-gradient(90deg, var(--zinc-700), var(--zinc-500) 50%, var(--zinc-700));
}

/* ---- the mark, five letters, one at a time ---- */
.gbds-loader__logo {
  width: 200px;                     /* LIVE dd149: w-[200px] h-[70px] */
  height: 70px;
  filter: var(--gbds-l-shadow);
  transition: filter 1s ease-out;   /* LIVE dd149 */
}
@media (min-width: 1024px) {        /* LIVE dd149: lg:w-[320px] lg:h-[110px] */
  .gbds-loader__logo { width: 320px; height: 110px; }
}
@media (max-width: 768px) { .gbds-loader__logo { filter: none; } }  /* LIVE dd149 */
.gbds-loader__letter {
  fill: var(--gbds-l-mark);
  opacity: 0;
  animation: gbds-fadeInLetter .4s ease-out forwards;  /* LIVE dd149 */
  transition: fill 1s ease-out;                        /* LIVE dd149 */
}
.gbds-loader__letter:nth-child(1) { animation-delay: 0s; }     /* LIVE dd149 */
.gbds-loader__letter:nth-child(2) { animation-delay: .1s; }
.gbds-loader__letter:nth-child(3) { animation-delay: .2s; }
.gbds-loader__letter:nth-child(4) { animation-delay: .3s; }
.gbds-loader__letter:nth-child(5) { animation-delay: .4s; }

/* ---- the line ----
   THE DEVIATION LIVES ON THIS RULE: var(--font-serif) instead of
   the Cormorant Garamond they declare and never load. Everything
   else on it is theirs: 12px, 16px from the xl step, .15em of
   tracking, uppercase, .4rem between words. */
.gbds-loader__head { display: flex; flex-direction: column; align-items: center; gap: var(--space-24); }  /* LIVE dd149: 1.5rem */
.gbds-loader__text {
  display: flex;
  gap: 6.4px;                       /* LIVE dd149: .4rem */
  margin: 0;
  font-family: var(--font-serif);   /* DEVIATION, Ton 11.09: theirs never loads and plays Georgia */
  font-size: 12px;                  /* LIVE dd149: text-[12px] */
  letter-spacing: .15em;            /* LIVE dd149 */
  text-transform: uppercase;        /* LIVE dd149 */
  color: var(--gbds-l-ink);
  transition: color .2s ease-out;   /* LIVE dd149 */
}
@media (min-width: 1280px) { .gbds-loader__text { font-size: 16px; } }  /* LIVE dd149: xl:text-[16px] */
.gbds-loader__word {
  opacity: 0;
  animation: gbds-fadeInWord .5s ease-out forwards;   /* LIVE dd149 */
}
.gbds-loader__word:nth-child(1) { animation-delay: .6s; }   /* LIVE dd149 */
.gbds-loader__word:nth-child(2) { animation-delay: .7s; }
.gbds-loader__word:nth-child(3) { animation-delay: .8s; }
.gbds-loader__word:nth-child(4) { animation-delay: .9s; }
.gbds-loader__dots {
  display: flex;
  opacity: 0;
  animation: gbds-fadeInWord .5s ease-out 1s forwards;  /* LIVE dd149 */
}
.gbds-loader__dot { animation: gbds-pulseDot 1.4s ease-in-out infinite; }  /* LIVE dd149 */
.gbds-loader__dot:nth-child(1) { animation-delay: 0s; }
.gbds-loader__dot:nth-child(2) { animation-delay: .2s; }
.gbds-loader__dot:nth-child(3) { animation-delay: .4s; }

/* ---- the meter ---- */
.gbds-loader__meter {
  position: relative;
  width: 100%;
  max-width: 320px;                 /* LIVE dd149 */
  margin-top: var(--space-48);      /* LIVE dd149: 3rem */
  opacity: 0;
  animation: gbds-fadeIn .8s ease-out 1.2s forwards;   /* LIVE dd149 */
}
.gbds-loader__track {
  position: relative;
  height: 2px;                      /* LIVE dd149 */
  border-radius: 2px;               /* LIVE dd149; a 2px bar, so the pill radius and 2 are the same shape */
  background: var(--gbds-l-track);
  overflow: visible;                /* LIVE dd149: the glow leans out */
  transition: background 1s ease-out;  /* LIVE dd149 */
}
.gbds-loader__bar {
  display: block;
  width: 0%;
  height: 100%;
  border-radius: 2px;               /* LIVE dd149 */
  background: var(--gbds-l-bar);
  transition: width .3s ease-out, background 1s ease-out;   /* LIVE dd149 */
}
.gbds-loader__glow {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 12px;                      /* LIVE dd149 */
  height: 12px;                     /* LIVE dd149 */
  border-radius: var(--radius-circle);
  background: var(--gbds-l-glow);
  transform: translate(-50%, -50%);
  transition: left .3s ease-out, background 1s ease-out;    /* LIVE dd149 */
  pointer-events: none;
}
.gbds-loader__orn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-16);             /* LIVE dd149: 1rem */
  margin-top: var(--space-16);      /* LIVE dd149: 1rem */
}
.gbds-loader__ornament {
  width: 24px;                      /* LIVE dd149 */
  height: 24px;
  color: var(--gbds-l-orn);
  transition: color 1s ease-out;    /* LIVE dd149 */
}
.gbds-loader__pct {
  min-width: 48px;                  /* LIVE dd149: 3rem */
  font-family: var(--font-serif);   /* same deviation as the line */
  font-size: 12px;                  /* LIVE dd149: .85rem of their 14px root, measured 11.9 */
  letter-spacing: .1em;             /* LIVE dd149 */
  text-align: center;
  color: var(--gbds-l-quiet);
  transition: color 1s ease-out;    /* LIVE dd149 */
}

/* ---- the sparks and the sheen ---- */
.gbds-loader__particles {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  transform: translateY(-60px);     /* LIVE dd149 */
  pointer-events: none;
  transition: opacity .8s ease-out; /* LIVE dd149 */
}
.gbds-loader.is-leaving .gbds-loader__particles,
.gbds-loader.is-leaving .gbds-loader__diag { opacity: 0; }
.gbds-loader__particle {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--size);
  height: var(--size);
  border-radius: var(--radius-circle);
  background: var(--gbds-l-spark);
  opacity: 0;
  animation: gbds-particleExplode var(--duration) ease-out infinite;  /* LIVE dd149 */
  animation-delay: var(--delay);
}
.gbds-loader__diag {
  position: absolute;
  top: -100%;
  left: -100%;
  width: 300%;
  height: 300%;
  background: var(--gbds-l-diag);
  animation: gbds-diagonalShift 6s ease-in-out infinite;   /* LIVE dd149 */
  transition: opacity .8s ease-out;
  pointer-events: none;
}
/* LIVE dd149: below 768 the sheen, the sparks and the centre glow
   are all switched off, and so is the mark's drop shadow. */
@media (max-width: 768px) {
  .gbds-loader__diag,
  .gbds-loader__particle,
  .gbds-loader::after { display: none; }
}

/* Every keyframe below is transcribed from LoadingAnimation.raw.css */
@keyframes gbds-fadeInLetter { 0% { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
@keyframes gbds-fadeInWord   { to { opacity: 1; } }
@keyframes gbds-fadeIn       { to { opacity: 1; } }
@keyframes gbds-pulseDot     { 0%, 60%, to { opacity: .3; } 30% { opacity: 1; } }
@keyframes gbds-centerGlow   { 0%, to { opacity: .4; } 50% { opacity: .8; } }
@keyframes gbds-diagonalShift { 0%, to { transform: translate(2%) translateY(-2%); } 50% { transform: translate(-2%) translateY(2%); } }
@keyframes gbds-particleExplode {
  0%  { opacity: 0;  transform: rotate(var(--angle)) translate(var(--start-offset)) scale(1); }
  10% { opacity: .5; }
  70% { opacity: .3; }
  to  { opacity: 0;  transform: rotate(var(--angle)) translate(var(--distance)) scale(.3); }
}

/* ============================================================
   THE ERROR, ON THE PLATE
   ------------------------------------------------------------
   Not white emptiness. The plate keeps its frame, says what
   happened in the leading voice, offers the way back and keeps
   the spare road open beside it.
   ============================================================ */
.gbds-error {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-16);
  padding: var(--space-24);
  text-align: center;
  background: var(--zinc-50);
}
.gbds-error__line {
  margin: 0;
  max-width: 46ch;
  font-family: var(--font-serif);
  font-size: 18px;                 /* TYPE-SCALE «H1 panel title», recorded */
  font-weight: 300;
  line-height: 1.4;
  letter-spacing: -0.4px;
  color: var(--zinc-900);
}
@media (min-width: 768px) { .gbds-error__line { font-size: 26px; } }
.gbds-error__acts { display: flex; flex-wrap: wrap; gap: var(--space-8); justify-content: center; }

/* ============================================================
   THE PERSONALIZE SURFACE lives in <gb-drawer>, so this page
   writes only the rhythm of the form inside it: 32 between
   named groups, 24 between the rows of one group. Rungs, not
   derived tokens (ловушка 21в).
   ============================================================ */
/* 32 between named groups, and the same 32 under the line that
   opens the drawer: the law of 2:1 does not stop at the edge of
   a panel. */
.gbd-sub + .gbds-pz__group,
.gbds-pz__group + .gbds-pz__group { margin-top: var(--space-32); }
.gbds-pz__group .gb-eyebrow { display: block; margin-bottom: var(--space-16); }
.gbds-pz__group gb-field { display: block; }
.gbds-pz__group gb-field + gb-field { margin-top: var(--space-24); }
.gbds-pz__foot { display: flex; gap: var(--space-16); }
.gbds-pz__foot .gb-btn { flex: 1 1 auto; }

/* ЛОВУШКА 3, and the antidote is the one comments.css already
   writes for the very same drawer: auth.css reproduces a preflight
   inside gb-guest-header / gb-auth-flow only, so a field standing
   anywhere else keeps the browser's own border and the underlined
   control becomes a box. Local, commented, at the consumer.
   box-sizing comes with it, or width 100% plus the 12 of padding
   carries the underline past the right edge of the drawer body. */
.gbds-pz__group .gba-input {
  box-sizing: border-box;
  border-style: solid;
  border-width: 0;
  border-bottom-width: 1px;
}
/* ONE COLUMN, the drawer's rule (gbppl-comments-dress-1): label,
   field text, helper and the foot all start on one edge. The
   owner's 12px offset is the live login's, kept there and
   straightened here, exactly as the comment drawer does. */
.gbds-pz__group .gba-input { padding-inline: 0; }
.gbds-pz__group .gba-field { padding: 0; }
</style>
</head>

     white band). The box is the system's .gbh-brand. -->
<header class="gbds-head">

<!-- VENDORED, NOT HOTLINKED. The harvest proved the GLB opens in
     @google/model-viewer@4.0.0; the file is that exact build,
     copied into the repo, and the Draco decoder it would otherwise
     pull from gstatic sits beside it. The page needs no network. -->
<script type="module" src="../assets/vendor/model-viewer/model-viewer.min.js"></script>

<script>
(function () {
  'use strict';

  /* ============================================================
     THE AXES                                gbppl-design-share-1
     ------------------------------------------------------------
     Read once out of the address, written back with replaceState,
     offered as choice rows of the one console. The grammar is
     live\portal-dashboard.html's, function for function.
     ============================================================ */
  var params = new URLSearchParams(location.search);

  function writeKey(key, value) {
    try {
      var u = new URL(location.href);
      u.searchParams.set(key, value);
      history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
    } catch (e) {}
  }

  var MODES  = { view: 1, approve: 1 };
  var STATES = { loading: 1, scene: 1, error: 1 };
  var SKINS  = { ink: 1, gold: 1 };

  var mode   = MODES[params.get('mode')]   ? params.get('mode')   : 'approve';
  var state  = STATES[params.get('state')] ? params.get('state')  : 'scene';
  /* Ren, 11.09: gold is Russell and Dima's own design, so gold is
     what the page opens on. Ink is the proposal beside it. */
  var skin   = SKINS[params.get('loader')] ? params.get('loader') : 'gold';

  var stage  = document.getElementById('gbdsStage');
  var viewer = document.getElementById('gbdsViewer');
  var loader = document.getElementById('gbdsLoader');
  var errbox = document.getElementById('gbdsError');
  var bar    = document.getElementById('gbdsBar');
  var glowDot = document.getElementById('gbdsGlowDot');
  var pct    = document.getElementById('gbdsPct');
  var ladderApprove = document.getElementById('gbdsLadderApprove');
  var ladderView    = document.getElementById('gbdsLadderView');

  function setMode(v) {
    mode = MODES[v] ? v : 'approve';
    ladderApprove.hidden = (mode !== 'approve');
    ladderView.hidden    = (mode !== 'view');
    document.body.setAttribute('data-gbds-mode', mode);
    writeKey('mode', mode);
  }

  /* Changing the skin REPLAYS THE FILM. A loader you cannot see is
     not a thing anyone can choose between, and by the time the row
     is clicked the first film has always finished. */
  function setSkin(v, replay) {
    skin = SKINS[v] ? v : 'gold';
    loader.setAttribute('data-gbds-loader', skin);
    writeKey('loader', skin);
    if (replay && state === 'scene') setState('scene');
  }

  /* ============================================================
     THE SPARKS
     ------------------------------------------------------------
     Forty of them, and the four numbers each one carries are not
     guessed: they are the recurrences read straight off the
     client's own markup (harvest loader.html), particle by
     particle, and they reproduce it exactly.

       angle         347deg, then -13deg each, modulo 360
       distance      383px, then -67px each, and +250 when it
                     would fall under 208
       size          2px and 1px, alternating
       delay         6.9s, then -1.1s each, and +8s when negative
       start-offset  38px down to 10px in steps of 2, repeating
     ============================================================ */
  (function sparks() {
    var host = document.getElementById('gbdsParticles');
    if (!host) return;
    var angle = 347, dist = 383, delay = 6.9, frag = document.createDocumentFragment();
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('span');
      s.className = 'gbds-loader__particle';
      s.style.setProperty('--angle', ((angle % 360) + 360) % 360 + 'deg');
      s.style.setProperty('--distance', dist + 'px');
      s.style.setProperty('--size', (i % 2 === 0 ? 2 : 1) + 'px');
      s.style.setProperty('--delay', Math.round(delay * 10) / 10 + 's');
      s.style.setProperty('--duration', '5s');
      s.style.setProperty('--start-offset', (38 - 2 * (i % 15)) + 'px');
      frag.appendChild(s);
      angle -= 13;
      dist -= 67; if (dist < 208) dist += 250;
      delay -= 1.1; if (delay < 0) delay += 8;
    }
    host.appendChild(frag);
  })();

  /* ============================================================
     THE FILM
     ------------------------------------------------------------
     The bar shows the SMALLER of two numbers: what the file has
     really loaded, and how far the film has run. So the film
     always plays even when the model is already in cache, and it
     never claims a hundred per cent the loader does not have.

     The ramp does not begin at zero but at 1.2s, which is where
     the meter itself arrives (LIVE dd149: .progress-container
     animation-delay). Its length is calc(--mo-large * 2),
     declared in CSS and read back here rather than typed twice,
     so the bar reaches a hundred at about 3.6s: the shape of the
     observed live timeline, on our own scale.
     ============================================================ */
  var FILM = 2400;
  var METER_IN = 1200;               /* LIVE dd149: the meter's own delay */
  try {
    var raw = getComputedStyle(document.body).getPropertyValue('--gbds-film').trim();
    if (/ms$/.test(raw)) FILM = parseFloat(raw);
    else if (/s$/.test(raw)) FILM = parseFloat(raw) * 1000;
  } catch (e) {}

  var realProgress = 0;
  var filmStart = 0;
  var loaded = false;
  var left = false;

  function paint() {
    var run = filmStart ? (Date.now() - filmStart - METER_IN) / FILM : 0;
    var filmProgress = Math.max(0, Math.min(1, run));
    var shown = Math.min(realProgress, filmProgress);
    bar.style.width = (shown * 100).toFixed(1) + '%';
    if (glowDot) glowDot.style.left = (shown * 100).toFixed(1) + '%';
    pct.textContent = Math.round(shown * 100) + '%';
    return shown;
  }

  /* One run of the film at a time. The console can restart it (a
     new state, a new skin), and without a token the old loop keeps
     painting the bar underneath the new one. */
  var runId = 0;
  function tick(mine) {
    if (mine !== runId || left) return;
    var shown = paint();
    if (state === 'loading') { requestAnimationFrame(function () { tick(mine); }); return; }
    if (loaded && shown >= 1) { leave(); return; }
    requestAnimationFrame(function () { tick(mine); });
  }

  /* THE EXIT IN TWO STAGES, theirs to the millisecond (LIVE dd149):
       1  .is-leaving   the white overlay rises over 2s while every
                        painted thing under it turns dark on light
                        over 1s. At the end of it the scene is
                        revealed, under an opaque white sheet.
       2  .is-gone      the sheet and the wrapper go, opacity 0
                        over 1.2s after a .5s wait, and the object
                        is simply there.
     Nothing blinks, and nothing is ever shown half drawn. */
  var VEIL_UP = 2000;                /* LIVE dd149: .white-overlay transition */
  var FADE_OUT = 1700;               /* LIVE dd149: 1.2s ease-out with .5s delay */
  function leave() {
    if (left) return;
    left = true;
    loader.classList.add('is-leaving');
    window.setTimeout(function () {
      if (viewer && typeof viewer.dismissPoster === 'function') viewer.dismissPoster();
      loader.classList.add('is-gone');
      document.body.setAttribute('data-gbds-scene', 'on');
      window.setTimeout(function () { loader.hidden = true; }, FADE_OUT);
    }, VEIL_UP);
  }

  function setState(v) {
    state = STATES[v] ? v : 'scene';
    errbox.hidden = (state !== 'error');
    document.body.setAttribute('data-gbds-scene', 'off');
    if (state === 'error') {
      /* The error is the end of the film, not an interruption of
         it: the loader goes at once and the plate says the thing
         in words. */
      left = true;
      loader.hidden = true;
      loader.classList.remove('is-leaving', 'is-gone');
    } else {
      left = false;
      loader.hidden = false;
      loader.classList.remove('is-leaving', 'is-gone');
      /* REWIND. Every entrance in this loader is a CSS animation
         with `forwards`, so a second run would show a finished
         film. One frame with the animations off restarts them all,
         which is what the console needs to put the two skins side
         by side. */
      loader.classList.add('is-rewound');
      void loader.offsetWidth;
      loader.classList.remove('is-rewound');
      filmStart = Date.now();
      runId++;
      (function (mine) { requestAnimationFrame(function () { tick(mine); }); })(runId);
    }
    writeKey('state', state);
  }

  /* ============================================================
     THE SCENE
     ------------------------------------------------------------
     The Draco decoder location has to be set BEFORE the file is
     asked for, so the element is given its src from here rather
     than from the markup.
     ============================================================ */
  var MODEL = '../assets/models/design-share/gift-box.glb';

  if (window.customElements) {
    customElements.whenDefined('model-viewer').then(function () {
      var MV = customElements.get('model-viewer');
      try {
        MV.dracoDecoderLocation = new URL('../assets/vendor/model-viewer/draco/', location.href).href;
      } catch (e) {}
      viewer.src = MODEL;
    });
  }

  /* THE NUDGE IS FOR THE WIDE FRAME ONLY. On a landscape plate the
     object's own shadow sits under it and the auto frame leaves
     more air above than below, so the target drops four
     hundredths of a metre and the two gaps even out (top gap ==
     bottom gap, ORO-SKILL 6a.3). In a portrait plate the same
     nudge tips the composition the other way, so there the auto
     frame is already right and the attribute is handed back. */
  function frameCamera() {
    var wide = window.matchMedia('(min-width: 768px)').matches;
    viewer.setAttribute('camera-target', wide ? 'auto -0.04m auto' : 'auto auto auto');
  }
  frameCamera();
  window.addEventListener('resize', frameCamera);

  viewer.addEventListener('progress', function (e) {
    realProgress = (e.detail && typeof e.detail.totalProgress === 'number') ? e.detail.totalProgress : 0;
  });
  viewer.addEventListener('error', function () {
    realProgress = 0;
    setState('error');
  });

  /* ============================================================
     THE SURFACES ARE PAINTED HERE, AND THEY ARE OURS
     ------------------------------------------------------------
     The GLB carries geometry and near black placeholder materials:
     the client's application swaps a baseColorTexture onto each of
     them at runtime, and the textures it swaps carry the branding
     of a real GildedBox customer (harvest §PII). None of that
     graphic is on this page. Every surface below is drawn into a
     canvas, in this house's own colours, for a brand that does not
     exist:

       Lid_1, Tray_1      the wrap: kraft paper with the fictional
       Blank, Blank.001   mark set very quietly on it, a repeat
                          rather than a logo
       Card_1.001         the greeting card: white, and the only
                          surface the personalize drawer rewrites
       Insert_1           the tray insert: flat kraft, one shade
                          deeper than the wrap
       Bottle_1           glass with transmission: untouched
       Paper_1            the foil of the bottle: untouched
       Label_1            the wine's own label, the one texture the
                          GLB carries itself: untouched. It is the
                          product, not a customer's brand.

     baseColorFactor is LINEAR in glTF, so every flat colour goes
     through the sRGB transfer function on its way in.

     THE FOUR MATERIAL COLOURS ARE NO TOKEN, and the reason is not
     laziness: the Zinc scale is INK AND GROUND, the colours of a
     surface a reader looks AT. These are the colours of a paper
     OBJECT inside a rendered scene, lit by an environment map and
     seen through a tone mapper, and putting Zinc 50 on a box only
     guarantees that the box is not Zinc 50 on screen. Kraft is
     also the honest answer to the plate: a white box on a near
     white ground has no edges at all, which is what the first
     render of this wave proved.
     ============================================================ */
  var CARD = {
    box:  'Acme Aviation',
    intro: 'Dear Morgan,',
    message: 'Thank you for a remarkable year in the air.',
    signature: 'The Acme Aviation team'
  };

  function srgbToLinear(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [16, 8, 0].map(function (sh) {
      var c = ((n >> sh) & 255) / 255;
      return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    }).concat([1]);
  }

  function canvas(size) {
    var c = document.createElement('canvas');
    c.width = size; c.height = size;
    return c;
  }

  /* THE WRAP. A repeat, not a logo: the mark is set small, in Zinc
     200 on Zinc 50, on a loose diagonal grid, so that it reads as
     a printed paper at arm's length and as nothing at all up
     close. Which is what a good corporate wrap does. */
  var KRAFT      = '#e8e1d4';       /* NO TOKEN: the paper of the box, reason above */
  var KRAFT_MARK = '#ded5c3';       /* NO TOKEN: the same paper, one shade deeper */
  var KRAFT_DEEP = '#ddd4c2';       /* NO TOKEN: the insert, one shade deeper again */

  function wrapTexture() {
    var S = 1024, c = canvas(S), g = c.getContext('2d');
    g.fillStyle = KRAFT;
    g.fillRect(0, 0, S, S);
    g.fillStyle = KRAFT_MARK;
    g.font = '600 18px Inter, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    var word = (CARD.box || 'Acme Aviation').toUpperCase();
    var stepX = 320, stepY = 160;
    for (var y = 0; y * stepY < S + stepY; y++) {
      for (var x = -1; x * stepX < S + stepX; x++) {
        g.save();
        g.translate(x * stepX + (y % 2 ? stepX / 2 : 0), y * stepY);
        g.rotate(-Math.PI / 15);
        g.fillText(word, 0, 0);
        g.restore();
      }
    }
    return c.toDataURL('image/png');
  }

  /* THE CARD. White, and it speaks in the page's own two voices:
     the eyebrow for the sender, the serif for the words. The UV of
     this mesh is a 6x4 card, so the copy is set in the middle band
     of the square and the margins are generous enough that a wrap
     of a few per cent either way costs nothing. */
  function cardTexture() {
    var S = 1024, c = canvas(S), g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, S, S);
    g.textAlign = 'center';
    g.textBaseline = 'alphabetic';

    g.fillStyle = '#71717a';                       /* --zinc-500 */
    g.font = '600 26px Inter, sans-serif';
    var mark = (CARD.box || 'Acme Aviation').toUpperCase();
    g.save();
    g.translate(S / 2, 300);
    /* the eyebrow's own tracking, 0.12em, by hand: canvas has no
       letter-spacing in every engine we run on */
    var track = 26 * 0.12, total = 0, i;
    for (i = 0; i < mark.length; i++) total += g.measureText(mark[i]).width + track;
    var x0 = -total / 2;
    g.textAlign = 'left';
    for (i = 0; i < mark.length; i++) {
      g.fillText(mark[i], x0, 0);
      x0 += g.measureText(mark[i]).width + track;
    }
    g.restore();

    g.textAlign = 'center';
    g.fillStyle = '#18181b';                       /* --zinc-900 */
    g.font = '300 40px "Noto Serif", Georgia, serif';
    g.fillText(CARD.intro, S / 2, 400);

    var words = String(CARD.message || '').split(/\s+/);
    var line = '', lines = [], max = S * 0.68;
    for (i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (g.measureText(test).width > max && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    for (i = 0; i < lines.length; i++) g.fillText(lines[i], S / 2, 480 + i * 56);

    g.fillStyle = '#52525b';                       /* --zinc-600 */
    g.font = '300 32px "Noto Serif", Georgia, serif';
    g.fillText(CARD.signature, S / 2, 480 + lines.length * 56 + 56);

    return c.toDataURL('image/png');
  }

  var FLAT = {
    'Insert_1': srgbToLinear(KRAFT_DEEP)
  };

  var dressing = false;
  function dress() {
    if (dressing || !viewer.model) return Promise.resolve();
    dressing = true;
    var wrapUrl = wrapTexture(), cardUrl = cardTexture();
    var jobs = viewer.model.materials.map(function (m) {
      var url = null;
      if (m.name === 'Lid_1' || m.name === 'Tray_1' || m.name === 'Blank' || m.name === 'Blank.001') url = wrapUrl;
      else if (m.name === 'Card_1.001') url = cardUrl;
      if (url) {
        return viewer.createTexture(url).then(function (tex) {
          m.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
          m.pbrMetallicRoughness.setBaseColorFactor([1, 1, 1, 1]);
          m.pbrMetallicRoughness.setRoughnessFactor(0.8);
        });
      }
      if (FLAT[m.name]) {
        m.pbrMetallicRoughness.setBaseColorFactor(FLAT[m.name]);
        m.pbrMetallicRoughness.setRoughnessFactor(0.9);
      }
      return Promise.resolve();
    });
    return Promise.all(jobs).then(function () { dressing = false; });
  }

  viewer.addEventListener('load', function () {
    /* fonts.ready before the canvas is drawn: a texture painted in
       the fallback face would bake the wrong metrics into the
       object and never recover (the fix oro.js already carries). */
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    ready.then(dress).then(function () {
      loaded = true;
      realProgress = 1;
      window.__gbdsReady = true;
    });
  });

  /* ============================================================
     SEE IT PERSONALIZED
     ------------------------------------------------------------
     Their surface is a centred modal. Ours is <gb-drawer>, and
     that is a decision, not a shortcut: the house has ONE overlay
     organism, it already carries Esc, the backdrop, the focus trip
     and the scroll lock, and a second overlay pattern may not be
     born without Ton's word (law 0a.4). Everything the modal held
     is here: the four fields, the GREETING CARD group, the line
     that admits nothing is saved, and two controls on one rung.

     AND IT REALLY WORKS. The card is our own canvas, so «Show it
     on the model» repaints it and the object in the plate changes
     in front of the reader. Nothing is sent anywhere and nothing
     is remembered, which is exactly what the helper says.

     ONE THING THEIRS DID WRONG IS FIXED (Ton-17): their first
     field stood with no group of its own while the other three had
     one, so the form read as «a field, and then a group». Both
     groups are named here.
     ============================================================ */
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function pzBody() {
    return '' +
      /* `optional` on every field, and it is not a detail: without
         it the organism draws the gold required star, and nothing
         here is required. A reader may personalize one line, all
         four, or none. */
      '<div class="gbds-pz__group">' +
        '<span class="gb-eyebrow">Gift box</span>' +
        /* Their label is «Custom Gift Box» under no group at all.
           Ours has a group, so the label stops repeating it: an
           eyebrow saying GIFT BOX over a label saying CUSTOM GIFT
           BOX is the same words twice in the same voice. */
        '<gb-field optional input-id="gbdsBox" name="box" label="Brand line"' +
          ' value="' + esc(CARD.box) + '"' +
          ' helper="A short line, printed across the wrap."></gb-field>' +
      '</div>' +
      '<div class="gbds-pz__group">' +
        '<span class="gb-eyebrow">Greeting card</span>' +
        '<gb-field optional input-id="gbdsIntro" name="intro" label="Intro" value="' + esc(CARD.intro) + '"></gb-field>' +
        '<gb-field optional input-id="gbdsMessage" name="message" type="textarea" label="Message"' +
          ' value="' + esc(CARD.message) + '"' +
          ' helper="Two lines sit comfortably on the card."></gb-field>' +
        '<gb-field optional input-id="gbdsSign" name="signature" label="Signature" value="' + esc(CARD.signature) + '"></gb-field>' +
      '</div>';
  }

  function pzFoot() {
    return '' +
      '<div class="gbds-pz__foot">' +
        '<button type="button" class="gb-btn gb-btn--large gb-btn--ghost gb-btn--secondary" data-gbds="pz-cancel">' +
          '<span class="gb-btn__label">Cancel</span></button>' +
        '<button type="button" class="gb-btn gb-btn--large gb-btn--filled gb-btn--secondary" data-gbds="pz-show">' +
          '<span class="gb-btn__label">Show it on the model</span></button>' +
      '</div>';
  }

  var drawer = document.querySelector('gb-drawer');

  function openPersonalize() {
    if (!drawer || typeof drawer.open !== 'function') return;
    drawer.open({
      title: 'See it personalized',
      sub: 'Type the names or messages you would put on this gift. Nothing is saved, it only changes what you see here.',
      html: pzBody(),
      foot: pzFoot()
    });
  }

  function readField(id, fallback) {
    var el = document.getElementById(id);
    return el && el.value != null && el.value !== '' ? el.value : fallback;
  }

  /* ============================================================
     THE QUIET ROADS
     ------------------------------------------------------------
     Download mockup keeps the promise the client's page breaks: an
     honest extension. Theirs writes a WEBP and calls it
     Stags-Leap-Cabernet.png (harvest §5), which some readers
     cannot open at all. Ours asks the canvas for a real PNG.
     ============================================================ */
  function download() {
    var url = null;
    try { url = viewer.toDataURL('image/png'); } catch (e) {}
    if (!url) return;
    var a = document.createElement('a');
    a.href = url;
    a.download = 'stags-leap-cabernet.png';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest ? e.target.closest('[data-gbds]') : null;
    if (!t) return;
    var what = t.getAttribute('data-gbds');
    if (what === 'personalize') { openPersonalize(); return; }
    if (what === 'download') { download(); return; }
    if (what === 'retry') { setState('scene'); viewer.src = MODEL; return; }
    if (what === 'pz-cancel') { drawer.close(); return; }
    if (what === 'pz-show') {
      CARD.box       = readField('gbdsBox', CARD.box);
      CARD.intro     = readField('gbdsIntro', CARD.intro);
      CARD.message   = readField('gbdsMessage', CARD.message);
      CARD.signature = readField('gbdsSign', CARD.signature);
      dressing = false;
      dress();
      drawer.close();
      return;
    }
    /* Approve design and Request changes are the decision of a
       real route and have nowhere to go inside a prototype. They
       say so in the console rather than pretending. */
    if (what === 'approve' || what === 'changes') {
      console.log('[design-share] ' + (what === 'approve' ? 'Approve design' : 'Request changes') + ': the route behind this button is not built in the prototype.');
    }
  });

  /* ============================================================
     ONE ROW PER AXIS IN THE ONE CONSOLE
     ============================================================ */
  var panel = document.querySelector('gb-studio-panel');
  function wirePanel() {
    if (!panel || typeof panel.addGroup !== 'function') return;
    panel.addGroup({
      type: 'choice',
      title: 'Actions',
      value: mode,
      options: [
        { label: 'Approve', value: 'approve', note: 'The client is being asked for an answer: approve the design, or ask for changes.' },
        { label: 'View only', value: 'view', note: 'No answer is being asked for. The two quiet roads become the whole ladder.' }
      ],
      onChange: setMode
    });
    panel.addGroup({
      type: 'choice',
      title: 'State',
      value: state,
      options: [
        { label: 'Scene', value: 'scene', note: 'The film plays and the object arrives. What a reader sees.' },
        { label: 'Loading', value: 'loading', note: 'The loader is held so it can be looked at.' },
        { label: 'Error', value: 'error', note: 'The design did not arrive. The plate says so and keeps both roads open.' }
      ],
      onChange: setState
    });
    panel.addGroup({
      type: 'choice',
      title: 'Loader',
      value: skin,
      options: [
        { label: 'Gold', value: 'gold', note: 'Russell and Dima\'s own film, reconstructed from the client\'s CSS: the mark letter by letter, the sparks, the sheen, the white exit. Our serif is the only change, and it is loaded.' },
        { label: 'Ink', value: 'ink', note: 'The same film in Zinc, offered beside it. Identical timings, no gold, no sheen.' }
      ],
      onChange: function (v) { setSkin(v, true); }
    });
  }
  if (panel && typeof panel.addGroup === 'function') wirePanel();
  else if (window.customElements) customElements.whenDefined('gb-studio-panel').then(function () {
    panel = document.querySelector('gb-studio-panel');
    setTimeout(wirePanel, 0);
  });

  setMode(mode);
  setSkin(skin);
  setState(state);
})();
</script>

</body>
</html>
