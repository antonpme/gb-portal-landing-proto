/* ============================================================
   THE ROOM'S OWN FOUR THINGS                        .gbhc-*
   ------------------------------------------------------------
   Nothing here restyles a system component. Four objects the
   system does not have yet are drawn, and each number is either a
   rung (--space-*, --radius, --gb-btn-*, --mo-*, the Zinc and Blue
   ramps) or is marked NO TOKEN with what it is and why.
   ============================================================ */

/* ---- No title band. Ton, 09.09: the bell in the sticky bar is
   THE way in; the page under the drawer is a plain page of the
   site, and a second Get help door is not drawn. The band that
   stood here («How can we help?» + Get help) was cut on his word:
   «все эти секции — просто игнорируй, мы такого делать не будем». */
/* ============================================================
   FLOOR ONE — THE OPTIONS
   ------------------------------------------------------------
   The row is the MyGifts popup's door, brought over as language
   rather than as CSS: disc with a glyph, title with an optional
   badge, one line under it, chevron at the end, hairlines between
   and nothing around. The popup's own numbers (46 disc, 14 gap,
   18 inset, 90 tall) are not copied: they were that popup's 1.15
   enlargement of the source, and in a 520 drawer the row stands on
   the scale instead — disc 44, which is the live circle the whole
   house already draws, gap and inset --space-16.
   ============================================================ */
.gbhc-doors {
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--white);
}
.gbhc-door {
  width: 100%;
  display: grid;
  grid-template-columns: var(--gb-btn-icon-size) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-16);
  background: transparent;
  border: 0;
  color: var(--zinc-900);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--mo-micro) var(--mo-move);
}
/* Trap 1: `body.gb-demo a { color: inherit }` weighs 0-1-2 and the
   Call us row is an <a>. The antidote is always written as a pair. */
.gbhc-door,
body.gb-demo a.gbhc-door { color: var(--zinc-900); }
.gbhc-door + .gbhc-door { border-top: 1px solid var(--zinc-200); }
.gbhc-door:hover { background: var(--zinc-50); }
.gbhc-door:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--gb-btn-focus-ring); }
/* The disc is the live circle (44) with the live glyph (22) in it,
   both read from the button organism so that the row and an icon
   button of the bar are the same size by construction. It is NOT a
   .gb-btn--icon: the row is the control, and a button inside a
   button is the thing the icon component's own header warns about. */
.gbhc-door__disc {
  width: var(--gb-btn-icon-size);
  height: var(--gb-btn-icon-size);
  display: grid;
  place-items: center;
  background: var(--zinc-50);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius-circle);
  color: var(--zinc-900);
}
.gbhc-door__copy { min-width: 0; display: grid; gap: 2px; }  /* NO TOKEN: 2px, half of the 4 that is itself half of --space-8; the two lines of a row are one sentence and the scale starts above them */
.gbhc-door__title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-8);
  font-size: 16px;          /* body base, verified live */
  font-weight: 600;
  line-height: 1.5;
}
.gbhc-door__sub {
  font-size: 14px;          /* the secondary rung, 14/21 */
  line-height: 1.5;
  color: var(--zinc-500);
}
.gbhc-door__go { color: var(--zinc-500); transition: transform var(--mo-micro) var(--mo-move); }
.gbhc-door:hover .gbhc-door__go { transform: translateX(3px); }  /* NO TOKEN: 3px, the nudge the popup's own chevron makes; there is no distance scale under 8 */

/* THE BADGE. Form of the house plate (.gbc-chip, .gbcCard-badge, the
   «in this order» mark of the V5 picker): Zinc 100 ground, Zinc 600
   ink, --radius. The dot is BLUE 600 and not green: being online is
   a state, Ton-5 gives states the blue, and the system has no green
   in :root at all (the four alert tones carry theirs on the
   component). The MyGifts popup used its source's green — a question
   for Ton, in the report. */
.gbhc-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-8);
  padding: 2px var(--space-8);   /* NO TOKEN: 2px, see .gbhc-door__copy */
  background: var(--zinc-100);
  border-radius: var(--radius);
  font-size: 12px;               /* the Eyebrow rung */
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0;
  color: var(--zinc-600);
  white-space: nowrap;
}
.gbhc-dot {
  flex: 0 0 auto;
  width: 6px;                    /* NO TOKEN: 6px, a dot; the space scale starts at 8 and a dot is not a space */
  height: 6px;
  border-radius: var(--radius-circle);
  background: var(--blue-600);
}

/* THE MARK OF THE CHOICE, the first beat of the relay. A door that
   has been chosen says so for --mo-micro before the drawer starts
   to leave, so the hand sees WHICH row it hit and the window that
   rises afterwards is understood as that row's answer. Blue 50 in
   both accent variants: this is a selection, and Ton-5 gives
   selection the blue whatever colour the plate is wearing. */
.gbhc-door.is-chosen,
.gbhc-door.is-chosen:hover { background: var(--blue-50); }

/* ============================================================
   FLOOR TWO — YOUR GIFT ADVISOR
   ------------------------------------------------------------
   The card of the portal's Get Help, minus SCHEDULE A CALL (the
   booking door upstairs is the same errand, and two doors to one
   place is the duplication the concept killed). In its place «Send
   a message», and the card GROWS DOWN rather than opening a level:
   the advisor and a message to the advisor are one subject, and a
   level change would say they are two.

   IT IS NOT PINNED TO THE FOOT, and that is a decision taken against
   the letter of the brief with its own reason. The live Get Help
   pins its card to the bottom of the panel, and the concept's first
   observation about that drawer is «между free-text и карточкой
   огромная пустота — дровер не скомпонован». Pinning is what makes
   that hole: two blocks pushed to opposite ends of a panel taller
   than both. Standing the card one gutter under the options gives
   the same order — options first, advisor second — and leaves the
   spare height where spare height belongs, under everything, where
   it reads as a short panel rather than as a broken one. Measured
   at 900 tall: pinned left 240px of white between the two floors.
   A question for Ton in the report; putting the pin back is one
   line (margin-top: auto on .gbhc-floor2).
   ============================================================ */
.gbhc-body { display: flex; flex-direction: column; gap: var(--space-32); }
.gbhc-advisor {
  background: var(--zinc-50);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
  padding: var(--space-16);
}
.gbhc-advisor__name {
  margin: 0 0 var(--space-8);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--zinc-900);
}
.gbhc-advisor__rows { display: grid; gap: var(--space-8); margin-bottom: var(--space-16); }
.gbhc-contact,
body.gb-demo a.gbhc-contact {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  font-size: 14px;
  line-height: 1.5;
  color: var(--zinc-600);
  text-decoration: none;
}
.gbhc-contact:hover,
body.gb-demo a.gbhc-contact:hover { color: var(--blue-600); }
.gbhc-contact .gb-icon { color: var(--zinc-500); }
.gbhc-contact:hover .gb-icon { color: inherit; }
/* THE GROWTH. A 0fr -> 1fr grid row: the panel finds its own height,
   nothing is measured in JS and nothing is written in pixels. */
.gbhc-grow { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--mo-small) var(--mo-move); }
.gbhc-grow > * { overflow: hidden; }
.gbhc-advisor.is-writing .gbhc-grow { grid-template-rows: 1fr; }
.gbhc-advisor.is-writing .gbhc-open { display: none; }
.gbhc-note { padding-top: var(--space-16); }
.gbhc-note__send { margin-top: var(--space-16); }

/* ---- THE TWO LABEL-LESS FIELDS, AND THEIR TWO ANTIDOTES -----
   The message to the advisor and the chat composer are both the
   house field with nothing written over them, which is how the live
   Get Help composer stands too. Two things follow, and the portal's
   own composer carries the identical pair for the identical reason
   (its note of 26.08, trap 10 of the skill):

   (a) TRAP 3. auth.css reproduces the live preflight INSIDE its own
       scope (gb-guest-header, gb-auth-flow) and .gba-input then
       gives a width to the bottom border only, trusting the other
       three to be zero already. Outside those two scopes the UA's
       full frame is still there, and the underline arrives as a box.
   (b) THE PLACEHOLDER DOES NOT FADE ON FOCUS. The live field fades
       it because a label has already said the field's name. Here
       there is no label: the placeholder IS the name, and a field
       that empties itself of words the moment you touch it is a
       field that stops telling you what it is for. */
.gbhc-note .gba-input,
.gbhc-composer .gba-input { border-style: solid; border-width: 0; border-bottom-width: 1px; }
.gbhc-note .gba-input:focus::placeholder,
.gbhc-composer .gba-input:focus::placeholder { opacity: 1; }
.gbhc-note .gba-input { display: block; }

/* ============================================================
   THE CHAT WINDOW AND THE PILL
   ------------------------------------------------------------
   Bottom right, over the page, under everything the studio owns:
   z 57 sits above the Inspect overlay (55) and the Comment pins
   (56) and below the device scene (58), the console (60) and the
   drawer (80/81). A conversation is the page's furniture, not the
   studio's.

   AT REST THERE IS NOTHING HERE. Both nodes carry [hidden] until a
   session starts, and the cross of either one ends the session and
   takes both away.
   ============================================================ */
/* ---- THE ACCENT OF THE PLATE, one property, two values ------
   Ton, 09.09, has not picked the colour yet, so both are built and
   the switch is a key of the address (?accent=blue|gold) and a row
   of the one console. BLUE is --blue-600, the house colour of state
   and action (Ton-5). GOLD is --gold-beta #bea042, WHICH IS A TOKEN
   AND NOT A FREE COLOUR: it is the gold of the Beta chip in the bar
   (system/components/header.css .gbh-beta, measured live 12.08) and
   tokens.css carries it under a standing veto — «новых золотых
   элементов не заводить» (BRAND.md, Russell 30.07, Ton-5 «золота в
   UI нет»). Building the variant is not lifting the veto; the
   question goes to Ton in the report, and until he answers, blue is
   the default the page loads on. */
:root { --gbhc-accent: var(--blue-600); }
html[data-gbhc-accent="gold"] { --gbhc-accent: var(--gold-beta); }

.gbhc-chat,
.gbhc-pill {
  position: fixed;
  right: var(--space-24);
  bottom: var(--space-24);
  z-index: 57;                    /* NO TOKEN: the house has no z scale; the neighbours are named above */
  width: 380px;                   /* NO TOKEN: a layout measure, the width that holds a line of chat without breaking it twice; the drawer's own 520 is marked the same way. THE PILL CARRIES THE SAME ONE ON PURPOSE: two plates of one width, anchored to one corner, make the morph a change of HEIGHT and nothing else — no width to interpolate, no content to reflow sideways. */
  max-width: calc(100vw - var(--space-32));
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel);
  background: var(--white);
}
@media (max-width: 639px) {
  .gbhc-chat, .gbhc-pill { right: var(--space-16); bottom: var(--space-16); }
}
.gbhc-chat {
  height: 520px;                  /* NO TOKEN: a layout measure, the same kind as the width */
  max-height: calc(100dvh - var(--header-h) - var(--space-48));
  display: flex;
  flex-direction: column;
  border: 1px solid var(--zinc-200);
  overflow: hidden;
}
.gbhc-chat[hidden], .gbhc-pill[hidden] { display: none; }

/* ============================================================
   THE CHOREOGRAPHY                       Ton, 09.09: «транзишн
   должен быть очень красивый, анимация — важная часть языка»
   ------------------------------------------------------------
   TWO MOVES, and every clock below is a rung of --mo-*.

   1. THE RELAY, drawer -> window. The chosen row lights for
      --mo-micro; the drawer leaves on its own exit (--mo-medium-out,
      the organism's clock, untouched); HALF WAY THROUGH THAT EXIT
      the window rises out of the bottom right corner on --mo-medium
      / --mo-enter. The two rides overlap, so the eye is handed from
      one object to the next instead of watching a queue. There is
      ONE scrim for the whole relay — the drawer's own, dimming on
      the same 350 — and it is still dimming while the window is
      already on its way up, which is what stops the blink a
      close-then-open would give.

   2. THE MORPH, window <-> pill. The two plates share a corner, a
      width and the 5px radius, so the only thing between them is
      HEIGHT: the frame travels 520 -> 56 on --mo-small / --mo-move
      while the content inside it leaves in --mo-small-out, three
      times faster, so nothing is ever seen squashed. The pill
      stands BEHIND the window for the whole ride (it is earlier in
      the markup, same z), the window lands exactly on it and is
      then hidden: there is no cross-fade to flicker, because at the
      moment of the swap the two plates occupy the same rectangle to
      the pixel. Opening is the same ride backwards, with the
      content arriving on --mo-arrive after the frame has started.
      The border colour rides with it, zinc-200 <-> the accent, so
      the 1px does not pop at the swap.

   NO prefers-reduced-motion BRANCH, and this is Ton-7 read strictly
   (Ton, 09.09: animation is off at the OS level on his machine and
   «мы должны принудительно заставлять её работать»). The drawer
   organism has no branch either, by the same principle, and it is
   written into drawer.css.
   ============================================================ */
.gbhc-chat.is-in {
  transform-origin: 100% 100%;    /* the bottom right corner: the window grows out of the corner it lives in */
  animation: gbhc-raise var(--mo-medium) var(--mo-enter) both;
}
@keyframes gbhc-raise {
  from { opacity: 0; transform: translateY(var(--space-16)) scale(0.96); }  /* NO TOKEN: 0.96, a proportion and not a length — the plate is a hair smaller than itself, which is what «growing» reads as without becoming a zoom */
  to   { opacity: 1; transform: none; }
}

/* The frame of the morph. Only the two properties that actually
   differ between the plates are animated. */
.gbhc-chat.is-morph {
  transition: height var(--mo-small) var(--mo-move),
              border-color var(--mo-small) var(--mo-move);
}
.gbhc-chat.is-shut { border-color: var(--gbhc-accent); }
/* The content. Arriving it follows the frame (--mo-arrive, delayed
   by --mo-small-out); leaving it goes first and fast. */
.gbhc-chat__head,
.gbhc-log,
.gbhc-composer { transition: opacity var(--mo-small) var(--mo-arrive) var(--mo-small-out); }
.gbhc-chat.is-shut .gbhc-chat__head,
.gbhc-chat.is-shut .gbhc-log,
.gbhc-chat.is-shut .gbhc-composer { opacity: 0; transition: opacity var(--mo-small-out) var(--mo-exit); }
/* One frame with no clock at all, so the window can be PLACED on the
   pill's rectangle before it is asked to grow off it. Written after
   the two rules above because it ties them on specificity and the
   later one wins. */
.gbhc-chat.is-nomo,
.gbhc-chat.is-nomo .gbhc-chat__head,
.gbhc-chat.is-nomo .gbhc-log,
.gbhc-chat.is-nomo .gbhc-composer { transition: none; }

.gbhc-chat__head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-16);
  border-bottom: 1px solid var(--zinc-200);
}
.gbhc-face {
  flex: 0 0 auto;
  width: var(--gb-btn-icon-size);
  height: var(--gb-btn-icon-size);
  display: grid;
  place-items: center;
  background: var(--zinc-100);
  border-radius: var(--radius-circle);
  color: var(--zinc-900);
}
.gbhc-chat__who { flex: 1 1 auto; min-width: 0; }
.gbhc-chat__name {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--zinc-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gbhc-chat__state {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  font-size: 14px;
  line-height: 1.5;
  color: var(--zinc-500);
}
.gbhc-chat__slots { flex: 0 0 auto; display: flex; align-items: center; }

.gbhc-log {
  flex: 1 1 auto;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-16);
  padding: var(--space-16);
}
/* A short thread hugs the composer, the way every thread does: the
   newest line is the one nearest the field you answer it in. Written
   as an auto margin on the first row rather than justify-content,
   because flex-end on a scrolling box has a habit of clipping the
   top of the list once it overflows. */
.gbhc-log > :first-child { margin-top: auto; }
.gbhc-msg { display: flex; }
.gbhc-msg__bubble {
  max-width: 84%;                 /* NO TOKEN: a proportion, not a length: a bubble leaves the other side visible so the thread reads as two voices */
  padding: var(--space-8) var(--space-16);
  border-radius: var(--radius);
  font-size: 14px;
  line-height: 1.5;
}
.gbhc-msg--them .gbhc-msg__bubble { background: var(--zinc-100); color: var(--zinc-900); }
.gbhc-msg--you { justify-content: flex-end; }
.gbhc-msg--you .gbhc-msg__bubble { background: var(--blue-600); color: var(--white); }

.gbhc-composer {
  flex: 0 0 auto;
  display: flex;
  align-items: flex-end;
  gap: var(--space-8);
  padding: var(--space-16);
  border-top: 1px solid var(--zinc-200);
}
.gbhc-composer .gba-inputwrap { flex: 1 1 auto; min-width: 0; }
.gbhc-composer .gba-input { display: block; }

/* ============================================================
   THE PILL — THE SESSION PLATE                        .gbhc-pill
   ------------------------------------------------------------
   Ton, 09.09, rejecting the black one: «чёрное не подходит:
   чёрное на чёрном не работает, чисто белое тоже; нужен формат,
   который работает и на чёрном, и на белом фоне». The black plate
   dissolved into the dark hero and the dark footer; a plain white
   one dissolves into every light section of the same page. What
   reads on both grounds is a WHITE PLATE WITH A DRAWN EDGE and a
   shadow: the shadow lifts it off the light, the coloured hairline
   draws it out of the dark, and the plate never changes colour, so
   the guest keeps looking at one object while the page scrolls
   under it.

   THE FORMULA, and each half is doing a job:
     white ground --white, --shadow-panel, --radius (5px — Ton,
       09.09: «у нас нет такого скругления, наш формат — 5
       пикселей», so no --radius-pill, ever), and a 1px border in
       the accent;
     LEFT INSET, Zinc 50 with a hairline of Zinc 200 down its right
       edge: who you are talking to and whether they are there.
       Two-tone is what makes the plate read as a HANDLE with a
       label rather than as a floating banner;
     RIGHT ZONE, on the white: the last line of the thread, live,
       clipped with an ellipsis, and the cross that ends the
       session.

   IT IS 380 WIDE, THE WINDOW'S OWN WIDTH (declared with the window
   above), which is both what Ton asked for — «плашка шире» — and
   what makes the morph honest.
   ============================================================ */
.gbhc-pill {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--gbhc-accent);
  overflow: hidden;               /* the inset is a full-bleed block; the plate's radius is what trims it */
  color: var(--zinc-900);
}
/* The plate is one target with one exception: everything but the
   cross opens the window again. */
.gbhc-pill__open {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  /* NO TOKEN: a proportion, not a length, the same kind of value as
     the bubble's 84%. Ton asked for «примерно на четверть», AND A
     QUARTER WAS MEASURED AND DOES NOT HOLD: at 380 the click area is
     330 (the plate less its border and the cross), a quarter of it
     is 82, and the two names this room actually has — «Brad Smaling»
     89 and «AI Concierge» 86 at 14/600 Inter — are both cut by it.
     42 per cent gives 138.6, which is 36.5 per cent of the whole
     plate and holds every name at every width down to 360. A plate
     whose left half is a name with an ellipsis in it is worse than a
     plate whose inset is a third: the inset exists to say WHO, and a
     name it cannot print is an inset with no job. */
  grid-template-columns: 42% minmax(0, 1fr);
  align-items: stretch;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.gbhc-pill__open:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--gb-btn-focus-ring); }
.gbhc-pill__who {
  min-width: 0;
  display: grid;
  align-content: center;
  /* The edge of the plate gets the full gutter, the hairline gets
     half of it: a rule is a boundary and wants less air than an
     outside edge. Both are rungs. */
  padding: var(--space-8) var(--space-8) var(--space-8) var(--space-16);
  background: var(--zinc-50);
  border-right: 1px solid var(--zinc-200);
}
.gbhc-pill__name {
  font-size: 14px;                /* the secondary rung; the plate is furniture, not a heading */
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gbhc-pill__state {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  min-width: 0;
  font-size: 12px;                /* the Eyebrow rung, without the caps: this is a status, not a label */
  line-height: 1.5;
  color: var(--zinc-500);
}
.gbhc-pill__state span:not(.gbhc-dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The living half. It says what was last said, so a minimised
   conversation is still a conversation and not a closed door. */
.gbhc-pill__last {
  align-self: center;
  min-width: 0;
  padding: var(--space-8) var(--space-8) var(--space-8) var(--space-16);
  font-size: 14px;
  line-height: 1.5;
  color: var(--zinc-500);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gbhc-pill__end { align-self: center; margin-right: var(--space-8); }
</style>
</head>
<body>

  <gb-site-header home-href="index.html"
    logo-src="../system/assets/gildedbox-logo.svg"
    catalog-href="catalog/index.html" portal-href="portal.html"
    meeting-href="book-a-meeting.html"></gb-site-header>

  <main>
    <!-- The page under the drawer is a real page: two sections of the
         site, with the site's own copy, so the bell, the drawer and the
         floating window are seen over something. Nothing is written
         here; both are the home organisms with the home attributes. -->
    <gb-banner-conversation pill="Impressive Gifts" rest="Your Brand"
      subtitle="For The Select Few, Envied By Most, Coveted By All"
      cta="Discover Gifts" href="catalog/index.html"></gb-banner-conversation>
  </main>

  <gb-advantages>
    <gb-advantage icon="present" live-icon="present" heading="Custom Gift Box">Each gift starts with an individually designed gift box.</gb-advantage>
    <gb-advantage icon="exchange" live-icon="gift-exchange" heading="Personalized Gifts">Personalization for every recipient means each gift is unique.</gb-advantage>
    <gb-advantage icon="monitor" live-icon="pc-monitor" heading="Gifting Portal">Send gifts to individuals, run and manage gifting campaigns.</gb-advantage>
  </gb-advantages>

  <gb-site-footer></gb-site-footer>

  <!-- The switchboard. One surface, two floors, and the booking flow
       stands on the second one. -->
  <gb-drawer id="gbhcDrawer"></gb-drawer>

  <!-- ---- THE CONVERSATION -------------------------------------
       Written in the page rather than injected into the body, on
       purpose: trap 19 asks every new STUDIO layer to mount inside
       <gb-studio-panel> so it keeps the house scale on a page with a
       foreign bundle. This is not a studio layer, it is the
       prototype's own furniture, and a node that stands in the
       markup cannot be handed the wrong scale by anybody.
       Both nodes are [hidden] at rest.

       THE PILL STANDS FIRST IN THE MARKUP, and that is the whole
       mechanism of the morph's last frame: the two plates carry the
       same z-index, so paint order is document order, and the
       window is therefore always ABOVE the pill. The window can
       shrink onto the pill and be taken away without anything
       showing through, and the pill can wait behind it, already
       drawn, instead of being faded in over the top. -->
  <div class="gbhc-pill" id="gbhcPill" hidden>
    <button class="gbhc-pill__open" type="button" id="gbhcPillOpen" aria-label="Open the chat">
      <span class="gbhc-pill__who">
        <span class="gbhc-pill__name" id="gbhcPillName">Live chat</span>
        <span class="gbhc-pill__state" id="gbhcPillState"></span>
      </span>
      <span class="gbhc-pill__last" id="gbhcPillLast"></span>
    </button>
    <button class="gb-btn gb-btn--icon gb-btn--small gb-btn--ghost gb-btn--secondary gbhc-pill__end" type="button"
            id="gbhcPillEnd" aria-label="End the chat"></button>
  </div>

  <div class="gbhc-chat" id="gbhcChat" role="dialog" aria-label="Chat" hidden>
    <div class="gbhc-chat__head">
      <span class="gbhc-face" id="gbhcFace" aria-hidden="true"></span>
      <div class="gbhc-chat__who">
        <p class="gbhc-chat__name" id="gbhcName">Live chat</p>
        <p class="gbhc-chat__state" id="gbhcState"></p>
      </div>
      <div class="gbhc-chat__slots">
        <button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary" type="button"
                id="gbhcMin" aria-label="Minimize the chat"></button>
        <button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary" type="button"
                id="gbhcEnd" aria-label="End the chat"></button>
      </div>
    </div>
    <div class="gbhc-log" id="gbhcLog" aria-live="polite"></div>
    <form class="gbhc-composer" id="gbhcForm" autocomplete="off">
      <div class="gba-inputwrap">
        <input class="gba-input" id="gbhcInput" type="text" aria-label="Your message" placeholder="Type a message...">
      </div>
      <button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary" type="submit" aria-label="Send"></button>
    </form>
  </div>

  <gb-studio-panel data-root="../" page="concierge"></gb-studio-panel>

  <script src="../system/components/shell.js"></script>
  <script src="../system/sandbox-registry.js"></script>
  <script src="../system/components/icon.js"></script>
  <script src="../system/components/studio-panel.js"></script>
  <script src="../system/components/header.js"></script>
  <script src="../system/components/footer.js"></script>
  <script src="../system/components/home.js"></script>
  <script src="../system/components/auth.js"></script>
  <script src="../system/components/booking.js"></script>
  <script src="../system/type-scale.js"></script>
  <script src="../system/components/drawer.js"></script>
  <script src="../system/components/inspect.js"></script>
  <script src="../system/components/toggle.js"></script>
  <script src="../system/components/comments.js"></script>

  <script>
  /* ============================================================
     gbppl-concierge-1 — THE CONTROLLER OF THE ROOM
     ------------------------------------------------------------
     Four things, in this order: the fork of the bar, the drawer,
     the second floor (booking), the conversation.
     ============================================================ */
  (function () {
    'use strict';

    var I = window.GbIcons;
    var drawer = document.getElementById('gbhcDrawer');

    /* ---- THE CLOCKS COME OUT OF THE TOKENS ---------------------
       Every wait in this controller is READ from --mo-*, so there is
       no second copy of a duration in JavaScript that can drift from
       the one in CSS. Change the rung in tokens.css and both the
       ride and the hand-off that follows it move together. */
    var ROOT_CS = getComputedStyle(document.documentElement);
    function ms(name) { return parseFloat(ROOT_CS.getPropertyValue(name)) || 0; }
    var MO = {
      micro:     ms('--mo-micro'),       /* 160 */
      smallOut:  ms('--mo-small-out'),   /* 90  */
      small:     ms('--mo-small'),       /* 280 */
      mediumOut: ms('--mo-medium-out'),  /* 350 — the drawer's exit */
      medium:    ms('--mo-medium')       /* 500 — the window's rise */
    };

    /* ---- THE ACCENT OF THE SESSION PLATE -----------------------
       Two variants, because Ton has not chosen. The address carries
       it (?accent=blue|gold) so a screenshot can be asked for by
       link, and the one console carries the same switch as a Demo
       row, which is the house rule for a page level toggle (Ton
       26.08, «один пульт»). Nothing else on the page reads the
       property: the accent is the plate's edge and only that. */
    var ACCENTS = ['blue', 'gold'];
    function readAccent() {
      var q = (new URLSearchParams(location.search)).get('accent');
      return ACCENTS.indexOf(q) > -1 ? q : 'blue';
    }
    function setAccent(v, writeUrl) {
      document.documentElement.setAttribute('data-gbhc-accent', v);
      if (!writeUrl) return;
      var u = new URL(location.href);
      u.searchParams.set('accent', v);
      history.replaceState(null, '', u.toString());
    }
    setAccent(readAccent(), false);

    /* Who the advisor is. One place, because the card, the message
       form and the live chat all speak of the same person. */
    var ADVISOR = {
      name: 'Brad Smaling',
      email: 'connect@gildedbox.com',
      phone: '(847) 801-0345 ext. 8118',
      tel: '+18478010345'
    };
    var DESK = { shown: '847.801.0345', tel: '+18478010345' };

    function glyph(name, size) { return I ? I.html(name, size) : ''; }

    /* ============================================================
       1. THE FORK OF THE BAR
       ------------------------------------------------------------
       Ton asked for a fork for this sandbox and for the canonical
       header to come out untouched. The fork is ADDITIVE: the bar is
       the one <gb-site-header> draws, and this block puts the
       concierge bell into its right cluster, in front of the search
       dot, so the glyph pair reads bell then search and the cart
       (which aims at the same dot) still lands between them.

       WHY NOT A COPY OF header.js. A second 1200 line template would
       be a second bar to keep in step with the first, and the first
       changes weekly. The observable result is what Ton is looking
       at, and it is the same result; if he wants the bell on Live for
       everyone, the button moves into TEMPLATE() in one line, which
       is a smaller change than deleting a fork.

       The element upgrades while header.js is being parsed, so the
       bar is already in the DOM here; whenDefined is belt and braces
       for a browser that defers the script.
       ============================================================ */
    function forkTheBar() {
      var slot = document.querySelector('gb-site-header .gbh-actions');
      if (!slot || slot.querySelector('[data-gbhc-bell]')) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary';
      btn.setAttribute('aria-label', 'Talk to us');
      btn.setAttribute('title', 'Talk to us');
      btn.setAttribute('aria-haspopup', 'dialog');
      btn.setAttribute('data-gbhc-bell', '');
      /* The slot of the organism carries the size (22 in a 44 circle);
         the drawing comes out of the record by name. */
      btn.innerHTML = '<span class="gb-btn__icon" aria-hidden="true">' +
        (I ? I.svg('service-bell') : '') + '</span>';
      btn.addEventListener('click', openHome);
      var search = slot.querySelector('[aria-label="Search gifts"]');
      slot.insertBefore(btn, search);
    }
    if (window.customElements && customElements.whenDefined) {
      customElements.whenDefined('gb-site-header').then(forkTheBar);
    }
    forkTheBar();

    /* No page level door: the sticky bar's bell is THE way in
       (Ton, 09.09), so nothing on the canvas opens the drawer. */

    /* ============================================================
       2. THE DRAWER, FLOOR ONE AND FLOOR TWO
       ============================================================ */
    /* Ton, 09.09: Live chat leads, the meeting follows, the AI door is
       third and says AI out loud — a reader must never take it for a
       person. The AI door is also contextual: it only belongs where
       gifts are being chosen (portal gift pages, catalog), and is
       absent — not disabled — everywhere else. This sandbox shows it
       present; the flag is the one word below. */
    var AI_DOOR_HERE = true;
    var DOORS = [
      {
        id: 'live', icon: 'chat',
        title: 'Live chat', badge: 'Online now',
        sub: 'Get help right now'
      },
      {
        id: 'meeting', icon: 'calendar',
        title: 'Book a meeting',
        sub: 'Pick a time that suits you'
      },
      {
        id: 'ai', icon: 'service-bell',
        title: 'AI Gift Concierge',
        sub: 'Instant answers from our AI assistant',
        hidden: !AI_DOOR_HERE
      },
      {
        id: 'call', icon: 'telephone',
        title: 'Call us',
        sub: 'Prefer to talk? ' + DESK.shown,
        href: 'tel:' + DESK.tel
      }
    ].filter(function (d) { return !d.hidden; });

    function doorHTML(d) {
      var tag = d.href ? 'a' : 'button';
      var attrs = d.href
        ? ' href="' + d.href + '"'
        : ' type="button"';
      return '<' + tag + ' class="gbhc-door" data-door="' + d.id + '"' + attrs + '>' +
        '<span class="gbhc-door__disc">' + glyph(d.icon, 22) + '</span>' +
        '<span class="gbhc-door__copy">' +
          '<span class="gbhc-door__title">' + d.title +
            (d.badge
              ? '<span class="gbhc-badge"><span class="gbhc-dot" aria-hidden="true"></span>' + d.badge + '</span>'
              : '') +
          '</span>' +
          '<span class="gbhc-door__sub">' + d.sub + '</span>' +
        '</span>' +
        '<span class="gbhc-door__go">' + glyph('chevron-right', 20) + '</span>' +
      '</' + tag + '>';
    }

    function homeHTML() {
      return '<div class="gbhc-body">' +
        '<div class="gbhc-doors">' + DOORS.map(doorHTML).join('') + '</div>' +
        '<div class="gbhc-floor2">' +
          /* The eyebrow is the live drawer's own line, word for word. */
          '<p class="gb-eyebrow">Want to connect now?</p>' +
          '<div class="gbhc-advisor" data-advisor>' +
            '<p class="gbhc-advisor__name">' + ADVISOR.name + '</p>' +
            '<div class="gbhc-advisor__rows">' +
              '<a class="gbhc-contact" href="mailto:' + ADVISOR.email + '">' +
                glyph('mail', 16) + ADVISOR.email + '</a>' +
              '<a class="gbhc-contact" href="tel:' + ADVISOR.tel + '">' +
                glyph('telephone', 16) + ADVISOR.phone + '</a>' +
            '</div>' +
            /* SCHEDULE A CALL is dead: the booking door upstairs is the
               same errand (concept, floor two). */
            '<button class="gb-btn gb-btn--medium gb-btn--outline gb-btn--secondary gb-btn--block gbhc-open" type="button" data-write>' +
              '<span class="gb-btn__label" data-pc-section="label">Send a message</span></button>' +
            '<div class="gbhc-grow"><div><div class="gbhc-note">' +
              '<div class="gba-inputwrap">' +
                '<textarea class="gba-input gba-textarea" id="gbhcNote" rows="3" ' +
                  'aria-label="Your message to ' + ADVISOR.name + '" ' +
                  'placeholder="Need help? Type your question here..."></textarea>' +
              '</div>' +
              '<button class="gb-btn gb-btn--medium gb-btn--filled gb-btn--primary gb-btn--block gbhc-note__send" type="button" data-send>' +
                '<span class="gb-btn__label" data-pc-section="label">Send</span></button>' +
            '</div></div></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function panel() { return document.querySelector('.gbd-panel'); }

    function openHome() {
      drawer.open({ title: 'Talk to us', html: homeHTML() });
      drawer.setBack(null);
      wireHome();
    }

    /* THE PANEL OUTLIVES ITS CONTENT. drawer.js builds .gbd-panel once
       and puts it on document.body; every open() only swaps the body
       inside it. A listener added per open would therefore be added
       again on every trip Home -> Meeting -> Home, and the second trip
       would fire everything twice. So the delegate is fitted ONCE, to
       the panel, and it works for whatever markup is standing in it. */
    var homeWired = false;
    function wireHome() {
      var p = panel();
      if (!p || homeWired) return;
      homeWired = true;
      p.addEventListener('click', function (e) {
        var door = e.target.closest ? e.target.closest('.gbhc-door') : null;
        if (door) {
          var id = door.getAttribute('data-door');
          if (id === 'meeting') { e.preventDefault(); openMeeting(); return; }
          if (id === 'live' || id === 'ai') { e.preventDefault(); relay(id, door); return; }
          return;   /* Call us is an <a href="tel:"> and stays one */
        }
        var write = e.target.closest ? e.target.closest('[data-write]') : null;
        if (write) {
          var card = p.querySelector('[data-advisor]');
          card.classList.add('is-writing');
          var note = p.querySelector('#gbhcNote');
          if (note) setTimeout(function () { note.focus(); }, 80);
          return;
        }
        var send = e.target.closest ? e.target.closest('[data-send]') : null;
        if (send) {
          /* Nothing leaves the browser: this is a prototype, and the
             one honest thing it can do is say so and close. */
          drawer.close();
        }
      });
    }

    /* ---- FLOOR TWO: THE BOOKING ORGANISM ----------------------
       Ton, 09.09: «выбор времени у нас расположен вертикально ПОД
       выбором даты». That is the organism's DEFAULT column, and it
       is the reason layout="compact" is deliberately absent: compact
       is the modifier that stands the slots BESIDE the calendar from
       520px of host. In this drawer the host is 472 at 1280 and the
       organism's own container query gives the 32 quarter hour chips
       their scrolling zone, so the panel does not grow to 1100.

       start="slot": two notches, «Pick a time» then «Confirmed», and
       the confirmation is the organism's own third screen at the same
       level, exactly as the concept asked. The back arrow of the head
       stays on both screens and goes home to the options.
       ------------------------------------------------------------ */
    function openMeeting() {
      drawer.open({
        title: 'Book a meeting',
        back: openHome,
        html: '<gb-booking-flow id="gbhcBooking" start="slot"' +
              ' guest-name="Anton Parkhomenko"' +
              ' guest-email="anton@gildedbox-demo.com"' +
              ' guest-company="GildedBox"' +
              ' site-href="help-concierge.html"' +
              ' exit-label="Back to the options"></gb-booking-flow>'
      });
      var flow = document.querySelector('.gbd-panel #gbhcBooking');
      if (!flow) return;
      /* The quiet exit of the last screen means «go back» inside a
         panel, not «leave the site»: the organism made that the
         host's business (gbb:exit is cancelable). */
      flow.addEventListener('gbb:exit', function (e) { e.preventDefault(); openHome(); });
    }

    /* ============================================================
       3. THE CONVERSATION
       ------------------------------------------------------------
       ONE WINDOW, TWO STARTS (the concept's strong unification): the
       AI concierge and the live chat are the same object with a
       different first message and a different name in the head.
       ============================================================ */
    var STARTS = {
      live: {
        icon: 'chat',
        name: ADVISOR.name,
        state: '<span class="gbhc-dot" aria-hidden="true"></span>Online now',
        /* THE PLATE SPEAKS SHORTER THAN THE HEAD. The inset is a
           third of a 380 plate and the status shares it with a name;
           the window's own head has the room for the long form and
           keeps it. «Online» and «AI assistant» are the same two
           facts in the space the plate actually has. */
        pillName: ADVISOR.name,
        pill: 'Online',
        say: ['Hi, this is ' + ADVISOR.name + ' at GildedBox.',
              'What are you working on today?'],
        reply: 'Got it. Give me a moment to pull up a few options for you.'
      },
      ai: {
        icon: 'service-bell',
        /* Ton, 09.09: the window says AI as loudly as the door does —
           a reader must never take this voice for a person. */
        name: 'AI Gift Concierge',
        state: '<span class="gbhc-dot" aria-hidden="true"></span>AI · answers right away',
        pillName: 'AI Concierge',
        pill: 'AI assistant',
        say: ['Hi, I am the GildedBox AI concierge — an assistant, not a person.',
              'Tell me who the gift is for and what the occasion is, and I will put a shortlist together.'],
        reply: 'Thank you. I am looking at what fits, and I can hand you to a live specialist at any point.'
      }
    };

    var chat = document.getElementById('gbhcChat');
    var pill = document.getElementById('gbhcPill');
    var log = document.getElementById('gbhcLog');
    var input = document.getElementById('gbhcInput');
    var mode = null;
    var replyTimer = null;

    document.getElementById('gbhcMin').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('chevron-down') : '') + '</span>';
    document.getElementById('gbhcEnd').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('close') : '') + '</span>';
    document.getElementById('gbhcPillEnd').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('close') : '') + '</span>';
    document.querySelector('#gbhcForm button[type="submit"]').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('arrow-right') : '') + '</span>';

    var pillLast = document.getElementById('gbhcPillLast');

    function say(side, text) {
      var row = document.createElement('div');
      row.className = 'gbhc-msg gbhc-msg--' + side;
      var bubble = document.createElement('div');
      bubble.className = 'gbhc-msg__bubble';
      bubble.textContent = text;      /* never innerHTML: a guest types here */
      row.appendChild(bubble);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      /* THE PLATE IS LIVE. Whatever was last said is what the pill
         shows, including an answer that lands while it is minimised:
         that is the difference between a handle on a conversation
         and a button that says a conversation exists. */
      pillLast.textContent = text;
    }

    /* ============================================================
       THE TWO RIDES
       ------------------------------------------------------------
       riseChat  — the end of the relay: the window comes up out of
                   the corner while the drawer is still leaving.
       minimise / expand — the morph: one plate becomes the other by
                   changing its height onto the other's rectangle.
       Only one of them may be in the air at a time; `busy` is the
       latch, and every path clears it (trap 22's rule, applied to a
       ride rather than to a request).
       ============================================================ */
    var busy = false;
    var rideTimer = null;

    function dress(which) {
      var start = STARTS[which];
      if (mode === which) return start;
      mode = which;
      log.innerHTML = '';
      document.getElementById('gbhcFace').innerHTML = glyph(start.icon, 22);
      document.getElementById('gbhcName').textContent = start.name;
      document.getElementById('gbhcState').innerHTML = start.state;
      document.getElementById('gbhcPillName').textContent = start.pillName;
      document.getElementById('gbhcPillState').innerHTML =
        '<span class="gbhc-dot" aria-hidden="true"></span><span>' + start.pill + '</span>';
      start.say.forEach(function (line) { say('them', line); });
      return start;
    }

    function riseChat(which) {
      dress(which);
      pill.hidden = true;
      chat.hidden = false;
      chat.classList.remove('is-in', 'is-morph', 'is-shut', 'is-nomo');
      chat.style.height = '';
      void chat.offsetWidth;
      chat.classList.add('is-in');
      setTimeout(function () { input.focus(); }, MO.smallOut);
    }

    /* ---- THE RELAY, drawer -> window --------------------------
       Three beats, and the third begins before the second has
       finished, which is the whole point of it.

         1  the row says it was the one that was hit  (--mo-micro)
         2  the drawer leaves on its own exit         (--mo-medium-out)
         3  HALF WAY through beat 2, the window rises (--mo-medium)

       The half is not a new duration and is not on the scale: it is
       a POINT INSIDE a rung, read off --mo-medium-out at run time,
       and there is nothing on the motion scale that could name it
       without inventing a clock. NO TOKEN, and the reason it is
       half and not a rung is that a rung would either land before
       the drawer has moved (--mo-small-out) or after it has gone
       (--mo-small, 280 of 350) and the overlap Ton asked for would
       be a queue again.

       ONE SCRIM FOR THE WHOLE RELAY. The drawer's own backdrop is
       never closed and reopened here: drawer.close() is called once
       and the scrim fades on its 350 while the window is already on
       its way up. Nothing dims a second time, so there is nothing
       to blink. */
    function relay(id, row) {
      if (busy) return;
      busy = true;
      if (row) row.classList.add('is-chosen');
      setTimeout(function () {
        drawer.close();
        setTimeout(function () {
          if (row) row.classList.remove('is-chosen');
          riseChat(id);
          busy = false;
        }, MO.mediumOut / 2);
      }, MO.micro);
    }

    /* ---- THE MORPH, window -> pill ----------------------------
       The pill is unhidden FIRST and measured where it will stand,
       so the window is given a real destination rather than a
       number somebody typed. It waits there, behind the window,
       fully drawn, for the whole ride. */
    function minimise() {
      if (busy) return;
      busy = true;
      chat.classList.remove('is-in');            /* the entrance animation must not own the height */
      var from = chat.getBoundingClientRect().height;
      pill.hidden = false;
      var to = pill.getBoundingClientRect().height;
      chat.style.height = from + 'px';
      chat.classList.add('is-morph');
      void chat.offsetHeight;                    /* the baseline of both transitions */
      chat.classList.add('is-shut');             /* the content leaves on --mo-small-out */
      chat.style.height = to + 'px';             /* the frame leaves on --mo-small */
      clearTimeout(rideTimer);
      rideTimer = setTimeout(function () {
        chat.hidden = true;
        chat.classList.remove('is-morph', 'is-shut');
        chat.style.height = '';
        busy = false;
      }, MO.small);
    }

    /* ---- THE MORPH, pill -> window ----------------------------
       The same ride read backwards. The window is placed ON the
       pill's rectangle with the clocks off, so nothing is seen
       jumping there, and only then is it asked to grow. */
    function expand() {
      if (busy || !mode) return;
      busy = true;
      var from = pill.getBoundingClientRect().height;
      chat.hidden = false;
      chat.classList.add('is-nomo', 'is-morph', 'is-shut');
      chat.style.height = '';
      var to = chat.getBoundingClientRect().height;   /* the natural height, already clipped by max-height */
      chat.style.height = from + 'px';
      void chat.offsetHeight;
      chat.classList.remove('is-nomo');
      void chat.offsetHeight;
      chat.classList.remove('is-shut');
      chat.style.height = to + 'px';
      clearTimeout(rideTimer);
      rideTimer = setTimeout(function () {
        chat.classList.remove('is-morph');
        chat.style.height = '';
        pill.hidden = true;
        busy = false;
        input.focus();
      }, MO.small);
    }

    /* THE CROSS ENDS THE SESSION, and the screen is clean: no window,
       no pill, nothing floating anywhere. Next time the door is used
       the conversation starts again from its greeting. */
    function endSession() {
      clearTimeout(replyTimer);
      clearTimeout(rideTimer);
      busy = false;
      chat.hidden = true;
      chat.classList.remove('is-in', 'is-morph', 'is-shut', 'is-nomo');
      chat.style.height = '';
      pill.hidden = true;
      mode = null;
      log.innerHTML = '';
      pillLast.textContent = '';
      input.value = '';
    }

    document.getElementById('gbhcMin').addEventListener('click', minimise);
    document.getElementById('gbhcEnd').addEventListener('click', endSession);
    document.getElementById('gbhcPillEnd').addEventListener('click', endSession);
    document.getElementById('gbhcPillOpen').addEventListener('click', expand);

    document.getElementById('gbhcForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      say('you', text);
      input.value = '';
      var start = STARTS[mode];
      if (!start) return;
      clearTimeout(replyTimer);
      /* One scripted answer, so the thread reads as a thread. NO
         TOKEN: 900ms of waiting is not a move, and the motion scale
         holds the length of moves. */
      replyTimer = setTimeout(function () { say('them', start.reply); }, 900);
    });

    /* ============================================================
       4. THE ONE CONSOLE
       ------------------------------------------------------------
       The page's only switch, declared to <gb-studio-panel> the way
       every page switch is (addGroup, type choice). It writes the
       key back into the address so the state Ton is looking at is
       the state a link reproduces.
       ============================================================ */
    var spanel = document.querySelector('gb-studio-panel');
    if (spanel && typeof spanel.addGroup === 'function') {
      spanel.addGroup({
        type: 'choice',
        title: 'Accent of the session plate',
        value: readAccent(),
        options: [
          { label: 'Blue', value: 'blue',
            note: 'Blue 600, the house colour of state and action. Nothing new is spent.' },
          { label: 'Gold', value: 'gold',
            note: 'The gold of the Beta chip in the bar, #bea042. It is a token, and it is under the standing veto on gold in the interface.' }
        ],
        onChange: function (v) { setAccent(v, true); }
      });
    }
  })();
  </script>

</body>
