   (system/components/header.css .gbh-beta, measured live 12.08) and
   tokens.css carries it under a standing veto — «новых золотых
   элементов не заводить» (BRAND.md, Russell 30.07, Ton-5 «золота в
   UI нет»). Building the variant is not lifting the veto; the
   question goes to Ton in the report, and until he answers, blue is
   the default the page loads on. */
:root { --gbhc-accent: var(--blue-600); }
html[data-gbhc-accent="gold"] { --gbhc-accent: var(--gold-beta); }

/* ============================================================
   THE HOVER OF THE TOP NAVIGATION — THREE CANDIDATES
   gbppl-nav-hover-1                                  .gbh-link
   ------------------------------------------------------------
   Ton, 09.09: «сейчас там hover вообще какой-то никакой». He is
   right, and the canon says so in its own words: header.css line
   141 is `.gbh-link:hover { opacity: 0.8 }`, carried over from the
   live bar's `transition-all duration-300` fade. A label that goes
   eighty per cent grey over 300ms is a hover you have to be told
   about.

   THREE CANDIDATES ON THE FORKED BAR OF THIS SANDBOX ONLY. The
   canonical header.css is not touched by a byte; everything below
   hangs off html[data-gbhc-hover] and dies with this page. The one
   Ton picks moves into the organism as a wave of its own.
   ?hover=underline|ink|both, and a row of the console. Default both.

   ALL THREE PUT OUT THE OLD FADE FIRST. Leaving opacity .8 under a
   new hover gives two hovers at once, and the weaker one does the
   talking.

   1  UNDERLINE  a hairline grows left to right under the label on
      --mo-small and retreats the same way. Provenance: the hero's
      own underline-CTA (Discover Gifts, home.css .gbhm-underline)
      and the rule of the controls recon that an underline means
      navigation. It is an ::after on transform: scaleX, so it
      cannot move the label or its neighbours by a pixel: the box
      never changes size, only what is painted inside it.
   2  INK        the label deepens to Zinc 900. AND THIS ONE MOVES
      THE BAR AT REST, WHICH IS NOT A LIBERTY BUT AN ARITHMETIC:
      the canon's resting ink IS ALREADY Zinc 900 (header.css 126,
      and a.gbh-link at 662), so there is nothing above it to move
      to. An ink hover exists only if rest sits a step lighter.
      Rest becomes Zinc 600, the hovered item becomes Zinc 900.
      That is a real change to how the bar reads when nobody is
      pointing at it, it is a deviation from live, and it is
      flagged in the report for Ton's eye rather than smuggled in.
      No weight change: weight moves the width and the neighbours.
   3  BOTH       one and two together.

   THE DARK STEP. This page's bar is the plain white one, so the
   transparent rules below are never exercised here; they are
   written because the organism has that step and the wave that
   moves the winner into the canon must not have to invent them.
   There the hairline is white and the ink runs Zinc 300 -> white,
   because the transparent bar's resting ink is already --white and
   the same arithmetic applies upside down.

   No prefers-reduced-motion branch: Ton-7, and Ton 09.09.
   ============================================================ */
:root { --gbhc-rule: var(--zinc-900); }
html[data-gbhc-hover] .gbh-bar .gbh-link:hover { opacity: 1; }

/* ---- 1. THE RULE ---- */
html[data-gbhc-hover="underline"] .gbh-bar .gbh-link::after,
html[data-gbhc-hover="both"] .gbh-bar .gbh-link::after {
  content: '';
  position: absolute;
  /* 16 is not a rung of our scale here, it is THE LIVE PADDING of
     the link (header.css .gbh-link, SYSTEM.md site chrome 12.08),
     flat at every width. Insetting the rule by exactly the padding
     makes it the width of the LABEL and not of the click box, which
     is what keeps the daylight between two rules. */
  left: 16px;
  right: 16px;
  bottom: var(--space-8);
  height: 1px;
  background: var(--gbhc-rule);
  transform: scaleX(0);
  transform-origin: left center;   /* out from the left, and back to the left */
  transition: transform var(--mo-small) var(--mo-move);
  pointer-events: none;
}
html[data-gbhc-hover="underline"] .gbh-bar .gbh-link:hover::after,
html[data-gbhc-hover="both"] .gbh-bar .gbh-link:hover::after { transform: scaleX(1); }

/* ---- 2. THE INK ----
   :not(.is-active) everywhere, or the Blue 600 of the active item
   (header.css 578) is overwritten by a selector that outweighs it.
   Weight 0-4-1 against the 0-2-2 of body.gb-demo a.gbh-link, which
   is the antidote every consumer of this bar has to clear. */
html[data-gbhc-hover="ink"]  .gbh-bar .gbh-link:not(.is-active),
html[data-gbhc-hover="both"] .gbh-bar .gbh-link:not(.is-active) { color: var(--zinc-600); }
html[data-gbhc-hover="ink"]  .gbh-bar .gbh-link:not(.is-active):hover,
html[data-gbhc-hover="both"] .gbh-bar .gbh-link:not(.is-active):hover { color: var(--zinc-900); }

/* ---- THE DARK STEP, unexercised on this page ---- */
html[data-gbhc-hover] .gb-header--transparent:not(.is-past-hero) .gbh-bar { --gbhc-rule: var(--white); }
html[data-gbhc-hover="ink"]  .gb-header--transparent:not(.is-past-hero) .gbh-bar .gbh-link:not(.is-active),
html[data-gbhc-hover="both"] .gb-header--transparent:not(.is-past-hero) .gbh-bar .gbh-link:not(.is-active) { color: var(--zinc-300); }
html[data-gbhc-hover="ink"]  .gb-header--transparent:not(.is-past-hero) .gbh-bar .gbh-link:not(.is-active):hover,
html[data-gbhc-hover="both"] .gb-header--transparent:not(.is-past-hero) .gbh-bar .gbh-link:not(.is-active):hover { color: var(--white); }

.gbhc-chat,
.gbhc-pill {
  position: fixed;
  right: var(--space-24);
  bottom: var(--space-24);
  z-index: 57;                    /* NO TOKEN: the house has no z scale; the neighbours are named above */
  max-width: calc(100vw - var(--space-32));
  border-radius: var(--radius);
  box-shadow: var(--shadow-panel);
  background: var(--white);
}
@media (max-width: 639px) {
  .gbhc-chat, .gbhc-pill { right: var(--space-16); bottom: var(--space-16); }
}
/* ---- THE SURFACE, MEASURED OFF THE REFERENCE ----------------
   gbppl-concierge-chat-2. Ton, 09.09: «лайв-чат ты сделал каким-то
   слишком маленьким. Посмотри, как это было сделано один в один на
   странице My Gifts — экспириенс уже сделан, перенеси его оттуда».
   The reference is live/portal.html?layout=band&hero=start, the
   START popup on its «Chat with our team» screen, and both numbers
   below are ITS numbers read off the running page with the
   instrument: .start-panel is 528 wide and the chat step is 748
   tall (--gsp-step-h). Nothing here is a taste: 380 x 520 was mine
   and it was the thing he called small; 528 x 748 is the surface
   that already exists in the house. */
.gbhc-chat {
  width: 528px;                   /* MEASURED on the reference panel, 09.09 */
  height: 748px;                  /* MEASURED, the reference's --gsp-step-h */
  max-height: calc(100dvh - var(--header-h) - var(--space-48));
  display: flex;
  flex-direction: column;
  border: 1px solid var(--zinc-200);
  overflow: hidden;
}
/* THE PLATE DOES NOT FOLLOW THE WINDOW UP. It is a handle, and a
   528 handle is a banner. So the morph stopped being a change of
   height alone and learned the width as well — see below. */
.gbhc-pill { width: 380px; }      /* NO TOKEN: a layout measure, the width that holds a name, a status and a line of the thread */
.gbhc-chat[hidden], .gbhc-pill[hidden] { display: none; }

/* ============================================================
   THE CHOREOGRAPHY                       Ton, 09.09: «транзишн
   должен быть очень красивый, анимация — важная часть языка»
   ------------------------------------------------------------
   TWO MOVES, and every clock below is a rung of --mo-*.

   1. THE RELAY, drawer -> window. The chosen row lights for
      --mo-micro; the drawer leaves on its own exit (--mo-medium-out,
      the organism's clock, untouched); HALF WAY THROUGH THAT EXIT
      the window rises out of the bottom right corner on --mo-medium
      / --mo-enter. The two rides overlap, so the eye is handed from
      one object to the next instead of watching a queue. There is
      ONE scrim for the whole relay — the drawer's own, dimming on
      the same 350 — and it is still dimming while the window is
      already on its way up, which is what stops the blink a
      close-then-open would give.

   2. THE MORPH, window <-> pill. The two plates share a corner and
      the 5px radius, and SINCE 09.09 THEY NO LONGER SHARE A WIDTH:
      the window took the reference's 528 and the plate stayed a
      380 handle, because a 528 handle is a banner. So the ride
      interpolates BOTH axes on one clock rather than one axis on
      one clock. That is the honest of the two roads and it costs
      nothing: the content is already at opacity 0 for the whole
      ride (it leaves in --mo-small-out, three times faster than
      the frame), so there is no text to reflow sideways while the
      box narrows, which was the only reason a single axis was
      worth having. Both plates are anchored to the same corner, so
      neither axis needs a position to interpolate either.
      528x748 -> 380x57 on --mo-small / --mo-move. The pill
      stands BEHIND the window for the whole ride (it is earlier in
      the markup, same z), the window lands exactly on it and is
      then hidden: there is no cross-fade to flicker, because at the
      moment of the swap the two plates occupy the same rectangle to
      the pixel. Opening is the same ride backwards, with the
      content arriving on --mo-arrive after the frame has started.
      The border colour rides with it, zinc-200 <-> the accent, so
      the 1px does not pop at the swap.

   NO prefers-reduced-motion BRANCH, and this is Ton-7 read strictly
   (Ton, 09.09: animation is off at the OS level on his machine and
   «мы должны принудительно заставлять её работать»). The drawer
   organism has no branch either, by the same principle, and it is
   written into drawer.css.
   ============================================================ */
.gbhc-chat.is-in {
  transform-origin: 100% 100%;    /* the bottom right corner: the window grows out of the corner it lives in */
  animation: gbhc-raise var(--mo-medium) var(--mo-enter) both;
}
@keyframes gbhc-raise {
  from { opacity: 0; transform: translateY(var(--space-16)) scale(0.96); }  /* NO TOKEN: 0.96, a proportion and not a length — the plate is a hair smaller than itself, which is what «growing» reads as without becoming a zoom */
  to   { opacity: 1; transform: none; }
}

/* The frame of the morph. Only the two properties that actually
   differ between the plates are animated. */
.gbhc-chat.is-morph {
  transition: width var(--mo-small) var(--mo-move),
              height var(--mo-small) var(--mo-move),
              border-color var(--mo-small) var(--mo-move);
}
.gbhc-chat.is-shut { border-color: var(--gbhc-accent); }
/* The content. Arriving it follows the frame (--mo-arrive, delayed
   by --mo-small-out); leaving it goes first and fast. */
.gbhc-chat__head,
.gbhc-log,
.gbhc-composer { transition: opacity var(--mo-small) var(--mo-arrive) var(--mo-small-out); }
.gbhc-chat.is-shut .gbhc-chat__head,
.gbhc-chat.is-shut .gbhc-log,
.gbhc-chat.is-shut .gbhc-composer { opacity: 0; transition: opacity var(--mo-small-out) var(--mo-exit); }
/* One frame with no clock at all, so the window can be PLACED on the
   pill's rectangle before it is asked to grow off it. Written after
   the two rules above because it ties them on specificity and the
   later one wins. */
.gbhc-chat.is-nomo,
.gbhc-chat.is-nomo .gbhc-chat__head,
.gbhc-chat.is-nomo .gbhc-log,
.gbhc-chat.is-nomo .gbhc-composer { transition: none; }

.gbhc-chat__head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-16);
  border-bottom: 1px solid var(--zinc-200);
}
.gbhc-face {
  flex: 0 0 auto;
  width: var(--gb-btn-icon-size);
  height: var(--gb-btn-icon-size);
  display: grid;
  place-items: center;
  background: var(--zinc-100);
  border-radius: var(--radius-circle);
  color: var(--zinc-900);
}
.gbhc-chat__who { flex: 1 1 auto; min-width: 0; }
.gbhc-chat__name {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--zinc-900);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gbhc-chat__state {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  min-width: 0;
  font-size: 14px;
  line-height: 1.5;
  color: var(--zinc-500);
}
.gbhc-chat__state span:not(.gbhc-dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gbhc-chat__slots { flex: 0 0 auto; display: flex; align-items: center; }
/* On the narrow step the head gives the face back to the thread. Two
   44 circles of chrome, a 44 face and a name do not fit across 328,
   and the greeting card two lines below already shows the same disc;
   the reference's own narrow head carries no avatar either. */
@media (max-width: 639px) {
  .gbhc-chat__head { gap: var(--space-8); }
  .gbhc-face { display: none; }
}

/* ============================================================
   THE THREAD, CARRIED OVER FROM THE REFERENCE
   gbppl-concierge-chat-2                             .gbhc-msg
   ------------------------------------------------------------
   Read off live/portal.html?layout=band&hero=start with the
   instrument, not off the source: the greeting is a WHITE CARD
   with a 40px round face beside it, the log stands on paper
   rather than on white so the card reads as a card, and the
   composer carries three suggestion chips, a ruled field with a
   square send beside it and a quiet line under the whole thing.

   FOUR THINGS DID NOT COME ACROSS AS THEY STAND THERE, and each
   one is a house law rather than a preference:
     the 12px bubble radius and the 999 pill of the chips became
       --radius, 5px. Ton, 09.09, in this very file's history: «у
       нас нет такого скругления, наш формат — 5 пикселей». The
       bubble keeps the IDEA — the corner nearest the speaker
       stays square, the other three are the house radius — so it
       still points at whoever said it;
     the green of the reference's avatar (--gh-success #276c49,
       marked NO TOKEN on that page with the words «the system
       owns no green») is not carried. The face is the disc this
       file already draws twice, Zinc 100 on a Zinc 200 hairline;
     the 15px floor of its clamp(15, .675vw, 16) became a flat 16.
       15 is not a rung of the reading group at all, which is the
       finding drawer.css wrote down on 28.08;
     the reference's own @media (prefers-reduced-motion) block,
       which kills the message entrance and the typing dots, is
       NOT carried. Ton-7, and Ton 09.09 in as many words.
   ============================================================ */
.gbhc-log {
  flex: 1 1 auto;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: var(--space-16);
  padding: var(--space-24) var(--space-24) var(--space-32);
  background: var(--zinc-50);     /* the reference's #fbfbfc paper, which it marks NO TOKEN; Zinc 50 is the house's near-white and it is a token */
}
@media (max-width: 639px) {
  .gbhc-log { padding: var(--space-24) var(--space-16) var(--space-32); }
}
/* THE THREAD STARTS AT THE TOP, which is a reversal and the
   reference is the reason. Until 09.09 a short thread hugged the
   composer here (margin-top: auto on the first row), which is a
   sound instinct in a 520 window and a wrong one in a 748 one: the
   greeting ends up floating at the floor with two thirds of the
   surface empty above it. The reference stands its greeting at the
   ceiling and lets the room fill downwards, and once the thread is
   long enough to scroll the two behave identically anyway. */

/* NO TOKEN, declared ONCE and spent three times (the gap beside a
   face, the gap in the composer row, the chip's side padding). 12
   is the reference's number in all three places, and it is the
   HALF OF 24 that the scale does not have — one of the five open
   questions about the scale already on Ton's list (trap 19). One
   entry in the NO TOKEN ledger instead of three. */
.gbhc-chat { --gbhc-half: 12px; }

.gbhc-msg {
  display: flex;
  align-items: flex-start;
  gap: var(--gbhc-half);
  animation: gbhc-msg-in var(--mo-small) var(--mo-arrive) both;
}
@keyframes gbhc-msg-in { from { opacity: 0; transform: translateY(var(--space-8)); } to { opacity: 1; transform: none; } }
.gbhc-msg__face {
  flex: 0 0 40px;                 /* the reference's own avatar, and 40 is a rung of Ton's height grid; it is written as a literal because the grid's names are button heights and a face is not a button */
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  margin-top: 2px;                /* NO TOKEN: 2px, the optical drop that puts the face on the first line of the card rather than on its border */
  background: var(--zinc-100);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius-circle);
  color: var(--zinc-900);
}
/* THE STACK is what a message becomes once it can carry more than a
   bubble: the words, and under them the choices the words asked for.
   It holds the width, so the chips line up with the card above them
   and not with the face beside it. */
.gbhc-msg__stack {
  min-width: 0;
  max-width: min(84%, 360px);     /* NO TOKEN: a proportion and the reference's own ceiling; a bubble leaves the other side visible so the thread reads as two voices */
  display: grid;
  gap: var(--space-8);
  justify-items: start;
}
.gbhc-msg--you .gbhc-msg__stack { justify-items: end; }
@media (max-width: 639px) {
  /* The reference's own narrow rule with our face and our gap in it:
     a percentage cannot know about the 40 disc standing beside the
     stack, and across 328 the difference is an overflow. */
  .gbhc-msg__stack { max-width: calc(100% - 40px - var(--gbhc-half)); }
}
.gbhc-msg__bubble {
  max-width: 100%;
  padding: var(--space-16);
  background: var(--white);
  border: 1px solid var(--zinc-200);
  /* The corner nearest the speaker stays square. */
  border-radius: 0 var(--radius) var(--radius) var(--radius);
  color: var(--zinc-900);
}
.gbhc-msg__bubble p { margin: 0; font-size: 16px; line-height: 1.5; }
.gbhc-msg__bubble p + p { margin-top: var(--space-8); }
.gbhc-msg--you { justify-content: flex-end; }
.gbhc-msg--you .gbhc-msg__bubble {
  background: var(--zinc-900);    /* the reference's ink, not the Blue 600 this file used before: blue is state (Ton-5) and a guest's own line is furniture */
  border-color: var(--zinc-900);
  border-radius: var(--radius) 0 var(--radius) var(--radius);
  color: var(--white);
}
/* ---- THE LINE THAT IS NOT A VOICE --------------------------
   gbppl-concierge-chat-3. «Brad Smaling joined the chat.» is the
   room reporting on itself, not somebody speaking, so it is not a
   bubble and has no face: a quiet centred line between two turns,
   the way every chat in the world says this. It also never reaches
   the session plate, because the plate carries what was SAID. */
.gbhc-sys {
  align-self: center;
  max-width: 100%;
  padding: 0 var(--space-8);
  color: var(--zinc-500);
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
  animation: gbhc-msg-in var(--mo-small) var(--mo-arrive) both;
}

/* ---- THE CHIPS THAT BELONG TO A MESSAGE --------------------
   gbppl-concierge-chat-3, and the distinction is the whole point.
   The chips at the composer are ROUTING: they say what the visit is
   about and they leave after the first thing the guest says. These
   ones are an ANSWER SHEET: they belong to the question that was
   just asked, they stand in the thread under it, and they go when
   the question is answered — by a tap or by anything typed instead.
   Same recipe (.gbhc-chips), a different place and a different
   life. They leave on --mo-small-out, the quiet leave before a
   step, which is exactly what this is. */
.gbhc-msg__ask { margin: 0; transition: opacity var(--mo-small-out) var(--mo-exit); }
.gbhc-msg__ask.is-out { opacity: 0; pointer-events: none; }

/* The specialist is typing. An idle animation with no end, on a rung
   (--mo-medium) rather than the reference's 700ms literal. */
.gbhc-msg--typing .gbhc-msg__bubble {
  min-width: 58px;                /* NO TOKEN: the reference's own, so three dots never sit in a box that reads as a word */
  display: flex;
  align-items: center;
  gap: 5px;                       /* NO TOKEN: the gap between dots is the dot; see below */
}
.gbhc-msg--typing .gbhc-msg__bubble > span {
  width: 5px;                     /* NO TOKEN: 5px, a dot; the space scale starts at 8 and a dot is not a space */
  height: 5px;
  background: var(--zinc-500);
  border-radius: var(--radius-circle);
  animation: gbhc-typing var(--mo-medium) var(--mo-move) infinite alternate;
}
.gbhc-msg--typing .gbhc-msg__bubble > span:nth-child(2) { animation-delay: 110ms; }  /* NO TOKEN: the reference's own cascade, and the 40ms step of MOTION.md is too tight to read on three dots */
.gbhc-msg--typing .gbhc-msg__bubble > span:nth-child(3) { animation-delay: 220ms; }
@keyframes gbhc-typing { to { opacity: 0.3; transform: translateY(-2px); } }

/* ---- THE COMPOSER, THREE PARTS, ALL FROM THE REFERENCE ------
   Chips, a ruled field with a square send beside it, and a quiet
   line that says who is on the other end. The field itself is the
   auth organism's (.gba-inputwrap / .gba-input); what is local is
   LAYOUT only, exactly as the reference says of itself: the two
   column row, the gap, and the square button. */
.gbhc-composer {
  flex: 0 0 auto;
  display: grid;
  gap: var(--space-8);
  padding: var(--space-8) var(--space-24) var(--space-16);
  background: var(--white);
  border-top: 1px solid var(--zinc-200);
}
@media (max-width: 639px) {
  .gbhc-composer { padding: var(--space-8) var(--space-16) var(--space-16); }
}
/* They wrap: every suggestion on screen, the surface taller by a row
   instead of narrower by a secret. The reference's own words. */
.gbhc-chips { display: flex; flex-wrap: wrap; gap: var(--space-8); }
.gbhc-chips[hidden] { display: none; }
.gbhc-chips button {
  flex: 0 0 auto;
  min-height: var(--gb-btn-small-h);   /* 32, the small rung */
  display: inline-flex;
  align-items: center;
  padding: 0 var(--gbhc-half);
  background: var(--white);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);        /* the reference is a 999 pill; the house chip in this very file is --radius, and Ton said 5 on 09.09 */
  color: var(--zinc-800);
  font-family: inherit;
  font-size: 14px;                     /* the secondary rung; the reference's 13 is not one */
  font-weight: 500;
  line-height: 1.25;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--mo-micro) var(--mo-move),
              border-color var(--mo-micro) var(--mo-move),
              color var(--mo-micro) var(--mo-move);
}
.gbhc-chips button:hover,
.gbhc-chips button:focus-visible {
  background: var(--zinc-900);
  border-color: var(--zinc-900);
  color: var(--white);
  outline: 0;
}
.gbhc-chips button:disabled { cursor: default; opacity: 0.45; }  /* NO TOKEN: the reference's own dimming of a control that is waiting */

/* The row. One local name carries the field ladder so the button
   stays square and level with the field at every width; a 44 icon
   circle was the other candidate and it is the wrong one, because
   this button is the right hand half of a form control and not
   chrome standing alone. The reference reasons the same way. */
.gbhc-composer__field {
  --gbhc-ctl-h: var(--form-ctl-h);      /* 48, base */
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--gbhc-ctl-h);
  align-items: center;
  gap: var(--gbhc-half);
}
@media (min-width: 1280px) { .gbhc-composer__field { --gbhc-ctl-h: var(--form-ctl-h-xl); } }   /* 56 */
@media (min-width: 2000px) { .gbhc-composer__field { --gbhc-ctl-h: var(--form-ctl-h-2xl); } }  /* 64 */
.gbhc-composer .gba-inputwrap { min-width: 0; }
.gbhc-composer .gba-input:disabled { color: var(--zinc-400); cursor: wait; }
.gbhc-send {
  width: var(--gbhc-ctl-h);
  height: var(--gbhc-ctl-h);
  display: grid;
  place-items: center;
  padding: 0;
  background: var(--zinc-900);
  border: 0;
  border-radius: var(--radius);
  color: var(--white);
  cursor: pointer;
  transition: background-color var(--mo-micro) var(--mo-move), transform var(--mo-micro) var(--mo-move);
}
.gbhc-send:not(:disabled):hover { background: var(--zinc-800); }
.gbhc-send:not(:disabled):active { transform: scale(0.97); }  /* NO TOKEN: a proportion, the reference's own press */
.gbhc-send:disabled { cursor: default; opacity: 0.28; }        /* NO TOKEN: the reference's own */
.gbhc-send:focus-visible { outline: 2px solid var(--gb-btn-focus-ring); outline-offset: 2px; }
.gbhc-composer__hint {
  margin: 0;
  font-size: 14px;                /* the secondary rung; the reference clamps 13 to 14 */
  line-height: 1.4;
  color: var(--zinc-500);
}

/* ============================================================
   THE PILL — THE SESSION PLATE                        .gbhc-pill
   ------------------------------------------------------------
   Ton, 09.09, rejecting the black one: «чёрное не подходит:
   чёрное на чёрном не работает, чисто белое тоже; нужен формат,
   который работает и на чёрном, и на белом фоне». The black plate
   dissolved into the dark hero and the dark footer; a plain white
   one dissolves into every light section of the same page. What
   reads on both grounds is a WHITE PLATE WITH A DRAWN EDGE and a
   shadow: the shadow lifts it off the light, the coloured hairline
   draws it out of the dark, and the plate never changes colour, so
   the guest keeps looking at one object while the page scrolls
   under it.

   THE FORMULA, and each half is doing a job:
     white ground --white, --shadow-panel, --radius (5px — Ton,
       09.09: «у нас нет такого скругления, наш формат — 5
       пикселей», so no --radius-pill, ever), and a 1px border in
       the accent;
     LEFT INSET, Zinc 50 with a hairline of Zinc 200 down its right
       edge: who you are talking to and whether they are there.
       Two-tone is what makes the plate read as a HANDLE with a
       label rather than as a floating banner;
     RIGHT ZONE, on the white: the last line of the thread, live,
       clipped with an ellipsis, and the cross that ends the
       session.

   IT IS 380 WIDE, THE WINDOW'S OWN WIDTH (declared with the window
   above), which is both what Ton asked for — «плашка шире» — and
   what makes the morph honest.
   ============================================================ */
.gbhc-pill {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--gbhc-accent);
  overflow: hidden;               /* the inset is a full-bleed block; the plate's radius is what trims it */
  color: var(--zinc-900);
}
/* The plate is one target with one exception: everything but the
   cross opens the window again. */
.gbhc-pill__open {
  flex: 1 1 auto;
  min-width: 0;
  display: grid;
  /* NO TOKEN: a proportion, not a length, the same kind of value as
     the bubble's 84%. Ton asked for «примерно на четверть», AND A
     QUARTER WAS MEASURED AND DOES NOT HOLD: at 380 the click area is
     330 (the plate less its border and the cross), a quarter of it
     is 82, and the two names this room actually has — «Brad Smaling»
     89 and «AI Concierge» 86 at 14/600 Inter — are both cut by it.
     42 per cent gives 138.6, which is 36.5 per cent of the whole
     plate and holds every name at every width down to 360. A plate
     whose left half is a name with an ellipsis in it is worse than a
     plate whose inset is a third: the inset exists to say WHO, and a
     name it cannot print is an inset with no job. */
  grid-template-columns: 42% minmax(0, 1fr);
  align-items: stretch;
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.gbhc-pill__open:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--gb-btn-focus-ring); }
.gbhc-pill__who {
  min-width: 0;
  display: grid;
  align-content: center;
  /* The edge of the plate gets the full gutter, the hairline gets
     half of it: a rule is a boundary and wants less air than an
     outside edge. Both are rungs. */
  padding: var(--space-8) var(--space-8) var(--space-8) var(--space-16);
  background: var(--zinc-50);
  border-right: 1px solid var(--zinc-200);
}
.gbhc-pill__name {
  font-size: 14px;                /* the secondary rung; the plate is furniture, not a heading */
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gbhc-pill__state {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  min-width: 0;
  font-size: 12px;                /* the Eyebrow rung, without the caps: this is a status, not a label */
  line-height: 1.5;
  color: var(--zinc-500);
}
.gbhc-pill__state span:not(.gbhc-dot) { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* The living half. It says what was last said, so a minimised
   conversation is still a conversation and not a closed door. */
.gbhc-pill__last {
  align-self: center;
  min-width: 0;
  padding: var(--space-8) var(--space-8) var(--space-8) var(--space-16);
  font-size: 14px;
  line-height: 1.5;
  color: var(--zinc-500);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.gbhc-pill__end { align-self: center; margin-right: var(--space-8); }
</style>
</head>
<body>

  <gb-site-header home-href="index.html"
    logo-src="../system/assets/gildedbox-logo.svg"
    catalog-href="catalog/index.html" portal-href="portal.html"
    meeting-href="book-a-meeting.html"></gb-site-header>

  <main>
    <!-- The page under the drawer is a real page: two sections of the
         site, with the site's own copy, so the bell, the drawer and the
         floating window are seen over something. Nothing is written
         here; both are the home organisms with the home attributes. -->
    <gb-banner-conversation pill="Impressive Gifts" rest="Your Brand"
      subtitle="For The Select Few, Envied By Most, Coveted By All"
      cta="Discover Gifts" href="catalog/index.html"></gb-banner-conversation>
  </main>

  <gb-advantages>
    <gb-advantage icon="present" live-icon="present" heading="Custom Gift Box">Each gift starts with an individually designed gift box.</gb-advantage>
    <gb-advantage icon="exchange" live-icon="gift-exchange" heading="Personalized Gifts">Personalization for every recipient means each gift is unique.</gb-advantage>
    <gb-advantage icon="monitor" live-icon="pc-monitor" heading="Gifting Portal">Send gifts to individuals, run and manage gifting campaigns.</gb-advantage>
  </gb-advantages>

  <gb-site-footer></gb-site-footer>

  <!-- The switchboard. One surface, two floors, and the booking flow
       stands on the second one. -->
  <gb-drawer id="gbhcDrawer"></gb-drawer>

  <!-- ---- THE CONVERSATION -------------------------------------
       Written in the page rather than injected into the body, on
       purpose: trap 19 asks every new STUDIO layer to mount inside
       <gb-studio-panel> so it keeps the house scale on a page with a
       foreign bundle. This is not a studio layer, it is the
       prototype's own furniture, and a node that stands in the
       markup cannot be handed the wrong scale by anybody.
       Both nodes are [hidden] at rest.

       THE PILL STANDS FIRST IN THE MARKUP, and that is the whole
       mechanism of the morph's last frame: the two plates carry the
       same z-index, so paint order is document order, and the
       window is therefore always ABOVE the pill. The window can
       shrink onto the pill and be taken away without anything
       showing through, and the pill can wait behind it, already
       drawn, instead of being faded in over the top. -->
  <div class="gbhc-pill" id="gbhcPill" hidden>
    <button class="gbhc-pill__open" type="button" id="gbhcPillOpen" aria-label="Open the chat">
      <span class="gbhc-pill__who">
        <span class="gbhc-pill__name" id="gbhcPillName">Live chat</span>
        <span class="gbhc-pill__state" id="gbhcPillState"></span>
      </span>
      <span class="gbhc-pill__last" id="gbhcPillLast"></span>
    </button>
    <button class="gb-btn gb-btn--icon gb-btn--small gb-btn--ghost gb-btn--secondary gbhc-pill__end" type="button"
            id="gbhcPillEnd" aria-label="End the chat"></button>
  </div>

  <div class="gbhc-chat" id="gbhcChat" role="dialog" aria-label="Chat" hidden>
    <div class="gbhc-chat__head">
      <span class="gbhc-face" id="gbhcFace" aria-hidden="true"></span>
      <div class="gbhc-chat__who">
        <p class="gbhc-chat__name" id="gbhcName">Live chat</p>
        <p class="gbhc-chat__state" id="gbhcState"></p>
      </div>
      <div class="gbhc-chat__slots">
        <button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary" type="button"
                id="gbhcMin" aria-label="Minimize the chat"></button>
        <button class="gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary" type="button"
                id="gbhcEnd" aria-label="End the chat"></button>
      </div>
    </div>
    <div class="gbhc-log" id="gbhcLog" aria-live="polite"></div>
    <form class="gbhc-composer" id="gbhcForm" autocomplete="off">
      <div class="gbhc-chips" id="gbhcChips" aria-label="Suggested messages"></div>
      <div class="gbhc-composer__field">
        <div class="gba-inputwrap">
          <input class="gba-input" id="gbhcInput" type="text" aria-label="Your message" placeholder="Message a gifting specialist...">
        </div>
        <button class="gbhc-send" id="gbhcSend" type="submit" aria-label="Send message" disabled></button>
      </div>
      <p class="gbhc-composer__hint" id="gbhcHint"></p>
    </form>
  </div>

  <gb-studio-panel data-root="../" page="concierge"></gb-studio-panel>

  <script src="../system/components/shell.js"></script>
  <script src="../system/sandbox-registry.js"></script>
  <script src="../system/components/icon.js"></script>
  <script src="../system/components/studio-panel.js"></script>
  <script src="../system/components/header.js"></script>
  <script src="../system/components/footer.js"></script>
  <script src="../system/components/home.js"></script>
  <script src="../system/components/auth.js"></script>
  <script src="../system/components/booking.js"></script>
  <script src="../system/type-scale.js"></script>
  <script src="../system/components/drawer.js"></script>
  <script src="../system/components/inspect.js"></script>
  <script src="../system/components/toggle.js"></script>
  <script src="../system/components/comments.js"></script>

  <script>
  /* ============================================================
     gbppl-concierge-1 — THE CONTROLLER OF THE ROOM
     ------------------------------------------------------------
     Four things, in this order: the fork of the bar, the drawer,
     the second floor (booking), the conversation.
     ============================================================ */
  (function () {
    'use strict';

    var I = window.GbIcons;
    var drawer = document.getElementById('gbhcDrawer');

    /* ---- THE CLOCKS COME OUT OF THE TOKENS ---------------------
       Every wait in this controller is READ from --mo-*, so there is
       no second copy of a duration in JavaScript that can drift from
       the one in CSS. Change the rung in tokens.css and both the
       ride and the hand-off that follows it move together. */
    var ROOT_CS = getComputedStyle(document.documentElement);
    function ms(name) { return parseFloat(ROOT_CS.getPropertyValue(name)) || 0; }
    var MO = {
      micro:     ms('--mo-micro'),       /* 160 */
      smallOut:  ms('--mo-small-out'),   /* 90  */
      small:     ms('--mo-small'),       /* 280 */
      mediumOut: ms('--mo-medium-out'),  /* 350 — the drawer's exit */
      medium:    ms('--mo-medium')       /* 500 — the window's rise */
    };

    /* ---- THE ACCENT OF THE SESSION PLATE -----------------------
       Two variants, because Ton has not chosen. The address carries
       it (?accent=blue|gold) so a screenshot can be asked for by
       link, and the one console carries the same switch as a Demo
       row, which is the house rule for a page level toggle (Ton
       26.08, «один пульт»). Nothing else on the page reads the
       property: the accent is the plate's edge and only that. */
    var ACCENTS = ['blue', 'gold'];
    function readAccent() {
      var q = (new URLSearchParams(location.search)).get('accent');
      return ACCENTS.indexOf(q) > -1 ? q : 'blue';
    }
    function setAccent(v, writeUrl) {
      document.documentElement.setAttribute('data-gbhc-accent', v);
      if (!writeUrl) return;
      var u = new URL(location.href);
      u.searchParams.set('accent', v);
      history.replaceState(null, '', u.toString());
    }
    setAccent(readAccent(), false);

    /* ---- THE HOVER OF THE NAVIGATION, three candidates --------
       gbppl-nav-hover-1. Same shape as the accent switch, same two
       handles: ?hover=underline|ink|both and a row of the console.
       The default is BOTH, which is the recommendation going to Ton
       with the frames. The CSS is at the top of this file. */
    var HOVERS = ['underline', 'ink', 'both'];
    function readHover() {
      var q = (new URLSearchParams(location.search)).get('hover');
      return HOVERS.indexOf(q) > -1 ? q : 'both';
    }
    function setHover(v, writeUrl) {
      document.documentElement.setAttribute('data-gbhc-hover', v);
      if (!writeUrl) return;
      var u = new URL(location.href);
      u.searchParams.set('hover', v);
      history.replaceState(null, '', u.toString());
    }
    setHover(readHover(), false);

    /* Who the advisor is. One place, because the card, the message
       form and the live chat all speak of the same person. */
    var ADVISOR = {
      name: 'Brad Smaling',
      email: 'connect@gildedbox.com',
      phone: '(847) 801-0345 ext. 8118',
      tel: '+18478010345'
    };
    var DESK = { shown: '847.801.0345', tel: '+18478010345' };

    function glyph(name, size) { return I ? I.html(name, size) : ''; }

    /* ============================================================
       1. THE FORK OF THE BAR
       ------------------------------------------------------------
       Ton asked for a fork for this sandbox and for the canonical
       header to come out untouched. The fork is ADDITIVE: the bar is
       the one <gb-site-header> draws, and this block puts the
       concierge bell into its right cluster, in front of the search
       dot, so the glyph pair reads bell then search and the cart
       (which aims at the same dot) still lands between them.

       WHY NOT A COPY OF header.js. A second 1200 line template would
       be a second bar to keep in step with the first, and the first
       changes weekly. The observable result is what Ton is looking
       at, and it is the same result; if he wants the bell on Live for
       everyone, the button moves into TEMPLATE() in one line, which
       is a smaller change than deleting a fork.

       The element upgrades while header.js is being parsed, so the
       bar is already in the DOM here; whenDefined is belt and braces
       for a browser that defers the script.
       ============================================================ */
    function forkTheBar() {
      var slot = document.querySelector('gb-site-header .gbh-actions');
      if (!slot || slot.querySelector('[data-gbhc-bell]')) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'gb-btn gb-btn--icon gb-btn--ghost gb-btn--secondary';
      btn.setAttribute('aria-label', 'Talk to us');
      btn.setAttribute('title', 'Talk to us');
      btn.setAttribute('aria-haspopup', 'dialog');
      btn.setAttribute('data-gbhc-bell', '');
      /* The slot of the organism carries the size (22 in a 44 circle);
         the drawing comes out of the record by name. */
      btn.innerHTML = '<span class="gb-btn__icon" aria-hidden="true">' +
        (I ? I.svg('service-bell') : '') + '</span>';
      btn.addEventListener('click', openHome);
      var search = slot.querySelector('[aria-label="Search gifts"]');
      slot.insertBefore(btn, search);
    }
    if (window.customElements && customElements.whenDefined) {
      customElements.whenDefined('gb-site-header').then(forkTheBar);
    }
    forkTheBar();

    /* No page level door: the sticky bar's bell is THE way in
       (Ton, 09.09), so nothing on the canvas opens the drawer. */

    /* ============================================================
       2. THE DRAWER, FLOOR ONE AND FLOOR TWO
       ============================================================ */
    /* Ton, 09.09: Live chat leads, the meeting follows, the AI door is
       third and says AI out loud — a reader must never take it for a
       person. The AI door is also contextual: it only belongs where
       gifts are being chosen (portal gift pages, catalog), and is
       absent — not disabled — everywhere else. This sandbox shows it
       present; the flag is the one word below. */
    var AI_DOOR_HERE = true;
    var DOORS = [
      {
        id: 'live', icon: 'chat',
        title: 'Live chat', badge: 'Online now',
        sub: 'Get help right now'
      },
      {
        id: 'meeting', icon: 'calendar',
        title: 'Book a meeting',
        sub: 'Pick a time that suits you'
      },
      {
        id: 'ai', icon: 'service-bell',
        title: 'AI Gift Concierge',
        sub: 'Instant answers from our AI assistant',
        hidden: !AI_DOOR_HERE
      },
      {
        id: 'call', icon: 'telephone',
        title: 'Call us',
        sub: 'Prefer to talk? ' + DESK.shown,
        href: 'tel:' + DESK.tel
      }
    ].filter(function (d) { return !d.hidden; });

    function doorHTML(d) {
      var tag = d.href ? 'a' : 'button';
      var attrs = d.href
        ? ' href="' + d.href + '"'
        : ' type="button"';
      return '<' + tag + ' class="gbhc-door" data-door="' + d.id + '"' + attrs + '>' +
        '<span class="gbhc-door__disc">' + glyph(d.icon, 22) + '</span>' +
        '<span class="gbhc-door__copy">' +
          '<span class="gbhc-door__title">' + d.title +
            (d.badge
              ? '<span class="gbhc-badge"><span class="gbhc-dot" aria-hidden="true"></span>' + d.badge + '</span>'
              : '') +
          '</span>' +
          '<span class="gbhc-door__sub">' + d.sub + '</span>' +
        '</span>' +
        '<span class="gbhc-door__go">' + glyph('chevron-right', 20) + '</span>' +
      '</' + tag + '>';
    }

    function homeHTML() {
      return '<div class="gbhc-body">' +
        '<div class="gbhc-doors">' + DOORS.map(doorHTML).join('') + '</div>' +
        '<div class="gbhc-floor2">' +
          /* The eyebrow is the live drawer's own line, word for word. */
          '<p class="gb-eyebrow">Want to connect now?</p>' +
          '<div class="gbhc-advisor" data-advisor>' +
            '<p class="gbhc-advisor__name">' + ADVISOR.name + '</p>' +
            '<div class="gbhc-advisor__rows">' +
              '<a class="gbhc-contact" href="mailto:' + ADVISOR.email + '">' +
                glyph('mail', 16) + ADVISOR.email + '</a>' +
              '<a class="gbhc-contact" href="tel:' + ADVISOR.tel + '">' +
                glyph('telephone', 16) + ADVISOR.phone + '</a>' +
            '</div>' +
            /* SCHEDULE A CALL is dead: the booking door upstairs is the
               same errand (concept, floor two). */
            '<button class="gb-btn gb-btn--medium gb-btn--outline gb-btn--secondary gb-btn--block gbhc-open" type="button" data-write>' +
              '<span class="gb-btn__label" data-pc-section="label">Send a message</span></button>' +
            '<div class="gbhc-grow"><div><div class="gbhc-note">' +
              '<div class="gba-inputwrap">' +
                '<textarea class="gba-input gba-textarea" id="gbhcNote" rows="3" ' +
                  'aria-label="Your message to ' + ADVISOR.name + '" ' +
                  'placeholder="Need help? Type your question here..."></textarea>' +
              '</div>' +
              '<button class="gb-btn gb-btn--medium gb-btn--filled gb-btn--primary gb-btn--block gbhc-note__send" type="button" data-send>' +
                '<span class="gb-btn__label" data-pc-section="label">Send</span></button>' +
            '</div></div></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function panel() { return document.querySelector('.gbd-panel'); }

    function openHome() {
      drawer.open({ title: 'Talk to us', html: homeHTML() });
      drawer.setBack(null);
      wireHome();
    }

    /* THE PANEL OUTLIVES ITS CONTENT. drawer.js builds .gbd-panel once
       and puts it on document.body; every open() only swaps the body
       inside it. A listener added per open would therefore be added
       again on every trip Home -> Meeting -> Home, and the second trip
       would fire everything twice. So the delegate is fitted ONCE, to
       the panel, and it works for whatever markup is standing in it. */
    var homeWired = false;
    function wireHome() {
      var p = panel();
      if (!p || homeWired) return;
      homeWired = true;
      p.addEventListener('click', function (e) {
        var door = e.target.closest ? e.target.closest('.gbhc-door') : null;
        if (door) {
          var id = door.getAttribute('data-door');
          if (id === 'meeting') { e.preventDefault(); openMeeting(); return; }
          if (id === 'live' || id === 'ai') { e.preventDefault(); relay(id, door); return; }
          return;   /* Call us is an <a href="tel:"> and stays one */
        }
        var write = e.target.closest ? e.target.closest('[data-write]') : null;
        if (write) {
          var card = p.querySelector('[data-advisor]');
          card.classList.add('is-writing');
          var note = p.querySelector('#gbhcNote');
          if (note) setTimeout(function () { note.focus(); }, 80);
          return;
        }
        var send = e.target.closest ? e.target.closest('[data-send]') : null;
        if (send) {
          /* Nothing leaves the browser: this is a prototype, and the
             one honest thing it can do is say so and close. */
          drawer.close();
        }
      });
    }

    /* ---- FLOOR TWO: THE BOOKING ORGANISM ----------------------
       Ton, 09.09: «выбор времени у нас расположен вертикально ПОД
       выбором даты». That is the organism's DEFAULT column, and it
       is the reason layout="compact" is deliberately absent: compact
       is the modifier that stands the slots BESIDE the calendar from
       520px of host. In this drawer the host is 472 at 1280 and the
       organism's own container query gives the 32 quarter hour chips
       their scrolling zone, so the panel does not grow to 1100.

       start="slot": two notches, «Pick a time» then «Confirmed», and
       the confirmation is the organism's own third screen at the same
       level, exactly as the concept asked. The back arrow of the head
       stays on both screens and goes home to the options.
       ------------------------------------------------------------ */
    function openMeeting() {
      drawer.open({
        title: 'Book a meeting',
        back: openHome,
        html: '<gb-booking-flow id="gbhcBooking" start="slot"' +
              ' guest-name="Anton Parkhomenko"' +
              ' guest-email="anton@gildedbox-demo.com"' +
              ' guest-company="GildedBox"' +
              ' site-href="help-concierge.html"' +
              ' exit-label="Back to the options"></gb-booking-flow>'
      });
      var flow = document.querySelector('.gbd-panel #gbhcBooking');
      if (!flow) return;
      /* The quiet exit of the last screen means «go back» inside a
         panel, not «leave the site»: the organism made that the
         host's business (gbb:exit is cancelable). */
      flow.addEventListener('gbb:exit', function (e) { e.preventDefault(); openHome(); });
    }

    /* ============================================================
       3. THE CONVERSATION
       ------------------------------------------------------------
       ONE WINDOW, TWO STARTS (the concept's strong unification): the
       AI concierge and the live chat are the same object with a
       different first message and a different name in the head.
       ============================================================ */
    /* THE LIVE START IS THE REFERENCE, WORD FOR WORD. Title, meta,
       both lines of the greeting card, all three chips, the
       placeholder and the quiet line are read off
       live/portal.html?layout=band&hero=start and not rewritten. The
       advisor's own name has not gone anywhere: it is on floor two of
       the drawer, where a named account manager belongs. The chat is
       «our team», which is what the reference calls it and what is
       true of a queue nobody has been assigned out of yet.

       THE AI START IS THE SAME SHAPE WITH THE OPPOSITE CONTENT. Ton's
       law stands over every line of it: a reader must never take this
       voice for a person, so the meta, the greeting and above all the
       quiet line say the opposite of the reference's. The chips
       cannot be carried across as words — an assistant is not asked
       about an existing order — so they are the same three ERRANDS in
       the AI's own language, and the third one is the way out to a
       human, which the AI must always offer. */
    var STARTS = {
      live: {
        icon: 'chat',
        name: 'Chat with our team',
        state: '<span class="gbhc-dot" aria-hidden="true"></span><span>Online now · A real person</span>',
        /* THE PLATE SPEAKS SHORTER THAN THE HEAD. The inset is a third
           of a 380 plate and the status shares it with a name; the
           window's own head has the room for the long form and keeps
           it. Both of these were measured against the inset, not
           guessed: see the note on the inset proportion. */
        pillName: 'GildedBox',      /* «GildedBox team» was measured and it is cut at 360; the brand alone over «Online» says the same thing in the room the inset has */
        pill: 'Online',
        placeholder: 'Message a gifting specialist...',
        hint: 'You’re chatting with a real member of the GildedBox team.',
        say: ['Hi. You’re chatting with a GildedBox gifting specialist.\nHow can I help today?'],
        chips: ['I need help choosing gifts',
                'I have an existing order',
                'I’d like a custom proposal'],
        /* THE PERSON ARRIVES WHEN A PERSON ARRIVES (the Tiffany
           mechanic, concept line 55, Ton 09.09). The room opens
           unnamed, because at that moment nobody has picked the
           conversation up; the name lands in the head and on the
           plate at the exact turn a specialist joins, and the thread
           says so in its own quiet line. Nothing is promised before
           it is true. The AI start has no `join` at all, and that is
           the difference stated as data rather than as an if. */
        join: {
          line: 'Brad Smaling joined the chat.',
          name: 'Brad Smaling',
          state: 'Online now · Gifting specialist',
          pillName: 'Brad Smaling',
          pill: 'Online'
        },
        turns: [
          { say: 'Got it, I can help with that.' },
          /* Turn two asks, and the choices come WITH the question. */
          { say: 'What’s the occasion?',
            ask: ['A client thank you', 'An onboarding gift', 'A holiday send'] },
          { say: 'Understood. I am putting a shortlist together and will send it over in a moment.' }
        ]
      },
      ai: {
        icon: 'service-bell',
        /* Ton, 09.09: the window says AI as loudly as the door does —
           a reader must never take this voice for a person. */
        name: 'AI Gift Concierge',
        state: '<span class="gbhc-dot" aria-hidden="true"></span><span>Always on · Not a person</span>',
        pillName: 'AI Concierge',
        pill: 'AI assistant',
        placeholder: 'Ask the AI concierge...',
        hint: 'You’re chatting with an AI assistant, not a member of the GildedBox team.',
        say: ['Hi. You’re chatting with the GildedBox AI concierge, which is software and not a person.\nTell me who the gift is for and what the occasion is, and I will put a shortlist together.'],
        chips: ['Help me choose a gift',
                'What fits a set budget?',
                'Hand me to a real person'],
        /* No join, ever. Nobody is going to walk into this room, and
           the head must not one day say a name. */
        turns: [
          { say: 'Thank you. Let me narrow that down.' },
          { say: 'What’s the occasion?',
            ask: ['A client thank you', 'An onboarding gift', 'A holiday send'] },
          { say: 'Understood. I am pulling a shortlist together, and I can hand you to a live specialist at any point.' }
        ]
      }
    };

    var chat = document.getElementById('gbhcChat');
    var pill = document.getElementById('gbhcPill');
    var log = document.getElementById('gbhcLog');
    var input = document.getElementById('gbhcInput');
    var mode = null;
    var replyTimer = null;

    document.getElementById('gbhcMin').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('chevron-down') : '') + '</span>';
    document.getElementById('gbhcEnd').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('close') : '') + '</span>';
    document.getElementById('gbhcPillEnd').innerHTML =
      '<span class="gb-btn__icon" aria-hidden="true">' + (I ? I.svg('close') : '') + '</span>';
    var send = document.getElementById('gbhcSend');
    var chips = document.getElementById('gbhcChips');
    var hint = document.getElementById('gbhcHint');
    send.innerHTML = glyph('arrow-right', 20);

    var pillLast = document.getElementById('gbhcPillLast');

    /* The face of the speaker, the reference's own 24px glyph in its
       own 40px disc. Ours is drawn out of the icon record by name,
       and its colours are the disc this file already draws twice. */
    function faceHTML() {
      return '<span class="gbhc-msg__face" aria-hidden="true">' + glyph('chat', 24) + '</span>';
    }

    /* ConciergeChatBubble of the reference: the face rides only on the
       agent's side, and the text is split on newlines into one <p>
       each, so the greeting is one card of two paragraphs and not two
       cards. textContent per line, never innerHTML: a guest types
       here. */
    function say(side, text, ask) {
      var row = document.createElement('article');
      row.className = 'gbhc-msg gbhc-msg--' + side;
      if (side === 'them') row.innerHTML = faceHTML();
      var stack = document.createElement('div');
      stack.className = 'gbhc-msg__stack';
      var bubble = document.createElement('div');
      bubble.className = 'gbhc-msg__bubble';
      text.split('\n').forEach(function (line) {
        var p = document.createElement('p');
        p.textContent = line;
        bubble.appendChild(p);
      });
      stack.appendChild(bubble);
      /* The answer sheet, if the question came with one. It is part
         of the message and lives inside it, so it scrolls with the
         thread and dies with it. */
      if (ask && ask.length) {
        var sheet = document.createElement('div');
        sheet.className = 'gbhc-chips gbhc-msg__ask';
        sheet.setAttribute('data-ask', '');
        sheet.setAttribute('aria-label', 'Answers');
        ask.forEach(function (label) {
          var b = document.createElement('button');
          b.type = 'button';
          b.textContent = label;
          sheet.appendChild(b);
        });
        stack.appendChild(sheet);
      }
      row.appendChild(stack);
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      /* THE PLATE IS LIVE. Whatever was last said is what the pill
         shows, including an answer that lands while it is minimised:
         that is the difference between a handle on a conversation
         and a button that says a conversation exists. The plate has
         one line, so a two paragraph card arrives there as one. */
      pillLast.textContent = text.split('\n').join(' ');
    }

    /* ---- THE CHIPS --------------------------------------------
       In the reference they stand for the life of the conversation
       and are only disabled while the specialist is typing. HERE
       THEY LEAVE after the first thing the guest says, and that is a
       deliberate divergence with a measurement behind it: the
       reference's surface is a 748 panel with the composer pinned to
       its floor and room to spare, and this window, at 360 wide,
       spends three rows and 120px on three chips that have already
       done their job. They are an opening, not a menu. Reported to
       Ton as a divergence rather than taken quietly.
       While a reply is pending they are disabled, which IS the
       reference, and it is the same latch as the field. */
    function paintChips(list) {
      chips.innerHTML = '';
      (list || []).forEach(function (label) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = label;
        chips.appendChild(b);
      });
      chips.hidden = !(list || []).length;
    }

    /* The field is dead while the other side is typing, and so is
       every chip. Both halves of the latch are set here and cleared
       here, in one place, in both directions (trap 22). */
    var pending = false;
    var turn = 0;              /* which scripted answer is next */
    function syncSend() {
      send.disabled = pending || !input.value.trim();
    }
    function setPending(on) {
      pending = on;
      input.disabled = on;
      var all = chips.querySelectorAll('button');
      for (var i = 0; i < all.length; i++) all[i].disabled = on;
      syncSend();
    }
    function typingRow() {
      var row = document.createElement('article');
      row.className = 'gbhc-msg gbhc-msg--them gbhc-msg--typing';
      row.setAttribute('role', 'status');
      row.setAttribute('aria-label', 'Typing');
      row.innerHTML = faceHTML() +
        '<div class="gbhc-msg__stack"><div class="gbhc-msg__bubble">' +
        '<span></span><span></span><span></span></div></div>';
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
      return row;
    }

    /* The room says a thing about itself. Not a voice, so not a
       bubble, and it never reaches the plate. */
    function note(text) {
      var p = document.createElement('p');
      p.className = 'gbhc-sys';
      p.setAttribute('role', 'status');
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    /* A question is answered once. Every answer sheet standing in the
       thread leaves the moment anything is said, whether it was
       tapped or typed: a list of answers under a question that has
       already been answered is a list that lies. */
    function closeAsks() {
      var open = log.querySelectorAll('[data-ask]');
      for (var i = 0; i < open.length; i++) {
        (function (sheet) {
          sheet.removeAttribute('data-ask');
          var all = sheet.querySelectorAll('button');
          for (var k = 0; k < all.length; k++) all[k].disabled = true;
          sheet.classList.add('is-out');
          setTimeout(function () { if (sheet.parentNode) sheet.parentNode.removeChild(sheet); }, MO.smallOut);
        })(open[i]);
      }
    }

    /* THE PERSON ARRIVES. The head and the plate are re-dressed at
       the one moment it becomes true, and never before. */
    var joined = false;
    function joinNow(join) {
      joined = true;
      note(join.line);
      document.getElementById('gbhcName').textContent = join.name;
      document.getElementById('gbhcState').innerHTML =
        '<span class="gbhc-dot" aria-hidden="true"></span><span>' + join.state + '</span>';
      document.getElementById('gbhcPillName').textContent = join.pillName;
      document.getElementById('gbhcPillState').innerHTML =
        '<span class="gbhc-dot" aria-hidden="true"></span><span>' + join.pill + '</span>';
    }

    /* ============================================================
       THE TWO RIDES
       ------------------------------------------------------------
       riseChat  — the end of the relay: the window comes up out of
                   the corner while the drawer is still leaving.
       minimise / expand — the morph: one plate becomes the other by
                   changing its height onto the other's rectangle.
       Only one of them may be in the air at a time; `busy` is the
       latch, and every path clears it (trap 22's rule, applied to a
       ride rather than to a request).
       ============================================================ */
    var busy = false;
    var rideTimer = null;

    function dress(which) {
      var start = STARTS[which];
      if (mode === which) return start;
      mode = which;
      log.innerHTML = '';
      clearTimeout(replyTimer);
      document.getElementById('gbhcFace').innerHTML = glyph(start.icon, 22);
      document.getElementById('gbhcName').textContent = start.name;
      document.getElementById('gbhcState').innerHTML = start.state;
      document.getElementById('gbhcPillName').textContent = start.pillName;
      document.getElementById('gbhcPillState').innerHTML =
        '<span class="gbhc-dot" aria-hidden="true"></span><span>' + start.pill + '</span>';
      input.placeholder = start.placeholder;
      input.setAttribute('aria-label', start.placeholder.replace('...', ''));
      hint.textContent = start.hint;
      paintChips(start.chips);
      input.value = '';
      joined = false;
      turn = 0;
      setPending(false);
      start.say.forEach(function (line) { say('them', line); });
      return start;
    }

    function riseChat(which) {
      dress(which);
      pill.hidden = true;
      chat.hidden = false;
      chat.classList.remove('is-in', 'is-morph', 'is-shut', 'is-nomo');
      chat.style.width = '';
      chat.style.height = '';
      void chat.offsetWidth;
      chat.classList.add('is-in');
      setTimeout(function () { input.focus(); }, MO.smallOut);
    }

    /* ---- THE RELAY, drawer -> window --------------------------
       Three beats, and the third begins before the second has
       finished, which is the whole point of it.

         1  the row says it was the one that was hit  (--mo-micro)
         2  the drawer leaves on its own exit         (--mo-medium-out)
         3  HALF WAY through beat 2, the window rises (--mo-medium)

       The half is not a new duration and is not on the scale: it is
       a POINT INSIDE a rung, read off --mo-medium-out at run time,
       and there is nothing on the motion scale that could name it
       without inventing a clock. NO TOKEN, and the reason it is
       half and not a rung is that a rung would either land before
       the drawer has moved (--mo-small-out) or after it has gone
       (--mo-small, 280 of 350) and the overlap Ton asked for would
       be a queue again.

       ONE SCRIM FOR THE WHOLE RELAY. The drawer's own backdrop is
       never closed and reopened here: drawer.close() is called once
       and the scrim fades on its 350 while the window is already on
       its way up. Nothing dims a second time, so there is nothing
       to blink. */
    function relay(id, row) {
      if (busy) return;
      busy = true;
      if (row) row.classList.add('is-chosen');
      setTimeout(function () {
        drawer.close();
        setTimeout(function () {
          if (row) row.classList.remove('is-chosen');
          riseChat(id);
          busy = false;
        }, MO.mediumOut / 2);
      }, MO.micro);
    }

    /* ---- THE MORPH, window -> pill ----------------------------
       The pill is unhidden FIRST and measured where it will stand,
       so the window is given a real destination rather than a
       number somebody typed. It waits there, behind the window,
       fully drawn, for the whole ride. */
    function box(el) { var r = el.getBoundingClientRect(); return { w: r.width, h: r.height }; }
    function setBox(el, b) { el.style.width = b.w + 'px'; el.style.height = b.h + 'px'; }
    function clearBox(el) { el.style.width = ''; el.style.height = ''; }

    function minimise() {
      if (busy) return;
      busy = true;
      chat.classList.remove('is-in');            /* the entrance animation must not own the frame */
      var from = box(chat);
      pill.hidden = false;
      var to = box(pill);                        /* a real destination, measured where it will stand */
      setBox(chat, from);
      chat.classList.add('is-morph');
      void chat.offsetHeight;                    /* the baseline of every transition on the frame */
      chat.classList.add('is-shut');             /* the content leaves on --mo-small-out */
      setBox(chat, to);                          /* the frame leaves on --mo-small, both axes */
      clearTimeout(rideTimer);
      rideTimer = setTimeout(function () {
        chat.hidden = true;
        chat.classList.remove('is-morph', 'is-shut');
        clearBox(chat);
        busy = false;
      }, MO.small);
    }

    /* ---- THE MORPH, pill -> window ----------------------------
       The same ride read backwards. The window is placed ON the
       pill's rectangle with the clocks off, so nothing is seen
       jumping there, and only then is it asked to grow. */
    function expand() {
      if (busy || !mode) return;
      busy = true;
      var from = box(pill);
      chat.hidden = false;
      chat.classList.add('is-nomo', 'is-morph', 'is-shut');
      clearBox(chat);
      var to = box(chat);                        /* the natural frame, already clipped by max-width and max-height */
      setBox(chat, from);
      void chat.offsetHeight;
      chat.classList.remove('is-nomo');
      void chat.offsetHeight;
      chat.classList.remove('is-shut');
      setBox(chat, to);
      clearTimeout(rideTimer);
      rideTimer = setTimeout(function () {
        chat.classList.remove('is-morph');
        clearBox(chat);
        pill.hidden = true;
        busy = false;
        input.focus();
      }, MO.small);
    }

    /* THE CROSS ENDS THE SESSION, and the screen is clean: no window,
       no pill, nothing floating anywhere. Next time the door is used
       the conversation starts again from its greeting. */
    function endSession() {
      clearTimeout(replyTimer);
      clearTimeout(rideTimer);
      busy = false;
      chat.hidden = true;
      chat.classList.remove('is-in', 'is-morph', 'is-shut', 'is-nomo');
      clearBox(chat);
      pill.hidden = true;
      mode = null;
      log.innerHTML = '';
      pillLast.textContent = '';
      input.value = '';
      joined = false;
      turn = 0;
      setPending(false);
    }

    document.getElementById('gbhcMin').addEventListener('click', minimise);
    document.getElementById('gbhcEnd').addEventListener('click', endSession);
    document.getElementById('gbhcPillEnd').addEventListener('click', endSession);
    document.getElementById('gbhcPillOpen').addEventListener('click', expand);

    /* ---- ONE WAY IN AND OUT FOR EVERY MESSAGE -----------------
       The typed line and the tapped chip are the same errand and go
       through the same door, which is how the reference has it and
       is also the only way the latch can be trusted. */
    function send_(value) {
      var text = (value || '').trim();
      var start = STARTS[mode];
      if (!text || pending || !start) return;
      closeAsks();                 /* the question in the thread is answered, whichever way */
      say('you', text);
      input.value = '';
      /* The opening is over: the routing chips have done their job. */
      paintChips(null);
      setPending(true);
      var typing = typingRow();
      var step = start.turns[Math.min(turn, start.turns.length - 1)];
      turn++;
      clearTimeout(replyTimer);
      /* The scripted answer, so the thread reads as a thread. NO
         TOKEN: 900ms of waiting is not a move, and the motion scale
         holds the length of moves. The latch is dropped in the same
         place it was set, and there is no other path out of it. */
      replyTimer = setTimeout(function () {
        if (typing.parentNode) typing.parentNode.removeChild(typing);
        /* The room reports the arrival BEFORE the arrival speaks. */
        if (start.join && !joined) joinNow(start.join);
        say('them', step.say, step.ask);
        setPending(false);
        if (!chat.hidden) input.focus();
      }, 900);
    }

    input.addEventListener('input', syncSend);
    document.getElementById('gbhcForm').addEventListener('submit', function (e) {
      e.preventDefault();
      send_(input.value);
    });
    chips.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('button') : null;
      if (!chip || chip.disabled) return;
      send_(chip.textContent);
    });
    /* The answer sheets live in the thread, and the thread is
       rewritten on every turn, so the listener sits on the log once
       and reads whatever is standing in it (the same reason the
       drawer's delegate is fitted to the panel and not to a body). */
    log.addEventListener('click', function (e) {
      var chip = e.target.closest ? e.target.closest('.gbhc-msg__ask button') : null;
      if (!chip || chip.disabled) return;
      send_(chip.textContent);
    });

    /* ============================================================
       4. THE ONE CONSOLE
       ------------------------------------------------------------
       The page's only switch, declared to <gb-studio-panel> the way
       every page switch is (addGroup, type choice). It writes the
       key back into the address so the state Ton is looking at is
       the state a link reproduces.
       ============================================================ */
    var spanel = document.querySelector('gb-studio-panel');
    if (spanel && typeof spanel.addGroup === 'function') {
      spanel.addGroup({
        type: 'choice',
        title: 'Accent of the session plate',
        value: readAccent(),
        options: [
          { label: 'Blue', value: 'blue',
            note: 'Blue 600, the house colour of state and action. Nothing new is spent.' },
          { label: 'Gold', value: 'gold',
            note: 'The gold of the Beta chip in the bar, #bea042. It is a token, and it is under the standing veto on gold in the interface.' }
        ],
        onChange: function (v) { setAccent(v, true); }
      });
      spanel.addGroup({
        type: 'choice',
        title: 'Hover of the top navigation',
        value: readHover(),
        options: [
          { label: 'Underline', value: 'underline',
            note: 'A hairline grows out from the left under the label and retreats the same way. Nothing moves.' },
          { label: 'Ink', value: 'ink',
            note: 'The label deepens to Zinc 900. Rest has to sit at Zinc 600 for that to be visible, so the bar reads lighter when nobody is pointing at it.' },
          { label: 'Both', value: 'both',
            note: 'The rule and the ink together. The candidate this wave recommends.' }
        ],
        onChange: function (v) { setHover(v, true); }
      });
    }
  })();
  </script>

</body>
</html>
