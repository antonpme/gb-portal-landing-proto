<!-- ============================================================
     gbppl-concierge-unify-1b — THE ADDRESS THIS ROOM USED TO HAVE
     ------------------------------------------------------------
     2026-09-09. Ton asked the question that settled the whole
     architecture: "how do we integrate this prototype into OUR
     prototypes, where is the switch". The answer is not a room of
     its own with a copy of the home page inside it, which is what
     this file had become and which he named in one line: "I asked
     for the home page, not a stub of something with one section
     on it". The answer is A LAYER ON THE REAL PAGES. The concierge
     now lives in live/concierge/ and two real prototypes put it on
     under one key: the home page at index.html?concierge=1 and the
     portal at portal.html?layout=band&hero=start&concierge=1.
     Under the layer there is the actual page, all of it, because
     there is no copy of anything.

     THIS ADDRESS HAS BEEN SHARED, so it does not stop working.
     Law 0a.5, links never break, and the precedent is
     system/oro/stepper.html, which forwards to inputnumber.html in
     exactly this manner. replace() rather than assign(), so a dead
     address does not sit in the back button; the query rides
     across, because device, studio and comment are context and not
     decoration; and the concierge key is forced on, because the
     concierge is what anybody following this link came to see.
     The body below is what a reader sees with scripts off.
     ============================================================ -->
