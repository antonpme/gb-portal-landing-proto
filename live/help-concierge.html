/* ============================================================
   THE ROOM'S OWN FOUR THINGS                        .gbhc-*
   ------------------------------------------------------------
   Nothing here restyles a system component. Four objects the
   system does not have yet are drawn, and each number is either a
   rung (--space-*, --radius, --gb-btn-*, --mo-*, the Zinc and Blue
   ramps) or is marked NO TOKEN with what it is and why.
   ============================================================ */

/* ---- No title band. Ton, 09.09: the bell in the sticky bar is
   THE way in; the page under the drawer is a plain page of the
   site, and a second Get help door is not drawn. The band that
   stood here («How can we help?» + Get help) was cut on his word:
   «все эти секции — просто игнорируй, мы такого делать не будем». */
/* ============================================================
   FLOOR ONE — THE OPTIONS
   ------------------------------------------------------------
   The row is the MyGifts popup's door, brought over as language
   rather than as CSS: disc with a glyph, title with an optional
   badge, one line under it, chevron at the end, hairlines between
   and nothing around. The popup's own numbers (46 disc, 14 gap,
   18 inset, 90 tall) are not copied: they were that popup's 1.15
   enlargement of the source, and in a 520 drawer the row stands on
   the scale instead — disc 44, which is the live circle the whole
   house already draws, gap and inset --space-16.
   ============================================================ */
.gbhc-doors {
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--white);
}
.gbhc-door {
  width: 100%;
  display: grid;
  grid-template-columns: var(--gb-btn-icon-size) minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-16);
  padding: var(--space-16);
  background: transparent;
  border: 0;
  color: var(--zinc-900);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background-color var(--mo-micro) var(--mo-move);
}
/* Trap 1: `body.gb-demo a { color: inherit }` weighs 0-1-2 and the
   Call us row is an <a>. The antidote is always written as a pair. */
.gbhc-door,
body.gb-demo a.gbhc-door { color: var(--zinc-900); }
.gbhc-door + .gbhc-door { border-top: 1px solid var(--zinc-200); }
.gbhc-door:hover { background: var(--zinc-50); }
.gbhc-door:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--gb-btn-focus-ring); }
/* The disc is the live circle (44) with the live glyph (22) in it,
   both read from the button organism so that the row and an icon
   button of the bar are the same size by construction. It is NOT a
   .gb-btn--icon: the row is the control, and a button inside a
   button is the thing the icon component's own header warns about. */
.gbhc-door__disc {
  width: var(--gb-btn-icon-size);
  height: var(--gb-btn-icon-size);
  display: grid;
  place-items: center;
  background: var(--zinc-50);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius-circle);
  color: var(--zinc-900);
}
.gbhc-door__copy { min-width: 0; display: grid; gap: 2px; }  /* NO TOKEN: 2px, half of the 4 that is itself half of --space-8; the two lines of a row are one sentence and the scale starts above them */
.gbhc-door__title {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--space-8);
  font-size: 16px;          /* body base, verified live */
  font-weight: 600;
  line-height: 1.5;
}
.gbhc-door__sub {
  font-size: 14px;          /* the secondary rung, 14/21 */
  line-height: 1.5;
  color: var(--zinc-500);
}
.gbhc-door__go { color: var(--zinc-500); transition: transform var(--mo-micro) var(--mo-move); }
.gbhc-door:hover .gbhc-door__go { transform: translateX(3px); }  /* NO TOKEN: 3px, the nudge the popup's own chevron makes; there is no distance scale under 8 */

/* THE BADGE. Form of the house plate (.gbc-chip, .gbcCard-badge, the
   «in this order» mark of the V5 picker): Zinc 100 ground, Zinc 600
   ink, --radius. The dot is BLUE 600 and not green: being online is
   a state, Ton-5 gives states the blue, and the system has no green
   in :root at all (the four alert tones carry theirs on the
   component). The MyGifts popup used its source's green — a question
   for Ton, in the report. */
.gbhc-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-8);
  padding: 2px var(--space-8);   /* NO TOKEN: 2px, see .gbhc-door__copy */
  background: var(--zinc-100);
  border-radius: var(--radius);
  font-size: 12px;               /* the Eyebrow rung */
  font-weight: 600;
  line-height: 1.5;
  letter-spacing: 0;
  color: var(--zinc-600);
  white-space: nowrap;
}
.gbhc-dot {
  flex: 0 0 auto;
  width: 6px;                    /* NO TOKEN: 6px, a dot; the space scale starts at 8 and a dot is not a space */
  height: 6px;
  border-radius: var(--radius-circle);
  background: var(--blue-600);
}

/* THE MARK OF THE CHOICE, the first beat of the relay. A door that
   has been chosen says so for --mo-micro before the drawer starts
   to leave, so the hand sees WHICH row it hit and the window that
   rises afterwards is understood as that row's answer. Blue 50 in
   both accent variants: this is a selection, and Ton-5 gives
   selection the blue whatever colour the plate is wearing. */
.gbhc-door.is-chosen,
.gbhc-door.is-chosen:hover { background: var(--blue-50); }

/* ============================================================
   FLOOR TWO — YOUR GIFT ADVISOR
   ------------------------------------------------------------
   The card of the portal's Get Help, minus SCHEDULE A CALL (the
   booking door upstairs is the same errand, and two doors to one
   place is the duplication the concept killed). In its place «Send
   a message», and the card GROWS DOWN rather than opening a level:
   the advisor and a message to the advisor are one subject, and a
   level change would say they are two.

   IT IS NOT PINNED TO THE FOOT, and that is a decision taken against
   the letter of the brief with its own reason. The live Get Help
   pins its card to the bottom of the panel, and the concept's first
   observation about that drawer is «между free-text и карточкой
   огромная пустота — дровер не скомпонован». Pinning is what makes
   that hole: two blocks pushed to opposite ends of a panel taller
   than both. Standing the card one gutter under the options gives
   the same order — options first, advisor second — and leaves the
   spare height where spare height belongs, under everything, where
   it reads as a short panel rather than as a broken one. Measured
   at 900 tall: pinned left 240px of white between the two floors.
   A question for Ton in the report; putting the pin back is one
   line (margin-top: auto on .gbhc-floor2).
   ============================================================ */
.gbhc-body { display: flex; flex-direction: column; gap: var(--space-32); }
.gbhc-advisor {
  background: var(--zinc-50);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
  padding: var(--space-16);
}
.gbhc-advisor__name {
  margin: 0 0 var(--space-8);
  font-size: 16px;
  font-weight: 600;
  line-height: 1.5;
  color: var(--zinc-900);
}
.gbhc-advisor__rows { display: grid; gap: var(--space-8); margin-bottom: var(--space-16); }
.gbhc-contact,
body.gb-demo a.gbhc-contact {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  font-size: 14px;
  line-height: 1.5;
  color: var(--zinc-600);
  text-decoration: none;
}
.gbhc-contact:hover,
body.gb-demo a.gbhc-contact:hover { color: var(--blue-600); }
.gbhc-contact .gb-icon { color: var(--zinc-500); }
.gbhc-contact:hover .gb-icon { color: inherit; }
/* THE GROWTH. A 0fr -> 1fr grid row: the panel finds its own height,
   nothing is measured in JS and nothing is written in pixels. */
.gbhc-grow { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--mo-small) var(--mo-move); }
.gbhc-grow > * { overflow: hidden; }
.gbhc-advisor.is-writing .gbhc-grow { grid-template-rows: 1fr; }
.gbhc-advisor.is-writing .gbhc-open { display: none; }
.gbhc-note { padding-top: var(--space-16); }
.gbhc-note__send { margin-top: var(--space-16); }

/* ---- THE TWO LABEL-LESS FIELDS, AND THEIR TWO ANTIDOTES -----
   The message to the advisor and the chat composer are both the
   house field with nothing written over them, which is how the live
   Get Help composer stands too. Two things follow, and the portal's
   own composer carries the identical pair for the identical reason
   (its note of 26.08, trap 10 of the skill):

   (a) TRAP 3. auth.css reproduces the live preflight INSIDE its own
       scope (gb-guest-header, gb-auth-flow) and .gba-input then
       gives a width to the bottom border only, trusting the other
       three to be zero already. Outside those two scopes the UA's
       full frame is still there, and the underline arrives as a box.
   (b) THE PLACEHOLDER DOES NOT FADE ON FOCUS. The live field fades
       it because a label has already said the field's name. Here
       there is no label: the placeholder IS the name, and a field
       that empties itself of words the moment you touch it is a
       field that stops telling you what it is for. */
.gbhc-note .gba-input,
.gbhc-composer .gba-input { border-style: solid; border-width: 0; border-bottom-width: 1px; }
.gbhc-note .gba-input:focus::placeholder,
.gbhc-composer .gba-input:focus::placeholder { opacity: 1; }
.gbhc-note .gba-input { display: block; }

/* ============================================================
   THE CHAT WINDOW AND THE PILL
   ------------------------------------------------------------
   Bottom right, over the page, under everything the studio owns:
   z 57 sits above the Inspect overlay (55) and the Comment pins
   (56) and below the device scene (58), the console (60) and the

   AT REST THERE IS NOTHING HERE. Both nodes carry [hidden] until a

   takes both away.
   ============================================================ */
/* ---- THE ACCENT OF THE PLATE, one property, two values ------
   Ton, 09.09, has not picked the colour yet, so both are built and
   the switch is a key of the address (?accent=blue|gold) and a row
   of the one console. BLUE is --blue-600, the house colour of state
   and action (Ton-5). GOLD is --gold-beta #bea042, WHICH IS A TOKEN
