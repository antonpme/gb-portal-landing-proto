<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- gbppl-gate-2: one code on every page of the studio; the guard runs before the bundle paints. -->
    <script src="../../system/components/studio.js" data-home="../../index.html"></script>
    <!--
      gbppl-catalog-mark-1 (2026-08-31) — ?nav=mark, THE PROTOTYPE'S OWN MENU.

      Ton, 31.08: «должна быть версия-прототип страницы категорий GIFTS, где
      меню переделано как просил Марк; её нет ни на live, ни в прототипе, это
      проблема».

      He is right that it is nowhere, and the reason is this page. The bundle
      under #root IS the July prototype Mark reviewed, and its own bar already
      answers three of the four things he asked for on 27.07: no CUSTOMIZE and
      no EXPLORE in the chrome, Portal folded into the person glyph, the
      concierge floating. Since gbppl-catalog-header-1 that bar has been hidden
      on every address we have, and what stands in its place is the SITE's bar,
      which carries GIFTS · CUSTOMIZE · PORTAL · EXPLORE — the menu Mark
      objected to, item for item. So the version he asked for was not missing:
      it was underneath.

      This key uncovers it. With ?nav=mark the five organisms this wrapper adds
      come out of the DOM below, every rule of the swap in oro-ui-override.css
      stands down, and the page is the prototype as reviewed. Without it
      nothing changes by a pixel.

      WHAT IT DOES NOT DO, and the report says so out loud: it does not build
      the fourth point. Categories are still the secondary row and Gifts still
      opens a mega menu. Uncovering is not redesigning, and the redesign is
      Ton's to order.

      The class goes on <html> before the first stylesheet, so nothing flashes.
      The key is `nav`, which header.js already carries in GB_KEEP.content, so
      it rides along the wrapper's internal links on its own.
    -->
    <script>
      (function () {
        try {
          if (new URLSearchParams(location.search).get('nav') !== 'mark') return;
          document.documentElement.classList.add('gbppl-nav-native');
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Interactive GildedBox category and AI Gift Concierge prototype"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GildedBox · Gift Concierge" />
    <meta
      property="og:description"
      content="Interactive concept for a faster, more personal way to find the right corporate gift."
    />
    <link rel="icon" href="./assets/brand/gildedbox-logo.svg" type="image/svg+xml" />
    <!-- gbppl-catalog-header-1: copy-lint on the way past. Both titles carried
         an em dash, which the prototype does not use anywhere (separator "·"). -->
    <title>GildedBox · Gift Concierge Prototype</title>
    <script type="module" crossorigin src="./assets/index-CosrF-zM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B68sqkur.css">
    <!--
      gbppl-catalog-drawer-tempo — the drawers of this vendored v1 build are
      retimed to the prototype's motion language (studio/system/MOTION.md).
      The build's own css above is minified output and is never hand-edited;
      the retiming rides on top, last stylesheet in, scoped to ?embed=1.
    -->
    <link rel="stylesheet" href="./oro-motion-override.css">
    <!--
      gbppl-badge-one — the count badges of this vendored build are brought
      onto the prototype's one badge (studio/system/tokens.css, COUNT BADGE).
      Same arrangement as the overlay above and for the same reason: the
      build's own css is minified output and is never hand-edited. Kept apart
      from the motion file on purpose -- one is tempo, this one is ui. Scoped
      to ?embed=1 too, so direct /catalog/ stays the untouched reference.

      2026-08-26: the build caught up. The badge below now lives in v1's own
      styles.css, so these rules restate a bundle that already agrees with
      them and are kept only as the record of where the numbers came from.
      Read the file's own header before changing either side.

      gbppl-catalog-header-1: the link to that file moved to the FOOT of this
      head. It now also carries the rules that hide the bundle's own header
      and repair the token names tokens.css takes off the bundle, and both
      jobs need it to be the last stylesheet in.
    -->
    <!--
      gbppl-catalog-exit — the vendored catalog was the one room of the
      studio with no door back: its own header offers Gifts, Solutions and
      Our Story, and "Book a Meeting" leaves for the production site, so a
      visitor who arrived from the hub had nothing to click but the browser's
      back arrow. The STUDIO tab that every other page carries is added here
      as a wrapper concern, not a build one: the panel is a standalone custom
      element in light DOM and tokens.css declares nothing but :root
      variables, so the bundle below is untouched and a rebuild does not have
      to know about either file. Fixing anything INSIDE the bundle still
      means rebuilding it in the ai-consierge repo.
    -->
    <link rel="stylesheet" href="../../system/assets/tokens.css">
    <link rel="stylesheet" href="../../system/components/studio-panel.css">
    <!--
      gbppl-catalog-header-1 — THE CHROME OF THIS PAGE IS THE SITE'S CHROME.

      Ton, 2026-08-26: «когда мы заходим на Gifts, у нас версия Live висит с
      хедером от версии Sandbox: ненастоящий хедер. Кнопка Book a Meeting
      другая, меню и дропдаун вообще другие. Большая проблема».

      He is right, and the fix is Ton-6 and Ton-8 in one line: live wears the
      system's components, and the system already owns this bar. The bundle
      below draws a header of its own (Gifts / Solutions / Our Story, a black
      Book a Meeting with a calendar glyph, its own mega menu). It is hidden
      by the overlay at the foot of this head, and <gb-site-header> stands in
      front of #root in the body instead — the same element, with the same
      four addresses written out, that live/index.html and live/checkout.html
      carry.

      Four stylesheets, and each one is needed by that element, not by the
      catalogue: shell for .gb-container, button for the .gb-btn family the
      bar's right pocket wears, header for the bar itself, footer for the
      site footer that replaces the bundle's (same argument, one floor down).
      They come AFTER the build's css on purpose — where a bare-element rule
      of the bundle (a, button, *) meets one of ours at equal weight, ours
      has to win — and they are scoped to .gb-*, gb-site-header and
      gb-site-footer, so nothing in them reaches the catalogue.

      What the page does NOT take is body.gb-demo. That class carries the
      demo body's ground, font and link colour, and the bundle brings its
      own; the header needs none of it.
    -->
    <link rel="stylesheet" href="../../system/components/shell.css">
    <link rel="stylesheet" href="../../system/components/button.css">
    <link rel="stylesheet" href="../../system/components/icon.css">
    <link rel="stylesheet" href="../../system/components/header.css">
    <link rel="stylesheet" href="../../system/components/footer.css">
    <!--
      gbppl-catalog-advantages-1 — and a fifth, for the advantages band that
      now stands above that footer. home.css is the home zone's stylesheet and
      it is scoped through and through: every selector in it, inside the media
      queries included, is prefixed .gbhm*, so nothing in it reaches the
      catalogue and no host wrapper is needed. What it does bring are its two
      local @font-face declarations, LogoFont and Nucleo. Nucleo is exactly
      what the three glyphs of this section are drawn in, and the urls inside
      resolve against the stylesheet, not against this page, so the depth
      costs nothing. The bundle declares none of the names the section reads
      (--home-advantages-bg, --catalog-ink, the four --container-* and
      --font-serif), so the collision that bit --space-* at the foot of this
      head does not repeat here.
    -->
    <!-- gbppl-inspect-1: Dev mode on the catalog, same six lines every studio page carries. -->
    <link rel="stylesheet" href="../../system/components/drawer.css">
    <link rel="stylesheet" href="../../system/components/docs.css">
    <link rel="stylesheet" href="../../system/components/inspect.css">
    <!-- gbppl-comments-b. auth.css comes with comments.css and for the same
         reason docs.css comes with inspect.css: the body of the drawer is
         written in the system's own atoms, and the comment form is made of
         fields (.gba-field / .gba-input). Every rule in the file is scoped to
         .gba-*, gb-field, gb-guest-header or gb-auth-flow, so a page that has
         none of them is unchanged by it. -->
    <link rel="stylesheet" href="../../system/components/auth.css">
    <link rel="stylesheet" href="../../system/components/comments.css">
    <link rel="stylesheet" href="../../system/components/home.css">
    <!--
      gbppl-catalog-hero-1 (2026-08-27) — and a sixth, for the hero band that
      now opens the page. catalog.css is the catalog zone's own stylesheet and
      the owner of <gb-catalog-hero>. Every selector in it is either one of the
      four custom elements or a .gbcH- / .gbcF- / .gbcL- / .gbcCard- hook,
      inside the media queries included, so nothing in it reaches the build;
      and not one of the names it reads (--container-pad, --catalog-ink, the
      zinc scale, --font-serif, --font-sans, --white) is declared by the
      bundle, so the --space-* collision at the foot of this head does not
      repeat here. Both directions checked by grep before the link went in.
    -->
    <link rel="stylesheet" href="../../system/components/catalog.css">
    <!-- Last stylesheet in: it overrides the build AND repairs the three
         --space-* names tokens.css takes off it. See the file's own head. -->
    <link rel="stylesheet" href="./oro-ui-override.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to gifts</a>
    <!--
      gbppl-catalog-header-1 — the site bar, in front of the bundle.

      Every address is written out. The component's defaults are page
      relative and this page stands two folders down, so nothing may be left
      to them (ORO-SKILL trap 2). catalog-href points at this page itself:
      the Gifts link and every item of its menu land on the category page,
      which is where the visitor already is, and the menu has no per-category
      key to offer the bundle yet.

      IT STANDS OUTSIDE #root, AND IT HAS TO. Two tries were measured today.
      Inside #root the bar would have been in React's earshot (the bridge
      below needs that), but createRoot() EMPTIES its container on the first
      render and the bar vanished with everything else that was in it. So it
      stands in front, where the build cannot reach it, and the bridge pays
      for that in the one way it can. See oro-header-bridge.js.
    -->
    <gb-site-header home-href="../index.html"
      logo-src="../../system/assets/gildedbox-logo.svg"
      catalog-href="index.html"
      portal-href="../portal.html"
      meeting-href="../book-a-meeting.html"
    ></gb-site-header>
    <!--
      gbppl-catalog-hero-1 — the hero band, between the bar and the app.

      The fifth piece of this page's chrome to come off the build. What stood
      here was <section class="category-hero">: 263px tall (190 at 390), the
      v1 drawing of a category opener, with the right words in the wrong band.
      It is hidden in the overlay and this element stands in front of #root
      instead, on the same argument as the bar, the floor, the advantages and
      the closing banner: live wears the system's components.

      THE COMPONENT WAS BEHIND THE LIVE, AND WAS RE-MEASURED FIRST. Until
      today <gb-catalog-hero> drew the black 354/680 band with a photograph on
      the right, which is what /catalog/products really looked like when the
      harvest was taken on 17.08. Measured again on 27.08 at nine widths the
      live band is white, 354 / 300 / 400 tall, has no image at all and
      carries a description under the title. The owner was brought up to that
      before this page was given the element -- catalog.css and catalog.js,
      both with the numbers in their own comments -- so nothing about the new
      band is patched onto this page.

      COPY, LIVE 27.08, verbatim: "Curated corporate gifts for clients, teams,
      events, and VIP moments." The live breaks the line by hand, with a <br>
      after "clients,", and so does this: in a 388px column the natural wrap
      falls into three lines instead of two. The newline inside the attribute
      is the break; every line is trimmed, so the indentation costs nothing.

      IT STANDS OUTSIDE #root, like the bar above it, and for the same reason:
      createRoot() empties its container on the first render. The sticky
      category row is unaffected -- it keeps top 0 and its 80px inside the
      app, and the hero is in ordinary flow above it, exactly where the
      build's own band was.
    -->
    <gb-catalog-hero heading="Gifts"
      subtitle="Curated corporate gifts for clients,
                teams, events, and VIP moments."></gb-catalog-hero>
    <!--
      gbppl-portal-door — the vendored catalog stands one folder below the
      studio's real portal page, so "Open Portal" leaves for it instead of
      the in-app placeholder. The address lives here, not in the build: the
      same bundle on its own Netlify host finds no attribute and keeps the
      placeholder. See readPortalHref in the app.

      gbppl-catalog-doors (2026-08-26) — data-meeting-href joins it on the
      same terms, and readHostHref in the app now reads all of them the same
      way: ?<name>= first, then the attribute on <html>, then here on #root.
      Every "Book a Meeting" in the catalog (header, Gifts menu, mobile nav,
      the sticky one in the category bar, and the Chat with us panel) used to
      leave for the production contact page in a new tab, which is a door out
      of the studio in the middle of a walk through it. Named here, it lands
      on our own booking page in the same tab instead. Absent, the production
      address stands, so the Netlify deploy of this prototype is unaffected.

      A third one is offered and deliberately NOT set: data-home-href would
      point the wordmark at ../index.html. The studio's home page is the hub
      gate, not a GildedBox home, and the catalog is the whole of the page the
      wordmark stands on, so it keeps scrolling to the top. The STUDIO tab
      below is the way back. Ton's call if that should change.
    -->
    <div
      id="root"
      data-portal-href="../portal.html"
      data-meeting-href="../book-a-meeting.html"
    ></div>
    <!--
      gbppl-catalog-prefooter-1 — the closing banner, first of the two bands
      the live category page carries above its footer.

      Ton, 2026-08-26: «https://www.gildedbox.com/catalog/products — пусть
      агенты перенесут 2 секции над футером: у нас их нет или кривые, но
      пусть уберут баги градиента, как есть на лайве».

      Measured on the live page the same day at 390 / 768 / 1280 / 1440 /
      1920 / 2258: above footer.footer stand section.bannersConversation
      (y 9525, h 528) and section.singleWithIconSimple (y 10053, h 528), in
      that order. The second already stands here, since gbppl-catalog-
      advantages-1. This is the first, and Ton-6 answers it in one line: it
      is not a new section, it is <gb-banner-conversation>, the sixth section
      of the home zone, which live/index.html has worn since 18.08. Nothing
      is drawn again, and catalog.css gains nothing.

      Only the words differ between the two live pages, and words are
      content, so they arrive as attributes. Live home says «Impressive Gifts
      | Your Brand»; live /catalog/products says «Iconic | Corporate
      Gifting». Subtitle and CTA label are the same sentence on both. The
      pill / rest split is the live markup's own: a <span> in a white box,
      then the rest of the line in plain serif.

      COPY, LIVE 26.08, verbatim, Title Case kept. Ton-9 transforms incoming
      copy, but this is not incoming copy: it is the client's own published
      wording on the very page being reproduced, and the whole live marketing
      voice is Title Case. Lower-casing it here would stand a sentence-case
      banner beside the Title Case one on the home page — the mixed-case
      fault Ton-9 exists to prevent. Sentence case for these two banners is a
      copy decision for Ton and Shannon, taken on both pages at once, not a
      lint fix taken here. Flagged in the report.

      href points at this page. On the live page the same link is
      /catalog/products with router-link-exact-active, i.e. it leads where
      the visitor already is. Left as the live has it.

      THE GRADIENT DEFECT IS FIXED AT THE OWNER, not here: home.css section
      6 carries the measurement and the reason the gradient became a flat
      token. Nothing about it is patched onto this page.

      The bundle has no version of this band to hide, curved or otherwise:
      neither bannersConversation nor singleWithIconSimple appears anywhere
      in its js or css (grep, 26.08). The one dark band it did draw was
      section.experience, already hidden by the overlay one wave ago.
    -->
    <gb-banner-conversation pill="Iconic" rest="Corporate Gifting"
      subtitle="For The Select Few, Envied By Most, Coveted By All"
      cta="Discover Gifts" href="index.html"></gb-banner-conversation>
    <!--
      gbppl-catalog-advantages-1 — the real advantages band, in place of the
      bundle's.

      Ton, 2026-08-26, on what stood here: «кривая, не настоящая». The build
      draws four columns over near black with chess and card characters typed
      as text where the icons should be, and a fourth column the live site
      does not have. Hidden in the overlay; this is the section the live site
      really carries, and the system owns it.

      It is the same element, with the same three children, the same
      attributes and the same words as live/index.html. Nothing is retyped
      for this page and nothing is re-addressed either: the glyphs come from
      the Nucleo face declared in home.css, and that url resolves against the
      stylesheet, so the extra folder of depth changes nothing here.

      Place: between #root and the footer, which is where it stands on the
      home page and where the bundle's own stood on this one. Outside #root,
      like the bar and the floor, because createRoot() empties its container.

      gbppl-catalog-prefooter-1 (26.08) — AND IT STAYS LIGHT, which is a
      deviation from the live CATEGORY page and not from the live site. The
      same live section is light #F6F6F6 on the home page and near black on
      /catalog/products: there its dark: variants switch on and paint
      linear-gradient(to right, rgba(0,0,0,.9), #000) over the light ground,
      although <html> carries no dark class and the scheme is light. One
      component, two grounds on two pages of one site. We wear the one
      calibrated against the home page, and that also removes the worse of
      the two bandings Julia circled: the dark variant stepped twenty five
      flat stripes of 57px (1440) and 76px (1920) across the width, because
      #181818 → #000000 is twenty five values of 8-bit grey and Chrome
      cannot dither pure greys. See home.css section 7.
    -->
    <gb-advantages>
      <gb-advantage icon="present" live-icon="present" heading="Custom Gift Box">Each gift starts with an individually designed gift box.</gb-advantage>
      <gb-advantage icon="exchange" live-icon="gift-exchange" heading="Personalized Gifts">Personalization for every recipient means each gift is unique.</gb-advantage>
      <gb-advantage icon="monitor" live-icon="pc-monitor" heading="Gifting Portal">Send gifts to individuals, run and manage gifting campaigns.</gb-advantage>
    </gb-advantages>
    <!--
      gbppl-catalog-header-1 — and the site floor, behind it. The bundle
      draws a dark three column footer of its own; the site's footer is a
      component we already own and every other live page wears it. Same
      argument as the bar above, and the swap is as clean: the bundle renders
      its footer once, at the end of #top and outside every view switch, so
      hiding it takes nothing else with it. footer.css is scoped under
      gb-site-footer, so it cannot reach the bundle's .footer* classes on the
      way past.
    -->
    <!--
      gbppl-prefooter-light-1 (2026-08-26) — THE SANDBOX SWITCH OF THE TWO
      CLOSING BANDS. Julia on the live category page: «we should change
      bottom part of the page (before footer), it doesn't look good»;
      Russell: «yes, that looks bad», «we need to reduce the white space» →
      Julia: «black» → Russell: «sure, blackspace». Ton's order: «попробовать
      сделать инверсию этих компонентов (цветовую, светлыми)... сделать
      варианты с инверсией, чтобы они были светлые».

      ?prefooter=light turns both modifiers on. They are declared in the
      owner, home.css, and the page only names them: tone="light" inverts
      the banner's colour, density="compact" tightens the rhythm of both.
      Nothing here paints anything, and nothing is switched on the home
      page: light there is a separate decision, not this one.

      The script runs before home.js, so the attributes are in place when
      the elements upgrade and the sections are stamped once, in the shape
      they are meant to have. Registered for the panel in
      system/sandbox-registry.js under page catalog.
    -->
    <script>
      (function () {
        if (new URLSearchParams(location.search).get('prefooter') !== 'light') return;
        var banner = document.querySelector('gb-banner-conversation');
        var advantages = document.querySelector('gb-advantages');
        if (banner) { banner.setAttribute('tone', 'light'); banner.setAttribute('density', 'compact'); }
        if (advantages) advantages.setAttribute('density', 'compact');
      })();
    </script>
    <gb-site-footer></gb-site-footer>
    <!--
      gbppl-catalog-mark-1 — and the other half of the key, one line per
      organism. Under ?nav=mark the five elements this wrapper adds are taken
      out of the DOM entirely rather than hidden: none of them is defined yet
      (their scripts are below), so removed here they never upgrade, the bar
      never becomes sticky, and the header bridge finds nothing to move and
      says so itself. display:none would have left five custom elements alive
      in the page for the console and Dev mode to name.

      The studio's own layer is untouched: the panel below, the guard in the
      head, the gate and Dev mode are on both views.
    -->
    <script>
      (function () {
        if (!document.documentElement.classList.contains('gbppl-nav-native')) return;
        ['gb-site-header', 'gb-catalog-hero', 'gb-banner-conversation', 'gb-advantages', 'gb-site-footer']
          .forEach(function (name) {
            var el = document.querySelector(name);
            if (el && el.parentNode) el.parentNode.removeChild(el);
          });
      })();
    </script>
    <!-- The way back to the studio, same tab and same four doors as every
         other page. page="catalog" is what draws the "Sandbox · this page"
         section out of the registry (none registered yet, and the panel says
         so out loud). -->
    <gb-studio-panel data-root="../../" page="catalog"></gb-studio-panel>
    <script src="../../system/components/header.js"></script>
    <!-- gbppl-header-auth-2. auth.js comes with header.js the same way
         auth.css already comes with comments.css: the sign in drawer of the
         bar (?hdr=auth) is <gb-auth-flow> itself, and the element is defined
         here. It registers three custom elements and does nothing else, so a
         page that carries none of them is unchanged by it. -->
    <script src="../../system/components/auth.js"></script>
    <script src="../../system/components/footer.js"></script>
    <script src="../../system/type-scale.js"></script>
    <script src="../../system/components/drawer.js"></script>
    <script src="../../system/components/inspect.js"></script>
    <script src="../../system/components/comments.js"></script>
    <script src="../../system/components/home.js"></script>
    <!-- gbppl-catalog-hero-1: registers the four catalog-zone elements; this
         page uses one of them, the hero above #root. -->
    <script src="../../system/components/catalog.js"></script>
    <!-- The two glyphs the bundle's header owned and nothing else offers:
         account and search. Wrapper concern, temporary, see the file. -->
    <script src="./oro-header-bridge.js"></script>
    <script src="../../system/sandbox-registry.js"></script>
    <script src="../../system/components/icon.js"></script>
    <script src="../../system/components/studio-panel.js"></script>
  </body>
</html>
