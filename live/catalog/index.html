<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- gbppl-gate-2: one code on every page of the studio; the guard runs before the bundle paints. -->
    <script src="../../system/components/studio.js" data-home="../../index.html"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Interactive GildedBox category and AI Gift Concierge prototype"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GildedBox · Gift Concierge" />
    <meta
      property="og:description"
      content="Interactive concept for a faster, more personal way to find the right corporate gift."
    />
    <link rel="icon" href="./assets/brand/gildedbox-logo.svg" type="image/svg+xml" />
    <!-- gbppl-catalog-header-1: copy-lint on the way past. Both titles carried
         an em dash, which the prototype does not use anywhere (separator "·"). -->
    <title>GildedBox · Gift Concierge Prototype</title>
    <script type="module" crossorigin src="./assets/index-CosrF-zM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B68sqkur.css">
    <!--
      gbppl-catalog-drawer-tempo — the drawers of this vendored v1 build are
      retimed to the prototype's motion language (studio/system/MOTION.md).
      The build's own css above is minified output and is never hand-edited;
      the retiming rides on top, last stylesheet in, scoped to ?embed=1.
    -->
    <link rel="stylesheet" href="./oro-motion-override.css">
    <!--
      gbppl-badge-one — the count badges of this vendored build are brought
      onto the prototype's one badge (studio/system/tokens.css, COUNT BADGE).
      Same arrangement as the overlay above and for the same reason: the
      build's own css is minified output and is never hand-edited. Kept apart
      from the motion file on purpose -- one is tempo, this one is ui. Scoped
      to ?embed=1 too, so direct /catalog/ stays the untouched reference.

      2026-08-26: the build caught up. The badge below now lives in v1's own
      styles.css, so these rules restate a bundle that already agrees with
      them and are kept only as the record of where the numbers came from.
      Read the file's own header before changing either side.

      gbppl-catalog-header-1: the link to that file moved to the FOOT of this
      head. It now also carries the rules that hide the bundle's own header
      and repair the token names tokens.css takes off the bundle, and both
      jobs need it to be the last stylesheet in.
    -->
    <!--
      gbppl-catalog-exit — the vendored catalog was the one room of the
      studio with no door back: its own header offers Gifts, Solutions and
      Our Story, and "Book a Meeting" leaves for the production site, so a
      visitor who arrived from the hub had nothing to click but the browser's
      back arrow. The STUDIO tab that every other page carries is added here
      as a wrapper concern, not a build one: the panel is a standalone custom
      element in light DOM and tokens.css declares nothing but :root
      variables, so the bundle below is untouched and a rebuild does not have
      to know about either file. Fixing anything INSIDE the bundle still
      means rebuilding it in the ai-consierge repo.
    -->
    <link rel="stylesheet" href="../../system/assets/tokens.css">
    <link rel="stylesheet" href="../../system/components/studio-panel.css">
    <!--
      gbppl-catalog-header-1 — THE CHROME OF THIS PAGE IS THE SITE'S CHROME.

      Ton, 2026-08-26: «когда мы заходим на Gifts, у нас версия Live висит с
      хедером от версии Sandbox: ненастоящий хедер. Кнопка Book a Meeting
      другая, меню и дропдаун вообще другие. Большая проблема».

      He is right, and the fix is Ton-6 and Ton-8 in one line: live wears the
      system's components, and the system already owns this bar. The bundle
      below draws a header of its own (Gifts / Solutions / Our Story, a black
      Book a Meeting with a calendar glyph, its own mega menu). It is hidden
      by the overlay at the foot of this head, and <gb-site-header> stands in
      front of #root in the body instead — the same element, with the same
      four addresses written out, that live/index.html and live/checkout.html
      carry.

      Four stylesheets, and each one is needed by that element, not by the
      catalogue: shell for .gb-container, button for the .gb-btn family the
      bar's right pocket wears, header for the bar itself, footer for the
      site footer that replaces the bundle's (same argument, one floor down).
      They come AFTER the build's css on purpose — where a bare-element rule
      of the bundle (a, button, *) meets one of ours at equal weight, ours
      has to win — and they are scoped to .gb-*, gb-site-header and
      gb-site-footer, so nothing in them reaches the catalogue.

      What the page does NOT take is body.gb-demo. That class carries the
      demo body's ground, font and link colour, and the bundle brings its
      own; the header needs none of it.
    -->
    <link rel="stylesheet" href="../../system/components/shell.css">
    <link rel="stylesheet" href="../../system/components/button.css">
    <link rel="stylesheet" href="../../system/components/header.css">
    <link rel="stylesheet" href="../../system/components/footer.css">
    <!--
      gbppl-catalog-advantages-1 — and a fifth, for the advantages band that
      now stands above that footer. home.css is the home zone's stylesheet and
      it is scoped through and through: every selector in it, inside the media
      queries included, is prefixed .gbhm*, so nothing in it reaches the
      catalogue and no host wrapper is needed. What it does bring are its two
      local @font-face declarations, LogoFont and Nucleo. Nucleo is exactly
      what the three glyphs of this section are drawn in, and the urls inside
      resolve against the stylesheet, not against this page, so the depth
      costs nothing. The bundle declares none of the names the section reads
      (--home-advantages-bg, --catalog-ink, the four --container-* and
      --font-serif), so the collision that bit --space-* at the foot of this
      head does not repeat here.
    -->
    <!-- gbppl-inspect-1: Dev mode on the catalog, same six lines every studio page carries. -->
    <link rel="stylesheet" href="../../system/components/drawer.css">
    <link rel="stylesheet" href="../../system/components/docs.css">
    <link rel="stylesheet" href="../../system/components/inspect.css">
    <link rel="stylesheet" href="../../system/components/home.css">
    <!-- Last stylesheet in: it overrides the build AND repairs the three
         --space-* names tokens.css takes off it. See the file's own head. -->
    <link rel="stylesheet" href="./oro-ui-override.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to gifts</a>
    <!--
      gbppl-catalog-header-1 — the site bar, in front of the bundle.

      Every address is written out. The component's defaults are page
      relative and this page stands two folders down, so nothing may be left
      to them (ORO-SKILL trap 2). catalog-href points at this page itself:
      the Gifts link and every item of its menu land on the category page,
      which is where the visitor already is, and the menu has no per-category
      key to offer the bundle yet.

      IT STANDS OUTSIDE #root, AND IT HAS TO. Two tries were measured today.
      Inside #root the bar would have been in React's earshot (the bridge
      below needs that), but createRoot() EMPTIES its container on the first
      render and the bar vanished with everything else that was in it. So it
      stands in front, where the build cannot reach it, and the bridge pays
      for that in the one way it can. See oro-header-bridge.js.
    -->
    <gb-site-header home-href="../index.html"
      logo-src="../../system/assets/gildedbox-logo.svg"
      catalog-href="index.html"
      portal-href="../portal.html"
      meeting-href="../book-a-meeting.html"
    ></gb-site-header>
    <!--
      gbppl-portal-door — the vendored catalog stands one folder below the
      studio's real portal page, so "Open Portal" leaves for it instead of
      the in-app placeholder. The address lives here, not in the build: the
      same bundle on its own Netlify host finds no attribute and keeps the
      placeholder. See readPortalHref in the app.

      gbppl-catalog-doors (2026-08-26) — data-meeting-href joins it on the
      same terms, and readHostHref in the app now reads all of them the same
      way: ?<name>= first, then the attribute on <html>, then here on #root.
      Every "Book a Meeting" in the catalog (header, Gifts menu, mobile nav,
      the sticky one in the category bar, and the Chat with us panel) used to
      leave for the production contact page in a new tab, which is a door out
      of the studio in the middle of a walk through it. Named here, it lands
      on our own booking page in the same tab instead. Absent, the production
      address stands, so the Netlify deploy of this prototype is unaffected.

      A third one is offered and deliberately NOT set: data-home-href would
      point the wordmark at ../index.html. The studio's home page is the hub
      gate, not a GildedBox home, and the catalog is the whole of the page the
      wordmark stands on, so it keeps scrolling to the top. The STUDIO tab
      below is the way back. Ton's call if that should change.
    -->
    <div
      id="root"
      data-portal-href="../portal.html"
      data-meeting-href="../book-a-meeting.html"
    ></div>
    <!--
      gbppl-catalog-advantages-1 — the real advantages band, in place of the
      bundle's.

      Ton, 2026-08-26, on what stood here: «кривая, не настоящая». The build
      draws four columns over near black with chess and card characters typed
      as text where the icons should be, and a fourth column the live site
      does not have. Hidden in the overlay; this is the section the live site
      really carries, and the system owns it.

      It is the same element, with the same three children, the same
      attributes and the same words as live/index.html. Nothing is retyped
      for this page and nothing is re-addressed either: the glyphs come from
      the Nucleo face declared in home.css, and that url resolves against the
      stylesheet, so the extra folder of depth changes nothing here.

      Place: between #root and the footer, which is where it stands on the
      home page and where the bundle's own stood on this one. Outside #root,
      like the bar and the floor, because createRoot() empties its container.
    -->
    <gb-advantages>
      <gb-advantage icon="present" live-icon="present" heading="Custom Gift Box">Each gift starts with an individually designed gift box.</gb-advantage>
      <gb-advantage icon="exchange" live-icon="gift-exchange" heading="Personalized Gifts">Personalization for every recipient means each gift is unique.</gb-advantage>
      <gb-advantage icon="monitor" live-icon="pc-monitor" heading="Gifting Portal">Send gifts to individuals, run and manage gifting campaigns.</gb-advantage>
    </gb-advantages>
    <!--
      gbppl-catalog-header-1 — and the site floor, behind it. The bundle
      draws a dark three column footer of its own; the site's footer is a
      component we already own and every other live page wears it. Same
      argument as the bar above, and the swap is as clean: the bundle renders
      its footer once, at the end of #top and outside every view switch, so
      hiding it takes nothing else with it. footer.css is scoped under
      gb-site-footer, so it cannot reach the bundle's .footer* classes on the
      way past.
    -->
    <gb-site-footer></gb-site-footer>
    <!-- The way back to the studio, same tab and same four doors as every
         other page. page="catalog" is what draws the "Sandbox · this page"
         section out of the registry (none registered yet, and the panel says
         so out loud). -->
    <gb-studio-panel data-root="../../" page="catalog"></gb-studio-panel>
    <script src="../../system/components/header.js"></script>
    <script src="../../system/components/footer.js"></script>
    <script src="../../system/type-scale.js"></script>
    <script src="../../system/components/drawer.js"></script>
    <script src="../../system/components/inspect.js"></script>
    <script src="../../system/components/home.js"></script>
    <!-- The two glyphs the bundle's header owned and nothing else offers:
         account and search. Wrapper concern, temporary, see the file. -->
    <script src="./oro-header-bridge.js"></script>
    <script src="../../system/sandbox-registry.js"></script>
    <script src="../../system/components/studio-panel.js"></script>
  </body>
</html>
