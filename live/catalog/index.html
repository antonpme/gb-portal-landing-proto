<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- gbppl-gate-2: one code on every page of the studio; the guard runs before the bundle paints. -->
    <script src="../../system/components/studio.js" data-home="../../index.html"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Interactive GildedBox category and AI Gift Concierge prototype"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GildedBox — Gift Concierge" />
    <meta
      property="og:description"
      content="Interactive concept for a faster, more personal way to find the right corporate gift."
    />
    <link rel="icon" href="./assets/brand/gildedbox-logo.svg" type="image/svg+xml" />
    <title>GildedBox — Gift Concierge Prototype</title>
    <script type="module" crossorigin src="./assets/index-CosrF-zM.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B68sqkur.css">
    <!--
      gbppl-catalog-drawer-tempo — the drawers of this vendored v1 build are
      retimed to the prototype's motion language (studio/system/MOTION.md).
      The build's own css above is minified output and is never hand-edited;
      the retiming rides on top, last stylesheet in, scoped to ?embed=1.
    -->
    <link rel="stylesheet" href="./oro-motion-override.css">
    <!--
      gbppl-badge-one — the count badges of this vendored build are brought
      onto the prototype's one badge (studio/system/tokens.css, COUNT BADGE).
      Same arrangement as the overlay above and for the same reason: the
      build's own css is minified output and is never hand-edited. Kept apart
      from the motion file on purpose -- one is tempo, this one is ui. Scoped
      to ?embed=1 too, so direct /catalog/ stays the untouched reference.

      2026-08-26: the build caught up. The badge below now lives in v1's own
      styles.css, so these rules restate a bundle that already agrees with
      them and are kept only as the record of where the numbers came from.
      Read the file's own header before changing either side.
    -->
    <link rel="stylesheet" href="./oro-ui-override.css">
    <!--
      gbppl-catalog-exit — the vendored catalog was the one room of the
      studio with no door back: its own header offers Gifts, Solutions and
      Our Story, and "Book a Meeting" leaves for the production site, so a
      visitor who arrived from the hub had nothing to click but the browser's
      back arrow. The STUDIO tab that every other page carries is added here
      as a wrapper concern, not a build one: the panel is a standalone custom
      element in light DOM and tokens.css declares nothing but :root
      variables, so the bundle below is untouched and a rebuild does not have
      to know about either file. Fixing anything INSIDE the bundle still
      means rebuilding it in the ai-consierge repo.
    -->
    <link rel="stylesheet" href="../../system/assets/tokens.css">
    <link rel="stylesheet" href="../../system/components/studio-panel.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to gifts</a>
    <!--
      gbppl-portal-door — the vendored catalog stands one folder below the
      studio's real portal page, so "Open Portal" leaves for it instead of
      the in-app placeholder. The address lives here, not in the build: the
      same bundle on its own Netlify host finds no attribute and keeps the
      placeholder. See readPortalHref in the app.

      gbppl-catalog-doors (2026-08-26) — data-meeting-href joins it on the
      same terms, and readHostHref in the app now reads all of them the same
      way: ?<name>= first, then the attribute on <html>, then here on #root.
      Every "Book a Meeting" in the catalog (header, Gifts menu, mobile nav,
      the sticky one in the category bar, and the Chat with us panel) used to
      leave for the production contact page in a new tab, which is a door out
      of the studio in the middle of a walk through it. Named here, it lands
      on our own booking page in the same tab instead. Absent, the production
      address stands, so the Netlify deploy of this prototype is unaffected.

      A third one is offered and deliberately NOT set: data-home-href would
      point the wordmark at ../index.html. The studio's home page is the hub
      gate, not a GildedBox home, and the catalog is the whole of the page the
      wordmark stands on, so it keeps scrolling to the top. The STUDIO tab
      below is the way back. Ton's call if that should change.
    -->
    <div
      id="root"
      data-portal-href="../portal.html"
      data-meeting-href="../book-a-meeting.html"
    ></div>
    <!-- The way back to the studio, same tab and same four doors as every
         other page. page="catalog" is what draws the "Sandbox · this page"
         section out of the registry (none registered yet, and the panel says
         so out loud). -->
    <gb-studio-panel data-root="../../" page="catalog"></gb-studio-panel>
    <script src="../../system/sandbox-registry.js"></script>
    <script src="../../system/components/studio-panel.js"></script>
  </body>
</html>
