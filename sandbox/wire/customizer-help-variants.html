<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>Mockup · Customizer help, five variants · GildedBox Design Studio</title>
<!-- ============================================================
     gbppl-customizer-help-variants-1 (30.09.2026). MOCKUP for a
     brainstorm with Ton, not a page. The question is the help element
     under NEXT on Your Design (Ton 30.09 20:21: «Get help looks
     deliberately the smallest text on the page»).
     Five variants, each at REAL size in two frames. Each frame is an
     iframe of THIS file (?f=desk|phone&v=A..E) so its own viewport
     drives the button ladder: the desktop frame is a 1280 viewport
     clipped to the 620 panel (large = 56, medium = 42, small = 36),
     the phone frame is a 390 viewport (large = 48, medium = 36,
     small = 32), whatever screen the page is opened on.
     Buttons and glyphs are the system's (button.css, icon.js). The
     panel furniture (stepper, tiles, colour tiles) is a page-only copy
     of the sandbox customizer (start-227-assets sb.css / cz.css).
     ============================================================ -->
<script>
  var GBQ = new URLSearchParams(location.search);
  var GBF = GBQ.get('f'), GBV = GBQ.get('v') || 'A';
  if (GBF) document.documentElement.classList.add('is-frame', 'is-' + GBF);
  else {
    var s = document.createElement('script');
    s.src = '../../system/components/studio.js';
    s.setAttribute('data-home', '../../index.html');
    document.head.appendChild(s);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../system/assets/tokens.css">
<link rel="stylesheet" href="../../system/components/icon.css">
<link rel="stylesheet" href="../../system/components/button.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-sans); color: var(--zinc-900); background: var(--white); -webkit-font-smoothing: antialiased; }
  p, h1, h2, h3 { margin: 0; }

  /* ---------- THE BOARD (top level) ---------- */
  .hv { max-width: 1216px; margin: 0 auto; padding: var(--space-48) var(--space-32) var(--space-64); }
  .hv-head h1 { font-size: 24px; line-height: 32px; font-weight: 500; }
  .hv-rec { margin-top: var(--space-16); padding: var(--space-16); background: var(--blue-50); border-radius: var(--radius); font-size: 16px; line-height: 24px; color: var(--zinc-900); }
  .hv-rec b { font-weight: 600; }
  .hv-var { margin-top: var(--space-64); }
  .hv-var h2 { font-size: 20px; line-height: 28px; font-weight: 500; }
  .hv-frames { display: flex; flex-wrap: wrap; gap: var(--space-48); margin-top: var(--space-16); align-items: flex-start; }
  .hv-frame { flex: 0 0 auto; max-width: 100%; }
  .hv-cap { font-size: 14px; line-height: 20px; color: var(--zinc-600); margin-bottom: var(--space-8); }
  .hv-clip { overflow: hidden; border: 1px solid var(--zinc-200); border-radius: var(--radius); background: #F7F7F7; }
  .hv-clip--desk { width: 622px; max-width: 100%; overflow-x: auto; }
  .hv-clip--desk .hv-win { width: 620px; height: 820px; overflow: hidden; position: relative; }
  .hv-clip--desk iframe { position: absolute; left: -660px; top: 0; width: 1280px; height: 820px; border: 0; display: block; }
  .hv-clip--phone { width: 392px; max-width: 100%; }
  .hv-clip--phone iframe { width: 390px; height: 844px; border: 0; display: block; }
  .hv-notes { margin-top: var(--space-16); display: grid; gap: var(--space-8); max-width: 1058px; font-size: 16px; line-height: 24px; color: var(--zinc-700); }
  .hv-notes b { color: var(--zinc-900); font-weight: 600; }
  @media (max-width: 767px) { .hv { padding: var(--space-32) var(--space-16) var(--space-48); } }

  /* ---------- THE FRAME (inside the iframes) ---------- */
  .is-frame body { background: #141414; overflow: hidden; }
  .pn { background: #F7F7F7; display: flex; flex-direction: column; }         /* NO TOKEN: live panel ground, harvest 28.09 */
  .is-desk .pn { position: absolute; top: 0; right: 0; width: 620px; height: 100vh; }
  .is-desk .pn-scroll { padding: var(--space-48) var(--space-48) 0; }
  .is-desk .pn-foot { padding: var(--space-16) var(--space-48) var(--space-48); margin-top: auto; }
  .is-phone .pn { position: absolute; left: 0; right: 0; bottom: 0; height: 50vh; background: var(--zinc-50); border-radius: 30px 30px 0 0; box-shadow: 0 -3px 8px rgba(0,0,0,.07); }
  .is-phone .pn-grab { height: 44px; display: grid; place-items: center; flex: 0 0 auto; }
  .is-phone .pn-grab span { width: 36px; height: 4px; border-radius: 2px; background: var(--zinc-300); }
  .is-phone .pn-scroll { padding: 0 var(--space-16); flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .is-phone .pn-foot { flex: 0 0 auto; padding: 12px var(--space-16) var(--space-8); border-top: 1px solid var(--zinc-200); background: var(--zinc-50); }
  .is-phone .pn-scene-note { position: absolute; top: 25vh; left: 0; right: 0; transform: translateY(-50%); text-align: center; color: var(--zinc-500); font-size: 14px; }
  .is-desk .pn-scene-note { position: absolute; top: 50%; left: 330px; transform: translate(-50%, -50%); color: var(--zinc-500); font-size: 14px; }

  .pn-head { display: flex; flex-direction: column; align-items: center; gap: var(--space-16); position: relative; }
  .is-phone .pn-head { gap: var(--space-8); }
  .pn-stepper { display: flex; align-items: center; }
  .pn-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--zinc-400); }
  .pn-dot.is-on { border-color: var(--zinc-900); }
  .pn-line { width: 84px; height: 1px; background: var(--zinc-300); }
  .is-phone .pn-dot { width: 8px; height: 8px; }
  .is-phone .pn-line { width: 84px; }
  .pn-steps { position: relative; width: 192px; height: 18px; font-size: 11px; color: var(--zinc-400); margin-top: -4px; }
  .is-desk .pn-steps { width: 204px; margin-top: -2px; }
  .pn-steps span { position: absolute; left: 4px; transform: translateX(-50%); }
  .pn-steps span:nth-child(2) { left: 50%; }
  .pn-steps span:nth-child(3) { left: calc(100% - 4px); }
  .pn-steps .is-on { color: var(--zinc-900); }
  .pn-title { width: 100%; height: 40px; display: flex; align-items: center; justify-content: space-between; }
  .pn-title > b { font-size: 16px; font-weight: 600; letter-spacing: .5px; color: var(--zinc-500); }
  .is-phone .pn-title > b { font-size: 12px; }
  .pn-arrow { width: 40px; height: 40px; display: grid; place-items: center; color: var(--zinc-900); }
  .pn-arrow.is-off { opacity: .3; }
  .pn-arrow.is-back .gb-icon { transform: rotate(180deg); }
  .pn-headhelp { position: absolute; right: 0; top: -12px; }                 /* D: the ghost lands on the step line */
  .is-phone .pn-headhelp { top: -16px; right: -4px; }

  .pn-choose { margin-top: var(--space-32); font-size: 20px; line-height: 28px; font-weight: 300; letter-spacing: 2px; color: var(--zinc-900); }
  .is-phone .pn-choose { margin-top: var(--space-24); font-size: 14px; line-height: 21px; }
  .pn-grid { margin-top: var(--space-16); display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-16); }
  .is-phone .pn-grid { gap: 12px; }
  .pn-tile { aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; box-shadow: inset 0 0 0 3px var(--zinc-100); position: relative; }
  .pn-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pn-tile.is-on { box-shadow: 0 1px 8px 3px rgba(0,0,0,.3); }
  .pn-tile.is-on::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius); box-shadow: inset 0 0 0 3px var(--zinc-900); }

  .pn-colors { margin-top: var(--space-32); display: flex; flex-direction: column; gap: var(--space-16); }
  .pn-colors h3 { font-size: 18px; line-height: 27px; font-weight: 300; letter-spacing: 2px; }
  .is-phone .pn-colors h3 { font-size: 14px; line-height: 21px; }
  .pn-crow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .is-phone .pn-crow { gap: var(--space-8); }
  .pn-sw { width: 24px; height: 24px; border-radius: 3px; border: 1px solid rgba(0,0,0,.1); display: block; }
  .pn-ctile.gb-btn { padding-left: var(--space-8); padding-right: 12px; }
  .pn-dna { margin-left: auto; }
  .is-phone .pn-dna { margin-left: 0; }

  .pn-next-copy { font-size: 14px; line-height: 21px; color: var(--zinc-600); text-align: center; margin-bottom: 12px; }
  .pn-next-copy strong { font-weight: 500; color: var(--zinc-900); }
  .is-phone .pn-next-copy { display: none; }                                 /* as live: the phone foot drops the line */

  /* A. secondary under NEXT */
  .pn--a .pn-help { margin-top: 12px; }
  /* B. one row */
  .v-b-row { display: flex; gap: 12px; }
  .v-b-row .v-b-help { flex: 0 0 calc(40% - 6px); min-width: 0; }
  .v-b-row .v-b-next { flex: 1 1 0; width: auto; }
  /* C. the advisor */
  .v-c { margin-top: var(--space-24); padding-top: var(--space-24); border-top: 1px solid var(--zinc-200); display: flex; align-items: center; gap: 12px; }
  .is-phone .v-c { margin-top: 12px; padding-top: 12px; }
  .v-c-face { flex: 0 0 40px; width: 40px; height: 40px; border-radius: var(--radius-circle); background: var(--zinc-100); border: 1px solid var(--zinc-200); display: grid; place-items: center; font-size: 14px; font-weight: 600; color: var(--zinc-900); }
  .v-c-text { flex: 1 1 auto; min-width: 0; }
  .v-c-who { font-size: 14px; line-height: 20px; color: var(--zinc-600); }
  .v-c-ask { font-size: 16px; line-height: 24px; color: var(--zinc-900); }
  /* E. the card, honest */
  .v-e { margin-top: var(--space-16); display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px var(--space-16); border: 1px solid var(--zinc-200); border-radius: var(--radius); }
  .is-phone .v-e { margin-top: 12px; }
  .v-e > .gb-icon { color: var(--zinc-700); flex: 0 0 auto; }
  .v-e-text { flex: 1 1 auto; min-width: 0; font-size: 16px; line-height: 24px; color: var(--zinc-700); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  var PHONE = GBF === 'phone';
  var root = document.getElementById('root');

  var VARIANTS = [
    { k: 'A', name: 'Secondary button under NEXT',
      for: 'One primary, one clear secondary. The live label, the live place. Reads as a button at a glance.',
      against: 'One more full-width row on the phone (36 + 12). The medium label is small caps: if it reads small, take the large rung, as live does.',
      russell: '"Good, that is our HELP WITH MY DESIGN. Keep it."' },
    { k: 'B', name: 'One row, two roles',
      for: 'The standard wizard footer. The phone saves a whole row.',
      against: 'Help stands as tall as NEXT, so the two compete. The live label fills its half with no air on desktop and does not fit the phone: there it becomes GET HELP.',
      russell: '"Why is help the same size as next?"' },
    { k: 'C', name: 'The advisor',
      for: 'The human face of the expert service. The strongest sell of "we design it for you".',
      against: 'The heaviest foot on the phone. Brad exists only in the portal: a guest in the customizer has no advisor, and there is no photo yet.',
      russell: '"I like a person there. Whose face, for a guest?"' },
    { k: 'D', name: 'Help in the panel head',
      for: 'Always there, far from NEXT. The foot stays clean. The phone foot is the smallest.',
      against: 'Out of sight at the moment of doubt. On the phone it shrinks to a glyph with no word.',
      russell: '"Nobody will find it up there."' },
    { k: 'E', name: 'The current card, made honest',
      for: 'Keeps the pitch sentence ("want our designers to do it?") and gains a real button.',
      against: 'Still a box of text beside a button: two things to read, and the card competes with NEXT for the eye.',
      russell: '"Still a box. Just make it a button."' }
  ];

  var ic = function (name, size, cls) { return '<span class="' + (cls || '') + '" data-gb-icon="' + name + '" data-gb-icon-size="' + size + '"></span>'; };
  var btnIcon = function (name, size) { return '<span class="gb-btn__icon" aria-hidden="true"><span data-gb-icon="' + name + '" data-gb-icon-size="' + size + '"></span></span>'; };
  var label = function (t) { return '<span class="gb-btn__label">' + t + '</span>'; };
  var NEXT = '<button type="button" class="gb-btn gb-btn--large gb-btn--filled gb-btn--primary gb-btn--block">' + label('Next') + btnIcon('arrow-right', PHONE ? 16 : 20) + '</button>';

  /* ---------- THE BOARD ---------- */
  if (!GBF) {
    var here = location.pathname.split('/').pop() || 'customizer-help-variants.html';
    var html = '<main class="hv"><header class="hv-head"><h1>Customizer, Your Design: the help under NEXT</h1>' +
      '<p class="hv-rec"><b>Recommendation: A.</b> It is the live pattern (HELP WITH MY DESIGN under NEXT), outline and one rung smaller so NEXT stays the one primary, it reads as a button at a glance, and the phone pays one short row.</p></header>';
    VARIANTS.forEach(function (v) {
      html += '<section class="hv-var" id="v-' + v.k + '"><h2>' + v.k + ' · ' + v.name + '</h2><div class="hv-frames">' +
        '<div class="hv-frame"><p class="hv-cap">Desktop, panel 620 at 1280</p><div class="hv-clip hv-clip--desk"><div class="hv-win"><iframe title="' + v.k + ' desktop" src="' + here + '?f=desk&v=' + v.k + '"></iframe></div></div></div>' +
        '<div class="hv-frame"><p class="hv-cap" data-foot="' + v.k + '">Phone, 390</p><div class="hv-clip hv-clip--phone"><iframe title="' + v.k + ' phone" data-phone="' + v.k + '" src="' + here + '?f=phone&v=' + v.k + '"></iframe></div></div>' +
        '</div><div class="hv-notes"><p><b>For:</b> ' + v.for + '</p><p><b>Against:</b> ' + v.against + '</p><p><b>Russell, likely:</b> ' + v.russell + '</p></div></section>';
    });
    root.innerHTML = html + '</main>';
    /* The phone budget, measured inside each phone frame. */
    Array.prototype.forEach.call(document.querySelectorAll('iframe[data-phone]'), function (f) {
      f.addEventListener('load', function () {
        try {
          var d = f.contentDocument, foot = d.querySelector('.pn-foot'), scroll = d.querySelector('.pn-scroll');
          document.querySelector('[data-foot="' + f.dataset.phone + '"]').textContent =
            'Phone, 390 · pinned foot ' + Math.round(foot.getBoundingClientRect().height) + ' px, content window ' + Math.round(scroll.getBoundingClientRect().height) + ' px';
        } catch (e) {}
      });
    });
    return;
  }

  /* ---------- ONE FRAME ---------- */
  var v = GBV;
  var helpHead = v === 'D'
    ? (PHONE
        ? '<button type="button" class="gb-btn gb-btn--icon gb-btn--small gb-btn--ghost gb-btn--secondary pn-headhelp" aria-label="Help">' + btnIcon('chat', 20) + '</button>'
        : '<button type="button" class="gb-btn gb-btn--small gb-btn--ghost gb-btn--secondary pn-headhelp">' + btnIcon('chat', 18) + label('Help') + '</button>')
    : '';
  var tiles = [1, 2, 3].map(function (n) { return '<div class="pn-tile' + (n === 1 ? ' is-on' : '') + '"><img src="../../assets/models/start227/art-' + n + '-lid.webp" alt=""></div>'; }).join('');
  var ctile = function (name, hex) { return '<span class="gb-btn gb-btn--outline gb-btn--secondary gb-btn--medium pn-ctile"><span class="pn-sw" style="background:' + hex + '"></span>' + label(name) + '</span>'; };

  var foot = '<p class="pn-next-copy">Next: <strong>Box</strong>, place your logo and name the box.</p>';
  if (v === 'A') {
    foot += NEXT + '<button type="button" class="gb-btn gb-btn--medium gb-btn--outline gb-btn--secondary gb-btn--block pn-help">' + label('Help with my design') + btnIcon('chat', PHONE ? 16 : 18) + '</button>';
  } else if (v === 'B') {
    foot += '<div class="v-b-row"><button type="button" class="gb-btn gb-btn--large gb-btn--outline gb-btn--secondary v-b-help">' + label(PHONE ? 'Get help' : 'Help with my design') + '</button>' +
      NEXT.replace('gb-btn--block', 'gb-btn--block v-b-next') + '</div>';
  } else if (v === 'C') {
    foot += NEXT + '<div class="v-c"><span class="v-c-face" aria-hidden="true">BS</span><div class="v-c-text"><p class="v-c-who">Brad Smaling, gift advisor</p><p class="v-c-ask">' + (PHONE ? 'Want us to design it?' : 'Want us to design it for you?') + '</p></div>' +
      '<button type="button" class="gb-btn ' + (PHONE ? 'gb-btn--small' : 'gb-btn--medium') + ' gb-btn--outline gb-btn--secondary">' + label('Talk to Brad') + '</button></div>';
  } else if (v === 'D') {
    foot += NEXT;
  } else {
    foot += NEXT + '<div class="v-e">' + ic('chat', 20) + '<p class="v-e-text">' + (PHONE ? 'Want us to design it?' : 'Questions, or want our designers to do it?') + '</p>' +
      '<button type="button" class="gb-btn gb-btn--small gb-btn--outline gb-btn--secondary">' + label('Get help') + '</button></div>';
  }

  root.innerHTML = '<p class="pn-scene-note">3D scene</p><aside class="pn pn--' + v.toLowerCase() + '">' +
    (PHONE ? '<div class="pn-grab"><span></span></div>' : '') +
    '<div class="pn-scroll"><header class="pn-head">' +
      '<div class="pn-stepper"><span class="pn-dot is-on"></span><span class="pn-line"></span><span class="pn-dot"></span><span class="pn-line"></span><span class="pn-dot"></span></div>' +
      '<div class="pn-steps"><span class="is-on">Design</span><span>Box</span><span>Card</span></div>' + helpHead +
      '<div class="pn-title"><span class="pn-arrow is-back is-off">' + ic('arrow-right', 18) + '</span><b>Your Design</b><span class="pn-arrow">' + ic('arrow-right', 18) + '</span></div>' +
    '</header>' +
    '<h3 class="pn-choose">Choose Your Design</h3><div class="pn-grid">' + tiles + '</div>' +
    '<section class="pn-colors"><h3>Colors</h3><div class="pn-crow">' + ctile('Lid', '#000000') +
      '<span class="gb-btn gb-btn--icon gb-btn--outline gb-btn--secondary gb-btn--small" aria-label="Swap colors">' + btnIcon('swap', 18) + '</span>' +
      ctile('Tray', '#FFD100') +
      '<span class="gb-btn gb-btn--outline gb-btn--secondary gb-btn--medium pn-dna">' + label('Edit my brand DNA') + '</span></div></section>' +
    '</div><footer class="pn-foot">' + foot + '</footer></aside>';
})();
</script>
<script src="../../system/components/icon.js"></script>
</body>
</html>
