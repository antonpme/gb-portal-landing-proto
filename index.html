     (24.08). The timer is still here; it now hands over to the

     gbppl-hub-7 — the ONE DOOR. Ton, 2026-08-23: every prototype
     should open from a single place, and that place should be behind
     a password and should look like us.

     THE GATE. A login window in the language of our auth organism
     (system\components\auth.css, harvested off
     portal.gildedbox.com/guest/auth): the wordmark, a serif title,
     one underline field with the live focus/error behaviour, and
     the BUTTON L submit in Blue 600. It is NOT system auth — no
     Basic realm, no browser dialog — because the browser's own box
     is the one surface in this project we cannot design.

     THE STUDIO BAR that used to stand on the second screen of this
     file lives on every studio page now, out of
     system\components\header.css (variant --studio, hub-7): the
     80px plank, the .gbh-nav voice, the header's quiet outline

     THE TREE — hub-4, extended by hub-9:

       /
       ├── index.html          this gate, the only public address
       ├── live.html           studio page: the connected walk
       ├── sandboxes.html      studio page: the open questions
       ├── live/               the connected walk itself: portal.html,

<style>
/* The local MOTION block that stood here is gone, hub-5, 2026-08-23.
   It carried a note saying it would delete itself the day the family
   reached the tokens; the family reached the tokens (they were
   re-synced from studio\system\tokens.css, MOTION block of 19.08),

/* ---------------- GROUND ----------------
   The hand-stamped ground that stood here (html/body background,
   ink, family, root size) was a fourth copy of shell.css's own
   demo grounding, written out because shell.JS is not loaded on
   this page. It never needed to be: shell.css styles html.gb-demo
   and body.gb-demo directly, so the class is enough and the copy
   is gone (audit, hub-9). */

/* ============================================================
   THE GATE
   ============================================================ */

/* The column of the auth organism (.gba-section) shrunk to a window:
   the live one is a 600 column with no border, ours is a card,
   because it stands alone on the page with nothing else to hold it. */
.gate {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.gate-card {
  width: 100%;
  max-width: 440px;
  padding: 40px 32px;
  background: var(--white);
  border: 1px solid var(--zinc-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  text-align: center;
}
@media (min-width: 1280px) {
  .gate-card { max-width: 480px; padding: 56px 48px; }
}

/* The wordmark at the compact pair the header already owns
   (126x42, the pth bar's small step). No new size invented. */
.gate-mark { display: block; width: 126px; height: 42px; margin: 0 auto; }

/* The serif title. This is exactly the auth organism's verify-step
   title (.gba-vh1): Noto Serif 500, 22 / 28 from 1280, leading
   tight, tracking -0.025em — the one serif that route allows. */
.gate-h1 {
  margin: 24px 0 0;
  font-family: var(--font-serif);
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
  letter-spacing: -0.025em;
  color: var(--zinc-900);
}
.gate-sub {
  margin: 12px 0 0;
  font-size: 13px;
  line-height: 1.625;
  letter-spacing: 0.2px;
  color: var(--zinc-500);
}
@media (min-width: 1280px) {
  .gate-h1 { font-size: 28px; }
  .gate-sub { font-size: 14px; }
}

.gate-form { margin-top: 32px; text-align: left; }
@media (min-width: 1280px) { .gate-form { margin-top: 40px; } }

/* The form atoms (label, input, error, button) come from
   system/components/auth.css — the organism's own classes. The local
   twins that used to sit here were exactly the drift Ton caught
   (23.08): the Enter label wore the CTA ladder's 11px instead of
   the organism's 14/15/16. Only gate-specific layout stays local. */
.gate-form .gba-field { padding: 0; }
.gate-form .gba-btn { border: 0; cursor: pointer; }
/* auth.css expects the demo pages' zeroed-border ground (it only sets
   border-color and the bottom width); this page has no such reset, so
   the UA's full input frame must be zeroed here once. */
.gate-form .gba-input { border-style: solid; border-width: 0; border-bottom-width: 1px; }

/* The gate leaving: shorter than the arrival and on the exit curve,
   because it never has to land anywhere. */
.gate.is-leaving {
  animation: gateOut var(--mo-small-out) var(--mo-exit) forwards;
  pointer-events: none;
}
@keyframes gateOut {
  to { opacity: 0; transform: translateY(-8px); }
}

/* Ton-7: the gate crossing is brand choreography, it plays regardless of
   prefers-reduced-motion. The polite branch here used to set animation:none,
   which left the JS waiting for an animationend that never came — the door
   froze for anyone with Windows animation effects off (Ton, 24.08). Only
   utility transitions stay polite. */
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 1ms !important; }
}

<body class="gb-demo">

<div class="gate" id="gate">
  <div class="gate-card">
    <img class="gate-mark" src="system/assets/gildedbox-logo.svg" alt="GildedBox" width="126" height="42">
    <h1 class="gate-h1">Design Studio</h1>
    <p class="gate-sub">The design studio of GildedBox — prototypes, sandboxes, and the Oro design system. This is not the live site: enter the access code to see what is being built.</p>

    <!-- The form wears the auth organism's OWN classes (system/components/auth.css),
         not local copies of its numbers — Ton, 23.08: if it's in the system, it is
         a component; a hand-rolled twin with drifting sizes is exactly the bug he
         caught (the Enter label sat at the CTA ladder's 11px instead of the
         organism's 14/15/16). -->
    <form class="gate-form" id="gate-form" novalidate>
      <div class="gba-field">
        <label class="gba-label" for="gate-code">Access code</label>
        <div class="gba-inputwrap">
          <input class="gba-input" id="gate-code" name="code" type="password"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
                 placeholder="Enter your access code" aria-describedby="gate-error">
        </div>
        <span class="gba-error" id="gate-error" role="alert"></span>
      </div>
      <button class="gba-btn" id="gate-submit" type="submit">
        <span class="gba-btn-label">Enter</span>
        <span class="gba-btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </button>
    </form>
  </div>
</div>

<script>
/* ============================================================
   THE LOCK
   ------------------------------------------------------------
   A gate for honest people, and it says so out loud. The pages are
   static HTML: anyone who opens devtools and sets the session flag
   by hand is past this in four seconds. What the hash buys is that
   the code never sits in the source as a readable string, and that
   a stranger who lands on the URL sees a locked door rather than
   the client's unfinished work.

   Since hub-9 the door no longer hides a second screen in this
   file: it hands over to live.html, and every studio page checks
   the same flag on its way in (system\components\studio.js).

   THE REAL LOCK ARRIVES WITH THE VPS — Basic auth at the nginx level,
   or a session cookie from a tiny handler — and then this screen can
   either stay as the face of that lock or come out altogether.
   ============================================================ */
(function () {
  'use strict';

  /* sha256('gilded-oro-18'). The code itself appears nowhere here. */
  var ACCESS_HASH = '391f502ab794ad5778024f46a0e70a7ced064c90e9b50bbc99fa8f94473dd38c';

  /* Session, not local: closing the tab locks the door again, which is
     what you want on a laptop that gets shown around in a meeting. */
  var FLAG = 'gbppl-hub-open';

  /* The room the gate opens into. */
  var HOME = 'live.html';

  var gate    = document.getElementById('gate');
  var form    = document.getElementById('gate-form');
  var input   = document.getElementById('gate-code');
  var errorEl = document.getElementById('gate-error');
  var submit  = document.getElementById('gate-submit');

  /* ---- sha256 ----
     crypto.subtle is there on https and, in Chrome, on file:// too;
     the fallback keeps the page working anywhere else (an http://
     preview server, an older browser) rather than failing open. */
  function sha256(text) {
    if (window.crypto && window.crypto.subtle) {
      return window.crypto.subtle
        .digest('SHA-256', new TextEncoder().encode(text))
        .then(function (buf) {
          return Array.prototype.map
            .call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); })
            .join('');
        });
    }
    return Promise.resolve(sha256Sync(text));
  }

  /* FIPS 180-4, the plain loop. Only ever reached by the fallback. */
  function sha256Sync(text) {
    var K = [
      0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
      0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
      0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
      0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
      0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
      0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
      0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var bytes = [], i, j;
    for (i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c < 128) bytes.push(c);
      else if (c < 2048) bytes.push(192 | (c >> 6), 128 | (c & 63));
      else bytes.push(224 | (c >> 12), 128 | ((c >> 6) & 63), 128 | (c & 63));
    }
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    for (i = 7; i >= 0; i--) bytes.push((i < 4 ? Math.floor(bitLen / Math.pow(2, 8 * i)) : 0) & 255);
    var rr = function (x, n) { return (x >>> n) | (x << (32 - n)); };
    var w = new Array(64);
    for (i = 0; i < bytes.length; i += 64) {
      for (j = 0; j < 16; j++) {
        w[j] = (bytes[i + j * 4] << 24) | (bytes[i + j * 4 + 1] << 16) | (bytes[i + j * 4 + 2] << 8) | bytes[i + j * 4 + 3];
      }
      for (j = 16; j < 64; j++) {
        var s0 = rr(w[j - 15], 7) ^ rr(w[j - 15], 18) ^ (w[j - 15] >>> 3);
        var s1 = rr(w[j - 2], 17) ^ rr(w[j - 2], 19) ^ (w[j - 2] >>> 10);
        w[j] = (w[j - 16] + s0 + w[j - 7] + s1) | 0;
      }
      var a = H[0], b = H[1], c2 = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (j = 0; j < 64; j++) {
        var S1 = rr(e, 6) ^ rr(e, 11) ^ rr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + K[j] + w[j]) | 0;
        var S0 = rr(a, 2) ^ rr(a, 13) ^ rr(a, 22);
        var mj = (a & b) ^ (a & c2) ^ (b & c2);
        var t2 = (S0 + mj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c2) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    return H.map(function (x) { return ('0000000' + (x >>> 0).toString(16)).slice(-8); }).join('');
  }

  function clearError() {
    input.classList.remove('invalid');
    errorEl.textContent = '';
  }

  /* The organism's rule: the error only ever speaks after a submit,
     and the next keystroke takes it back. */
  function showError(msg) {
    input.classList.add('invalid');
    errorEl.textContent = msg;
  }

  input.addEventListener('input', clearError);

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var value = input.value.trim();
    if (!value) { showError('Enter the access code'); input.focus(); return; }

    submit.disabled = true;
    sha256(value).then(function (hex) {
      submit.disabled = false;
      if (hex !== ACCESS_HASH) {
        showError('That code does not open this door');
        input.select();
        return;
      }
      clearError();
      try { sessionStorage.setItem(FLAG, '1'); } catch (e) {}
      gate.classList.add('is-leaving');
      /* animationend is the cue, but never the only key: if the animation
         is suppressed (reduced motion, a hidden tab), the timer opens the
         door anyway. Frozen-gate bug, Ton 24.08. */
      var crossed = false;
      var cross = function () {
        if (crossed) return;
        crossed = true;
        /* replace, not assign: the gate must not sit in the history
           behind the studio, or Back walks straight into it. */
        location.replace(HOME);
      };
      gate.addEventListener('animationend', cross, { once: true });
      setTimeout(cross, 700);
    }).catch(function () {
      submit.disabled = false;
      showError('Could not check the code — reload the page');
    });
  });

  input.focus();
})();
</script>
